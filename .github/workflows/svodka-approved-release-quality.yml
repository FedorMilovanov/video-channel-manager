name: Svodka approved release quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svodka-approved-release-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-approved-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PROFILE_PATH: content/telegram/channels/svodka.json
      BINDING_PATH: content/telegram/channels/svodka-target-binding.json
      QUEUE_PATH: content/telegram/svodka/draft-14-posts-2026-08.json
      APPROVAL_PATH: content/telegram/svodka/release-approval-2026-08.json
      RELEASE_PATH: .runtime/svodka-approved-release.json
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Apply exact production Telegram dependency lock
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt
          python -m pip check

      - name: Static quality for approval surface
        run: |
          set -euo pipefail
          ruff check src/video_channel_manager/svodka_approval_cli.py tests/test_svodka_approval_cli.py tests/test_svodka_rollout_schedule.py
          ruff format --check src/video_channel_manager/svodka_approval_cli.py tests/test_svodka_approval_cli.py tests/test_svodka_rollout_schedule.py
          mypy src/video_channel_manager/svodka_approval_cli.py --show-error-codes

      - name: Exact approval regressions
        run: python -m pytest -q tests/test_svodka_approval_cli.py tests/test_svodka_rollout_schedule.py

      - name: Materialize exact reviewed release without provider access
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python -m video_channel_manager.svodka_approval_cli \
            --profile "$PROFILE_PATH" \
            --queue "$QUEUE_PATH" \
            --binding "$BINDING_PATH" \
            --approval "$APPROVAL_PATH" \
            --output "$RELEASE_PATH"
          python - <<'PY'
          import os
          from pathlib import Path
          from video_channel_manager.telegram_multichannel_release import load_release

          release = load_release(Path(os.environ["RELEASE_PATH"]))
          assert release.release_authorized is True
          assert release.reviewed_candidate_sha256 == "sha256:98e259210f138b8ad0280dec38306dcecbbdba89899db336906994f9dfb0bc0f"
          assert release.digest == "sha256:e774115e4382ef9ff1871f0d9b5a7d80c075f41c66ecc9963ccbee7c23d41233"
          assert len(release.items) == 14
          assert release.items[4].publication_id == "svodka-2026-august-total-solar-eclipse"
          assert release.items[4].scheduled_at.isoformat() == "2026-08-12T10:30:00+03:00"
          print("provider_write_performed=false")
          PY

      - name: Upload exact approved release proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: svodka-approved-release-proof
          path: .runtime/svodka-approved-release.json
          if-no-files-found: error
          retention-days: 7
