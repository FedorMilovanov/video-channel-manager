name: Milovi Cake live canary v2 dispatch controller

on:
  workflow_run:
    workflows:
      - Milovi Telegram live canary v2 quality
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: milovi-cake-live-canary-v2-controller
  cancel-in-progress: false

jobs:
  dispatch-exact-once:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      PROVIDER_WORKFLOW: milovi-telegram-live-canary-v2.yml
      RELEASE_PATH: content/telegram/milovi-cake/oneoff-canary-authorized-release-2026-08-18-v2.json
      EXECUTION_AUTH_PATH: content/telegram/milovi-cake/oneoff-canary-execution-authorization-2026-08-18-v2.json
      PUBLICATION_ID: milovi-canary-20260818-002
      PROVIDER_CONFIRM: PUBLISH:@MiloviCake:milovi-canary-20260818-002
      STATE_LEDGER_API_PATH: content/telegram/milovi-cake/oneoff-canary-2026-08-18-v2/publication-ledger.json
      PREDECESSOR_LEDGER_API_PATH: content/telegram/milovi-cake/oneoff-canary-2026-08-18/publication-ledger.json

    steps:
      - name: Check out exact quality-proven revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install minimal Telegram runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            -r requirements/telegram-publisher.txt

      - name: Resolve exact automatic dispatch authorization
        id: activation
        shell: python
        run: |
          from __future__ import annotations

          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from video_channel_manager.telegram_multichannel_release import load_release

          release = load_release(Path(os.environ["RELEASE_PATH"]))
          authorization = json.loads(Path(os.environ["EXECUTION_AUTH_PATH"]).read_text(encoding="utf-8"))
          blockers: list[str] = []

          if release.release_id != "milovi-oneoff-canary-2026-08-18-v2":
              blockers.append("release_identity_drift")
          if release.digest != "sha256:7d85bad0c335a4c6a8dd745226661aba8867cc103b5e16bf9ffe4c063b7e2eae":
              blockers.append("release_digest_drift")
          if len(release.items) != 1 or release.items[0].publication_id != os.environ["PUBLICATION_ID"]:
              blockers.append("publication_identity_drift")
          if authorization.get("release_digest") != release.digest:
              blockers.append("authorization_release_digest_drift")
          if authorization.get("publication_id") != os.environ["PUBLICATION_ID"]:
              blockers.append("authorization_publication_drift")
          if authorization.get("execution_authorized") is not True:
              blockers.append("execution_not_authorized")
          if authorization.get("automatic_dispatch_authorized") is not True:
              blockers.append("automatic_dispatch_not_authorized")
          if authorization.get("max_provider_attempts") != 1:
              blockers.append("provider_attempt_policy_drift")
          if authorization.get("blind_mutation_retries") != 0:
              blockers.append("blind_retry_policy_drift")
          if authorization.get("supersedes_publication_id") != "milovi-canary-20260818-001":
              blockers.append("superseded_identity_drift")
          if authorization.get("supersedes_only_if_prior_intent_absent") is not True:
              blockers.append("supersede_safety_drift")

          now = datetime.now(ZoneInfo("Europe/Moscow"))
          try:
              not_before = datetime.fromisoformat(authorization["execute_not_before"])
              not_after = datetime.fromisoformat(authorization["execute_not_after"])
          except Exception:
              blockers.append("execution_window_invalid")
          else:
              if now < not_before:
                  blockers.append("live_canary_v2_not_due")
              if now >= not_after:
                  blockers.append("live_canary_v2_too_stale")

          active = not blockers
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"active={'true' if active else 'false'}\n")
              output.write(f"reason={','.join(blockers) if blockers else 'authorized'}\n")
          print(json.dumps({
              "active": active,
              "reason": blockers,
              "target_sha": os.environ["TARGET_SHA"],
              "publication_id": os.environ["PUBLICATION_ID"],
              "moscow_now": now.isoformat(),
              "provider_access_performed": False,
              "provider_write_performed": False,
          }, ensure_ascii=False))

      - name: Fail closed when automatic dispatch is unauthorized or expired
        if: steps.activation.outputs.active != 'true'
        shell: bash
        run: |
          echo "Milovi live canary v2 controller refused dispatch: ${{ steps.activation.outputs.reason }}" >&2
          exit 3

      - name: Wait for exact current-main CI, canary quality, and media proof
        if: steps.activation.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            current_main="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$current_main" != "$TARGET_SHA" ]]; then
              echo "main moved before live canary v2 dispatch: expected $TARGET_SHA, found $current_main" >&2
              exit 3
            fi

            set +e
            python -m video_channel_manager.telegram_github_quality_gate --workflow ci.yml --sha "$TARGET_SHA" > /tmp/milovi-v2-ci.log 2>&1
            ci_status=$?
            python -m video_channel_manager.telegram_github_quality_gate --workflow milovi-telegram-live-canary-v2-quality.yml --sha "$TARGET_SHA" > /tmp/milovi-v2-quality.log 2>&1
            quality_status=$?
            python -m video_channel_manager.telegram_github_quality_gate --workflow milovi-telegram-bootstrap-media-proof.yml --sha "$TARGET_SHA" > /tmp/milovi-v2-media.log 2>&1
            media_status=$?
            set -e

            if [[ "$ci_status" == "0" && "$quality_status" == "0" && "$media_status" == "0" ]]; then
              cat /tmp/milovi-v2-ci.log
              cat /tmp/milovi-v2-quality.log
              cat /tmp/milovi-v2-media.log
              echo "All exact current-main proofs are green for $TARGET_SHA."
              exit 0
            fi

            echo "Waiting for exact-main proofs ($attempt/36): CI=$ci_status quality=$quality_status media=$media_status"
            sleep 20
          done

          echo "Exact current-main quality proofs did not all become green within the bounded wait." >&2
          cat /tmp/milovi-v2-ci.log || true
          cat /tmp/milovi-v2-quality.log || true
          cat /tmp/milovi-v2-media.log || true
          exit 3

      - name: Prove predecessor and fresh v2 durable state are mutation-free
        if: steps.activation.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/contents/$PREDECESSOR_LEDGER_API_PATH?ref=state%2Fmilovi-cake-telegram" --jq '.content' | tr -d '\n' | base64 -d > /tmp/milovi-v1-ledger.json
          gh api "/repos/$GITHUB_REPOSITORY/contents/$STATE_LEDGER_API_PATH?ref=state%2Fmilovi-cake-telegram" --jq '.content' | tr -d '\n' | base64 -d > /tmp/milovi-v2-ledger.json
          python - <<'PY'
          import json
          from pathlib import Path

          v1 = json.loads(Path("/tmp/milovi-v1-ledger.json").read_text(encoding="utf-8"))["entries"]["milovi-canary-20260818-001"]
          assert v1["state"] == "pending"
          assert v1["provider_effect"] == "impossible"
          assert v1["intent_id"] is None
          assert v1["workflow_run_id"] is None
          assert v1["attempted_at_utc"] is None
          assert v1["message_id"] is None

          v2_doc = json.loads(Path("/tmp/milovi-v2-ledger.json").read_text(encoding="utf-8"))
          assert v2_doc["release_digest"] == "sha256:7d85bad0c335a4c6a8dd745226661aba8867cc103b5e16bf9ffe4c063b7e2eae"
          v2 = v2_doc["entries"]["milovi-canary-20260818-002"]
          assert v2["state"] == "pending"
          assert v2["provider_effect"] == "impossible"
          assert v2["intent_id"] is None
          assert v2["workflow_run_id"] is None
          assert v2["attempted_at_utc"] is None
          assert v2["message_id"] is None
          print(json.dumps({"predecessor_intent_absent": True, "v2_provider_effect": "impossible"}))
          PY

      - name: Check whether dedicated v2 provider workflow was already dispatched
        if: steps.activation.outputs.active == 'true'
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$PROVIDER_WORKFLOW/runs?event=workflow_dispatch&branch=main&per_page=100" > /tmp/milovi-v2-provider-runs.json
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          authorization = json.loads(Path(os.environ["EXECUTION_AUTH_PATH"]).read_text(encoding="utf-8"))
          authorized_at = datetime.fromisoformat(authorization["authorized_at"]).astimezone(timezone.utc)
          runs = json.loads(Path("/tmp/milovi-v2-provider-runs.json").read_text(encoding="utf-8")).get("workflow_runs", [])
          prior = []
          for run in runs:
              created_raw = str(run.get("created_at") or "")
              if not created_raw:
                  continue
              created_at = datetime.fromisoformat(created_raw.replace("Z", "+00:00"))
              if created_at >= authorized_at:
                  prior.append({
                      "id": run.get("id"),
                      "head_sha": run.get("head_sha"),
                      "status": run.get("status"),
                      "conclusion": run.get("conclusion"),
                      "created_at": created_raw,
                  })
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"already={'true' if prior else 'false'}\n")
          print(json.dumps({"prior_provider_dispatch_runs": prior}, ensure_ascii=False))
          PY

      - name: Fail closed if v2 provider workflow was already dispatched
        if: steps.activation.outputs.active == 'true' && steps.prior.outputs.already == 'true'
        shell: bash
        run: |
          echo "A live canary v2 provider workflow_dispatch already exists; no replay is permitted." >&2
          exit 3

      - name: Re-prove exact current main immediately before provider dispatch
        if: steps.activation.outputs.active == 'true' && steps.prior.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" == "$TARGET_SHA" ]] || { echo "main moved after proofs: expected $TARGET_SHA, found $current_main" >&2; exit 3; }
          echo "Exact current main remains $current_main. Controller has performed no Telegram access."

      - name: Dispatch exact pre-authorized v2 provider workflow once
        if: steps.activation.outputs.active == 'true' && steps.prior.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/milovi-v2-dispatch.json
          import json
          import os
          print(json.dumps({
              "ref": "main",
              "inputs": {"confirm": os.environ["PROVIDER_CONFIRM"]},
          }))
          PY
          gh api \
            --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$PROVIDER_WORKFLOW/dispatches" \
            --input /tmp/milovi-v2-dispatch.json
          echo "Exact Milovi live canary v2 provider workflow dispatched once. Controller performed no Telegram access."
