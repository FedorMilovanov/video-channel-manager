name: YouTube executor Ruff format once

on:
  push:
    branches:
      - agent/youtube-release-executor-rebased
    paths:
      - .github/workflows/youtube-executor-ruff-format-once.yml

permissions:
  contents: write

jobs:
  format-and-self-remove:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/youtube-release-executor-rebased
          fetch-depth: 1

      - name: Install exact CI Ruff
        run: python -m pip install 'ruff==0.16.2'

      - name: Format exact YouTube executor files
        run: |
          ruff format \
            src/video_channel_manager/youtube_release_execution.py \
            src/video_channel_manager/youtube_release_operations.py \
            src/video_channel_manager/youtube_release_plan.py \
            src/video_channel_manager/youtube_release_provider.py \
            src/video_channel_manager/youtube_release_state.py

      - name: Commit formatting and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/youtube-executor-ruff-format-once.yml
          git add \
            src/video_channel_manager/youtube_release_execution.py \
            src/video_channel_manager/youtube_release_operations.py \
            src/video_channel_manager/youtube_release_plan.py \
            src/video_channel_manager/youtube_release_provider.py \
            src/video_channel_manager/youtube_release_state.py
          git commit -m 'Apply exact Ruff formatting to YouTube release executor'
          git push origin HEAD:agent/youtube-release-executor-rebased
