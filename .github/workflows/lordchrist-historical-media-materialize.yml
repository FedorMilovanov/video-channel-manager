name: LordChrist historical media materialize v2

on:
  pull_request:
    paths:
      - ".github/workflows/lordchrist-historical-media-materialize.yml"
      - "content/telegram/lordchrist/historical-editorial/v1/v3/media-acquisition-manifest-v2-2026-09-09.json"
      - "content/telegram/lordchrist/historical-editorial/v1/v3/batch-manifest-2026-09-08.json"
      - "content/telegram/lordchrist/historical-editorial/v1/verification/**"
      - "content/telegram/lordchrist/historical-editorial/v1/sources/**"
      - "src/video_channel_manager/telegram_historical_media.py"
      - "src/video_channel_manager/telegram_historical_media_v2.py"
      - "src/video_channel_manager/telegram_historical_media_materialize_v2.py"
      - "src/video_channel_manager/telegram_historical_archival_revision.py"
      - "tests/test_telegram_historical_media_v2.py"
      - "tests/test_telegram_historical_media_materialize_v2.py"
      - "tests/test_telegram_historical_archival_revision.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lordchrist-historical-media-materialize-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-v2:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      MANIFEST_PATH: content/telegram/lordchrist/historical-editorial/v1/v3/media-acquisition-manifest-v2-2026-09-09.json
    steps:
      - name: Check out exact PR head with push authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Assert exact event head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install deterministic archival runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check -e '.[dev,milovi-gap-read]'
          python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
          pdftoppm -v 2>&1 | sed -n '1,2p'
          python - <<'PY'
          import PIL
          if PIL.__version__ != '12.3.0':
              raise SystemExit(f'unexpected Pillow runtime: {PIL.__version__}')
          print('Pillow', PIL.__version__)
          PY

      - name: Bootstrap complete V2 materializer sources
        shell: bash
        env:
          MATERIALIZER_Z: 
          MATERIALIZER_TEST_Z: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          import zlib
          from pathlib import Path

          files = {
              Path('src/video_channel_manager/telegram_historical_media_materialize_v2.py'): os.environ['MATERIALIZER_Z'],
              Path('tests/test_telegram_historical_media_materialize_v2.py'): os.environ['MATERIALIZER_TEST_Z'],
          }
          for path, encoded in files.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY

      - name: Extend archival exhibit taxonomy and normalize closure sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/video_channel_manager/telegram_historical_archival_revision.py')
          text = path.read_text(encoding='utf-8')
          anchor = (
              '        "critical_edition_facsimile",\n'
              '        "contextual_historical_map",\n'
          )
          replacement = (
              '        "critical_edition_facsimile",\n'
              '        "contextual_historical_map",\n'
              '        "institutional_catalog_record",\n'
              '        "official_document_excerpt",\n'
          )
          if '"institutional_catalog_record"' not in text:
              if anchor not in text:
                  raise SystemExit('archival exhibit taxonomy anchor differs')
              path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          ruff check --fix \
            src/video_channel_manager/telegram_historical_archival_revision.py \
            src/video_channel_manager/telegram_historical_media_materialize_v2.py \
            tests/test_telegram_historical_media_materialize_v2.py
          ruff format \
            src/video_channel_manager/telegram_historical_archival_revision.py \
            src/video_channel_manager/telegram_historical_media_materialize_v2.py \
            tests/test_telegram_historical_media_materialize_v2.py

      - name: Run V2 regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_telegram_historical_media_v2.py \
            tests/test_telegram_historical_media_materialize_v2.py \
            tests/test_telegram_historical_archival_revision.py \
            -q

      - name: Acquire, render and preflight all 16 exhibits
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .runtime/lordchrist-historical-media-v2
          python -m video_channel_manager.telegram_historical_media_materialize_v2 \
            "$MANIFEST_PATH" \
            --repo-root . \
            --acquisition-dir .runtime/lordchrist-historical-media-v2 \
            > /tmp/lordchrist-materialize-v2.json
          cat /tmp/lordchrist-materialize-v2.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/lordchrist-materialize-v2.json').read_text(encoding='utf-8'))
          assert result['status'] == 'PASS'
          assert result['asset_count'] == 16
          assert result['publication_count'] == 8
          assert len(result['revision_packages']) == 8
          assert len(result['preflights']) == 8
          assert result['provider_writes_authorized'] is False
          assert result['live_eligible'] is False
          assert result['provider_write_performed'] is False
          for path in result['preflights']:
              report = json.loads(Path(path).read_text(encoding='utf-8'))
              assert report['status'] == 'PASS'
              assert report['archival_media_count'] == 2
              assert report['transport_ready_media_count'] == 0
              assert report['provider_writes_authorized'] is False
              assert report['live_eligible'] is False
              assert report['provider_write_performed'] is False
          PY

      - name: Enforce provider-inert generated surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('content/telegram/lordchrist/historical-editorial/v1/v3')
          receipt = json.loads((root / 'media-render-receipt-v2-2026-09-09.json').read_text(encoding='utf-8'))
          assert receipt['asset_count'] == 16
          assert len(receipt['outputs']) == 16
          assert len({(item['publication_id'], item['slot']) for item in receipt['outputs']}) == 16
          packages = list(root.glob('*/revision-package-v2-2026-09-09.json'))
          assert len(packages) == 8
          for path in packages:
              value = json.loads(path.read_text(encoding='utf-8'))
              assert value['provider_writes_authorized'] is False
              assert value['live_eligible'] is False
              assert all(item['transport_ready'] is False for item in value['archival_media'])
              assert all(item['provider_write_performed'] is False for item in value['archival_media'])
          PY

      - name: Commit deterministic provider-inert closure
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/video_channel_manager/telegram_historical_archival_revision.py \
            src/video_channel_manager/telegram_historical_media_materialize_v2.py \
            tests/test_telegram_historical_media_materialize_v2.py \
            'content/telegram/lordchrist/historical-editorial/v1/v3/*/media/*.jpg' \
            'content/telegram/lordchrist/historical-editorial/v1/v3/*/media/*.png' \
            content/telegram/lordchrist/historical-editorial/v1/v3/media-render-receipt-v2-2026-09-09.json \
            'content/telegram/lordchrist/historical-editorial/v1/v3/*/revision-package-v2-2026-09-09.json' \
            'content/telegram/lordchrist/historical-editorial/v1/v3/*/revision-preflight-v2-2026-09-09.json'
          if git diff --cached --quiet; then
            echo 'All 16 deterministic exhibits and all 8 revision preflights are already committed.'
            exit 0
          fi
          git commit -m 'feat(lordchrist): materialize complete archival v3 media'
          git fetch --no-tags origin "$HEAD_REF"
          test "$(git rev-parse "origin/$HEAD_REF")" = "$EVENT_HEAD"
          git push origin "HEAD:$HEAD_REF"
