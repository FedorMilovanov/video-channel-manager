name: LordChrist historical media materialize

on:
  pull_request:
    paths:
      - ".github/workflows/lordchrist-historical-media-materialize.yml"
      - "content/telegram/lordchrist/historical-editorial/v1/v3/media-acquisition-probes-2026-09-09.json"
      - "src/video_channel_manager/telegram_historical_media.py"

permissions:
  contents: write

concurrency:
  group: lordchrist-historical-media-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      MANIFEST_PATH: content/telegram/lordchrist/historical-editorial/v1/v3/media-acquisition-probes-2026-09-09.json
      OUTPUT_DIR: .runtime/lordchrist-historical-media-materialize
    steps:
      - name: Check out exact PR head with push authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Assert exact event head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install provider-free runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[dev]'
          command -v pdftoppm
          pdftoppm -v 2>&1 | head -2

      - name: Re-acquire exact proven source bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_DIR"
          python -m video_channel_manager.telegram_historical_media \
            "$MANIFEST_PATH" \
            --repo-root . \
            --output-dir "$OUTPUT_DIR" > /tmp/materialize-acquisition.json

      - name: Validate source identities and render archival exhibits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          from PIL import Image, __version__ as pillow_version

          root = Path('.').resolve()
          out = Path('.runtime/lordchrist-historical-media-materialize')
          receipt = json.loads((out / 'acquisition-receipt.json').read_text(encoding='utf-8'))
          by_asset = {item['asset_id']: item for item in receipt['results']}
          expected = {
              'img-stam-v3-wheaton-telegram': 'sha256:4ad6ec29439c599cd130d1b1f1412651fb8af6176a0710997dd2010f151e70c9',
              'img-tyndale-v3-worms-source-pdf': 'sha256:421e5071c54b1d4aa261d81b94f89467deff1e8ac6950c4b0e37fabad5aa1def',
              'img-tyndale-v3-prison-letter-demaus-pdf': 'sha256:44411b2cf6f93139b92a78d9526acdc531f579c8ee9b311bb37ae852263f599b',
          }
          if set(by_asset) != set(expected):
              raise SystemExit(f'unexpected probe asset universe: {sorted(by_asset)}')
          for asset_id, digest in expected.items():
              if by_asset[asset_id]['source_sha256'] != digest:
                  raise SystemExit(f'source digest drift for {asset_id}')

          tyndale_dir = root / 'content/telegram/lordchrist/historical-editorial/v1/v3/tyndale-new-testament-1526/media'
          stam_dir = root / 'content/telegram/lordchrist/historical-editorial/v1/v3/stam-china-december-1934/media'
          tyndale_dir.mkdir(parents=True, exist_ok=True)
          stam_dir.mkdir(parents=True, exist_ok=True)

          worms_source = out / by_asset['img-tyndale-v3-worms-source-pdf']['output_file_name']
          worms_target = tyndale_dir / 'tyndale-v3-worms-1526-page-44.png'
          subprocess.run([
              'pdftoppm', '-f', '44', '-l', '44', '-png', '-r', '180', '-singlefile',
              str(worms_source), str(worms_target.with_suffix('')),
          ], check=True)

          demaus_source = out / by_asset['img-tyndale-v3-prison-letter-demaus-pdf']['output_file_name']
          demaus_raw = out / 'demaus-page-462-raw.png'
          subprocess.run([
              'pdftoppm', '-f', '462', '-l', '462', '-png', '-r', '180', '-singlefile',
              str(demaus_source), str(demaus_raw.with_suffix('')),
          ], check=True)
          demaus_target = tyndale_dir / 'tyndale-v3-prison-letter-1535-page-462.png'
          with Image.open(demaus_raw) as image:
              image.rotate(-90, expand=True).save(demaus_target, format='PNG')

          stam_source = out / by_asset['img-stam-v3-wheaton-telegram']['output_file_name']
          stam_target = stam_dir / 'stam-v3-wheaton-telegram.jpg'
          stam_target.write_bytes(stam_source.read_bytes())

          poppler = subprocess.run(['pdftoppm', '-v'], check=True, capture_output=True, text=True).stderr.splitlines()[0]

          def identity(path: Path) -> dict[str, object]:
              data = path.read_bytes()
              with Image.open(path) as image:
                  width, height = image.size
                  mime = Image.MIME.get(image.format or '')
              if mime not in {'image/png', 'image/jpeg'}:
                  raise SystemExit(f'unexpected rendered MIME for {path}: {mime}')
              return {
                  'path': path.relative_to(root).as_posix(),
                  'sha256': 'sha256:' + hashlib.sha256(data).hexdigest(),
                  'byte_length': len(data),
                  'mime': mime,
                  'width': width,
                  'height': height,
              }

          render_receipt = {
              'schema_name': 'video-channel-manager.telegram-historical-media-render-receipt',
              'schema_version': 1,
              'owning_issue': 561,
              'state': 'provider_inert',
              'provider_writes_authorized': False,
              'live_eligible': False,
              'provider_write_performed': False,
              'render_runtime': {'poppler': poppler, 'pillow': pillow_version},
              'outputs': [
                  {
                      'publication_id': 'lordchrist-history-tyndale-new-testament-1526-v3',
                      'slot': 'hero',
                      'source_asset_id': 'img-tyndale-v3-worms-source-pdf',
                      'source_sha256': expected['img-tyndale-v3-worms-source-pdf'],
                      'transform': {'kind': 'pdf_page_render', 'pdf_page_1_based': 44, 'dpi': 180, 'rotation_degrees_clockwise': 0},
                      **identity(worms_target),
                  },
                  {
                      'publication_id': 'lordchrist-history-tyndale-new-testament-1526-v3',
                      'slot': 'document',
                      'source_asset_id': 'img-tyndale-v3-prison-letter-demaus-pdf',
                      'source_sha256': expected['img-tyndale-v3-prison-letter-demaus-pdf'],
                      'transform': {'kind': 'pdf_page_render', 'pdf_page_1_based': 462, 'dpi': 180, 'rotation_degrees_clockwise': 90},
                      **identity(demaus_target),
                  },
                  {
                      'publication_id': 'lordchrist-history-stam-china-december-1934-v3',
                      'slot': 'hero',
                      'source_asset_id': 'img-stam-v3-wheaton-telegram',
                      'source_sha256': expected['img-stam-v3-wheaton-telegram'],
                      'transform': {'kind': 'identity_copy'},
                      **identity(stam_target),
                  },
              ],
          }
          receipt_path = root / 'content/telegram/lordchrist/historical-editorial/v1/v3/media-render-receipt-phase2-2026-09-09.json'
          receipt_path.write_text(json.dumps(render_receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(render_receipt, ensure_ascii=False, indent=2))
          PY

      - name: Commit only deterministic provider-inert materialization
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            content/telegram/lordchrist/historical-editorial/v1/v3/tyndale-new-testament-1526/media/tyndale-v3-worms-1526-page-44.png \
            content/telegram/lordchrist/historical-editorial/v1/v3/tyndale-new-testament-1526/media/tyndale-v3-prison-letter-1535-page-462.png \
            content/telegram/lordchrist/historical-editorial/v1/v3/stam-china-december-1934/media/stam-v3-wheaton-telegram.jpg \
            content/telegram/lordchrist/historical-editorial/v1/v3/media-render-receipt-phase2-2026-09-09.json
          if git diff --cached --quiet; then
            echo 'Exact materialized bytes already committed.'
            exit 0
          fi
          git commit -m 'feat(lordchrist): materialize proven archival media'
          git fetch --no-tags origin "$HEAD_REF"
          test "$(git rev-parse "origin/$HEAD_REF")" = "$EVENT_HEAD"
          git push origin "HEAD:$HEAD_REF"
