name: Milovi Telegram one-time owner-approved v12 due dispatch

on:
  # 2026-11-07 11:00 Moscow = 08:00 UTC. Start 7 minutes after.
  # Gate enforces exact year/date and maximum 120 minute lateness.
  schedule:
    - cron: "7 8 7 11 *"
  # Manual testing is permanently provider-inert.
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: milovi-telegram-exact-due-20261107-002
  cancel-in-progress: false

jobs:
  guarded-dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install existing minimal Telegram validator requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            -r requirements/telegram-publisher.txt

      - name: Read latest protected Milovi state, without changing it
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            refs/heads/state/milovi-cake-telegram
          git show FETCH_HEAD:content/telegram/milovi-cake/feed/milovi-feed-20261107-002.json >/dev/null
          git show FETCH_HEAD:content/telegram/milovi-cake/feed/index.json >/dev/null

      - name: Fail closed on stale main or altered release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$remote_main" == "$GITHUB_SHA" ]] || {
            echo "main advanced since this exact run started; no dispatch" >&2
            exit 3
          }

      - name: Prove exact release, time, target and non-dispatched state
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.milovi_telegram_due_dispatch \
            --event "$EVENT_NAME" \
            --output "$GITHUB_OUTPUT"

      - name: Dispatch only the canonical publisher, never send directly
        if: github.event_name == 'schedule' && steps.gate.outputs.dispatch == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$remote_main" == "$GITHUB_SHA" ]] || {
            echo "main advanced after due gate; no provider dispatch" >&2
            exit 3
          }
          gh workflow run milovi-telegram-feed-publisher.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f operation=publish \
            -f publication_id=milovi-feed-20261107-002 \
            -f 'confirm=PUBLISH:@MiloviCake:milovi-feed-20261107-002'