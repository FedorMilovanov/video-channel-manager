name: Lordchrist Telegram publisher

on:
  workflow_dispatch:
    inputs:
      action:
        description: Preview, run read-only Telegram preflight, or publish one exact guarded post
        required: true
        default: preview
        type: choice
        options:
          - preview
          - preflight
          - publish
          - publish-article
      publication_id:
        description: Exact publication_id required for manual publish
        required: false
        type: string
      confirm:
        description: For publish type PUBLISH:<publication_id>
        required: false
        type: string
  schedule:
    # GitHub cron fires in UTC. 07:00 UTC = 10:00 Moscow (morning quote slot),
    # 09:00 UTC = 12:00 Moscow (midday rich-article slot, Tuesday and Friday),
    # 16:17 UTC = 19:17 Moscow (historical rich slot), 18:00 UTC = 21:00 Moscow
    # (evening quote slot). The previous UTC-as-Moscow expressions fired three
    # hours past every documented slot boundary.
    #
    # Do not add a `timezone:` key here. These expressions are already UTC
    # offsets converted from the Moscow slot times in production-schedule.json,
    # and the runtime re-derives the slot in Europe/Moscow before publishing. A
    # timezone key would apply that offset twice: the morning slot would fire at
    # 07:00 Moscow (before its 10:00 boundary, "slot is not due yet") and the
    # evening slot at 15:00 UTC (past its 180-minute lease, "too stale").
    # tests/test_lordchrist_schedule_cron_contract.py enforces this agreement.
    - cron: "0 7 * * *"
    - cron: "0 9 * * 2,5"
    - cron: "17 16 * * 1,3,6"
    - cron: "0 18 * * 2,5,0"

permissions:
  actions: read
  contents: write

concurrency:
  group: lordchrist-telegram-publisher
  cancel-in-progress: false
  queue: max

env:
  PYTHONPATH: src
  PREDECESSOR_QUEUE_PATH: content/telegram/lordchrist/verified-30-posts.json
  QUEUE_PATH: content/telegram/lordchrist/verified-30-posts.json
  PRESENTATION_POLICY_PATH: content/telegram/lordchrist/presentation-policy-v5.json
  PRESENTATION_POLICY_V3_PATH: content/telegram/lordchrist/presentation-policy-v3.json
  PRESENTATION_POLICY_V4_PATH: content/telegram/lordchrist/presentation-policy-v4.json
  RUNTIME_ACTIVATION_PATH: content/telegram/lordchrist/successor-depth-runtime-activation-v5.json
  PRESENTATION_MIGRATION_PATH: content/telegram/lordchrist/successor-depth-presentation-migration-v2.json
  SOURCE_WEB_AUDIT_PATH: content/telegram/lordchrist/quote-source-web-audit-v2.json
  SOURCE_LIVE_PROBE_PATH: content/telegram/lordchrist/quote-source-live-probe-v2.json
  DEPTH_AUDIT_PATH: content/telegram/lordchrist/quote-depth-audit-v1.json
  DEPTH_REPLACEMENTS_PATH: content/telegram/lordchrist/quote-depth-replacements-v1.json
  PRODUCTION_CONFIG_PATH: content/telegram/lordchrist/production-schedule.json
  SUCCESSOR_CANDIDATE_PATH: content/telegram/lordchrist/successor-quotes-v1.json
  SUCCESSOR_TRANSLATION_LEDGER_PATH: content/telegram/lordchrist/successor-translation-ledger-v1.json
  SUCCESSOR_INTEGRITY_AMENDMENTS_PATH: content/telegram/lordchrist/successor-integrity-amendments-v1.json
  SUCCESSOR_RELEASE_PATH: content/telegram/lordchrist/successor-release-v2.json
  SUCCESSOR_ACTIVATION_PATH: content/telegram/lordchrist/successor-activation-v1.json
  SUCCESSOR_RUNTIME_QUEUE_PATH: .runtime/lordchrist-successor-runtime-queue.json
  DEPTH_RELEASE_PATH: content/telegram/lordchrist/successor-depth-release-v1.json
  DEPTH_ACTIVATION_PATH: content/telegram/lordchrist/successor-depth-activation-v1.json
  DEPTH_RESTORE_PATH: content/telegram/lordchrist/successor-depth-restore-v1.json
  DEPTH_V2_RUNTIME_QUEUE_PATH: .runtime/lordchrist-successor-depth-v2-runtime-queue.json
  DEPTH_V2_LEDGER_PATH: .state/lordchrist/content/telegram/lordchrist/successor-depth-v2-publication-ledger.json
  DEPTH_RUNTIME_QUEUE_PATH: .runtime/lordchrist-successor-depth-v3-runtime-queue.json
  DEPTH_LEDGER_RELATIVE_PATH: content/telegram/lordchrist/successor-depth-v3-publication-ledger.json
  DEPTH_LEDGER_PATH: .state/lordchrist/content/telegram/lordchrist/successor-depth-v3-publication-ledger.json
  STANDALONE_REVIEW_PATH: content/telegram/lordchrist/quote-standalone-review-v2.json
  ACTIVE_SELECTION_PATH: .runtime/lordchrist-active-quote-selection.json
  QUOTE_CHECKPOINT_PATH: .runtime/lordchrist-quote-runtime-checkpoint.json
  STATE_BRANCH: state/lordchrist-telegram
  STATE_DIR: .state/lordchrist
  PREDECESSOR_LEDGER_RELATIVE_PATH: content/telegram/lordchrist/publication-ledger.json
  PREDECESSOR_LEDGER_PATH: .state/lordchrist/content/telegram/lordchrist/publication-ledger.json
  SUCCESSOR_LEDGER_RELATIVE_PATH: content/telegram/lordchrist/successor-publication-ledger.json
  SUCCESSOR_LEDGER_PATH: .state/lordchrist/content/telegram/lordchrist/successor-publication-ledger.json
  LEDGER_RELATIVE_PATH: content/telegram/lordchrist/publication-ledger.json
  LEDGER_PATH: .state/lordchrist/content/telegram/lordchrist/publication-ledger.json
  LORDCHRIST_PREDECESSOR_QUEUE_PATH: content/telegram/lordchrist/verified-30-posts.json
  LORDCHRIST_PREDECESSOR_LEDGER_PATH: .state/lordchrist/content/telegram/lordchrist/publication-ledger.json
  DISPATCH_PATH: .runtime/lordchrist-dispatch.json
  RENDERED_PATH: .runtime/lordchrist-rendered.json
  OUTCOME_PATH: .runtime/lordchrist-outcome.json
  TARGET_PROOF_PATH: .runtime/lordchrist-target-proof.json
  HISTORICAL_RELEASE_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_id == 'lordchrist-history-spurgeon-down-grade-1887-v3' && 'content/telegram/lordchrist/historical-editorial/v1/production-release-spurgeon-v3-media-canary.json' || 'content/telegram/lordchrist/historical-editorial/v1/production-release-2026-09-cycle-02.json' }}
  HISTORICAL_LEDGER_RELATIVE_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_id == 'lordchrist-history-spurgeon-down-grade-1887-v3' && 'content/telegram/lordchrist/historical-editorial/publication-ledger-spurgeon-v3-media.json' || 'content/telegram/lordchrist/historical-editorial/publication-ledger.json' }}
  HISTORICAL_LEDGER_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_id == 'lordchrist-history-spurgeon-down-grade-1887-v3' && '.state/lordchrist/content/telegram/lordchrist/historical-editorial/publication-ledger-spurgeon-v3-media.json' || '.state/lordchrist/content/telegram/lordchrist/historical-editorial/publication-ledger.json' }}
  HISTORICAL_INTENT_PATH: .runtime/lordchrist-historical-intent.json
  HISTORICAL_OUTCOME_PATH: .runtime/lordchrist-historical-outcome.json
  HISTORICAL_TARGET_PROOF_PATH: .runtime/lordchrist-historical-target-proof.json
  LORDCHRIST_TELEGRAM_CHAT_ID: ${{ vars.LORDCHRIST_TELEGRAM_CHAT_ID }}
  LORDCHRIST_TELEGRAM_BOT_ID: ${{ vars.LORDCHRIST_TELEGRAM_BOT_ID }}
  LORDCHRIST_TELEGRAM_BOT_USERNAME: ${{ vars.LORDCHRIST_TELEGRAM_BOT_USERNAME }}
  LORDCHRIST_APPROVED_QUEUE_DIGEST: ${{ vars.LORDCHRIST_APPROVED_QUEUE_DIGEST }}
  LORDCHRIST_POSTING_ENABLED: ${{ vars.LORDCHRIST_POSTING_ENABLED }}

jobs:
  publish-next:
    if: >-
      github.ref == 'refs/heads/main' &&
      !(github.event_name == 'schedule' && github.event.schedule == '17 16 * * 1,3,6') &&
      !(github.event_name == 'workflow_dispatch' && inputs.action == 'publish-article') &&
      !(github.event_name == 'workflow_dispatch' && inputs.action == 'publish' && startsWith(inputs.publication_id, 'lordchrist-history-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out immutable code and queue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install minimal Telegram runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt

      - name: Determine guarded execution mode
        id: intent
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EVENT: ${{ github.event.schedule }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUESTED_ACTION: ${{ inputs.action }}
          REQUESTED_PUBLICATION_ID: ${{ inputs.publication_id }}
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          mode=manual
          do_preflight=false
          do_publish=false
          reason=manual_preview
          publication_id=""
          scheduled_slot=""

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            if [[ "$RUN_ATTEMPT" != "1" ]]; then
              echo "Scheduled workflow re-runs are forbidden; wait for the next normal schedule or use an exact-bound manual publish." >&2
              exit 5
            fi
            mode=scheduled
            mapfile -t schedule_parts < <(python - <<'PY'
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          from video_channel_manager.telegram_presentation import load_presentation_policy
          from video_channel_manager.telegram_schedule import (
              decide_scheduled_slot,
              load_production_schedule,
              require_release_binding,
          )

          schedule = load_production_schedule(Path(os.environ["PRODUCTION_CONFIG_PATH"]))
          policy = load_presentation_policy(Path(os.environ["PRESENTATION_POLICY_PATH"]))
          require_release_binding(
              schedule,
              queue_digest=os.environ["LORDCHRIST_APPROVED_QUEUE_DIGEST"],
              chat_id=int(os.environ["LORDCHRIST_TELEGRAM_CHAT_ID"]),
              bot_id=int(os.environ["LORDCHRIST_TELEGRAM_BOT_ID"]),
              bot_username=os.environ["LORDCHRIST_TELEGRAM_BOT_USERNAME"],
              presentation_policy_id=policy.policy_id,
              presentation_policy_sha256=policy.digest,
          )
          decision = decide_scheduled_slot(
              schedule,
              event_schedule=os.environ.get("SCHEDULE_EVENT", ""),
              now=datetime.now(tz=UTC),
              lane="quote",
          )
          print("active" if decision.active else "inactive")
          print(decision.slot or "")
          print(decision.reason)
          PY
            )
            schedule_state="${schedule_parts[0]:-inactive}"
            scheduled_slot="${schedule_parts[1]:-}"
            schedule_reason="${schedule_parts[2]:-unknown_schedule_state}"
            if [[ "$schedule_state" == "active" && -n "$scheduled_slot" ]]; then
              do_preflight=true
              do_publish=true
              reason="scheduled_${scheduled_slot}_execution"
            else
              do_preflight=false
              do_publish=false
              reason="scheduled_inactive:$schedule_reason"
            fi
          elif [[ "$REQUESTED_ACTION" == "preflight" ]]; then
            do_preflight=true
            reason=manual_read_only_preflight
          elif [[ "$REQUESTED_ACTION" == "publish" ]]; then
            [[ "$REQUESTED_PUBLICATION_ID" =~ ^lordchrist-[a-z0-9][a-z0-9-]{4,100}$ ]] || {
              echo "Manual publication requires an exact valid publication_id." >&2
              exit 2
            }
            expected_confirmation="PUBLISH:$REQUESTED_PUBLICATION_ID"
            if [[ "$CONFIRMATION" != "$expected_confirmation" ]]; then
              echo "Live publication requires the exact confirmation: $expected_confirmation" >&2
              exit 2
            fi
            do_preflight=true
            do_publish=true
            reason=manual_execution
            publication_id="$REQUESTED_PUBLICATION_ID"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "do_preflight=$do_preflight" >> "$GITHUB_OUTPUT"
          echo "do_publish=$do_publish" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "publication_id=$publication_id" >> "$GITHUB_OUTPUT"
          echo "scheduled_slot=$scheduled_slot" >> "$GITHUB_OUTPUT"

      - name: Check out publication ledger read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state/lordchrist-telegram
          path: .state/lordchrist
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact active quote release (v4 Puritan/Spurgeon queue)
        id: active_release
        shell: bash
        run: |
          set -euo pipefail
          # After the v4 strict-schema cutover (2026-10-28) the live queue is the
          # 30-post classical Puritan/Spurgeon queue at QUEUE_PATH.  The old
          # depth-v3 resolution chain (successor-*-v1 + quote-depth-*) is kept
          # around for historical/audit reference only and is no longer the
          # active publisher input.  Emit the same selection JSON shape the
          # downstream steps expect, pointing directly at the v4 queue with a
          # fresh ledger on the state branch (initialized on first publish).
          mkdir -p .runtime
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          from pathlib import Path

          from video_channel_manager.telegram_models import TelegramQueue

          queue_path = Path(os.environ["QUEUE_PATH"])
          queue = TelegramQueue.model_validate_json(queue_path.read_text(encoding="utf-8"))
          digest = queue.digest

          # Initialization is needed when (a) no ledger exists yet on the state
          # branch, or (b) the existing ledger is bound to a previous release
          # (different queue digest). In case (b) the v4 cutover discards the
          # stale ledger in a later step and re-initializes a fresh one on the
          # first guarded publish.
          needs_init = True
          ledger_path = Path(os.environ["LEDGER_PATH"])
          if ledger_path.is_file():
              try:
                  existing = json.loads(ledger_path.read_text(encoding="utf-8"))
                  if existing.get("queue_digest") == digest:
                      needs_init = False
              except (OSError, json.JSONDecodeError):
                  needs_init = True

          selection = {
              "schema_name": "video-channel-manager.telegram-active-quote-selection",
              "schema_version": 3,
              "active_release": "v4",
              "release_id": "lordchrist-puritan-spurgeon-v4",
              "queue_path": str(queue_path),
              "ledger_path": os.environ["LEDGER_PATH"],
              "ledger_relative_path": "content/telegram/lordchrist/publication-ledger.json",
              "queue_digest": digest,
              "predecessor_complete": True,
              "needs_ledger_initialization": needs_init,
              "history_queue_path": str(queue_path),
              "history_ledger_path": os.environ["LEDGER_PATH"],
              "provider_writes_authorized": True,
          }
          Path(os.environ["ACTIVE_SELECTION_PATH"]).write_text(
              json.dumps(selection, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )

          outputs = {
              "active_release": selection["active_release"],
              "queue_digest": selection["queue_digest"],
              "needs_ledger_initialization": str(selection["needs_ledger_initialization"]).lower(),
              "provider_writes_authorized": "true",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={value}\n")

          env = {
              "QUEUE_PATH": selection["queue_path"],
              "LEDGER_PATH": selection["ledger_path"],
              "LEDGER_RELATIVE_PATH": selection["ledger_relative_path"],
              "LORDCHRIST_APPROVED_QUEUE_DIGEST": selection["queue_digest"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in env.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Validate immutable queue and strict ledger
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_cli \
            --queue "$QUEUE_PATH" \
            --ledger "$LEDGER_PATH" \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            validate

      - name: Bind the v4 runtime activation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_ARM'
          import hashlib
          import json
          import os
          from pathlib import Path

          from video_channel_manager.telegram_models import TelegramQueue, sha256_text, canonical_json
          from video_channel_manager.telegram_presentation import load_presentation_policy

          queue = TelegramQueue.model_validate_json(Path(os.environ["QUEUE_PATH"]).read_text(encoding="utf-8"))
          policy = load_presentation_policy(Path(os.environ["PRESENTATION_POLICY_PATH"]))
          schedule = json.loads(Path(os.environ["PRODUCTION_CONFIG_PATH"]).read_text(encoding="utf-8"))
          digest = queue.digest

          checkpoint = {
              "schema_name": "video-channel-manager.telegram-runtime-activation",
              "schema_version": 1,
              "project_key": "lord-god-strength",
              "channel_username": "@lordchrist",
              "release_id": "lordchrist-puritan-spurgeon-v4",
              "queue_digest": digest,
              "presentation_policy_id": policy.policy_id,
              "presentation_policy_sha256": policy.digest,
              "state_ledger_relative_path": os.environ.get("LEDGER_RELATIVE_PATH", "content/telegram/lordchrist/publication-ledger.json"),
              "provider_writes_authorized": bool(schedule.get("enabled")),
              "note": "v4 Puritan/Spurgeon 30-post strict-schema queue activated 2026-10-28; round-hour slots 10:00/21:00 MSK.",
          }
          Path(os.environ["QUOTE_CHECKPOINT_PATH"]).write_text(
              json.dumps(checkpoint, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          if schedule["enabled"] is not checkpoint["provider_writes_authorized"]:
              raise SystemExit(
                  "Reviewed schedule arming disagrees with the v4 runtime activation checkpoint; "
                  "autonomous dispatch may only be armed when the schedule is enabled."
              )
          if schedule["presentation_policy_sha256"] != checkpoint["presentation_policy_sha256"]:
              raise SystemExit("Reviewed schedule presentation policy differs from the v4 activation checkpoint.")
          if digest != schedule["queue_digest"]:
              raise SystemExit("v4 queue digest differs from the production schedule binding.")
          PY_ARM


      - name: Prove the exact next v4 reading unit
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_cli \
            --queue "$QUEUE_PATH" \
            --ledger "$LEDGER_PATH" \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            preview

      - name: Preview next publication
        if: steps.intent.outputs.do_preflight != 'true' && steps.intent.outputs.do_publish != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Execution skipped: ${{ steps.intent.outputs.reason }}"
          python -m video_channel_manager.telegram_cli \
            --queue "$QUEUE_PATH" \
            --ledger "$LEDGER_PATH" \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            preview

      - name: Require current-main exact-SHA repository CI proof
        if: steps.intent.outputs.do_preflight == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow ci.yml \
            --sha "$GITHUB_SHA"

      - name: Validate read-only target configuration
        if: steps.intent.outputs.do_preflight == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LORDCHRIST_TELEGRAM_CHAT_ID" =~ ^-?[0-9]+$ ]] || {
            echo "LORDCHRIST_TELEGRAM_CHAT_ID must be an exact signed integer." >&2
            exit 2
          }
          (( LORDCHRIST_TELEGRAM_CHAT_ID < 0 )) || {
            echo "LORDCHRIST_TELEGRAM_CHAT_ID must be negative." >&2
            exit 2
          }
          [[ "$LORDCHRIST_TELEGRAM_BOT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "LORDCHRIST_TELEGRAM_BOT_ID must be an exact positive integer." >&2
            exit 2
          }
          [[ "$LORDCHRIST_TELEGRAM_BOT_USERNAME" =~ ^[A-Za-z0-9_]+$ ]] || {
            echo "LORDCHRIST_TELEGRAM_BOT_USERNAME is invalid." >&2
            exit 2
          }
          [[ -n "$LORDCHRIST_APPROVED_QUEUE_DIGEST" ]] || {
            echo "Missing LORDCHRIST_APPROVED_QUEUE_DIGEST." >&2
            exit 2
          }

      - name: Read-only bot and channel preflight
        if: steps.intent.outputs.do_preflight == 'true'
        shell: bash
        env:
          LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python -m video_channel_manager.telegram_cli \
            --queue "$QUEUE_PATH" \
            --ledger "$LEDGER_PATH" \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            preflight \
            --mode "${{ steps.intent.outputs.mode }}" \
            --expected-chat-id "$LORDCHRIST_TELEGRAM_CHAT_ID" \
            --expected-bot-id "$LORDCHRIST_TELEGRAM_BOT_ID" \
            --expected-bot-username "$LORDCHRIST_TELEGRAM_BOT_USERNAME" \
            --output "$TARGET_PROOF_PATH"

      - name: Stop after read-only preflight
        if: steps.intent.outputs.do_preflight == 'true' && steps.intent.outputs.do_publish != 'true'
        shell: bash
        run: echo "Read-only Telegram preflight passed. No provider mutation was attempted."

      - name: Enforce publication gates
        if: steps.intent.outputs.do_publish == 'true'
        shell: bash
        env:
          SCHEDULE_EVENT: ${{ github.event.schedule }}
          EXPECTED_SLOT: ${{ steps.intent.outputs.scheduled_slot }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.intent.outputs.mode }}" == "scheduled" ]]; then
            python - <<'PY'
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          from video_channel_manager.telegram_presentation import load_presentation_policy
          from video_channel_manager.telegram_schedule import (
              decide_scheduled_slot,
              load_production_schedule,
              require_release_binding,
          )

          schedule = load_production_schedule(Path(os.environ["PRODUCTION_CONFIG_PATH"]))
          policy = load_presentation_policy(Path(os.environ["PRESENTATION_POLICY_PATH"]))
          require_release_binding(
              schedule,
              queue_digest=os.environ["LORDCHRIST_APPROVED_QUEUE_DIGEST"],
              chat_id=int(os.environ["LORDCHRIST_TELEGRAM_CHAT_ID"]),
              bot_id=int(os.environ["LORDCHRIST_TELEGRAM_BOT_ID"]),
              bot_username=os.environ["LORDCHRIST_TELEGRAM_BOT_USERNAME"],
              presentation_policy_id=policy.policy_id,
              presentation_policy_sha256=policy.digest,
          )
          decision = decide_scheduled_slot(
              schedule,
              event_schedule=os.environ.get("SCHEDULE_EVENT", ""),
              now=datetime.now(tz=UTC),
          )
          expected_slot = os.environ.get("EXPECTED_SLOT", "")
          if not decision.active or decision.slot != expected_slot:
              raise SystemExit(
                  f"Scheduled production slot reproof failed: active={decision.active}, slot={decision.slot!r}, expected={expected_slot!r}."
              )
          print(f"Scheduled production slot {decision.slot} is active and release-bound.")
          PY
          else
            [[ "${LORDCHRIST_POSTING_ENABLED,,}" == "true" ]] || {
              echo "LORDCHRIST_POSTING_ENABLED is not true." >&2
              exit 2
            }
          fi

      - name: Discard stale v4 ledger before durable initialization
        if: steps.active_release.outputs.needs_ledger_initialization == 'true' && steps.intent.outputs.do_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$LEDGER_PATH"

      - name: Enable state writer for one-time v4 ledger initialization
        if: steps.active_release.outputs.needs_ledger_initialization == 'true' && steps.intent.outputs.do_publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state/lordchrist-telegram
          path: .state/lordchrist
          fetch-depth: 0
          persist-credentials: true

      - name: Persist initialized v4 ledger to state branch
        if: steps.active_release.outputs.needs_ledger_initialization == 'true' && steps.intent.outputs.do_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.active_release.outputs.active_release }}" == "v4" ]] || {
            echo "Fresh ledger initialization is only defined for the v4 release." >&2
            exit 2
          }
          [[ ! -e "$LEDGER_PATH" ]] || {
            echo "v4 ledger unexpectedly exists on the state branch; refusing ambiguous initialization." >&2
            exit 3
          }
          mkdir -p "$(dirname "$LEDGER_PATH")"
          python -m video_channel_manager.telegram_cli \
            --queue "$QUEUE_PATH" \
            --ledger "$LEDGER_PATH" \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            initialize-ledger \
            --confirm INITIALIZE_STRICT_TELEGRAM_LEDGER
          python -m video_channel_manager.telegram_cli \
            --queue "$QUEUE_PATH" \
            --ledger "$LEDGER_PATH" \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            validate

          git -C "$STATE_DIR" config user.name "lordchrist-publisher[bot]"
          git -C "$STATE_DIR" config user.email "lordchrist-publisher@users.noreply.github.com"
          git -C "$STATE_DIR" add -- "$LEDGER_RELATIVE_PATH"
          git -C "$STATE_DIR" commit -m "Initialize reviewed Lordchrist v4 Puritan/Spurgeon ledger [skip ci]"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$remote_sha" == "$local_sha" ]] || {
            echo "Remote v4 ledger initialization commit differs from local exact commit." >&2
            exit 3
          }

          git -C "$STATE_DIR" fetch --no-tags origin "$STATE_BRANCH"
          git -C "$STATE_DIR" show "origin/$STATE_BRANCH:$LEDGER_RELATIVE_PATH" > .runtime/remote-v4-ledger.json
          cmp -s "$LEDGER_PATH" .runtime/remote-v4-ledger.json || {
            echo "Remote v4 ledger differs from the exact initialized ledger." >&2
            exit 3
          }
          python -m video_channel_manager.telegram_cli \
            --queue "$QUEUE_PATH" \
            --ledger .runtime/remote-v4-ledger.json \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            validate

      - name: Enable publication ledger writer
        if: steps.intent.outputs.do_publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state/lordchrist-telegram
          path: .state/lordchrist
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare one exact strict-order dispatch
        id: prepare
        if: steps.intent.outputs.do_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --queue "$QUEUE_PATH"
            --ledger "$LEDGER_PATH"
            --presentation-policy "$PRESENTATION_POLICY_PATH"
            prepare
            --mode "${{ steps.intent.outputs.mode }}"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
            --github-sha "$GITHUB_SHA"
            --github-workflow-sha "${{ github.workflow_sha }}"
            --target-proof "$TARGET_PROOF_PATH"
            --dispatch "$DISPATCH_PATH"
          )
          if [[ "${{ steps.intent.outputs.mode }}" == "manual" ]]; then
            args+=(--expected-publication-id "${{ steps.intent.outputs.publication_id }}")
          else
            args+=(--scheduled-slot "${{ steps.intent.outputs.scheduled_slot }}")
          fi

          set +e
          python -m video_channel_manager.telegram_cli "${args[@]}"
          status=$?
          set -e

          if [[ "$status" -eq 3 ]]; then
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            echo "No eligible next publication; queue may be complete or this slot/day quota is already used."
            exit 0
          fi
          [[ "$status" -eq 0 ]] || exit "$status"
          echo "prepared=true" >> "$GITHUB_OUTPUT"

      - name: Render exact Telegram provider payload
        if: steps.prepare.outputs.prepared == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_cli \
            --queue "$QUEUE_PATH" \
            --ledger "$LEDGER_PATH" \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            render-dispatch \
            --dispatch "$DISPATCH_PATH" \
            --output "$RENDERED_PATH"

      - name: Persist intent and rendered payload before sendMessage
        id: persist_intent
        if: steps.prepare.outputs.prepared == 'true'
        shell: bash
        run: |
          set -euo pipefail

          push_exact_state() {
            local parent_sha="$1"
            local local_sha="$2"
            local remote_sha=""
            local attempt

            for attempt in 1 2 3; do
              if git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"; then
                return 0
              fi

              remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" 2>/dev/null | cut -f1 || true)"
              if [[ "$remote_sha" == "$local_sha" ]]; then
                echo "State commit reached remote despite a failed push response."
                return 0
              fi
              if [[ -n "$remote_sha" && "$remote_sha" != "$parent_sha" ]]; then
                echo "State branch moved unexpectedly from $parent_sha to $remote_sha; refusing to overwrite it." >&2
                return 3
              fi
              sleep $((attempt * 2))
            done
            return 3
          }

          git -C "$STATE_DIR" diff --quiet -- "$LEDGER_RELATIVE_PATH" && {
            echo "Prepared dispatch did not change the ledger." >&2
            exit 3
          }

          evidence_rel_dir="content/telegram/lordchrist/dispatches/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          evidence_abs_dir="$STATE_DIR/$evidence_rel_dir"
          mkdir -p "$evidence_abs_dir"
          cp -- "$DISPATCH_PATH" "$evidence_abs_dir/dispatch.json"
          cp -- "$RENDERED_PATH" "$evidence_abs_dir/rendered.json"

          git -C "$STATE_DIR" config user.name "lordchrist-publisher[bot]"
          git -C "$STATE_DIR" config user.email "lordchrist-publisher@users.noreply.github.com"
          git -C "$STATE_DIR" add -- "$LEDGER_RELATIVE_PATH" "$evidence_rel_dir"
          git -C "$STATE_DIR" diff --cached --quiet && {
            echo "Prepared dispatch produced no durable state delta." >&2
            exit 3
          }
          parent_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" commit -m "Record Lordchrist dispatch intent for run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT [skip ci]"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          push_exact_state "$parent_sha" "$local_sha" || exit 3

          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || {
            echo "Remote state branch does not contain the exact intent commit." >&2
            exit 3
          }

          git -C "$STATE_DIR" fetch --no-tags origin "$STATE_BRANCH"
          git -C "$STATE_DIR" show "origin/$STATE_BRANCH:$LEDGER_RELATIVE_PATH" > .runtime/remote-ledger.json
          git -C "$STATE_DIR" show "origin/$STATE_BRANCH:$evidence_rel_dir/dispatch.json" > .runtime/remote-dispatch.json
          git -C "$STATE_DIR" show "origin/$STATE_BRANCH:$evidence_rel_dir/rendered.json" > .runtime/remote-rendered.json

          cmp -s "$DISPATCH_PATH" .runtime/remote-dispatch.json || {
            echo "Remote dispatch evidence differs from the exact prepared dispatch." >&2
            exit 3
          }
          cmp -s "$RENDERED_PATH" .runtime/remote-rendered.json || {
            echo "Remote rendered evidence differs from the exact provider payload." >&2
            exit 3
          }

          python -m video_channel_manager.telegram_cli \
            --queue "$QUEUE_PATH" \
            --ledger .runtime/remote-ledger.json \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            verify-intent \
            --dispatch .runtime/remote-dispatch.json

          python -m video_channel_manager.telegram_cli \
            --queue "$QUEUE_PATH" \
            --ledger .runtime/remote-ledger.json \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            verify-rendered \
            --dispatch .runtime/remote-dispatch.json \
            --rendered .runtime/remote-rendered.json

          echo "persisted=true" >> "$GITHUB_OUTPUT"

      - name: Re-prove current-main CI immediately before Telegram mutation
        id: pre_send_quality
        if: steps.persist_intent.outputs.persisted == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow ci.yml \
            --sha "$GITHUB_SHA"

      - name: Resolve blocked pre-send intent as confirmed absent
        if: steps.persist_intent.outputs.persisted == 'true' && steps.pre_send_quality.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          publication_id="$(python - <<'PY'
          from pathlib import Path
          from video_channel_manager.telegram_state import load_dispatch
          print(load_dispatch(Path(".runtime/lordchrist-dispatch.json")).publication_id)
          PY
          )"
          python -m video_channel_manager.telegram_cli \
            --queue "$QUEUE_PATH" \
            --ledger "$LEDGER_PATH" \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            resolve \
            --publication-id "$publication_id" \
            --resolution confirmed_absent \
            --evidence-note "Exact current-main repository CI reproof failed before the Telegram send step, so this workflow did not dispatch a provider mutation." \
            --resolved-by "github-actions:$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"

      - name: Send exactly one prepared message
        id: send
        if: steps.persist_intent.outputs.persisted == 'true' && steps.pre_send_quality.outcome == 'success'
        shell: bash
        env:
          LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
          LORDCHRIST_POSTING_ENABLED: ${{ github.event_name == 'schedule' && 'true' || vars.LORDCHRIST_POSTING_ENABLED }}
          LORDCHRIST_SCHEDULE_ENABLED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          set +e
          python -m video_channel_manager.telegram_cli \
            --queue "$QUEUE_PATH" \
            --ledger "$LEDGER_PATH" \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            send \
            --dispatch "$DISPATCH_PATH" \
            --rendered "$RENDERED_PATH"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Capture exact Lordchrist provider outcome
        id: capture_outcome
        if: steps.persist_intent.outputs.persisted == 'true' && steps.pre_send_quality.outcome == 'success' && steps.send.outcome == 'success' && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_lordchrist_outcome_cli \
            --queue "$QUEUE_PATH" \
            --ledger "$LEDGER_PATH" \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            capture \
            --dispatch "$DISPATCH_PATH" \
            --rendered "$RENDERED_PATH" \
            --output "$OUTCOME_PATH"

      - name: Archive exact Lordchrist provider outcome before state mutation
        if: steps.capture_outcome.outcome == 'success' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lordchrist-provider-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/lordchrist-outcome.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Persist exact Telegram result
        id: persist_result
        if: steps.persist_intent.outputs.persisted == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail

          push_exact_state() {
            local parent_sha="$1"
            local local_sha="$2"
            local remote_sha=""
            local attempt

            for attempt in 1 2 3; do
              if git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"; then
                return 0
              fi

              remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" 2>/dev/null | cut -f1 || true)"
              if [[ "$remote_sha" == "$local_sha" ]]; then
                echo "Result state reached remote despite a failed push response."
                return 0
              fi
              if [[ -n "$remote_sha" && "$remote_sha" != "$parent_sha" ]]; then
                echo "State branch moved unexpectedly from $parent_sha to $remote_sha; refusing to overwrite it." >&2
                return 4
              fi
              sleep $((attempt * 2))
            done
            return 4
          }

          git -C "$STATE_DIR" add -- "$LEDGER_RELATIVE_PATH"
          if git -C "$STATE_DIR" diff --cached --quiet; then
            echo "No post-send result was saved. The durable intent remains blocking; blind retry is forbidden." >&2
            exit 4
          fi
          parent_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" commit -m "Record Lordchrist Telegram result for run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT [skip ci]"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          push_exact_state "$parent_sha" "$local_sha" || exit 4

          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || {
            echo "Remote result commit verification failed." >&2
            exit 4
          }

          if [[ "${{ steps.pre_send_quality.outcome }}" != "success" ]]; then
            echo "Provider mutation was blocked by the final current-main CI reproof; confirmed-absent state was persisted." >&2
            exit 4
          fi
          if [[ "${{ steps.send.outputs.exit_code }}" != "0" ]]; then
            echo "Telegram did not return a fully verified success. Review the state ledger before any ambiguous retry." >&2
            exit 4
          fi

      - name: Report actual quote publication status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          EXECUTION_REASON: ${{ steps.intent.outputs.reason }}
          DURABLE_RESULT: ${{ steps.persist_result.outcome }}
        shell: bash
        run: python -m video_channel_manager.telegram_quote_status

  historical-rich:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '17 16 * * 1,3,6') ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'publish' && startsWith(inputs.publication_id, 'lordchrist-history-'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact historical release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install minimal Telegram runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt

      - name: Resolve exact historical execution mode
        id: historical_intent
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EVENT: ${{ github.event.schedule }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUESTED_PUBLICATION_ID: ${{ inputs.publication_id }}
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          mode=""
          expected_publication_id=""
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            [[ "$SCHEDULE_EVENT" == "17 16 * * 1,3,6" ]] || {
              echo "Historical job received an unrelated schedule." >&2
              exit 2
            }
            [[ "$RUN_ATTEMPT" == "1" ]] || {
              echo "Historical scheduled reruns are forbidden." >&2
              exit 5
            }
            mode=scheduled
          else
            expected_publication_id="$REQUESTED_PUBLICATION_ID"
            [[ "$expected_publication_id" == "lordchrist-history-spurgeon-down-grade-1887-v3" ]] || {
              echo "Manual historical production is restricted to the exact reviewed canary." >&2
              exit 2
            }
            [[ "$CONFIRMATION" == "PUBLISH:$expected_publication_id" ]] || {
              echo "Historical canary requires exact PUBLISH confirmation." >&2
              exit 2
            }
            [[ "${LORDCHRIST_POSTING_ENABLED,,}" == "true" ]] || {
              echo "LORDCHRIST_POSTING_ENABLED is not true." >&2
              exit 2
            }
            [[ "$RUN_ATTEMPT" == "1" ]] || {
              echo "Historical canary reruns are forbidden." >&2
              exit 5
            }
            mode=manual_canary
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "expected_publication_id=$expected_publication_id" >> "$GITHUB_OUTPUT"

      - name: Validate exact historical release provider-free
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_historical_production preview \
            --release "$HISTORICAL_RELEASE_PATH"

      - name: Require exact current-main CI before historical state intent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow ci.yml \
            --sha "$GITHUB_SHA"

      - name: Read-only historical Telegram target proof
        shell: bash
        env:
          LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python -m video_channel_manager.telegram_historical_production preflight \
            --release "$HISTORICAL_RELEASE_PATH" \
            --output "$HISTORICAL_TARGET_PROOF_PATH"

      - name: Check out shared LordChrist state read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state/lordchrist-telegram
          path: .state/lordchrist
          fetch-depth: 0
          persist-credentials: false

      - name: Require initialized exact historical ledger and cross-track safety
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$HISTORICAL_LEDGER_PATH" ]] || {
            echo "Historical durable ledger is not initialized on state/lordchrist-telegram." >&2
            exit 2
          }
          python -m video_channel_manager.telegram_historical_production guard \
            --release "$HISTORICAL_RELEASE_PATH" \
            --ledger "$HISTORICAL_LEDGER_PATH" \
            --state-root "$STATE_DIR"
          python -m video_channel_manager.telegram_historical_production coverage \
            --release "$HISTORICAL_RELEASE_PATH" \
            --ledger "$HISTORICAL_LEDGER_PATH"

      - name: Enable shared LordChrist state writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state/lordchrist-telegram
          path: .state/lordchrist
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare one exact historical rich intent
        id: historical_prepare
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --release "$HISTORICAL_RELEASE_PATH"
            --ledger "$HISTORICAL_LEDGER_PATH"
            --state-root "$STATE_DIR"
            --mode "${{ steps.historical_intent.outputs.mode }}"
            --target-proof "$HISTORICAL_TARGET_PROOF_PATH"
            --github-repository "$GITHUB_REPOSITORY"
            --github-sha "$GITHUB_SHA"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
            --intent-output "$HISTORICAL_INTENT_PATH"
          )
          if [[ "${{ steps.historical_intent.outputs.mode }}" == "manual_canary" ]]; then
            args+=(--expected-publication-id "${{ steps.historical_intent.outputs.expected_publication_id }}")
          fi
          set +e
          python -m video_channel_manager.telegram_historical_production prepare "${args[@]}"
          status=$?
          set -e
          if [[ "$status" -eq 3 ]]; then
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            echo "Historical event is safely inert for this exact slot."
            exit 0
          fi
          [[ "$status" -eq 0 ]] || exit "$status"
          echo "prepared=true" >> "$GITHUB_OUTPUT"

      - name: Persist historical intent before sendRichMessage
        id: historical_persist_intent
        if: steps.historical_prepare.outputs.prepared == 'true'
        shell: bash
        run: |
          set -euo pipefail
          push_exact_state() {
            local parent_sha="$1"
            local local_sha="$2"
            local remote_sha=""
            local attempt
            for attempt in 1 2 3; do
              if git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"; then
                return 0
              fi
              remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" 2>/dev/null | cut -f1 || true)"
              if [[ "$remote_sha" == "$local_sha" ]]; then
                return 0
              fi
              if [[ -n "$remote_sha" && "$remote_sha" != "$parent_sha" ]]; then
                echo "Shared LordChrist state moved unexpectedly; refusing overwrite." >&2
                return 3
              fi
              sleep $((attempt * 2))
            done
            return 3
          }

          git -C "$STATE_DIR" diff --quiet -- "$HISTORICAL_LEDGER_RELATIVE_PATH" && {
            echo "Historical prepare did not create a durable intent delta." >&2
            exit 3
          }
          evidence_rel_dir="content/telegram/lordchrist/historical-editorial/dispatches/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          evidence_abs_dir="$STATE_DIR/$evidence_rel_dir"
          mkdir -p "$evidence_abs_dir"
          cp -- "$HISTORICAL_INTENT_PATH" "$evidence_abs_dir/intent.json"

          git -C "$STATE_DIR" config user.name "lordchrist-publisher[bot]"
          git -C "$STATE_DIR" config user.email "lordchrist-publisher@users.noreply.github.com"
          git -C "$STATE_DIR" add -- "$HISTORICAL_LEDGER_RELATIVE_PATH" "$evidence_rel_dir/intent.json"
          parent_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" commit -m "Record Lordchrist historical intent for run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT [skip ci]"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          push_exact_state "$parent_sha" "$local_sha" || exit 3
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$remote_sha" == "$local_sha" ]] || {
            echo "Remote historical intent commit differs from local exact commit." >&2
            exit 3
          }

          git -C "$STATE_DIR" fetch --no-tags origin "$STATE_BRANCH"
          git -C "$STATE_DIR" show "origin/$STATE_BRANCH:$HISTORICAL_LEDGER_RELATIVE_PATH" > .runtime/remote-historical-ledger.json
          git -C "$STATE_DIR" show "origin/$STATE_BRANCH:$evidence_rel_dir/intent.json" > .runtime/remote-historical-intent.json
          cmp -s "$HISTORICAL_INTENT_PATH" .runtime/remote-historical-intent.json || {
            echo "Remote historical intent evidence differs from exact prepared intent." >&2
            exit 3
          }
          python -m video_channel_manager.telegram_historical_production status \
            --release "$HISTORICAL_RELEASE_PATH" \
            --ledger .runtime/remote-historical-ledger.json > /dev/null
          echo "persisted=true" >> "$GITHUB_OUTPUT"

      - name: Send exactly one historical rich message
        id: historical_send
        if: steps.historical_persist_intent.outputs.persisted == 'true'
        shell: bash
        env:
          LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_historical_production send \
            --release "$HISTORICAL_RELEASE_PATH" \
            --intent "$HISTORICAL_INTENT_PATH" \
            --target-proof "$HISTORICAL_TARGET_PROOF_PATH" \
            --outcome "$HISTORICAL_OUTCOME_PATH"

      - name: Archive exact historical provider outcome before durable result mutation
        id: historical_archive
        if: steps.historical_send.outcome == 'success' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lordchrist-historical-provider-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/lordchrist-historical-outcome.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Apply archived historical outcome
        if: steps.historical_archive.outcome == 'success' && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_historical_production apply \
            --release "$HISTORICAL_RELEASE_PATH" \
            --ledger "$HISTORICAL_LEDGER_PATH" \
            --intent "$HISTORICAL_INTENT_PATH" \
            --outcome "$HISTORICAL_OUTCOME_PATH"

      - name: Persist exact historical Telegram result
        if: steps.historical_persist_intent.outputs.persisted == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          push_exact_state() {
            local parent_sha="$1"
            local local_sha="$2"
            local remote_sha=""
            local attempt
            for attempt in 1 2 3; do
              if git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"; then
                return 0
              fi
              remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" 2>/dev/null | cut -f1 || true)"
              if [[ "$remote_sha" == "$local_sha" ]]; then
                return 0
              fi
              if [[ -n "$remote_sha" && "$remote_sha" != "$parent_sha" ]]; then
                echo "Shared LordChrist state moved unexpectedly after provider outcome." >&2
                return 4
              fi
              sleep $((attempt * 2))
            done
            return 4
          }

          git -C "$STATE_DIR" add -- "$HISTORICAL_LEDGER_RELATIVE_PATH"
          if git -C "$STATE_DIR" diff --cached --quiet; then
            echo "No historical provider result was applied. Durable intent remains blocking; blind retry is forbidden." >&2
            exit 4
          fi
          parent_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" commit -m "Record Lordchrist historical Telegram result for run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT [skip ci]"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          push_exact_state "$parent_sha" "$local_sha" || exit 4
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$remote_sha" == "$local_sha" ]] || {
            echo "Remote historical result commit verification failed." >&2
            exit 4
          }

          publication_id="$(python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path(".runtime/lordchrist-historical-intent.json").read_text(encoding="utf-8"))
          print(value["publication_id"])
          PY
          )"
          PUBLICATION_ID="$publication_id" python - <<'PY'
          import json
          import os
          from pathlib import Path
          ledger = json.loads(Path(os.environ["HISTORICAL_LEDGER_PATH"]).read_text(encoding="utf-8"))
          row = ledger["entries"][os.environ["PUBLICATION_ID"]]
          if row["state"] != "published" or row["provider_effect"] != "verified" or not row.get("message_id"):
              raise SystemExit(f"Historical provider outcome is terminal but not verified: {row}")
          print(f"Historical publication verified as Telegram message {row['message_id']}")
          PY

      - name: Report historical coverage after verified result
        if: steps.historical_archive.outcome == 'success' && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_historical_production coverage \
            --release "$HISTORICAL_RELEASE_PATH" \
            --ledger "$HISTORICAL_LEDGER_PATH"

  charnock-rich:
    # Long L2 articles: one article per midday slot (12:00 Moscow, Tue/Fri).
    # The midday cron stays a configured queue slot, so it still reaches
    # publish-next, where the runtime decider refuses the quote lane and exits
    # inactive; this job is the only consumer of the article lane.
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 2,5') ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'publish-article')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out immutable code and article queue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install minimal Telegram runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt

      - name: Resolve today's article from the queue
        id: article
        shell: bash
        env:
          PYTHONPATH: src
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PUBLICATION_ID: ${{ inputs.publication_id }}
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            python -m video_channel_manager.lordchrist_rich_articles due > due.json
            cat due.json
            publication_id="$(python -c 'import json;print(json.load(open("due.json")).get("due") or "")')"
          else
            [[ "$REQUESTED_PUBLICATION_ID" =~ ^lordchrist-rich-charnock-[0-9]{2}$ ]] || {
              echo "Manual article run requires an exact queued publication_id." >&2
              exit 2
            }
            [[ "$CONFIRMATION" == "PUBLISH:$REQUESTED_PUBLICATION_ID" ]] || {
              echo "Manual article publication requires the exact confirmation: PUBLISH:$REQUESTED_PUBLICATION_ID" >&2
              exit 2
            }
            publication_id="$REQUESTED_PUBLICATION_ID"
          fi
          echo "publication_id=$publication_id" >> "$GITHUB_OUTPUT"

      - name: Preview the exact rich document
        if: steps.article.outputs.publication_id != ''
        shell: bash
        env:
          PYTHONPATH: src
          PUBLICATION_ID: ${{ steps.article.outputs.publication_id }}
        run: |
          set -euo pipefail
          python -m video_channel_manager.lordchrist_rich_articles preview \
            --publication-id "$PUBLICATION_ID" \
            --media-base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"

      - name: Publish the article through the shared rich boundary
        if: steps.article.outputs.publication_id != ''
        shell: bash
        env:
          PYTHONPATH: src
          PUBLICATION_ID: ${{ steps.article.outputs.publication_id }}
          LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python -m video_channel_manager.lordchrist_rich_articles send \
            --publication-id "$PUBLICATION_ID" \
            --media-base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}" \
            --outcome "rich-article-outcome.json"
