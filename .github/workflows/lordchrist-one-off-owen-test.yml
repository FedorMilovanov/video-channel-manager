name: Lordchrist one-off Owen autonomous test

on:
  workflow_dispatch:
  schedule:
    - cron: "15,20,25,30,35,40,45,50,55 20 7 8 *"
      timezone: Europe/Moscow

permissions:
  contents: write

concurrency:
  group: lordchrist-one-off-owen-2026-08-07
  cancel-in-progress: false
  queue: single

env:
  PYTHONPATH: src
  POST_PATH: content/telegram/lordchrist/one-off/2026-08-07-owen-first-actings.json
  STATE_BRANCH: state/lordchrist-telegram
  STATE_DIR: .state/lordchrist-one-off
  STATE_RELATIVE_PATH: content/telegram/lordchrist/one-off-state/2026-08-07-owen-first-actings.json
  STATE_PATH: .state/lordchrist-one-off/content/telegram/lordchrist/one-off-state/2026-08-07-owen-first-actings.json
  RENDERED_PATH: .runtime/owen-rendered.json
  TARGET_PATH: .runtime/owen-target.json
  SEND_RESULT_PATH: .runtime/owen-send-result.json
  EXPECTED_DATE_MOSCOW: "2026-08-07"
  EXPECTED_PUBLICATION_ID: lordchrist-owen-first-actings-test
  LORDCHRIST_TELEGRAM_CHAT_ID: ${{ vars.LORDCHRIST_TELEGRAM_CHAT_ID }}
  LORDCHRIST_TELEGRAM_BOT_ID: ${{ vars.LORDCHRIST_TELEGRAM_BOT_ID }}
  LORDCHRIST_TELEGRAM_BOT_USERNAME: ${{ vars.LORDCHRIST_TELEGRAM_BOT_USERNAME }}

jobs:
  publish-one-off:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out immutable code and one-off source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install minimal Telegram runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt

      - name: Enforce exact one-off Moscow date
        id: date_gate
        shell: bash
        run: |
          set -euo pipefail
          actual_date="$(TZ=Europe/Moscow date +%F)"
          if [[ "$actual_date" != "$EXPECTED_DATE_MOSCOW" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "One-off window expired; no provider call is authorized."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Validate and render exact presentation-v1 payload
        if: steps.date_gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python - <<'PY'
          import json
          from pathlib import Path
          from video_channel_manager.telegram_models import TelegramPost
          from video_channel_manager.telegram_presentation import load_presentation_policy, render_post

          post = TelegramPost.model_validate_json(Path("content/telegram/lordchrist/one-off/2026-08-07-owen-first-actings.json").read_text(encoding="utf-8"))
          if post.publication_id != "lordchrist-owen-first-actings-test":
              raise SystemExit("unexpected one-off publication_id")
          rendered = render_post(post, load_presentation_policy())
          Path(".runtime/owen-rendered.json").write_text(
              json.dumps(rendered.model_dump(mode="json"), ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(rendered.text)
          print(rendered.provider_payload_sha256)
          PY

      - name: Read-only bot and channel preflight
        if: steps.date_gate.outputs.run == 'true'
        shell: bash
        env:
          LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from video_channel_manager.telegram_transport import preflight_target

          target = preflight_target(
              token=os.environ["LORDCHRIST_TELEGRAM_BOT_TOKEN"],
              expected_chat_id=int(os.environ["LORDCHRIST_TELEGRAM_CHAT_ID"]),
              expected_bot_id=int(os.environ["LORDCHRIST_TELEGRAM_BOT_ID"]),
              expected_bot_username=os.environ["LORDCHRIST_TELEGRAM_BOT_USERNAME"],
          )
          Path(".runtime/owen-target.json").write_text(
              json.dumps(target.model_dump(mode="json"), ensure_ascii=False, sort_keys=True, default=str, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Check out one-off state writer
        if: steps.date_gate.outputs.run == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: state/lordchrist-telegram
          path: .state/lordchrist-one-off
          fetch-depth: 0
          persist-credentials: true

      - name: Reject duplicate or ambiguous prior one-off state
        id: prior
        if: steps.date_gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$STATE_PATH" ]]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          state="$(python -c 'import json,os; print(json.load(open(os.environ["STATE_PATH"], encoding="utf-8"))["state"])')"
          effect="$(python -c 'import json,os; print(json.load(open(os.environ["STATE_PATH"], encoding="utf-8"))["provider_effect"])')"
          if [[ "$state" == "published" && "$effect" == "verified" ]]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "One-off already verified; no duplicate send."
            exit 0
          fi
          echo "Existing one-off state is $state/$effect; refusing any blind retry." >&2
          exit 5

      - name: Persist exact intent before sendMessage
        id: persist_intent
        if: steps.date_gate.outputs.run == 'true' && steps.prior.outputs.send == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$STATE_PATH")"
          python - <<'PY'
          import hashlib
          import json
          import os
          import secrets
          from datetime import UTC, datetime
          from pathlib import Path

          post_bytes = Path(os.environ["POST_PATH"]).read_bytes()
          rendered = json.loads(Path(os.environ["RENDERED_PATH"]).read_text(encoding="utf-8"))
          target = json.loads(Path(os.environ["TARGET_PATH"]).read_text(encoding="utf-8"))
          state = {
              "schema_name": "video-channel-manager.telegram-one-off-state",
              "schema_version": 1,
              "publication_id": os.environ["EXPECTED_PUBLICATION_ID"],
              "state": "dispatching",
              "provider_effect": "may_exist",
              "intent_id": secrets.token_hex(16),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "github_sha": os.environ["GITHUB_SHA"],
              "source_file_sha256": "sha256:" + hashlib.sha256(post_bytes).hexdigest(),
              "provider_payload_sha256": rendered["provider_payload_sha256"],
              "target": target,
              "attempted_at_utc": datetime.now(UTC).isoformat().replace("+00:00", "Z"),
              "published_at_utc": None,
              "message_id": None,
              "message_url": None,
              "last_error": None,
          }
          Path(os.environ["STATE_PATH"]).write_text(
              json.dumps(state, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          cd "$STATE_DIR"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$STATE_RELATIVE_PATH"
          git commit -m "Persist one-off Owen Telegram intent for run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          git push origin HEAD:state/lordchrist-telegram
          intent_commit="$(git rev-parse HEAD)"
          git fetch origin state/lordchrist-telegram
          [[ "$(git rev-parse origin/state/lordchrist-telegram)" == "$intent_commit" ]] || {
            echo "Remote one-off intent does not match local commit; refusing sendMessage." >&2
            exit 5
          }
          echo "persisted=true" >> "$GITHUB_OUTPUT"

      - name: Send exactly one formatted Owen message
        id: send
        if: steps.persist_intent.outputs.persisted == 'true'
        shell: bash
        env:
          LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          import httpx
          from video_channel_manager.telegram_presentation import RenderedTelegramPost, formatting_entities_match
          from video_channel_manager.telegram_transport import TelegramApiError, _api_call, _result_dict

          rendered = RenderedTelegramPost.model_validate_json(Path(os.environ["RENDERED_PATH"]).read_text(encoding="utf-8"))
          target = json.loads(Path(os.environ["TARGET_PATH"]).read_text(encoding="utf-8"))
          result = {
              "ok": False,
              "provider_effect": "may_exist",
              "message_id": None,
              "message_url": None,
              "published_at_utc": None,
              "last_error": None,
          }
          try:
              with httpx.Client(
                  timeout=httpx.Timeout(connect=15, read=45, write=30, pool=15),
                  transport=httpx.HTTPTransport(retries=0),
                  trust_env=False,
              ) as client:
                  message = _result_dict(
                      _api_call(
                          client,
                          api_base="https://api.telegram.org",
                          token=os.environ["LORDCHRIST_TELEGRAM_BOT_TOKEN"],
                          method="sendMessage",
                          mutation=True,
                          payload={
                              "chat_id": int(target["chat_id"]),
                              "text": rendered.html_text,
                              "parse_mode": rendered.parse_mode,
                              "link_preview_options": {"is_disabled": True},
                          },
                      ),
                      method="sendMessage",
                      provider_effect="may_exist",
                  )
              if int(message.get("chat", {}).get("id", 0)) != int(target["chat_id"]):
                  raise RuntimeError("Telegram returned the wrong chat id")
              if message.get("text") != rendered.text:
                  raise RuntimeError("Telegram returned different plain text")
              if not formatting_entities_match(rendered.expected_entities, message.get("entities")):
                  raise RuntimeError("Telegram returned different formatting entities")
              message_id = int(message.get("message_id", 0))
              if message_id <= 0:
                  raise RuntimeError("Telegram returned invalid message_id")
              result.update(
                  ok=True,
                  provider_effect="verified",
                  message_id=message_id,
                  message_url=f"https://t.me/lordchrist/{message_id}",
                  published_at_utc=datetime.now(UTC).isoformat().replace("+00:00", "Z"),
              )
          except TelegramApiError as exc:
              result["provider_effect"] = exc.provider_effect
              result["last_error"] = str(exc)
          except Exception as exc:
              result["provider_effect"] = "may_exist"
              result["last_error"] = f"postflight verification failed: {type(exc).__name__}: {exc}"

          Path(os.environ["SEND_RESULT_PATH"]).write_text(
              json.dumps(result, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Persist exact one-off Telegram result
        if: steps.persist_intent.outputs.persisted == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$SEND_RESULT_PATH" ]] || {
            echo "Send step produced no result artifact; durable intent remains ambiguous. No retry is allowed." >&2
            exit 5
          }
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state_path = Path(os.environ["STATE_PATH"])
          state = json.loads(state_path.read_text(encoding="utf-8"))
          result = json.loads(Path(os.environ["SEND_RESULT_PATH"]).read_text(encoding="utf-8"))
          if result["ok"]:
              state["state"] = "published"
              state["provider_effect"] = "verified"
              state["message_id"] = result["message_id"]
              state["message_url"] = result["message_url"]
              state["published_at_utc"] = result["published_at_utc"]
              state["last_error"] = None
          elif result["provider_effect"] in {"confirmed_absent", "not_dispatched"}:
              state["state"] = "failed"
              state["provider_effect"] = result["provider_effect"]
              state["last_error"] = result["last_error"]
          else:
              state["state"] = "unknown"
              state["provider_effect"] = "may_exist"
              state["last_error"] = result["last_error"]
          state_path.write_text(json.dumps(state, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          cd "$STATE_DIR"
          git add -- "$STATE_RELATIVE_PATH"
          git commit -m "Persist one-off Owen Telegram result for run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          git push origin HEAD:state/lordchrist-telegram

      - name: Require verified one-off result
        if: steps.persist_intent.outputs.persisted == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          ok="$(python -c 'import json,os; print(str(json.load(open(os.environ["SEND_RESULT_PATH"], encoding="utf-8"))["ok"]).lower())')"
          [[ "$ok" == "true" ]] || {
            echo "One-off result is not verified. Do not re-run; inspect durable state first." >&2
            exit 5
          }
