name: Milovi Cake one-off canary dispatch controller

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Exact controller confirmation
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: milovi-cake-oneoff-canary-controller
  cancel-in-progress: false

jobs:
  dispatch-exact-once:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PROVIDER_WORKFLOW: milovi-telegram-oneoff-canary.yml
      EXECUTION_AUTH_PATH: content/telegram/milovi-cake/oneoff-canary-execution-authorization-2026-08-18.json
      PUBLICATION_ID: milovi-canary-20260818-001
      EXPECTED_CONTROLLER_CONFIRM: DISPATCH:@MiloviCake:milovi-canary-20260818-001
      PROVIDER_CONFIRM: PUBLISH:@MiloviCake:milovi-canary-20260818-001

    steps:
      - name: Check out exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install minimal Telegram runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            -r requirements/telegram-publisher.txt

      - name: Resolve exact controller authorization and execution window
        id: activation
        env:
          MANUAL_CONFIRM: ${{ inputs.confirm }}
          EVENT_NAME: ${{ github.event_name }}
        shell: python
        run: |
          from __future__ import annotations

          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          authorization = json.loads(
              Path(os.environ["EXECUTION_AUTH_PATH"]).read_text(encoding="utf-8")
          )
          blockers: list[str] = []

          if os.environ["EVENT_NAME"] != "workflow_dispatch":
              blockers.append("controller_requires_workflow_dispatch")
          if os.environ["MANUAL_CONFIRM"] != os.environ["EXPECTED_CONTROLLER_CONFIRM"]:
              blockers.append("exact_controller_confirmation_missing_or_mismatched")
          if authorization.get("schema_name") != "video-channel-manager.telegram-oneoff-execution-authorization":
              blockers.append("execution_authorization_schema_drift")
          if authorization.get("project_key") != "milovi-cake":
              blockers.append("execution_authorization_project_drift")
          if str(authorization.get("channel_username") or "").casefold() != "@milovicake":
              blockers.append("execution_authorization_channel_drift")
          if authorization.get("publication_id") != os.environ["PUBLICATION_ID"]:
              blockers.append("execution_authorization_publication_drift")
          if authorization.get("execution_authorized") is not True:
              blockers.append("execution_not_authorized")
          if authorization.get("automatic_dispatch_authorized") is not True:
              blockers.append("controller_dispatch_not_authorized")
          if authorization.get("max_provider_attempts") != 1:
              blockers.append("provider_attempt_policy_drift")
          if authorization.get("blind_mutation_retries") != 0:
              blockers.append("blind_retry_policy_drift")

          now = datetime.now(ZoneInfo("Europe/Moscow"))
          try:
              not_before = datetime.fromisoformat(authorization["execute_not_before"])
              not_after = datetime.fromisoformat(authorization["execute_not_after"])
          except Exception:
              blockers.append("execution_window_invalid")
          else:
              if now < not_before:
                  blockers.append("oneoff_not_due")
              if now >= not_after:
                  blockers.append("oneoff_too_stale")

          active = not blockers
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"active={'true' if active else 'false'}\n")
              output.write(f"reason={','.join(blockers) if blockers else 'authorized'}\n")
          print(json.dumps({
              "active": active,
              "reason": blockers,
              "publication_id": os.environ["PUBLICATION_ID"],
              "moscow_now": now.isoformat(),
              "provider_access_performed": False,
              "provider_write_performed": False,
          }, ensure_ascii=False))

      - name: Fail closed when controller dispatch is unauthorized or expired
        if: steps.activation.outputs.active != 'true'
        shell: bash
        run: |
          echo "Milovi one-off controller refused dispatch: ${{ steps.activation.outputs.reason }}" >&2
          exit 3

      - name: Require exact current-main one-off quality and media proofs
        if: steps.activation.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow ci.yml \
            --sha "$GITHUB_SHA"
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow milovi-telegram-oneoff-canary-quality.yml \
            --sha "$GITHUB_SHA"
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow milovi-telegram-bootstrap-media-proof.yml \
            --sha "$GITHUB_SHA"

      - name: Check whether the dedicated provider workflow was already dispatched
        if: steps.activation.outputs.active == 'true'
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$PROVIDER_WORKFLOW/runs?event=workflow_dispatch&branch=main&per_page=100" \
            > /tmp/milovi-oneoff-runs.json
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          authorization = json.loads(
              Path(os.environ["EXECUTION_AUTH_PATH"]).read_text(encoding="utf-8")
          )
          authorized_at = datetime.fromisoformat(authorization["authorized_at"]).astimezone(timezone.utc)
          runs = json.loads(
              Path("/tmp/milovi-oneoff-runs.json").read_text(encoding="utf-8")
          ).get("workflow_runs", [])

          prior = []
          for run in runs:
              created_raw = str(run.get("created_at") or "")
              if not created_raw:
                  continue
              created_at = datetime.fromisoformat(created_raw.replace("Z", "+00:00"))
              if created_at >= authorized_at:
                  prior.append({
                      "id": run.get("id"),
                      "head_sha": run.get("head_sha"),
                      "status": run.get("status"),
                      "conclusion": run.get("conclusion"),
                      "created_at": created_raw,
                  })

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"already={'true' if prior else 'false'}\n")
          print(json.dumps({"prior_provider_dispatch_runs": prior}, ensure_ascii=False))
          PY

      - name: Fail closed if provider workflow was already dispatched
        if: steps.activation.outputs.active == 'true' && steps.prior.outputs.already == 'true'
        shell: bash
        run: |
          echo "A provider workflow_dispatch already exists for this exact authorization; fresh authorization is required before another dispatch." >&2
          exit 3

      - name: Re-prove main did not move before provider dispatch
        if: steps.activation.outputs.active == 'true' && steps.prior.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "main moved after exact-current-main proofs: expected $GITHUB_SHA, found $current_main" >&2
            exit 3
          fi
          echo "Exact current main remains $current_main; provider dispatch is still fail-closed and provider-inert here."

      - name: Dispatch exact pre-authorized provider workflow once
        if: steps.activation.outputs.active == 'true' && steps.prior.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/milovi-oneoff-dispatch.json
          import json
          import os

          print(json.dumps({
              "ref": "main",
              "inputs": {"confirm": os.environ["PROVIDER_CONFIRM"]},
          }))
          PY
          gh api \
            --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$PROVIDER_WORKFLOW/dispatches" \
            --input /tmp/milovi-oneoff-dispatch.json
          echo "Exact Milovi one-off provider workflow dispatched once. This controller performed no Telegram access."
