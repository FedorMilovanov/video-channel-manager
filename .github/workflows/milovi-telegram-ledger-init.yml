name: Milovi Cake initialize publication ledger

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main SHA containing the reviewed authorized release
        required: true
        type: string
      release_digest:
        description: Exact sha256 digest of the reviewed authorized Milovi release
        required: true
        type: string
      confirm:
        description: Type INITIALIZE:<release_digest>
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: milovi-cake-telegram-publisher
  cancel-in-progress: false

jobs:
  initialize:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PROFILE_PATH: content/telegram/channels/milovi-cake.json
      BINDING_PATH: content/telegram/channels/milovi-cake-target-binding.json
      ROLLOUT_PATH: content/telegram/milovi-cake/queues/bootstrap-first-screen-queue-2026-08.json
      CANDIDATES_PATH: content/telegram/milovi-cake/bootstrap-first-screen-candidates-2026-08.json
      TRANSPORT_PROOF_PATH: content/telegram/milovi-cake/bootstrap-photo-transport-proof-2026-08.json
      WINDOW_PATH: content/telegram/milovi-cake/publishing-window-2026-08.json
      AUTHORIZED_RELEASE_PATH: content/telegram/milovi-cake/bootstrap-authorized-release-2026-08.json
      EXPECTED_CANDIDATE_PATH: .runtime/milovi-ledger-init-expected-release.json
      STATE_BRANCH: state/milovi-cake-telegram
      STATE_DIR: .state/milovi-cake
      LEDGER_RELATIVE_PATH: content/telegram/milovi-cake/publication-ledger.json
      LEDGER_PATH: .state/milovi-cake/content/telegram/milovi-cake/publication-ledger.json
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      REQUESTED_DIGEST: ${{ inputs.release_digest }}
      CONFIRMATION: ${{ inputs.confirm }}

    steps:
      - name: Check out immutable current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install minimal Telegram runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            -r requirements/telegram-publisher.txt

      - name: Compile exact current bootstrap expectation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python -m video_channel_manager.milovi_telegram_bootstrap validate \
            --profile "$PROFILE_PATH" \
            --rollout "$ROLLOUT_PATH" \
            --candidates "$CANDIDATES_PATH" \
            --transport-proof "$TRANSPORT_PROOF_PATH" \
            --publishing-window "$WINDOW_PATH"
          python -m video_channel_manager.milovi_telegram_bootstrap build-release \
            --profile "$PROFILE_PATH" \
            --rollout "$ROLLOUT_PATH" \
            --candidates "$CANDIDATES_PATH" \
            --transport-proof "$TRANSPORT_PROOF_PATH" \
            --publishing-window "$WINDOW_PATH" \
            --output "$EXPECTED_CANDIDATE_PATH"

      - name: Verify exact reviewed release and explicit initialization authority
        shell: python
        run: |
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          from video_channel_manager.telegram_channel_profile import load_channel_profile
          from video_channel_manager.telegram_multichannel_release import load_release
          from video_channel_manager.telegram_target_binding import load_target_binding

          sha40 = re.compile(r"^[0-9a-f]{40}$")
          sha256 = re.compile(r"^sha256:[0-9a-f]{64}$")
          expected_main = os.environ["EXPECTED_MAIN_SHA"]
          requested_digest = os.environ["REQUESTED_DIGEST"]
          confirmation = os.environ["CONFIRMATION"]

          if not sha40.fullmatch(expected_main):
              raise SystemExit("expected_main_sha must be exact lowercase 40-hex")
          if expected_main != os.environ["GITHUB_SHA"]:
              raise SystemExit("ledger initialization only accepts exact current main")
          if not sha256.fullmatch(requested_digest):
              raise SystemExit("release_digest must be an exact sha256 digest")
          if confirmation != f"INITIALIZE:{requested_digest}":
              raise SystemExit("confirmation must be exactly INITIALIZE:<release_digest>")

          profile = load_channel_profile(Path(os.environ["PROFILE_PATH"]))
          if profile.project_key != "milovi-cake" or profile.channel_username.casefold() != "@milovicake":
              raise SystemExit("selected profile is not Milovi Cake")
          if profile.provider_writes_authorized is not False:
              raise SystemExit("ledger bootstrap requires Telegram provider writes to remain disabled")
          if profile.daily_verified_limit != 2 or profile.state_branch != os.environ["STATE_BRANCH"]:
              raise SystemExit("Milovi profile state/policy drifted from reviewed bootstrap contract")

          binding = load_target_binding(Path(os.environ["BINDING_PATH"]), profile)
          if (
              binding.chat_id != -1002215328390
              or binding.bot_id != 8716602202
              or binding.bot_username.casefold() != "preaching_mp3_bot"
              or binding.can_post_messages is not True
              or binding.provider_write_performed is not False
          ):
              raise SystemExit("Milovi target binding differs from reviewed exact target")

          expected = load_release(Path(os.environ["EXPECTED_CANDIDATE_PATH"]))
          authorized = load_release(Path(os.environ["AUTHORIZED_RELEASE_PATH"]))
          if authorized.digest != requested_digest:
              raise SystemExit("requested release digest differs from reviewed authorized release")
          if not authorized.release_authorized:
              raise SystemExit("Milovi release is not authorized")
          if not authorized.reviewed_candidate_sha256 or not authorized.reviewed_by or authorized.reviewed_at is None:
              raise SystemExit("authorized Milovi release lacks exact human review metadata")
          if (
              authorized.release_id != expected.release_id
              or authorized.project_key != expected.project_key
              or authorized.channel_username.casefold() != expected.channel_username.casefold()
              or authorized.profile_sha256 != expected.profile_sha256
              or authorized.timezone != expected.timezone
              or authorized.daily_verified_limit != expected.daily_verified_limit
              or authorized.items != expected.items
          ):
              raise SystemExit("authorized Milovi release payload or schedule drifted from current main")
          if (
              authorized.target_binding_sha256 != binding.digest
              or authorized.chat_id != binding.chat_id
              or authorized.bot_id != binding.bot_id
              or (authorized.bot_username or "").casefold() != binding.bot_username.casefold()
          ):
              raise SystemExit("authorized Milovi release differs from exact target binding")
          if len(authorized.items) != 10:
              raise SystemExit("authorized Milovi bootstrap release must contain exactly ten items")
          print(
              f"release={authorized.release_id} digest={authorized.digest} "
              f"reviewed_by={authorized.reviewed_by} provider_access_performed=false"
          )

      - name: Require exact current-main Milovi bootstrap quality
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow milovi-telegram-bootstrap-quality.yml \
            --sha "$GITHUB_SHA"

      - name: Create isolated state branch from exact current main if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["STATE_BRANCH"]
          current_main = os.environ["GITHUB_SHA"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "video-channel-manager-milovi-ledger-init/1",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          ref_url = f"https://api.github.com/repos/{repo}/git/ref/heads/{branch}"
          request = urllib.request.Request(ref_url, headers=headers)
          created = False
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  existing = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              body = json.dumps({"ref": f"refs/heads/{branch}", "sha": current_main}).encode("utf-8")
              create = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/refs",
                  data=body,
                  headers={**headers, "Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(create, timeout=30) as response:
                  existing = json.load(response)
              created = True
          object_sha = str((existing.get("object") or {}).get("sha") or "")
          if len(object_sha) != 40:
              raise SystemExit("state branch response lacks exact commit SHA")
          Path("/tmp/milovi-state-branch.json").write_text(
              json.dumps(
                  {
                      "state_branch": branch,
                      "created": created,
                      "branch_sha": object_sha,
                      "creation_base_sha": current_main if created else None,
                      "provider_access_performed": False,
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          print(Path("/tmp/milovi-state-branch.json").read_text(encoding="utf-8"), end="")

      - name: Check out isolated Milovi state branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state/milovi-cake-telegram
          path: .state/milovi-cake
          fetch-depth: 0
          persist-credentials: true

      - name: Initialize exact ledger once and persist only state
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$LEDGER_PATH" ]]; then
            python -m video_channel_manager.telegram_multichannel_cli validate-ledger \
              --release "$AUTHORIZED_RELEASE_PATH" \
              --ledger "$LEDGER_PATH"
            echo "Matching Milovi ledger already exists; refusing to overwrite it."
            exit 0
          fi

          mkdir -p "$(dirname "$LEDGER_PATH")"
          python -m video_channel_manager.telegram_multichannel_cli initialize-ledger \
            --release "$AUTHORIZED_RELEASE_PATH" \
            --output "$LEDGER_PATH" \
            --confirm "INITIALIZE:$REQUESTED_DIGEST"

          git -C "$STATE_DIR" config user.name "milovi-telegram-publisher[bot]"
          git -C "$STATE_DIR" config user.email "milovi-telegram-publisher@users.noreply.github.com"
          git -C "$STATE_DIR" add -- "$LEDGER_RELATIVE_PATH"
          staged="$(git -C "$STATE_DIR" diff --cached --name-only)"
          [[ "$staged" == "$LEDGER_RELATIVE_PATH" ]] || {
            echo "ledger initialization staged unexpected state paths: $staged" >&2
            exit 3
          }

          python -m video_channel_manager.telegram_multichannel_cli validate-ledger \
            --release "$AUTHORIZED_RELEASE_PATH" \
            --ledger "$LEDGER_PATH"

          git -C "$STATE_DIR" commit -m "Initialize Milovi Cake publication ledger [skip ci]"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || {
            echo "remote Milovi state branch does not contain exact ledger commit" >&2
            exit 3
          }
