name: Wave 5 apply adversarial hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/wave-5-operator-layer
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git show ceb97f4a4290942cd886ae1e60eb8b70ab4172d5:.github/wave5-adversarial.patch.gz.b64 \
            | base64 --decode \
            | gzip -d > /tmp/wave5-adversarial.patch
          git apply --check /tmp/wave5-adversarial.patch
          git apply /tmp/wave5-adversarial.patch
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          pester_path = Path("tests/powershell/VideoManager.Operator.Tests.ps1")
          pester = pester_path.read_text(encoding="utf-8")
          old = '} | Should -Throw "*snapshot*cannot be blank*"'
          new = '} | Should -Throw "*source snapshot confirmation must be a non-empty string*"'
          if pester.count(old) != 1:
              raise SystemExit("Expected one blank-snapshot assertion target")
          pester_path.write_text(pester.replace(old, new), encoding="utf-8", newline="\n")

          registry_path = Path("scripts/operator/powershell-wrappers.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          for entry in registry["test_files"]:
              path = Path(entry["path"])
              text = path.read_text(encoding="utf-8-sig").replace("\r\n", "\n").replace("\r", "\n")
              entry["sha256"] = hashlib.sha256(text.encode("utf-8")).hexdigest()
          registry_path.write_text(
              json.dumps(registry, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          python -m pip install -e ".[dev]"
          ruff format tests/test_powershell_operator_inventory.py
          ruff check tests/test_powershell_operator_inventory.py
          pytest -q tests/test_powershell_operator_inventory.py
      - name: Install Pester 5.7.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
      - name: Run hardened operator tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $Result = Invoke-Pester -Path tests/powershell -PassThru -Output Detailed
          if ($Result.FailedCount -gt 0) { exit 1 }
      - name: Commit hardened contract
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/wave5-adversarial.patch.gz.b64 .github/workflows/wave5-source-export.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wave 5: harden operator request and artifact contracts"
          git push origin HEAD:agent/wave-5-operator-layer
