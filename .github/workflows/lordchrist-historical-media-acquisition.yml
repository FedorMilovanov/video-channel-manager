name: LordChrist historical media acquisition

on:
  pull_request:
    paths:
      - ".github/workflows/lordchrist-historical-media-acquisition.yml"
      - "content/telegram/lordchrist/historical-editorial/v1/v3/media-acquisition-manifest-*.json"
      - "src/video_channel_manager/telegram_historical_media.py"
      - "tests/test_telegram_historical_media.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lordchrist-historical-media-acquisition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      MANIFEST_PATH: content/telegram/lordchrist/historical-editorial/v1/v3/media-acquisition-manifest-2026-09-09.json
      OUTPUT_DIR: .runtime/lordchrist-historical-media-acquisition
    steps:
      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install provider-free acquisition runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Run acquisition regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_telegram_historical_media.py -q

      - name: Acquire exact archive bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_DIR"
          python -m video_channel_manager.telegram_historical_media \
            "$MANIFEST_PATH" \
            --repo-root . \
            --output-dir "$OUTPUT_DIR" > /tmp/historical-media-acquisition.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path(os.environ["MANIFEST_PATH"])
          output_dir = Path(os.environ["OUTPUT_DIR"])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          receipt = json.loads((output_dir / "acquisition-receipt.json").read_text(encoding="utf-8"))
          if receipt.get("status") != "PASS":
              raise SystemExit("historical media acquisition did not pass")
          if receipt.get("provider_writes_authorized") is not False:
              raise SystemExit("historical media acquisition unexpectedly authorized provider writes")
          if receipt.get("live_eligible") is not False:
              raise SystemExit("historical media acquisition unexpectedly became live-eligible")
          if receipt.get("provider_write_performed") is not False:
              raise SystemExit("historical media acquisition unexpectedly claimed a provider write")
          expected_count = len(manifest.get("assets") or [])
          if expected_count <= 0:
              raise SystemExit("historical media manifest has no acquisition assets")
          if receipt.get("asset_count") != expected_count:
              raise SystemExit(
                  f"historical media receipt count differs from exact manifest: "
                  f"{receipt.get('asset_count')} != {expected_count}"
              )
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
          PY

      - name: Upload immutable acquisition candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lordchrist-historical-media-${{ github.event.pull_request.head.sha || github.sha }}
          path: .runtime/lordchrist-historical-media-acquisition/
          if-no-files-found: error
          retention-days: 7
