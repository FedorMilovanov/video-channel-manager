name: Bootstrap unified editorial patch

on:
  push:
    branches:
      - agent/unified-editorial-pipeline
    paths:
      - .github/workflows/bootstrap-editorial-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/unified-editorial-pipeline
          fetch-depth: 0

      - name: Apply verified patch archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/editorial-patch.b64.* | base64 --decode > /tmp/editorial-patch.tar.gz
          echo "69235c08cf078b30653275f35f6aacf0f3454e816423a48bdabed9e0ce2710b1  /tmp/editorial-patch.tar.gz" | sha256sum --check -
          tar -xzf /tmp/editorial-patch.tar.gz -C .
          rm -f .github/editorial-patch.b64.*
          rm -f .github/workflows/bootstrap-editorial-patch.yml
          python -m compileall -q src tests

      - name: Commit applied patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add unified editorial content pipeline"
          git push origin HEAD:agent/unified-editorial-pipeline
