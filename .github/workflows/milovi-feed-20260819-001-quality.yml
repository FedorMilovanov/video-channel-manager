name: Milovi feed 20260819-001 quality

on:
  pull_request:
    paths:
      - "content/telegram/milovi-cake/**"
      - ".github/workflows/milovi-feed-20260819-001-*.yml"
      - "tests/test_milovi_feed_20260819_001.py"
  push:
    branches: [main]
    paths:
      - "content/telegram/milovi-cake/**"
      - ".github/workflows/milovi-feed-20260819-001-*.yml"
      - "tests/test_milovi_feed_20260819_001.py"

permissions:
  contents: read

jobs:
  exact-candidate-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate exact provider-inert release contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("content/telegram/milovi-cake")
          candidate = json.loads((root / "next-publication-candidate-2026-08-19.json").read_text(encoding="utf-8"))
          release = json.loads((root / "releases/milovi-feed-20260819-001-review.json").read_text(encoding="utf-8"))
          state = json.loads((root / "releases/milovi-feed-20260819-001-state-contract.json").read_text(encoding="utf-8"))

          pid = "milovi-feed-20260819-001"
          assert candidate["publication_id"] == release["publication_id"] == state["publication_id"] == pid
          for obj in (candidate, release, state):
              assert obj["execution_authorized"] is False
              assert obj["provider_mutation_allowed"] is False
          assert release["release_authorized"] is False
          assert release["execution_contract"]["max_provider_attempts"] == 1
          assert release["execution_contract"]["blind_mutation_retries"] == 0
          assert release["execution_contract"]["publish_exactly_one_item"] is True
          assert release["execution_contract"]["second_item_allowed"] is False
          assert release["execution_contract"]["fresh_exact_human_execution_authorization_required"] is True
          assert release["execution_contract"]["automation_is_execution_authority"] is False
          assert state["initial_state"]["intent_id"] is None
          assert state["initial_state"]["provider_effect"] == "impossible"
          assert state["initial_state"]["provider_attempt_count"] == 0
          assert state["preparation_rules"]["write_state_branch_during_provider_inert_preparation"] is False
          assert state["execution_transition_rules"]["max_provider_attempts"] == 1
          assert state["execution_transition_rules"]["blind_mutation_retries"] == 0
          assert state["execution_transition_rules"]["second_publication_forbidden"] is True
          assert candidate["scheduled_at"] == "2026-08-19T10:30:00+03:00"
          assert candidate["timezone"] == "Europe/Moscow"
          print("exact Milovi one-item quality contract: OK")
          PY
