name: Wave 5 retire legacy wrappers

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/wave-5-operator-layer
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Insert fail-closed retired-wrapper guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          registry_path = root / 'scripts/operator/powershell-wrappers.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          marker = '# VCM-WAVE5-RETIRED-GUARD'
          block = (
              '\n'
              '# VCM-WAVE5-RETIRED-GUARD\n'
              '$VcmOperatorModule = Join-Path $PSScriptRoot "operator\\VideoManager.Operator.psm1"\n'
              'Import-Module -Name $VcmOperatorModule -Force -ErrorAction Stop\n'
              'Stop-VcmRetiredWrapper -WrapperPath $PSCommandPath -RepositoryRoot (Split-Path -Parent $PSScriptRoot)\n'
          )

          registered = set()
          for entry in registry['wrappers']:
              relative = str(entry['path']).replace('\\', '/')
              registered.add(relative)
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f'Registered wrapper is missing: {relative}')
              text = path.read_text(encoding='utf-8-sig')
              if entry['status'] == 'retired':
                  if marker not in text:
                      anchors = (
                          '$PSNativeCommandUseErrorActionPreference = $false',
                          '$ErrorActionPreference = "Stop"',
                      )
                      anchor = next((value for value in anchors if value in text), None)
                      if anchor is None:
                          raise SystemExit(f'Cannot find a safe guard anchor in {relative}')
                      if text.count(anchor) != 1:
                          raise SystemExit(f'Guard anchor is not unique in {relative}: {anchor}')
                      text = text.replace(anchor, anchor + block, 1)
                      path.write_text(text, encoding='utf-8', newline='\n')
                  guard_index = text.index(marker)
                  risky = [
                      text.find(value)
                      for value in (
                          'apply_vk_editorial_cleanup_plan.py',
                          'run_vk_p1_final_megawave_resume.py',
                          'recover_youtube_comment_wave.py',
                          'schedule_lord_god_article_wave_v3.py',
                          'schedule_lord_god_wall_tail_current.py',
                          'vk_shorts_reset_current.py',
                          'run_vk_wall_wave.py',
                          '--execute',
                      )
                      if text.find(value) >= 0
                  ]
                  if risky and guard_index >= min(risky):
                      raise SystemExit(f'Retired guard is too late in {relative}')
              entry['sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()

          discovered = {
              path.relative_to(root).as_posix()
              for path in (root / 'scripts').rglob('*.ps1')
          }
          if discovered != registered:
              raise SystemExit(
                  'PowerShell registry mismatch. Missing: '
                  f'{sorted(discovered - registered)}; stale: {sorted(registered - discovered)}'
              )
          registry_path.write_text(
              json.dumps(registry, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          python -m pip install -e ".[dev]"
          pytest -q tests/test_powershell_operator_inventory.py
          rm -f .github/wave5-retire-trigger .github/workflows/wave5-retire-wrappers.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wave 5: retire legacy provider-write PowerShell wrappers"
          git push origin HEAD:agent/wave-5-operator-layer
