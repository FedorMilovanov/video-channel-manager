name: Milovi queue wiring one-shot

on:
  push:
    branches:
      - agent/milovi-wire-first-screen-queue
    paths:
      - .github/workflows/milovi-wire-first-screen-queue-once.yml

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/milovi-wire-first-screen-queue
          fetch-depth: 0
      - name: Replace only the reviewed rollout source path
        shell: python
        run: |
          from pathlib import Path

          old = "content/telegram/milovi-cake/bootstrap-rollout-candidate-2026-08.json"
          new = "content/telegram/milovi-cake/queues/bootstrap-first-screen-queue-2026-08.json"
          files = [
              Path(".github/workflows/milovi-telegram-bootstrap-publisher.yml"),
              Path(".github/workflows/milovi-telegram-bootstrap-quality.yml"),
          ]
          for path in files:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one old rollout path, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          publisher = files[0].read_text(encoding="utf-8")
          quality = files[1].read_text(encoding="utf-8")
          if old in publisher or old in quality:
              raise SystemExit("historical rollout path survived reviewed wiring replacement")
          if publisher.count(new) != 1 or quality.count(new) != 1:
              raise SystemExit("operational queue path is not bound exactly once in publisher and quality")
      - name: Commit exact wiring and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/milovi-wire-first-screen-queue-once.yml
          git config user.name "milovi-queue-wiring[bot]"
          git config user.email "milovi-queue-wiring@users.noreply.github.com"
          git add -- \
            .github/workflows/milovi-telegram-bootstrap-publisher.yml \
            .github/workflows/milovi-telegram-bootstrap-quality.yml \
            .github/workflows/milovi-wire-first-screen-queue-once.yml
          git diff --cached --check
          git commit -m "Wire Milovi publisher to operational first-screen queue [skip ci]"
          git push origin HEAD:agent/milovi-wire-first-screen-queue
