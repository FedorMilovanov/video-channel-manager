name: Bootstrap clean Lordchrist Telegram publisher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: bootstrap-lordchrist-clean
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.head_ref == 'agent/lordchrist-telegram-publisher-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/lordchrist-telegram-publisher-clean
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Verify and materialize reviewed package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import base64
          import bz2
          import hashlib
          import json
          from pathlib import Path

          expected_digest = '047cb8482912e00185cf4b619f4cdd80750e4cb78eef8b8e52cdd7f817a160d2'
          parts = sorted(Path('.bootstrap-final').glob('payload.*'))
          expected_parts = [f'payload.{index:03d}' for index in range(1, 7)]
          if [path.name for path in parts] != expected_parts:
              raise SystemExit(f'Unexpected bootstrap part set: {[path.name for path in parts]}')
          encoded = ''.join(path.read_text(encoding='ascii') for path in parts)
          actual_digest = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if actual_digest != expected_digest:
              raise SystemExit(f'Bootstrap digest mismatch: {actual_digest}')
          data = json.loads(bz2.decompress(base64.b64decode(encoded)).decode('utf-8'))
          required = {
              '.github/workflows/lordchrist-telegram-poster.yml',
              'content/telegram/lordchrist/quote-library-107.md',
              'content/telegram/lordchrist/verified-30-posts.json',
              'content/telegram/lordchrist/verified-30-posts.md',
              'docs/operations/lordchrist-telegram-publisher.md',
              'scripts/telegram/post_next.py',
              'src/video_channel_manager/telegram_publisher.py',
              'tests/test_telegram_publisher.py',
          }
          files = data.get('files', {})
          if set(files) != required:
              raise SystemExit(f'Unexpected payload file set: {sorted(files)}')
          for relative, file_content in files.items():
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(file_content, encoding='utf-8', newline='\n')
          Path('/tmp/lordchrist-ledger.json').write_text(data['state_content'], encoding='utf-8', newline='\n')
          Path('/tmp/lordchrist-state-path.txt').write_text(data['state_path'], encoding='utf-8')
          PYCODE

      - name: Overlay verified type-corrected publisher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import base64
          import bz2
          import hashlib
          from pathlib import Path

          source = Path('.bootstrap-fix/telegram_publisher.py.bz2.b64').read_text(encoding='ascii')
          expected = '41a0b9add6dd7bee737d30427654476a54aca9bbe67ed37970c1a5899501d5e2'
          if hashlib.sha256(source.encode('ascii')).hexdigest() != expected:
              raise SystemExit('Type-corrected publisher overlay digest mismatch')
          target = Path('src/video_channel_manager/telegram_publisher.py')
          target.write_bytes(bz2.decompress(base64.b64decode(source)))
          PYCODE

      - name: Format and validate focused implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m ruff format src/video_channel_manager/telegram_publisher.py scripts/telegram/post_next.py tests/test_telegram_publisher.py
          python -m compileall -q src/video_channel_manager/telegram_publisher.py scripts/telegram/post_next.py
          python -m pytest -q tests/test_telegram_publisher.py
          python -m ruff check src/video_channel_manager/telegram_publisher.py scripts/telegram/post_next.py tests/test_telegram_publisher.py
          python -m ruff format --check src/video_channel_manager/telegram_publisher.py scripts/telegram/post_next.py tests/test_telegram_publisher.py
          python -m mypy src/video_channel_manager/telegram_publisher.py

      - name: Commit only final implementation files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap-clean .bootstrap-final .bootstrap-fix .github/workflows/bootstrap-lordchrist-clean.yml
          git config user.name 'lordchrist-bootstrap[bot]'
          git config user.email 'lordchrist-bootstrap@users.noreply.github.com'
          git add -A
          git commit -m 'Add guarded Lordchrist Telegram quote publisher'
          git push origin HEAD:agent/lordchrist-telegram-publisher-clean

      - name: Initialize isolated publication ledger
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin state/lordchrist-telegram
          git worktree add /tmp/lordchrist-state origin/state/lordchrist-telegram
          state_path="$(cat /tmp/lordchrist-state-path.txt)"
          mkdir -p "/tmp/lordchrist-state/$(dirname "$state_path")"
          cp /tmp/lordchrist-ledger.json "/tmp/lordchrist-state/$state_path"
          git -C /tmp/lordchrist-state config user.name 'lordchrist-bootstrap[bot]'
          git -C /tmp/lordchrist-state config user.email 'lordchrist-bootstrap@users.noreply.github.com'
          git -C /tmp/lordchrist-state add -- "$state_path"
          if ! git -C /tmp/lordchrist-state diff --cached --quiet; then
            git -C /tmp/lordchrist-state commit -m 'Initialize Lordchrist publication ledger [skip ci]'
            git -C /tmp/lordchrist-state push origin HEAD:state/lordchrist-telegram
          fi
