name: Bootstrap clean Lordchrist publisher

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: bootstrap-lordchrist-clean
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.head_ref == 'agent/lordchrist-telegram-publisher-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out clean implementation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/lordchrist-telegram-publisher-clean
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Verify and materialize reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import base64
          import hashlib
          import json
          import zlib
          from pathlib import Path

          expected_sha256 = '2870de7c8ca96cc56ae4cfef7ade2fa212430bb776335a069f925ac1e60d87ed'
          expected_files = {
              '.github/workflows/lordchrist-telegram-poster.yml',
              'content/telegram/lordchrist/quote-library-107.md',
              'content/telegram/lordchrist/verified-30-posts.json',
              'content/telegram/lordchrist/verified-30-posts.md',
              'docs/operations/lordchrist-telegram-publisher.md',
              'scripts/telegram/post_next.py',
              'src/video_channel_manager/telegram_publisher.py',
              'tests/test_telegram_publisher.py',
          }

          parts = sorted(Path('.bootstrap-clean').glob('payload.*'))
          expected_parts = [f'payload.{index:03d}' for index in range(1, 16)]
          if [path.name for path in parts] != expected_parts:
              raise SystemExit(f'Unexpected payload sequence: {[path.name for path in parts]}')

          encoded = ''.join(''.join(path.read_text(encoding='ascii').split()) for path in parts)
          compressed = base64.b64decode(encoded, validate=True)
          actual_sha256 = hashlib.sha256(compressed).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(
                  f'Payload SHA-256 mismatch: expected {expected_sha256}, got {actual_sha256}'
              )

          data = json.loads(zlib.decompress(compressed).decode('utf-8'))
          if set(data) != {'files'}:
              raise SystemExit(f'Unexpected payload keys: {sorted(data)}')
          files = data['files']
          if set(files) != expected_files:
              missing = sorted(expected_files.difference(files))
              extra = sorted(set(files).difference(expected_files))
              raise SystemExit(f'Unexpected file set; missing={missing}, extra={extra}')

          for relative_path in sorted(files):
              path = Path(relative_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(files[relative_path], encoding='utf-8', newline='\n')

          print(
              f'Materialized {len(files)} reviewed files from {len(parts)} parts; '
              f'compressed_sha256={actual_sha256}'
          )
          PYCODE

      - name: Install project development dependencies
        run: |
          python -m pip install --upgrade 'pip>=25' 'setuptools>=83,<84' wheel
          python -m pip install -e '.[dev]'

      - name: Run focused offline verification
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/video_channel_manager/telegram_publisher.py \
            scripts/telegram/post_next.py
          PYTHONPATH=src python -m pytest -q tests/test_telegram_publisher.py

      - name: Commit final implementation and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap-clean .github/workflows/bootstrap-lordchrist-clean.yml
          git config user.name 'lordchrist-bootstrap[bot]'
          git config user.email 'lordchrist-bootstrap@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add Lordchrist Telegram publisher and quote library'
          git push origin HEAD:agent/lordchrist-telegram-publisher-clean
