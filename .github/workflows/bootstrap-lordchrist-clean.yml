name: Bootstrap clean Lordchrist publisher

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: bootstrap-lordchrist-clean
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.head_ref == 'agent/lordchrist-telegram-publisher-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out clean implementation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/lordchrist-telegram-publisher-clean
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Verify and materialize reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import base64
          import hashlib
          import json
          import zlib
          from pathlib import Path

          expected_sha256 = '2870de7c8ca96cc56ae4cfef7ade2fa212430bb776335a069f925ac1e60d87ed'
          expected_part_sha256 = {
              'payload.001': '4932d7c2e20692a92d26e8fc66c6a6df58b8c2a3e6cc4cbe35cf514721c013ce',
              'payload.002': '23b351277d82ba8ec3e23b742a1e6b2494c85c96a95ee50bfb7ffe7208a3b4d5',
              'payload.003': '7fa33a6f7b3e21afa020fea9535422fa563d60190f40862acc603b49fd4e16ac',
              'payload.004': '07c57bba34dffb9a5ec86ab0edd4f282b3c12f9a6cac80600f47e856a20c0968',
              'payload.005': '13de784c7559f36b2a57f55ee6b46a5567dda987cdca711df11a8dd6f1d4dba3',
              'payload.006': '6fcea0a1e039d75798fc9079f344c860fa3225f6d8bdf093095c6a86e919c603',
              'payload.007': '1832adff16a6751ee890ecd42dd29ee4263a12eeaadf8844f8322a023a0d2492',
              'payload.008': '439fa29f596917e07f381d9e2dfda262fe07c0d0a0e75afb5f4c950558012af2',
              'payload.009': '4308626f9218a3c2b3cba0bd03d9523e9e8ac3d38e4a7d5c15daf63079308ae1',
              'payload.010': '7b74c741d7604a1386c9f9fef905935eba82d1ecd50e9e32556e52338993ca93',
              'payload.011': '1d10fe1cc2f65fb4e133e60595d6acd7731d01fe0029aa3e801ad265bd3029ca',
              'payload.012': 'ce6ae6761b4a94690dd6cfea440ee8e64b0813e957a49965b8e27399037f6761',
              'payload.013': '51e2809e3e7caf8aaf2168e844d97fd25b83d2e27971e74b6ce5cb73faef833f',
              'payload.014': '0929b8f8340b97dd99ece7b698de03fd936abbd69527e4505a40890016ad1ed6',
              'payload.015': '036174ea41cd07c7f6939b2042c364a368f20500edb75af044553a19ad9155e2',
          }
          expected_files = {
              '.github/workflows/lordchrist-telegram-poster.yml',
              'content/telegram/lordchrist/quote-library-107.md',
              'content/telegram/lordchrist/verified-30-posts.json',
              'content/telegram/lordchrist/verified-30-posts.md',
              'docs/operations/lordchrist-telegram-publisher.md',
              'scripts/telegram/post_next.py',
              'src/video_channel_manager/telegram_publisher.py',
              'tests/test_telegram_publisher.py',
          }

          parts = sorted(Path('.bootstrap-clean').glob('payload.*'))
          expected_parts = list(expected_part_sha256)
          actual_parts = [path.name for path in parts]
          if actual_parts != expected_parts:
              raise SystemExit(f'Unexpected payload sequence: {actual_parts}')

          mismatches = []
          for path in parts:
              raw = path.read_bytes()
              actual = hashlib.sha256(raw).hexdigest()
              expected = expected_part_sha256[path.name]
              print(f'{path.name}: bytes={len(raw)} sha256={actual}')
              if actual != expected:
                  mismatches.append((path.name, expected, actual, len(raw)))
          if mismatches:
              raise SystemExit(f'Payload part mismatch: {mismatches}')

          encoded = ''.join(''.join(path.read_text(encoding='ascii').split()) for path in parts)
          compressed = base64.b64decode(encoded, validate=True)
          actual_sha256 = hashlib.sha256(compressed).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(
                  f'Payload SHA-256 mismatch: expected {expected_sha256}, got {actual_sha256}'
              )

          data = json.loads(zlib.decompress(compressed).decode('utf-8'))
          if set(data) != {'files'}:
              raise SystemExit(f'Unexpected payload keys: {sorted(data)}')
          files = data['files']
          if set(files) != expected_files:
              missing = sorted(expected_files.difference(files))
              extra = sorted(set(files).difference(expected_files))
              raise SystemExit(f'Unexpected file set; missing={missing}, extra={extra}')

          for relative_path in sorted(files):
              path = Path(relative_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(files[relative_path], encoding='utf-8', newline='\n')

          print(
              f'Materialized {len(files)} reviewed files from {len(parts)} parts; '
              f'compressed_sha256={actual_sha256}'
          )
          PYCODE

      - name: Install project development dependencies
        run: |
          python -m pip install --upgrade 'pip>=25' 'setuptools>=83,<84' wheel
          python -m pip install -e '.[dev]'

      - name: Run focused offline verification
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/video_channel_manager/telegram_publisher.py \
            scripts/telegram/post_next.py
          PYTHONPATH=src python -m pytest -q tests/test_telegram_publisher.py

      - name: Commit final implementation and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap-clean .github/workflows/bootstrap-lordchrist-clean.yml
          git config user.name 'lordchrist-bootstrap[bot]'
          git config user.email 'lordchrist-bootstrap@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add Lordchrist Telegram publisher and quote library'
          git push origin HEAD:agent/lordchrist-telegram-publisher-clean
