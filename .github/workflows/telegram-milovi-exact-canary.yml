name: Milovi Telegram exact photo canary

on:
  push:
    branches:
      - main
    paths:
      - content/telegram/milovi-cake/live/canary-authorization.json

permissions:
  contents: write

concurrency:
  group: milovi-telegram-exact-photo-canary
  cancel-in-progress: false

jobs:
  send-exact-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Reject GitHub reruns before provider access
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"

      - name: Check out exact authorization commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install exact canary dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            httpx==0.28.1 Pillow==11.3.0
          python -m pip check

      - name: Prepare exact payload and dispatch-started barrier
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/milovi_telegram_canary_prepare.py

      - name: Persist dispatch-started barrier before sendPhoto
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/telegram/milovi-cake/live/canary-dispatch-state.json
          git commit -m 'Milovi Telegram: persist canary dispatch-started barrier'
          git push origin HEAD:main

      - name: Dispatch one exact sendPhoto with zero mutation retry
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/milovi_telegram_canary_send.py

      - name: Persist verified Telegram receipt
        shell: bash
        run: |
          set -euo pipefail
          git add content/telegram/milovi-cake/live/canary-dispatch-state.json
          git commit -m 'Milovi Telegram: record verified canary receipt'
          git push origin HEAD:main
