name: Svodka native rich message canary
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RICH-CANARY:@deep_info_life:ONE-ARTICLE
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: svodka-telegram-publisher
  cancel-in-progress: false
  queue: max
jobs:
  canary:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PROFILE_PATH: content/telegram/channels/svodka.json
      BINDING_PATH: content/telegram/channels/svodka-target-binding.json
      SPEC_PATH: content/telegram/svodka/native-rich-canary/canary-spec.json
      TARGET_PROOF_PATH: .runtime/svodka-native-rich-target-proof.json
      MEDIA_PROOF_PATH: .runtime/svodka-native-rich-media-proof.json
      MEDIA_RECHECK_PATH: .runtime/svodka-native-rich-media-recheck.json
      DOCUMENT_PATH: .runtime/svodka-native-rich-document.json
      FUTURE_EDIT_TEST_PATH: .runtime/svodka-native-rich-future-edit-test.json
      INTENT_PATH: .runtime/svodka-native-rich-intent.json
      PROVIDER_OUTCOME_PATH: .runtime/svodka-native-rich-provider-outcome.json
      TERMINAL_STATE_PATH: .runtime/svodka-native-rich-terminal-state.json
      OUTCOME_ARTIFACT_NAME: svodka-native-rich-canary-outcome-${{ github.run_id }}-${{ github.run_attempt }}
      STATE_BRANCH: state/svodka-telegram
      STATE_DIR: .state/svodka
      STATE_RELATIVE_PATH: content/telegram/svodka/native-rich-message-canary.json
      STATE_PATH: .state/svodka/content/telegram/svodka/native-rich-message-canary.json
      EXPECTED_CHAT_ID: -1003527567039
      EXPECTED_BOT_ID: 8716602202
      EXPECTED_BOT_USERNAME: preaching_mp3_bot
    steps:
      - name: Check out exact current main runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install minimal Telegram runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt
      - name: Require exact one-article confirmation and preview reviewed document
        env:
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == 'RICH-CANARY:@deep_info_life:ONE-ARTICLE' ]] || {
            echo 'confirmation must exactly authorize one native Rich Message article' >&2
            exit 2
          }
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'native Rich Message canary is main-only' >&2
            exit 2
          }
          mkdir -p .runtime
          python -m video_channel_manager.svodka_native_rich_canary preview \
            --profile "$PROFILE_PATH" \
            --binding "$BINDING_PATH" \
            --spec "$SPEC_PATH" \
            --repository-root . \
            --github-repository "$GITHUB_REPOSITORY" \
            --github-sha "$GITHUB_SHA" \
            --document-output "$DOCUMENT_PATH" \
            --future-edit-output "$FUTURE_EDIT_TEST_PATH"
      - name: Require exact current-main Svodka quality proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow svodka-quality.yml \
            --sha "$GITHUB_SHA"
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow svodka-approved-release-quality.yml \
            --sha "$GITHUB_SHA"
      - name: Fetch and hash both reviewed remote media assets read-only
        run: |
          set -euo pipefail
          python -m video_channel_manager.svodka_native_rich_canary media-proof \
            --spec "$SPEC_PATH" \
            --repository-root . \
            --output "$MEDIA_PROOF_PATH"
      - name: Fresh read-only exact target preflight
        env:
          SVODKA_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_channel_cli preflight \
            --profile "$PROFILE_PATH" \
            --expected-chat-id "$EXPECTED_CHAT_ID" \
            --expected-bot-id "$EXPECTED_BOT_ID" \
            --expected-bot-username "$EXPECTED_BOT_USERNAME" \
            --output "$TARGET_PROOF_PATH"
      - name: Check out isolated durable Svodka state branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state/svodka-telegram
          path: .state/svodka
          fetch-depth: 0
          persist-credentials: true
      - name: Refuse every second native Rich Message canary run
        run: |
          set -euo pipefail
          if [[ -e "$STATE_PATH" ]]; then
            echo 'Durable native Rich Message canary state already exists. STOP: blind retry is forbidden.' >&2
            cat "$STATE_PATH"
            exit 3
          fi
      - name: Prepare exact native Rich Message intent
        env:
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          python -m video_channel_manager.svodka_native_rich_canary prepare \
            --profile "$PROFILE_PATH" \
            --binding "$BINDING_PATH" \
            --spec "$SPEC_PATH" \
            --target-proof "$TARGET_PROOF_PATH" \
            --media-proof "$MEDIA_PROOF_PATH" \
            --state "$STATE_PATH" \
            --repository-root . \
            --confirmation "$CONFIRMATION" \
            --github-repository "$GITHUB_REPOSITORY" \
            --github-ref "$GITHUB_REF" \
            --github-sha "$GITHUB_SHA" \
            --github-workflow-sha "${{ github.workflow_sha }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --intent-output "$INTENT_PATH"
      - name: Persist durable intent before any Telegram mutation
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$STATE_PATH")"
          cp -- "$INTENT_PATH" "$STATE_PATH"
          git -C "$STATE_DIR" config user.name 'svodka-publisher[bot]'
          git -C "$STATE_DIR" config user.email 'svodka-publisher@users.noreply.github.com'
          git -C "$STATE_DIR" add -- "$STATE_RELATIVE_PATH"
          [[ "$(git -C "$STATE_DIR" diff --cached --name-only)" == "$STATE_RELATIVE_PATH" ]] || {
            echo 'native rich intent attempted to change state outside its isolated canary record' >&2
            exit 3
          }
          git -C "$STATE_DIR" commit -m "Record Svodka native rich canary intent for run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT [skip ci]"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || {
            echo 'remote state branch does not contain the exact native rich intent' >&2
            exit 3
          }
          git -C "$STATE_DIR" fetch --no-tags origin "$STATE_BRANCH"
          git -C "$STATE_DIR" show "origin/$STATE_BRANCH:$STATE_RELATIVE_PATH" > .runtime/remote-native-rich-intent.json
          cmp --silent "$INTENT_PATH" .runtime/remote-native-rich-intent.json || {
            echo 'remote native rich intent bytes differ from the reviewed local intent' >&2
            exit 3
          }
      - name: Re-prove exact current-main quality immediately before mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow svodka-quality.yml \
            --sha "$GITHUB_SHA"
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow svodka-approved-release-quality.yml \
            --sha "$GITHUB_SHA"
      - name: Re-fetch exact media bytes immediately before mutation
        run: |
          set -euo pipefail
          python -m video_channel_manager.svodka_native_rich_canary media-proof \
            --spec "$SPEC_PATH" \
            --repository-root . \
            --expected-proof "$MEDIA_PROOF_PATH" \
            --output "$MEDIA_RECHECK_PATH"
      - name: Dispatch exactly one native sendRichMessage mutation
        id: dispatch
        env:
          SVODKA_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set +e
          python -m video_channel_manager.svodka_native_rich_canary dispatch \
            --profile "$PROFILE_PATH" \
            --binding "$BINDING_PATH" \
            --spec "$SPEC_PATH" \
            --target-proof "$TARGET_PROOF_PATH" \
            --media-proof "$MEDIA_RECHECK_PATH" \
            --durable-state .runtime/remote-native-rich-intent.json \
            --provider-outcome "$PROVIDER_OUTCOME_PATH" \
            --repository-root .
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Archive exact provider outcome before durable outcome
        id: outcome_artifact
        if: ${{ !cancelled() && steps.dispatch.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.OUTCOME_ARTIFACT_NAME }}
          path: .runtime/svodka-native-rich-provider-outcome.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: true
      - name: Materialize exact terminal state from archived provider evidence
        if: ${{ !cancelled() && steps.outcome_artifact.outcome == 'success' }}
        run: |
          set -euo pipefail
          python -m video_channel_manager.svodka_native_rich_canary finalize \
            --durable-intent .runtime/remote-native-rich-intent.json \
            --provider-outcome "$PROVIDER_OUTCOME_PATH" \
            --artifact-name "$OUTCOME_ARTIFACT_NAME" \
            --artifact-id "${{ steps.outcome_artifact.outputs.artifact-id }}" \
            --artifact-url "${{ steps.outcome_artifact.outputs.artifact-url }}" \
            --artifact-digest "${{ steps.outcome_artifact.outputs.artifact-digest }}" \
            --state-output "$TERMINAL_STATE_PATH"
      - name: Persist durable outcome and permanently block blind retry
        if: ${{ !cancelled() && steps.outcome_artifact.outcome == 'success' }}
        run: |
          set -euo pipefail
          cp -- "$TERMINAL_STATE_PATH" "$STATE_PATH"
          git -C "$STATE_DIR" add -- "$STATE_RELATIVE_PATH"
          [[ "$(git -C "$STATE_DIR" diff --cached --name-only)" == "$STATE_RELATIVE_PATH" ]] || {
            echo 'native rich outcome attempted to change state outside its isolated canary record' >&2
            exit 4
          }
          git -C "$STATE_DIR" diff --cached --quiet && {
            echo 'native rich provider outcome produced no durable state delta' >&2
            exit 4
          }
          git -C "$STATE_DIR" commit -m "Record Svodka native rich canary outcome for run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT [skip ci]"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || {
            echo 'remote state branch does not contain the exact native rich outcome' >&2
            exit 4
          }
          git -C "$STATE_DIR" fetch --no-tags origin "$STATE_BRANCH"
          git -C "$STATE_DIR" show "origin/$STATE_BRANCH:$STATE_RELATIVE_PATH" > .runtime/remote-native-rich-outcome.json
          cmp --silent "$TERMINAL_STATE_PATH" .runtime/remote-native-rich-outcome.json || {
            echo 'remote native rich outcome bytes differ from the archived terminal state' >&2
            exit 4
          }
      - name: Require exact verified outcome or stop without retry
        if: ${{ !cancelled() && steps.outcome_artifact.outcome == 'success' }}
        env:
          DISPATCH_EXIT_CODE: ${{ steps.dispatch.outputs.exit_code }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from video_channel_manager.svodka_native_rich_canary import load_canary_state
          state = load_canary_state(Path('.runtime/remote-native-rich-outcome.json'))
          if state.state == 'may_exist':
              raise SystemExit('STOP: sendRichMessage may exist; blind retry, automatic edit, and automatic delete are forbidden')
          if state.state != 'verified':
              raise SystemExit(f'STOP: native Rich Message canary is {state.state}; every second run is forbidden')
          outcome = state.provider_outcome
          assert outcome.expected_chat_id == -1003527567039
          assert outcome.message_id is not None and outcome.message_id > 0
          assert outcome.returned_rich_message is not None
          assert outcome.structure_verification == 'exact'
          assert outcome.media_verification == 'exact'
          PY
          [[ "$DISPATCH_EXIT_CODE" == '0' ]] || {
            echo 'native Rich Message dispatch did not return exact verified success' >&2
            exit 4
          }
