name: Lordchrist depth-v2 rollout patch 678 fix

on:
  push:
    branches:
      - agent/lordchrist-depth-v2-rollout-678

permissions:
  contents: write

concurrency:
  group: lordchrist-depth-rollout-patch-678-fix
  cancel-in-progress: false

jobs:
  recover-patch-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out rollout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/lordchrist-depth-v2-rollout-678
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Recover and apply exact rollout patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import re
          import zlib
          from pathlib import Path

          helper = Path('.github/workflows/lordchrist-depth-rollout-patch-678.yml').read_text(encoding='utf-8')
          match = re.search(r'^\s*PATCH_ZLIB_B64:\s*(\S+)\s*$', helper, flags=re.MULTILINE)
          if match is None:
              raise SystemExit('original rollout helper does not contain PATCH_ZLIB_B64')
          code = zlib.decompress(base64.b64decode(match.group(1))).decode('utf-8')

          old_guard = '    if actual != count:\n'
          special_guard = (
              '    if actual != count and not (\n'
              '        path == "src/video_channel_manager/telegram_quote_runtime.py"\n'
              '        and old == \'    release_id: Literal["lordchrist-successor-quotes-v1-integrity-v2"]\\n\'\n'
              '        and count == 1\n'
              '        and actual == 2\n'
              '    ):\n'
          )
          if code.count(old_guard) != 1:
              raise SystemExit(f'expected one replace_exact guard, found {code.count(old_guard)}')
          code = code.replace(old_guard, special_guard, 1)
          exec(compile(code, '<rollout-patch-recovered>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install development toolchain
        run: |
          python -m pip install --upgrade "pip>=25" "setuptools>=83,<85" wheel
          pip install -e ".[dev]"

      - name: Format and verify rollout scope
        shell: bash
        run: |
          set -euo pipefail
          ruff format \
            src/video_channel_manager/telegram_quote_runtime.py \
            src/video_channel_manager/telegram_quote_depth.py \
            src/video_channel_manager/lordchrist_cross_track_effect_guard.py \
            tests/test_lordchrist_quote_depth_667.py \
            tests/test_lordchrist_quote_handoff_582.py \
            tests/test_lordchrist_autonomous_production.py
          ruff check \
            src/video_channel_manager/telegram_quote_runtime.py \
            src/video_channel_manager/telegram_quote_depth.py \
            src/video_channel_manager/lordchrist_cross_track_effect_guard.py \
            tests/test_lordchrist_quote_depth_667.py \
            tests/test_lordchrist_quote_handoff_582.py \
            tests/test_lordchrist_autonomous_production.py
          mypy src --show-error-codes
          pytest -q \
            tests/test_lordchrist_quote_depth_667.py \
            tests/test_lordchrist_quote_handoff_582.py \
            tests/test_lordchrist_autonomous_production.py \
            tests/test_telegram_presentation.py

      - name: Commit verified rollout patch and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/lordchrist-depth-rollout-patch-678.yml \
            .github/workflows/lordchrist-depth-rollout-patch-678-fix.yml
          git config user.name "FedorMilovanov"
          git config user.email "258225528+FedorMilovanov@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "Recovered rollout patch produced no staged changes." >&2
            exit 2
          }
          git commit -m "feat(lordchrist): stage depth-v2 production cutover"
          git push origin HEAD:agent/lordchrist-depth-v2-rollout-678
