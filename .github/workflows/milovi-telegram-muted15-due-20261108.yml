name: Milovi Telegram exact approved 15-video November schedule

on:
  workflow_run:
    workflows:
      - Milovi Telegram feed quality
    types:
      - completed
    branches:
      - main
  schedule:
    # 16:07 UTC = 19:07 Moscow; exact 2026 Nov 8-22 only in the Python gate.
    - cron: "7 16 8-22 11 *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # Same group as canonical Milovi publisher; state writes never overlap.
  group: milovi-cake-telegram-publisher
  cancel-in-progress: false

jobs:
  exact-owner-video-control:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      STATE_DIR: .state/milovi
      STATE_BRANCH: state/milovi-cake-telegram
    steps:
      - name: Check out exact main and immutable releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install existing minimal Telegram validator requirements
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt

      - name: Fail closed if newer main or missing CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$remote_main" == "$GITHUB_SHA" ]] || exit 3
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow milovi-telegram-feed-quality.yml --sha "$GITHUB_SHA"

      - name: Validate all fifteen exact released videos without provider access
        run: python -m scripts.milovi_muted15_due validate

      - name: Check out shared protected state branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state/milovi-cake-telegram
          path: .state/milovi
          fetch-depth: 0
          persist-credentials: true

      - name: Initialize all fifteen ledgers and channel index as one transaction
        if: github.event_name == 'workflow_run'
        run: python -m scripts.milovi_muted15_due initialize-all --state-checkout "$STATE_DIR"

      - name: Persist provider-inert initialization with one commit
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          git -C "$STATE_DIR" config user.name "milovi-telegram-feed[bot]"
          git -C "$STATE_DIR" config user.email "milovi-telegram-feed@users.noreply.github.com"
          git -C "$STATE_DIR" add -- content/telegram/milovi-cake/feed
          if git -C "$STATE_DIR" diff --cached --quiet; then
            echo "All fifteen protected state entries already initialized."
            exit 0
          fi
          git -C "$STATE_DIR" commit -m "Initialize 15 exact Milovi owner-approved November video ledgers"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || exit 3

      - name: Compute exact scheduled day and state gate without mutation
        if: github.event_name == 'schedule'
        id: due
        run: |
          set -euo pipefail
          python -m scripts.milovi_muted15_due due \
            --state-checkout "$STATE_DIR" --output "$GITHUB_OUTPUT"

      - name: Dispatch only canonical single-writer publisher for due item
        if: github.event_name == 'schedule' && steps.due.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_ID: ${{ steps.due.outputs.publication_id }}
        run: |
          set -euo pipefail
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$remote_main" == "$GITHUB_SHA" ]] || exit 3
          gh workflow run milovi-telegram-feed-publisher.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            -f operation=publish -f publication_id="$PUBLICATION_ID" \
            -f "confirm=PUBLISH:@MiloviCake:$PUBLICATION_ID"
