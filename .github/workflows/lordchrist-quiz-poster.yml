name: Lordchrist quiz publisher

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Provider-free validate, explicit durable state initialization, or one exact quiz publication attempt
        required: true
        default: validate
        type: choice
        options:
          - validate
          - initialize-state
          - publish
      publication_id:
        description: Exact quiz publication_id from content/telegram/lordchrist/quiz
        required: true
        default: lordchrist-quiz-city-of-palms
        type: string
      confirm:
        description: INITIALIZE:@lordchrist:<id> or PUBLISH:@lordchrist:<id>; unused for validate
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: lordchrist-telegram-publisher
  cancel-in-progress: false
  queue: max
  queue: max

jobs:
  exact-control-plane:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PROFILE_PATH: content/telegram/channels/lordchrist-rich.json
      STATE_BRANCH: state/lordchrist-telegram
      STATE_DIR: .state/lordchrist
      TARGET_PROOF_PATH: .runtime/lordchrist-quiz-target-proof.json
      ENVELOPE_PATH: .runtime/lordchrist-quiz-dispatch.json
      OUTCOME_PATH: .runtime/lordchrist-quiz-outcome.json
      MAX_PUBLICATION_LAG_MINUTES: "360"

    steps:
      - name: Check out exact current-main runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install minimal Telegram runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            -r requirements/telegram-publisher.txt

      - name: Require exact current main before any state or provider work
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$remote_main" == "$GITHUB_SHA" ]] || {
            echo "main advanced after this run started; refusing stale control-plane execution" >&2
            exit 3
          }

      - name: Resolve exact bundle paths and authority gate
        id: gate
        env:
          OPERATION: ${{ inputs.operation }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
          CONFIRM: ${{ inputs.confirm || '' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$OPERATION" in
            validate)
              python -m video_channel_manager.lordchrist_quiz validate \
                --publication-id "$PUBLICATION_ID"
              ;;
            initialize-state)
              [[ "$CONFIRM" == "INITIALIZE:@lordchrist:$PUBLICATION_ID" ]] || {
                echo "exact state initialization confirmation is missing" >&2
                exit 3
              }
              python -m video_channel_manager.lordchrist_quiz validate \
                --publication-id "$PUBLICATION_ID" \
                --require-release-authorized
              ;;
            publish)
              [[ "$CONFIRM" == "PUBLISH:@lordchrist:$PUBLICATION_ID" ]] || {
                echo "exact publication confirmation is missing" >&2
                exit 3
              }
              python -m video_channel_manager.lordchrist_quiz validate \
                --publication-id "$PUBLICATION_ID" \
                --require-execution-authorized
              ;;
            *)
              echo "unsupported control-plane operation" >&2
              exit 3
              ;;
          esac
          echo "release_path=content/telegram/lordchrist/quiz/$PUBLICATION_ID-runtime.json" >> "$GITHUB_OUTPUT"
          echo "ledger_relative_path=content/telegram/lordchrist/quiz/$PUBLICATION_ID-ledger.json" >> "$GITHUB_OUTPUT"
          echo "ledger_path=$STATE_DIR/content/telegram/lordchrist/quiz/$PUBLICATION_ID-ledger.json" >> "$GITHUB_OUTPUT"

      - name: Provider-free validation complete
        if: inputs.operation == 'validate'
        run: echo "Exact lordchrist quiz bundle is valid. This operation had no provider access and created no execution authority."

      - name: Require exact current-main CI proof before state/provider path
        if: inputs.operation != 'validate'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow ci.yml \
            --sha "$GITHUB_SHA"

      - name: Check out isolated durable lordchrist state
        if: inputs.operation != 'validate'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state/lordchrist-telegram
          path: .state/lordchrist
          fetch-depth: 0
          persist-credentials: true

      - name: Initialize exact quiz state
        if: inputs.operation == 'initialize-state'
        env:
          PUBLICATION_ID: ${{ inputs.publication_id }}
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.lordchrist_quiz state-init \
            --publication-id "$PUBLICATION_ID" \
            --state-checkout "$STATE_DIR"

          git -C "$STATE_DIR" config user.name "lordchrist-quiz[bot]"
          git -C "$STATE_DIR" config user.email "lordchrist-quiz@users.noreply.github.com"
          git -C "$STATE_DIR" add -- "${{ steps.gate.outputs.ledger_relative_path }}"
          if git -C "$STATE_DIR" diff --cached --quiet; then
            echo "Exact lordchrist quiz state was already initialized with the same immutable identity."
            exit 0
          fi
          git -C "$STATE_DIR" commit -m "Initialize exact quiz state for $PUBLICATION_ID"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || {
            echo "durable lordchrist state branch did not accept exact initialization" >&2
            exit 3
          }

      - name: Require exact initialized publishable state before Telegram access
        if: inputs.operation == 'publish'
        env:
          PUBLICATION_ID: ${{ inputs.publication_id }}
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.lordchrist_quiz state-check \
            --publication-id "$PUBLICATION_ID" \
            --state-checkout "$STATE_DIR" \
            --require-publishable
          python -m video_channel_manager.telegram_publication_freshness next \
            --release "${{ steps.gate.outputs.release_path }}" \
            --ledger "${{ steps.gate.outputs.ledger_path }}" \
            --publication-id "$PUBLICATION_ID" \
            --max-lag-minutes "$MAX_PUBLICATION_LAG_MINUTES"

      - name: Fresh exact target preflight
        if: inputs.operation == 'publish'
        env:
          LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_channel_cli preflight \
            --profile "$PROFILE_PATH" \
            --expected-chat-id -1001295216957 \
            --expected-bot-id 8716602202 \
            --expected-bot-username preaching_mp3_bot \
            --output "$TARGET_PROOF_PATH"

      - name: Prepare exactly one durable quiz intent
        if: inputs.operation == 'publish'
        env:
          PUBLICATION_ID: ${{ inputs.publication_id }}
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_multichannel_cli prepare \
            --profile "$PROFILE_PATH" \
            --release "${{ steps.gate.outputs.release_path }}" \
            --ledger "${{ steps.gate.outputs.ledger_path }}" \
            --target-proof "$TARGET_PROOF_PATH" \
            --mode manual \
            --publication-id "$PUBLICATION_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-sha "$GITHUB_SHA" \
            --github-workflow-sha "${{ github.workflow_sha }}" \
            --envelope-output "$ENVELOPE_PATH"

      - name: Persist exact intent in release ledger before mutation
        if: inputs.operation == 'publish'
        id: persist_intent
        env:
          PUBLICATION_ID: ${{ inputs.publication_id }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_rel_dir="content/telegram/lordchrist/quiz-dispatches/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          evidence_abs_dir="$STATE_DIR/$evidence_rel_dir"
          mkdir -p "$evidence_abs_dir"
          cp -- "$ENVELOPE_PATH" "$evidence_abs_dir/dispatch.json"
          cp -- "$TARGET_PROOF_PATH" "$evidence_abs_dir/target-proof.json"

          git -C "$STATE_DIR" config user.name "lordchrist-quiz[bot]"
          git -C "$STATE_DIR" config user.email "lordchrist-quiz@users.noreply.github.com"
          git -C "$STATE_DIR" add -- \
            "${{ steps.gate.outputs.ledger_relative_path }}" \
            "$evidence_rel_dir"
          git -C "$STATE_DIR" diff --cached --quiet && {
            echo "prepared lordchrist quiz item produced no durable intent delta" >&2
            exit 3
          }
          git -C "$STATE_DIR" commit -m "Record lordchrist quiz intent for run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || {
            echo "remote state branch does not contain exact lordchrist quiz intent" >&2
            exit 3
          }
          echo "evidence_rel_dir=$evidence_rel_dir" >> "$GITHUB_OUTPUT"

      - name: Re-prove exact current main and CI immediately before mutation
        if: inputs.operation == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$remote_main" == "$GITHUB_SHA" ]] || {
            echo "main advanced after durable intent; do not send and do not replay this intent" >&2
            exit 3
          }
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow ci.yml \
            --sha "$GITHUB_SHA"

      - name: Send exactly once through the canonical generic Telegram runtime
        if: inputs.operation == 'publish'
        id: send
        env:
          LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set +e
          python -m video_channel_manager.telegram_multichannel_cli send-once \
            --profile "$PROFILE_PATH" \
            --release "${{ steps.gate.outputs.release_path }}" \
            --ledger "${{ steps.gate.outputs.ledger_path }}" \
            --envelope "$ENVELOPE_PATH" \
            --outcome-output "$OUTCOME_PATH"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [[ -f "$OUTCOME_PATH" ]] || {
            echo "provider runtime produced no durable outcome artifact; this intent is non-replayable" >&2
            exit 5
          }

      - name: Archive exact provider outcome before state mutation
        if: inputs.operation == 'publish' && always() && steps.send.outputs.status != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lordchrist-quiz-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/lordchrist-quiz-outcome.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Apply exact outcome and persist terminal or blocking state
        if: inputs.operation == 'publish' && always() && steps.send.outputs.status != ''
        env:
          PUBLICATION_ID: ${{ inputs.publication_id }}
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_multichannel_cli apply-outcome \
            --release "${{ steps.gate.outputs.release_path }}" \
            --ledger "${{ steps.gate.outputs.ledger_path }}" \
            --envelope "$ENVELOPE_PATH" \
            --outcome "$OUTCOME_PATH"

          evidence_rel_dir="${{ steps.persist_intent.outputs.evidence_rel_dir }}"
          cp -- "$OUTCOME_PATH" "$STATE_DIR/$evidence_rel_dir/outcome.json"
          git -C "$STATE_DIR" add -- \
            "${{ steps.gate.outputs.ledger_relative_path }}" \
            "$evidence_rel_dir/outcome.json"
          git -C "$STATE_DIR" commit -m "Record lordchrist quiz outcome for run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || {
            echo "remote state branch does not contain exact lordchrist quiz outcome" >&2
            exit 3
          }

          status="${{ steps.send.outputs.status }}"
          if [[ "$status" != "0" ]]; then
            echo "Telegram send was not verified; exact outcome is durable and blind replay is blocked." >&2
            exit "$status"
          fi
