name: Svodka one-time generic runtime quality

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/svodka-runtime-quality-once.yml

permissions:
  contents: write

concurrency:
  group: svodka-runtime-quality-once
  cancel-in-progress: false

jobs:
  validate-format-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install repository dev runtime
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run self-diagnosing runtime quality gate
        id: quality
        shell: bash
        run: |
          set -uo pipefail
          ruff format \
            src/video_channel_manager/telegram_multichannel_outcome.py \
            src/video_channel_manager/telegram_multichannel_cli.py \
            tests/test_telegram_multichannel_outcome.py \
            tests/test_telegram_multichannel_state.py \
            tests/test_svodka_release_review.py \
            2>&1 | tee /tmp/format.log
          format_status=${PIPESTATUS[0]}

          ruff check \
            src/video_channel_manager/telegram_multichannel_outcome.py \
            src/video_channel_manager/telegram_multichannel_cli.py \
            src/video_channel_manager/telegram_multichannel_release.py \
            src/video_channel_manager/telegram_multichannel_state.py \
            src/video_channel_manager/svodka_release.py \
            tests/test_telegram_multichannel_outcome.py \
            tests/test_telegram_multichannel_state.py \
            tests/test_svodka_release_review.py \
            2>&1 | tee /tmp/ruff.log
          ruff_status=${PIPESTATUS[0]}

          mypy \
            src/video_channel_manager/telegram_multichannel_outcome.py \
            src/video_channel_manager/telegram_multichannel_cli.py \
            --show-error-codes \
            2>&1 | tee /tmp/mypy.log
          mypy_status=${PIPESTATUS[0]}

          python -m pytest -q \
            tests/test_telegram_multichannel_outcome.py \
            tests/test_telegram_multichannel_state.py \
            tests/test_svodka_release_review.py \
            tests/test_telegram_channel_cli.py \
            tests/test_svodka_preflight_workflow.py \
            2>&1 | tee /tmp/pytest.log
          pytest_status=${PIPESTATUS[0]}

          echo "format_status=$format_status" >> "$GITHUB_OUTPUT"
          echo "ruff_status=$ruff_status" >> "$GITHUB_OUTPUT"
          echo "mypy_status=$mypy_status" >> "$GITHUB_OUTPUT"
          echo "pytest_status=$pytest_status" >> "$GITHUB_OUTPUT"

      - name: Persist diagnostic if any quality check failed
        if: steps.quality.outputs.format_status != '0' || steps.quality.outputs.ruff_status != '0' || steps.quality.outputs.mypy_status != '0' || steps.quality.outputs.pytest_status != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/operations
          {
            echo '# Svodka generic runtime quality diagnostic'
            echo
            echo "Generated by GitHub Actions run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT."
            echo
            echo "- format: ${{ steps.quality.outputs.format_status }}"
            echo "- ruff: ${{ steps.quality.outputs.ruff_status }}"
            echo "- mypy: ${{ steps.quality.outputs.mypy_status }}"
            echo "- pytest: ${{ steps.quality.outputs.pytest_status }}"
            echo
            for item in ruff mypy pytest; do
              echo "## $item"
              echo '```text'
              cat "/tmp/$item.log"
              echo '```'
              echo
            done
          } > docs/operations/svodka-runtime-quality-diagnostic.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/video_channel_manager tests docs/operations/svodka-runtime-quality-diagnostic.md
          git commit -m "Record Svodka generic runtime quality diagnostics"
          git push origin HEAD:main

      - name: Commit validated formatter output and remove one-time workflow
        if: steps.quality.outputs.format_status == '0' && steps.quality.outputs.ruff_status == '0' && steps.quality.outputs.mypy_status == '0' && steps.quality.outputs.pytest_status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/svodka-runtime-quality-once.yml
          git add src/video_channel_manager tests
          git commit -m "Validate and format generic Telegram runtime"
          git push origin HEAD:main

      - name: Fail after preserving diagnostic
        if: steps.quality.outputs.format_status != '0' || steps.quality.outputs.ruff_status != '0' || steps.quality.outputs.mypy_status != '0' || steps.quality.outputs.pytest_status != '0'
        run: exit 1
