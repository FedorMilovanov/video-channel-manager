name: LordChrist historical media locator diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/lordchrist-historical-media-locator-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect remaining public archival locators
        shell: bash
        run: |
          set -euo pipefail
          UA='video-channel-manager-historical-media-locator/1.0 (+https://github.com/FedorMilovanov/video-channel-manager)'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          echo '=== BEDFORD RECORDS ==='
          curl -fsSL --max-time 25 -A "$UA" 'https://bedsarchivescat.bedford.gov.uk/Details/archive/110061210' -o "$tmp/bed-main.html"
          for id in 110669209 110669210; do
            curl -fsSL --max-time 25 -A "$UA" "https://bedsarchivescat.bedford.gov.uk/Details/archive/$id" -o "$tmp/bed-$id.html" || true
          done
          python - "$tmp" <<'PY'
          import re, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          keys=('110669209','110669210','slide65','slide66','image','media','file','download','jpg','jpeg','png','tif','iiif')
          for path in sorted(root.glob('bed-*.html')):
              text=path.read_text(encoding='utf-8', errors='replace')
              print(f'=== {path.name} ===')
              for url in dict.fromkeys(re.findall(r'https?://[^\s"<>]+', text)):
                  if any(k in url.casefold() for k in keys):
                      print('URL', url[:1200])
              for n,line in enumerate(text.splitlines(),1):
                  if any(k in line.casefold() for k in keys):
                      print(f'L{n}', line[:1600])
          PY

          echo '=== BEDFORD IMAGE VIEWER RUNTIME ==='
          curl -fsSL --max-time 25 -A "$UA" 'https://bedsarchivescat.bedford.gov.uk/Scripts/Base/ImageViewer.js' -o "$tmp/bed-viewer.js"
          python - "$tmp/bed-viewer.js" <<'PY'
          import re, sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          for n,line in enumerate(text.splitlines(),1):
              if any(k in line.casefold() for k in ('ajax','image','viewer','priref','download','media','url','src')):
                  print(f'L{n}',line[:1800])
          print('URLS')
          for url in dict.fromkeys(re.findall(r'https?://[^\s"<>]+',text)):
              print(url[:1600])
          PY

          echo '=== INTERNET ARCHIVE EXACT-TITLE SEARCH ==='
          python - <<'PY' > "$tmp/ia-urls.txt"
          import urllib.parse
          queries=[
              'title:("The gospel of Christ worthy of all acceptation") AND creator:("Andrew Fuller")',
              'title:("Observations on the Rev. Andrew Fuller late pamphlet") AND creator:("Dan Taylor")',
              'title:("Observations on the Rev. Andrew Fuller’s late pamphlet") AND creator:("Dan Taylor")',
          ]
          for q in queries:
              params=urllib.parse.urlencode({
                  'q':q,
                  'fl[]':['identifier','title','creator','date','year'],
                  'rows':50,
                  'page':1,
                  'output':'json',
              },doseq=True)
              print('https://archive.org/advancedsearch.php?'+params)
          PY
          while IFS= read -r url; do
            echo "QUERY $url"
            if curl -fsSL --max-time 25 -A "$UA" "$url" -o "$tmp/ia.json"; then
              python - "$tmp/ia.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          print(json.dumps(data.get('response',{}).get('docs',[]),ensure_ascii=False,indent=2))
          PY
            fi
          done < "$tmp/ia-urls.txt"

          echo '=== GOOGLE BOOKS FULLER METADATA (NON-FATAL) ==='
          if curl -fsSL --max-time 25 -A "$UA" 'https://www.googleapis.com/books/v1/volumes/UfRhAAAAcAAJ' -o "$tmp/fuller-volume.json"; then
            python - "$tmp/fuller-volume.json" <<'PY'
          import json, sys
          v=json.load(open(sys.argv[1], encoding='utf-8'))
          print(json.dumps({'id':v.get('id'),'volumeInfo':{k:v.get('volumeInfo',{}).get(k) for k in ('title','publishedDate','pageCount')},'accessInfo':v.get('accessInfo',{})}, ensure_ascii=False, indent=2))
          PY
          else
            echo 'Google Books metadata unavailable; continuing without weakening archival requirements.'
          fi

          echo '=== GOETTINGEN TAYLOR FULLTEXT ==='
          if curl -fsSL --max-time 25 -A "$UA" 'https://nl.sub.uni-goettingen.de/id/0220002400?origin=/collection/nlh-ecc' -o "$tmp/taylor.html"; then
            python - "$tmp/taylor.html" <<'PY'
          import re, sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          keys=('pdf','download','image','viewer','digit','0220002400','iiif','manifest','mets','alto','presentation')
          for url in dict.fromkeys(re.findall(r'https?://[^\s"<>]+',text)):
              if any(k in url.casefold() for k in keys):
                  print('URL',url[:1600])
          for n,line in enumerate(text.splitlines(),1):
              if any(k in line.casefold() for k in keys):
                  print(f'L{n}',line[:1800])
          PY
          fi

          echo '=== OFFICIAL FRUS EPUB ==='
          curl -fsSL --max-time 25 -A "$UA" 'https://static.history.state.gov/frus/frus1934v03/ebook/frus1934v03.epub' -o "$tmp/frus.epub"
          sha1sum "$tmp/frus.epub"
          sha256sum "$tmp/frus.epub"
          stat -c '%s bytes' "$tmp/frus.epub"
          python - "$tmp/frus.epub" <<'PY'
          import re, sys, zipfile
          p=sys.argv[1]
          with zipfile.ZipFile(p) as z:
              print('mimetype=',z.read('mimetype').decode('ascii'))
              names=z.namelist()
              print('entries=',len(names))
              hits=[]
              for name in names:
                  if not name.lower().endswith(('.xhtml','.html','.htm')):
                      continue
                  data=z.read(name).decode('utf-8',errors='replace')
                  if 'Stam' in data and ('December 17' in data or 'baby was safe' in data or 'Wuhu' in data):
                      hits.append(name)
                      plain=re.sub(r'<[^>]+>',' ',data)
                      plain=' '.join(plain.split())
                      print('HIT',name,plain[:3000])
              print('stam entries=',hits[:30])
          PY
