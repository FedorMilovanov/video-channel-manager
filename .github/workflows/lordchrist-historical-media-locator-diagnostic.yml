name: LordChrist historical media locator diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/lordchrist-historical-media-locator-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pin final Bedford and Wellcome source identities
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          UA='video-channel-manager-historical-media-locator/1.0 (+https://github.com/FedorMilovanov/video-channel-manager)'

          bedford='https://bedsarchives.bedford.gov.uk/images/ExploreYourArchive2013/1667%20Gaol%20List.JPG'
          echo '=== BEDFORD HSA1667/W/58 ==='
          curl -fsSL --retry 3 --max-time 90 -A "$UA" "$bedford" -o "$tmp/bedford.jpg"
          file "$tmp/bedford.jpg"
          stat -c 'BEDFORD_BYTES %s' "$tmp/bedford.jpg"
          sha1sum "$tmp/bedford.jpg" | sed 's# .*# BEDFORD_SHA1#'
          sha256sum "$tmp/bedford.jpg" | sed 's# .*# BEDFORD_SHA256#'
          python - "$tmp/bedford.jpg" <<'PY'
          from pathlib import Path
          import struct, sys
          data = Path(sys.argv[1]).read_bytes()
          if not data.startswith(b'\xff\xd8'):
              raise SystemExit('Bedford source is not JPEG')
          i = 2
          while i + 9 < len(data):
              if data[i] != 0xFF:
                  i += 1
                  continue
              marker = data[i + 1]
              i += 2
              if marker in {0xD8, 0xD9} or 0xD0 <= marker <= 0xD7:
                  continue
              length = struct.unpack('>H', data[i:i+2])[0]
              if marker in {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}:
                  h, w = struct.unpack('>HH', data[i+3:i+7])
                  print('BEDFORD_DIMENSIONS', w, h)
                  break
              i += length
          else:
              raise SystemExit('Bedford JPEG dimensions not found')
          PY

          taylor='https://api.wellcomecollection.org/catalogue/v2/works/d2cy4t36'
          echo '=== WELLCOME TAYLOR 1786 ==='
          curl -fsSL --retry 3 --max-time 90 -A "$UA" -H 'Accept: application/json' "$taylor" -o "$tmp/taylor.json"
          file "$tmp/taylor.json"
          stat -c 'TAYLOR_BYTES %s' "$tmp/taylor.json"
          sha1sum "$tmp/taylor.json" | sed 's# .*# TAYLOR_SHA1#'
          sha256sum "$tmp/taylor.json" | sed 's# .*# TAYLOR_SHA256#'
          python - "$tmp/taylor.json" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if not isinstance(payload, dict):
              raise SystemExit('Wellcome response is not a JSON object')
          print('TAYLOR_ID', payload.get('id'))
          print('TAYLOR_TITLE', payload.get('title'))
          PY
