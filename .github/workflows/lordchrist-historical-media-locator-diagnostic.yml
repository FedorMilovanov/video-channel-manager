name: LordChrist historical media locator diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/lordchrist-historical-media-locator-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pin Taylor Wellcome catalog JSON
        shell: bash
        run: |
          set -euo pipefail
          UA='video-channel-manager-historical-media-locator/1.0 (+https://github.com/FedorMilovanov/video-channel-manager)'
          url='https://api.wellcomecollection.org/catalogue/v2/works/d2cy4t36?include=identifiers,items,holdings,contributors,production,images'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --max-time 30 -A "$UA" -D "$tmp/headers" "$url" -o "$tmp/taylor.json"
          head -40 "$tmp/headers" | tr -d '\r'
          file "$tmp/taylor.json"
          stat -c '%s bytes' "$tmp/taylor.json"
          sha1sum "$tmp/taylor.json"
          sha256sum "$tmp/taylor.json"
          python - "$tmp/taylor.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1],encoding='utf-8'))
          assert v['id']=='d2cy4t36'
          assert v['title'].startswith("Observations on the Rev. Andrew Fuller's late pamphlet")
          assert any(event.get('dates') and event['dates'][0].get('label')=='1786' for event in v.get('production',[]))
          assert any(c.get('agent',{}).get('label')=='Taylor, Dan 1738-1816.' for c in v.get('contributors',[]))
          holdings=v.get('holdings',[])
          assert holdings
          location=holdings[0].get('location',{})
          print('TAYLOR_WORK_ID',v['id'])
          print('TAYLOR_TITLE',v['title'])
          print('TAYLOR_PRODUCTION',json.dumps(v.get('production'),ensure_ascii=False))
          print('TAYLOR_CONTRIBUTORS',json.dumps(v.get('contributors'),ensure_ascii=False))
          print('TAYLOR_HOLDING_LOCATION',json.dumps(location,ensure_ascii=False))
          print('TAYLOR_IMAGES',json.dumps(v.get('images'),ensure_ascii=False))
          PY
