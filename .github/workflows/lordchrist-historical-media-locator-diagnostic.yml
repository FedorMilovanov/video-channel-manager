name: LordChrist historical media locator diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/lordchrist-historical-media-locator-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe final archival binary routes
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150.0 Safari/537.36'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          echo '=== BEDFORD SLIDE65 INPUTS ==='
          curl -fsSL --max-time 30 -A "$UA" 'https://bedsarchivescat.bedford.gov.uk/Details/archive/110669209' -o "$tmp/bed.html"
          python - "$tmp/bed.html" "$tmp/bed-env.json" <<'PY'
          import html, json, re, sys
          from html.parser import HTMLParser
          from pathlib import Path

          class Inputs(HTMLParser):
              def __init__(self):
                  super().__init__(); self.items=[]
              def handle_starttag(self, tag, attrs):
                  if tag.casefold() == 'input': self.items.append(dict(attrs))

          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          parser=Inputs(); parser.feed(text)
          interesting=[]
          for item in parser.items:
              cls=item.get('class','')
              if 'ais-image' in cls or 'ais-priref' in cls:
                  interesting.append(item)
                  print(json.dumps(item,ensure_ascii=False))
          filenames=[i.get('value') for i in parser.items if 'ais-image-filename-value' in i.get('class','') and i.get('value')]
          servers=[i.get('value') for i in parser.items if 'ais-image-server' in i.get('class','') and i.get('value')]
          payload={'filenames':filenames,'servers':servers}
          Path(sys.argv[2]).write_text(json.dumps(payload),encoding='utf-8')
          print('BEDFORD_ENV',json.dumps(payload,ensure_ascii=False))
          for token in ('Slide65','GetImageURL','GetImageViewer','ais-image-filename-value','ais-image-server'):
              print(token,'hits=',text.count(token))
          PY

          python - "$tmp/bed-env.json" "$tmp/bed-helper-queries.txt" <<'PY'
          import json, sys, urllib.parse
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          rows=[]
          for filename in data.get('filenames',[]):
              for server in data.get('servers',[]):
                  q=urllib.parse.urlencode({'filename':filename,'imageServer':server,'size':'1600','commentImage':'false'})
                  rows.append('https://bedsarchivescat.bedford.gov.uk/helper/GetImageURL?'+q)
                  q2=urllib.parse.urlencode({'filename':filename,'imageServer':server,'totalimages':'1','commentImage':'false'})
                  rows.append('https://bedsarchivescat.bedford.gov.uk/helper/GetImageViewer?'+q2)
          open(sys.argv[2],'w',encoding='utf-8').write('\n'.join(rows))
          PY
          n=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            n=$((n+1)); echo "BEDFORD_HELPER[$n] $url"
            if curl -fsSL --max-time 30 -A "$UA" -e 'https://bedsarchivescat.bedford.gov.uk/Details/archive/110669209' "$url" -o "$tmp/bed-helper-$n"; then
              file "$tmp/bed-helper-$n" || true
              wc -c "$tmp/bed-helper-$n"
              head -c 2500 "$tmp/bed-helper-$n" | tr '\000' ' ' || true
              echo
              python - "$tmp/bed-helper-$n" <<'PY'
          import re,sys
          from pathlib import Path
          data=Path(sys.argv[1]).read_bytes()
          text=data.decode('utf-8',errors='ignore')
          urls=list(dict.fromkeys(re.findall(r'https?://[^\s"<>]+',text)))
          for url in urls:
              if any(k in url.casefold() for k in ('image','jpg','jpeg','png','tif','slide65')):
                  print('BEDFORD_DISCOVERED_URL',url[:2000])
          PY
            fi
          done < "$tmp/bed-helper-queries.txt"

          echo '=== GOOGLE BOOKS FULLER PR1 ==='
          for url in \
            'https://books.google.com/books?id=UfRhAAAAcAAJ&pg=PR1&source=gbs_selected_pages' \
            'https://www.google.com/books?id=UfRhAAAAcAAJ&jscmd=SearchWithinVolume2&q=gospel' \
            'https://books.google.com/books/content?id=UfRhAAAAcAAJ&pg=PR1&img=1&zoom=2&hl=en'; do
            echo "FULLER_URL $url"
            if curl -L --max-time 30 -A "$UA" -D "$tmp/full-h" "$url" -o "$tmp/full-b"; then
              head -40 "$tmp/full-h" | tr -d '\r'
              file "$tmp/full-b" || true
              wc -c "$tmp/full-b"
              sha1sum "$tmp/full-b"; sha256sum "$tmp/full-b"
              python - "$tmp/full-b" <<'PY'
          import re,sys
          from pathlib import Path
          data=Path(sys.argv[1]).read_bytes()
          text=data.decode('utf-8',errors='ignore')
          for token in ('PR1','books/content','pageImage','sig=','img=1','UfRhAAAAcAAJ'):
              print('TOKEN',token,'hits=',text.count(token))
          for m in re.finditer(r'.{0,220}(?:PR1|books/content|pageImage|sig=).{0,500}',text,re.I|re.S):
              print('FULLER_CONTEXT',' '.join(m.group(0).split())[:1800])
          PY
            fi
          done

          echo '=== TAYLOR MAX PLANCK / GOETTINGEN ==='
          curl -fsSL --max-time 30 -A "$UA" 'https://mpipsyl.disco.mpg.de/Record/E-Books.EB000462974/DetailsIndex' -o "$tmp/taylor-mpi.html"
          python - "$tmp/taylor-mpi.html" <<'PY'
          import re,sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          for url in dict.fromkeys(re.findall(r'https?://[^\s"<>]+',text)):
              if any(k in url.casefold() for k in ('goettingen','0220002400','ecco','fulltext')):
                  print('TAYLOR_LINK',url[:1800])
          PY
          for url in \
            'http://nl.sub.uni-goettingen.de/id/0220002400?origin=/collection/nlh-ecc' \
            'https://nl.sub.uni-goettingen.de/id/0220002400?origin=/collection/nlh-ecc'; do
            echo "TAYLOR_URL $url"
            curl -L --max-time 30 -A "$UA" -e 'https://mpipsyl.disco.mpg.de/' -D "$tmp/tay-h" "$url" -o "$tmp/tay-b" || true
            head -40 "$tmp/tay-h" | tr -d '\r' || true
            file "$tmp/tay-b" || true
            wc -c "$tmp/tay-b" || true
            python - "$tmp/tay-b" <<'PY'
          import re,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          if not p.exists(): raise SystemExit
          text=p.read_text(encoding='utf-8',errors='ignore')
          for token in ('pdf','iiif','manifest','image','download','0220002400'):
              print('TOKEN',token,'hits=',text.casefold().count(token))
          for url in dict.fromkeys(re.findall(r'https?://[^\s"<>]+',text)):
              if any(k in url.casefold() for k in ('pdf','iiif','manifest','image','download','0220002400')):
                  print('TAYLOR_DISCOVERED_URL',url[:2000])
          PY
          done
