name: LordChrist historical media locator diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/lordchrist-historical-media-locator-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect final unresolved archival binary routes
        shell: bash
        run: |
          set -u -o pipefail
          UA='video-channel-manager-historical-media-locator/1.0 (+https://github.com/FedorMilovanov/video-channel-manager)'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          echo '=== WELLCOME EXACT TAYLOR WORK d2cy4t36 ==='
          for url in \
            'https://api.wellcomecollection.org/catalogue/v2/works/d2cy4t36?include=identifiers,items,holdings,contributors,production,images' \
            'https://api.wellcomecollection.org/catalogue/v2/images?query=d2cy4t36&pageSize=100'; do
            echo "WELLCOME_URL $url"
            if curl -fsSL --max-time 30 -A "$UA" "$url" -o "$tmp/wellcome.json"; then
              python -m json.tool "$tmp/wellcome.json" | head -1200
              python - "$tmp/wellcome.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1],encoding='utf-8'))
          def walk(x,path=''):
              if isinstance(x,dict):
                  for k,val in x.items():
                      p=f'{path}.{k}' if path else k
                      if k in {'url','id','label','license','linkText','accessConditions','locations','items','images','thumbnail','referenceNumber','title'}:
                          print('FIELD',p,json.dumps(val,ensure_ascii=False)[:4000])
                      walk(val,p)
              elif isinstance(x,list):
                  for i,val in enumerate(x): walk(val,f'{path}[{i}]')
          walk(v)
          PY
            else
              echo 'WELLCOME_FETCH_FAILED'
            fi
          done

          echo '=== WELLCOME TITLE SEARCH ==='
          python - <<'PY' > "$tmp/wellcome-search-url"
          import urllib.parse
          q='Observations on the Rev. Andrew Fuller late pamphlet Dan Taylor 1786'
          print('https://api.wellcomecollection.org/catalogue/v2/works?'+urllib.parse.urlencode({'query':q,'include':'identifiers,items,holdings,contributors,production,images','pageSize':20}))
          PY
          if curl -fsSL --max-time 30 -A "$UA" "$(cat "$tmp/wellcome-search-url")" -o "$tmp/wellcome-search.json"; then
            python - "$tmp/wellcome-search.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1],encoding='utf-8'))
          for r in v.get('results',[]):
              print(json.dumps({k:r.get(k) for k in ('id','title','referenceNumber','items','images','identifiers','availabilities')},ensure_ascii=False,indent=2))
          PY
          fi

          echo '=== BEDFORD CHILD HTML MEDIA MARKERS ==='
          curl -fsSL --max-time 30 -A "$UA" 'https://bedsarchivescat.bedford.gov.uk/Details/archive/110669209' -o "$tmp/bed.html"
          python - "$tmp/bed.html" <<'PY'
          import re,sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          for n,line in enumerate(text.splitlines(),1):
              low=line.casefold()
              if any(k in low for k in ('image','media','filename','server','slide65','110669209','download','attachment','digital','thumbnail')):
                  print(f'BED_L{n}',line[:5000])
          for src in re.findall(r'(?:src|href)=["\']([^"\']+)',text,re.I):
              if any(k in src.casefold() for k in ('image','media','download','110669209','slide65','helper')):
                  print('BED_LINK',src[:3000])
          PY

          echo '=== BEDFORD DETAIL DOWNLOAD ROUTES ==='
          for url in \
            'https://bedsarchivescat.bedford.gov.uk/Details/download?priref=110669209&database=archive' \
            'https://bedsarchivescat.bedford.gov.uk/Details/download?priref=110061210&database=archive' \
            'https://bedsarchivescat.bedford.gov.uk/helper/GetImageViewer?priref=110669209' \
            'https://bedsarchivescat.bedford.gov.uk/helper/GetImageURL?priref=110669209&size=1600'; do
            echo "BED_ROUTE $url"
            curl -L --max-time 30 -A "$UA" -e 'https://bedsarchivescat.bedford.gov.uk/Details/archive/110669209' -D "$tmp/bed-h" "$url" -o "$tmp/bed-b" || true
            head -30 "$tmp/bed-h" | tr -d '\r' || true
            file "$tmp/bed-b" || true
            wc -c "$tmp/bed-b" || true
            head -c 3000 "$tmp/bed-b" | tr '\000' ' ' || true
            echo
          done

          echo '=== TAYLOR EXTERNAL EXACT-ID SEARCH ENDPOINTS ==='
          for url in \
            'https://archive.org/advancedsearch.php?q=%22T11675%22&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=creator&fl%5B%5D=date&rows=50&output=json' \
            'https://archive.org/advancedsearch.php?q=%220220002400%22&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=creator&fl%5B%5D=date&rows=50&output=json'; do
            echo "IA_URL $url"
            curl -fsSL --max-time 30 -A "$UA" "$url" || true
            echo
          done

          echo 'diagnostic completed; absence of a route is data, not a workflow failure'
