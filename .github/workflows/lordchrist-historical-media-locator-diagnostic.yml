name: LordChrist historical media locator diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/lordchrist-historical-media-locator-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install project
        run: python -m pip install -e .
      - name: Reconcile sealed historical identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          from video_channel_manager.telegram_historical_bundle import HistoricalSourceShardV1
          from video_channel_manager.telegram_historical_editorial import HistoricalSourceRegistry
          from video_channel_manager.telegram_research import sha256_json

          root = Path('.')
          bunyan = root / 'content/telegram/lordchrist/historical-editorial/v1/sources/bunyan.json'
          bunyan_verification = root / 'content/telegram/lordchrist/historical-editorial/v1/verification/bunyan-bedford-prison-v3-2026-09-08.json'
          corrections_b = root / 'content/telegram/lordchrist/historical-editorial/v1/sources/historical-v3-corrections-b.json'
          batch = root / 'content/telegram/lordchrist/historical-editorial/v1/v3/batch-manifest-2026-09-08.json'

          def git_blob(path: Path) -> str:
              return subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()

          print('BUNYAN_GIT_BLOB', git_blob(bunyan))
          print('BUNYAN_VERIFICATION_GIT_BLOB', git_blob(bunyan_verification))
          print('CORRECTIONS_B_GIT_BLOB', git_blob(corrections_b))
          print('BATCH_CURRENT_GIT_BLOB', git_blob(batch))
          print('BUNYAN_SHA256_JSON', sha256_json(json.loads(bunyan.read_text(encoding='utf-8'))))
          print('CORRECTIONS_B_SHA256_JSON', sha256_json(json.loads(corrections_b.read_text(encoding='utf-8'))))

          for catalog_name in ('source-catalog.json', 'source-catalog-human-v2.json'):
              catalog_path = root / 'content/telegram/lordchrist/historical-editorial/v1' / catalog_name
              catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
              sources = []
              shard_lines = []
              for ref in catalog['shards']:
                  shard_path = root / ref['path']
                  payload = json.loads(shard_path.read_text(encoding='utf-8'))
                  shard = HistoricalSourceShardV1.model_validate(payload)
                  digest = sha256_json(payload)
                  count = len(shard.sources)
                  shard_lines.append((ref['shard_id'], digest, count))
                  sources.extend(shard.sources)
              registry = HistoricalSourceRegistry(
                  schema_name='video-channel-manager.telegram-historical-source-registry',
                  schema_version=1,
                  checked_on=catalog['checked_on'],
                  sources=tuple(sources),
              )
              print('CATALOG', catalog_name)
              print('CATALOG_TOTAL_SOURCES', len(sources))
              print('CATALOG_REGISTRY_SHA256', registry.digest)
              for shard_id, digest, count in shard_lines:
                  if shard_id == 'history-sources-bunyan':
                      print('CATALOG_BUNYAN_SHARD', shard_id, digest, count)
          PY
