name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "agent/**"
      - "integration/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-legendary-poet-article-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/legendary-poet-article-wave' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/legendary-poet-article-wave
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Finalize exact policy and proof evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime
          from pathlib import Path

          expected_policy_digest = "sha256:af210867d2ea392394e2034cffa9d43c3e1adc632386e9ec4827b033c8fff9a0"
          policy_path = Path("data/editorial/legendary-poet-article-wave-202608.json")
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          for operation in policy["operations"]:
              operation["publish_date"] = int(datetime.fromisoformat(operation["publish_at"]).timestamp())
              operation["message_sha256"] = "sha256:" + hashlib.sha256(
                  operation["message"].encode("utf-8")
              ).hexdigest()
          unsigned = {key: value for key, value in policy.items() if key != "policy_sha256"}
          canonical = json.dumps(
              unsigned,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          actual_policy_digest = "sha256:" + hashlib.sha256(canonical).hexdigest()
          if actual_policy_digest != expected_policy_digest:
              raise SystemExit(
                  f"Approved policy content drifted: {actual_policy_digest} != {expected_policy_digest}"
              )
          policy["policy_sha256"] = actual_policy_digest
          policy_path.write_text(
              json.dumps(policy, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          proof_path = Path("docs/operations/mutation-fault-proof-register.json")
          proof_register = json.loads(proof_path.read_text(encoding="utf-8"))
          boundary = {
              "boundary_id": "vk.wall.photo.save",
              "proofs": [
                  {
                      "stages": ["before_dispatch"],
                      "test_id": "tests/test_vk_article_provider.py::test_exact_existing_post_is_adopted_but_schedule_collision_is_blocked",
                      "claim": "exact duplicates and occupied postponed slots stop before photo-save dispatch",
                  },
                  {
                      "stages": ["after_dispatch_before_response"],
                      "test_id": "tests/test_vk_article_provider.py::test_adapter_preserves_unknown_outcome_and_does_not_retry",
                      "claim": "an ambiguous provider outcome is surfaced once and never replayed",
                  },
                  {
                      "stages": ["during_postflight"],
                      "test_id": "tests/test_vk_article_provider_postflight.py::test_schedule_postflight_mismatch_is_unknown_and_never_replayed",
                      "claim": "a non-exact postponed postflight remains unknown after one photo save and one wall post",
                  },
                  {
                      "stages": ["before_final_commit"],
                      "test_id": "tests/test_vk_article_provider_postflight.py::test_schedule_requires_exact_postflight_before_final_success",
                      "claim": "success is returned only after exact text, date, URL, photo and one-post wall delta verification",
                  },
              ],
          }
          boundaries = proof_register["boundaries"]
          boundaries[:] = [item for item in boundaries if item.get("boundary_id") != boundary["boundary_id"]]
          boundaries.append(boundary)
          proof_path.write_text(
              json.dumps(proof_register, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          for temporary in (
              Path(".github/workflows/finalize-legendary-poet-article-policy.yml"),
              Path(".github/workflows/register-legendary-poet-wall-photo.yml"),
              Path(".github/workflows/format-legendary-poet-article-wave.yml"),
          ):
              temporary.unlink(missing_ok=True)
          PY
          python -m pip install ruff==0.16.1
          ruff format tests/test_vk_article_provider_postflight.py
          git checkout origin/main -- .github/workflows/ci.yml
      - name: Commit exact evidence
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No evidence changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            data/editorial/legendary-poet-article-wave-202608.json \
            docs/operations/mutation-fault-proof-register.json \
            tests/test_vk_article_provider_postflight.py
          git add -u .github/workflows
          git commit -m "Finalize Legendary Poet article policy evidence"
          git push origin HEAD:agent/legendary-poet-article-wave

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade packaging toolchain
        run: python -m pip install --upgrade "pip>=25" "setuptools>=83,<84" wheel
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Validate installed dependency graph
        run: pip check
      - name: Compile Python sources and operational scripts
        run: python -m compileall -q src scripts tests
      - name: Dependency vulnerability gate
        id: pip_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pip-audit --skip-editable --desc on 2>&1 | tee pip-audit.log
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pip-audit-${{ matrix.python-version }}
          path: pip-audit.log
          if-no-files-found: error
      - name: Ruff correctness gate
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check . --output-format=concise 2>&1 | tee ruff.log
      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruff-${{ matrix.python-version }}
          path: ruff.log
          if-no-files-found: error
      - name: Ruff formatting gate
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff format --check . 2>&1 | tee ruff-format.log
      - name: Upload Ruff formatting report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruff-format-${{ matrix.python-version }}
          path: ruff-format.log
          if-no-files-found: error
      - name: Static typing
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy src --show-error-codes 2>&1 | tee mypy.log
      - name: Upload static typing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mypy-${{ matrix.python-version }}
          path: mypy.log
          if-no-files-found: error
      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --cov=video_channel_manager --cov-report=term-missing 2>&1 | tee pytest.log
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest.log
          if-no-files-found: error
      - name: Enforce quality gates
        if: >-
          steps.pip_audit.outcome == 'failure' ||
          steps.ruff.outcome == 'failure' ||
          steps.format.outcome == 'failure' ||
          steps.mypy.outcome == 'failure' ||
          steps.tests.outcome == 'failure'
        run: exit 1

  powershell-windows-51:
    name: PowerShell Windows 5.1
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        shell: powershell
        run: python -m pip install -e .
      - name: Install Pester 5.7.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
      - name: Run operator tests in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $Result = Invoke-Pester -Path tests/powershell -PassThru -Output Detailed
          if ($Result.FailedCount -gt 0) { exit 1 }

  powershell-windows-7:
    name: PowerShell Windows 7
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
