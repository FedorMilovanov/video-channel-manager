      - name: Set up Python 3.11
        if: needs.fast-check.result == 'success' && (needs.fast-check.outputs.docs_only != 'true')
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
