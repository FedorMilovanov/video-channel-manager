name: Wave 6 operational state sync

on:
  push:
    branches: [agent/wave-6-state-sync]
  pull_request:

permissions:
  contents: write

concurrency:
  group: wave6-state-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/wave-6-state-sync
          fetch-depth: 0
      - name: Synchronize audit register and changelog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          register_path = Path("docs/operations/audit-register-2026-08-04.json")
          data = json.loads(register_path.read_text(encoding="utf-8"))
          data["verified_main_head"] = "c4c4d3233ec20b8f939343c5d667d8687d7ff040"
          data["generated_from_baseline"] = "c4c4d3233ec20b8f939343c5d667d8687d7ff040"
          findings = {item["id"]: item for item in data["findings"]}
          findings["F-014"].update({
              "status": "fixed",
              "wave": 6,
              "summary": "PR78 introduces one supported versioned wave engine, classifies all 91 Python scripts, retires 26 direct provider-write executors before dispatch, and confines historical private imports to compatibility adapters.",
              "action": "Retain executor-registry, digest, retirement-guard, schema, replay, and reconciliation regression coverage.",
              "owner_issue": 76,
          })
          findings["F-015"].update({
              "status": "partial",
              "wave": 7,
              "summary": "Waves 1-6 now cover upload crash/replay, project identity, transport retries, wall safety, PowerShell execution, and versioned wave evidence; broader systematic mutation-boundary fault injection remains active.",
              "action": "Issue 80 owns deterministic mutation-boundary, corruption, interrupted-write, and cross-platform process fault coverage.",
              "owner_issue": 80,
          })
          findings["F-024"].update({
              "status": "fixed",
              "summary": "current-state.md, automation-backlog.md, audit register, and changelog are synchronized through Wave 6 code merge c4c4d3233ec20b8f939343c5d667d8687d7ff040; Wave 7 issue 80 is next.",
              "action": "Keep synchronized after every wave and live run.",
              "owner_issue": 64,
          })
          data["wave_issues"]["6"] = 76
          data["wave_issues"]["7"] = 80
          data.update({
              "wave6_status": "completed",
              "wave6_issue": 76,
              "wave6_pr": 78,
              "wave6_merge": "c4c4d3233ec20b8f939343c5d667d8687d7ff040",
              "wave6_ci_run": 30908185487,
              "wave6_tests": "611 passed, 1 xfailed",
              "wave6_pester": "20/20 on Windows PowerShell 5.1, PowerShell 7 Windows, and PowerShell 7 Linux",
              "wave6_provider_writes": 0,
              "wave7_status": "active",
              "wave7_issue": 80,
          })
          register_path.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")

          changelog_path = Path("docs/operations/project-memory-changelog.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          heading = "### Wave 6 completed — stable versioned wave engine"
          if heading not in changelog:
              anchor = "## 2026-08-04\n\n"
              if changelog.count(anchor) != 1:
                  raise SystemExit("Unexpected changelog anchor count")
              entry = """### Wave 6 completed — stable versioned wave engine

- Merged PR #78 as `c4c4d3233ec20b8f939343c5d667d8687d7ff040`.
- Exact-head CI run `30908185487` passed dependency audit, compileall, Ruff, formatting, strict mypy, and full pytest on Python 3.11, 3.12, and 3.13: `611 passed, 1 xfailed`.
- Pester passed `20/20` on Windows PowerShell 5.1, PowerShell 7 on Windows, and PowerShell 7 on Linux.
- Added strict immutable v1 source/plan/apply/result/reconciliation schemas with exact project, snapshot, policy, file, operation-set, and self-digest binding.
- Classified all 91 Python scripts; retired 26 direct provider-write executors before functions, credentials, paths, or provider dispatch.
- Confined historical private cross-script imports to compatibility adapters; the supported engine imports no historical `scripts.*` modules.
- Added atomic per-operation journals, automatic replay prohibition, one-attempt ambiguous mutation semantics, and exact unknown-operation reconciliation.
- Restricted PowerShell provider mutations to the complete Wave 6 `wave apply` contract; no implicit production provider adapter is registered by the CLI.
- No VK or YouTube provider write occurred during implementation or CI.
- Wave 6 issue #76 closed; Wave 7 fault-injection work is owned by issue #80.

"""
              changelog = changelog.replace(anchor, anchor + entry, 1)
              changelog_path.write_text(changelog, encoding="utf-8")
          PY
          python -m json.tool docs/operations/audit-register-2026-08-04.json >/dev/null
          python -m pytest -q tests/test_operational_memory.py tests/test_wave_executor_inventory.py tests/test_wave_engine_contract.py tests/test_wave_engine_cli.py
      - name: Commit synchronized sources and self-cleanup
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/wave6-state-sync-trigger
          git config user.name "Wave 6 State Sync"
          git config user.email "wave6-state-sync@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: synchronize Wave 6 operational state"
          git push origin HEAD:agent/wave-6-state-sync
