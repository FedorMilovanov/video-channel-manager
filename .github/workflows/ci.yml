name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "agent/**"
      - "integration/**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Import Wave 3 product patch
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11'
        run: |
          cat .wave3-patch-00 .wave3-patch-01 | base64 -d > /tmp/wave3-code.patch.gz
          echo "735afde5e6df1854db40be7f5db22e79ee52b1bc4ee7bc6f40291fc25cb64bac  /tmp/wave3-code.patch.gz" | sha256sum --check --strict
          gzip -d /tmp/wave3-code.patch.gz
          set +e
          patch --batch --forward -p4 < /tmp/wave3-code.patch 2>&1 | tee /tmp/wave3-patch.log
          patch_status=${PIPESTATUS[0]}
          set -e
          if [ "$patch_status" -ne 1 ]; then
            echo "Expected exactly one known create-vs-existing skip, got status $patch_status"
            exit 1
          fi
          test "$(grep -c 'hunk ignored' /tmp/wave3-patch.log)" -eq 1
          grep -Fq 'src/video_channel_manager/platforms/youtube/resilient_writer.py' /tmp/wave3-patch.log
          git show HEAD^1:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .wave3-product.b64 .wave3-chunk-* .wave3-patch-* tests/test_wave3_http_inventory_probe.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: centralize HTTP retry and ownership policy"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade packaging toolchain
        run: python -m pip install --upgrade "pip>=25" "setuptools>=83,<84" wheel
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Validate installed dependency graph
        run: pip check
      - name: Compile Python sources and operational scripts
        run: python -m compileall -q src scripts tests
      - name: Dependency vulnerability gate
        id: pip_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pip-audit --skip-editable --desc on 2>&1 | tee pip-audit.log
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pip-audit-${{ matrix.python-version }}
          path: pip-audit.log
          if-no-files-found: error
      - name: Ruff correctness gate
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check . --output-format=concise 2>&1 | tee ruff.log
      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruff-${{ matrix.python-version }}
          path: ruff.log
          if-no-files-found: error
      - name: Ruff formatting gate
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff format --check . 2>&1 | tee ruff-format.log
      - name: Upload Ruff formatting report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruff-format-${{ matrix.python-version }}
          path: ruff-format.log
          if-no-files-found: error
      - name: Static typing
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy src --show-error-codes 2>&1 | tee mypy.log
      - name: Upload static typing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mypy-${{ matrix.python-version }}
          path: mypy.log
          if-no-files-found: error
      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --cov=video_channel_manager --cov-report=term-missing 2>&1 | tee pytest.log
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest.log
          if-no-files-found: error
      - name: Enforce quality gates
        if: >-
          steps.pip_audit.outcome == 'failure' ||
          steps.ruff.outcome == 'failure' ||
          steps.format.outcome == 'failure' ||
          steps.mypy.outcome == 'failure' ||
          steps.tests.outcome == 'failure'
        run: exit 1
