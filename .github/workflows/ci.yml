name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "agent/**"
      - "integration/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Export exact PowerShell surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wave5-inventory/files
          find . -type f -name '*.ps1' -not -path './.git/*' -print | LC_ALL=C sort | sed 's#^./##' > wave5-inventory/paths.txt
          while IFS= read -r path; do
            mkdir -p "wave5-inventory/files/$(dirname "$path")"
            cp "$path" "wave5-inventory/files/$path"
          done < wave5-inventory/paths.txt
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('.')
          paths = [line for line in Path('wave5-inventory/paths.txt').read_text(encoding='utf-8').splitlines() if line]
          records = []
          for raw_path in paths:
              path = root / raw_path
              data = path.read_bytes()
              text = data.decode('utf-8-sig', errors='replace')
              code = '\n'.join(
                  line for line in text.splitlines()
                  if not line.lstrip().startswith('#')
              )
              records.append(
                  {
                      'path': raw_path,
                      'sha256': hashlib.sha256(data).hexdigest(),
                      'size_bytes': len(data),
                      'has_param_block': bool(re.search(r'(?im)^\s*param\s*\(', code)),
                      'python_launch': bool(re.search(r'(?im)(?:^|[\s&])(?:py(?:\.exe)?|python(?:3(?:\.\d+)?)?(?:\.exe)?|video-manager)(?:\s|$)', code)),
                      'nested_powershell': bool(re.search(r'(?im)(?:^|[\s&])(?:pwsh|powershell)(?:\.exe)?(?:\s|$)', code)),
                      'last_write_time_selection': 'LastWriteTime' in code,
                      'user_path_hardcode': bool(re.search(r'(?i)[A-Z]:\\Users\\', code)),
                      'reads_last_exit_code': '$LASTEXITCODE' in code,
                      'provider_write_markers': sorted(
                          marker
                          for marker in (
                              'video.save',
                              'video.delete',
                              'wall.post',
                              'wall.delete',
                              'wall.edit',
                              'upload',
                              'apply',
                              'delete',
                              'publish',
                          )
                          if marker.lower() in code.lower()
                      ),
                      'stdout_parsing_markers': sorted(
                          marker
                          for marker in ('Select-String', '-match', 'regex', 'ConvertFrom-Json')
                          if marker.lower() in code.lower()
                      ),
                  }
              )
          Path('wave5-inventory/inventory.json').write_text(
              json.dumps({'schema_name': 'video-manager.wave5-powershell-inventory', 'schema_version': 1, 'count': len(records), 'records': records}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
      - name: Upload PowerShell inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wave5-powershell-inventory
          path: wave5-inventory
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade packaging toolchain
        run: python -m pip install --upgrade "pip>=25" "setuptools>=83,<84" wheel
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Validate installed dependency graph
        run: pip check
      - name: Compile Python sources and operational scripts
        run: python -m compileall -q src scripts tests
      - name: Dependency vulnerability gate
        id: pip_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pip-audit --skip-editable --desc on 2>&1 | tee pip-audit.log
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pip-audit-${{ matrix.python-version }}
          path: pip-audit.log
          if-no-files-found: error
      - name: Ruff correctness gate
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check . --output-format=concise 2>&1 | tee ruff.log
      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruff-${{ matrix.python-version }}
          path: ruff.log
          if-no-files-found: error
      - name: Ruff formatting gate
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff format --check . 2>&1 | tee ruff-format.log
      - name: Upload Ruff formatting report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruff-format-${{ matrix.python-version }}
          path: ruff-format.log
          if-no-files-found: error
      - name: Static typing
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy src --show-error-codes 2>&1 | tee mypy.log
      - name: Upload static typing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mypy-${{ matrix.python-version }}
          path: mypy.log
          if-no-files-found: error
      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --cov=video_channel_manager --cov-report=term-missing 2>&1 | tee pytest.log
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest.log
          if-no-files-found: error
      - name: Enforce quality gates
        if: >-
          steps.pip_audit.outcome == 'failure' ||
          steps.ruff.outcome == 'failure' ||
          steps.format.outcome == 'failure' ||
          steps.mypy.outcome == 'failure' ||
          steps.tests.outcome == 'failure'
        run: exit 1
