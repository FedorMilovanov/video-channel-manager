name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "agent/**"
      - "integration/**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Make ambiguous VK outcomes non-retryable
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11'
        run: |
          git fetch origin "${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}" --depth=1
          git checkout -B "${GITHUB_HEAD_REF}" "refs/remotes/origin/${GITHUB_HEAD_REF}"
          python -m pip install "ruff<1,>=0.9"
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_text: str, old: str, new: str, *, expected: int = 1) -> None:
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} replacement(s), found {count}: {old!r}")
              path.write_text(text.replace(old, new, expected), encoding="utf-8")

          writer = "src/video_channel_manager/platforms/vk/writer.py"
          replace_exact(
              writer,
              '                method=method,\n                retryable=True,\n                kind=exc.kind,',
              '                method=method,\n                retryable=operation is HttpOperationClass.SAFE_READ,\n                kind=exc.kind,',
          )
          replace_exact(
              writer,
              '                method=method,\n                retryable=kind in {HttpFailureKind.RATE_LIMIT, HttpFailureKind.TRANSIENT_HTTP},',
              '                method=method,\n                retryable=(\n                    operation is HttpOperationClass.SAFE_READ\n                    and kind in {HttpFailureKind.RATE_LIMIT, HttpFailureKind.TRANSIENT_HTTP}\n                ),',
          )
          replace_exact(
              writer,
              '                retryable=code in _RETRYABLE_API_CODES,',
              '                retryable=operation is HttpOperationClass.SAFE_READ and code in _RETRYABLE_API_CODES,',
          )
          replace_exact(
              writer,
              '                method="video.upload",\n                retryable=True,\n                kind=exc.kind,',
              '                method="video.upload",\n                retryable=False,\n                kind=exc.kind,',
          )
          replace_exact(
              writer,
              '                method="video.upload",\n                retryable=kind in {HttpFailureKind.RATE_LIMIT, HttpFailureKind.TRANSIENT_HTTP},',
              '                method="video.upload",\n                retryable=False,',
          )

          thumbnails = "src/video_channel_manager/platforms/vk/thumbnails.py"
          replace_exact(
              thumbnails,
              '                method=method,\n                retryable=True,\n                kind=exc.kind,',
              '                method=method,\n                retryable=operation is HttpOperationClass.SAFE_READ,\n                kind=exc.kind,',
          )
          replace_exact(
              thumbnails,
              '                method=method,\n                retryable=kind is HttpFailureKind.TRANSIENT_HTTP,',
              '                method=method,\n                retryable=(\n                    operation is HttpOperationClass.SAFE_READ\n                    and kind in {HttpFailureKind.RATE_LIMIT, HttpFailureKind.TRANSIENT_HTTP}\n                ),',
          )
          replace_exact(
              thumbnails,
              '                retryable=code in _RETRYABLE_API_CODES,',
              '                retryable=operation is HttpOperationClass.SAFE_READ and code in _RETRYABLE_API_CODES,',
          )
          replace_exact(
              thumbnails,
              '                method="video.thumbUpload",\n                retryable=True,\n                kind=exc.kind,',
              '                method="video.thumbUpload",\n                retryable=False,\n                kind=exc.kind,',
          )
          replace_exact(
              thumbnails,
              '                method="video.thumbUpload",\n                retryable=kind is HttpFailureKind.TRANSIENT_HTTP,',
              '                method="video.thumbUpload",\n                retryable=False,',
          )

          writer_tests = "tests/test_vk_writer.py"
          replace_exact(
              writer_tests,
              '    assert error.value.retryable is True\n    assert calls == 1',
              '    assert error.value.retryable is False\n    assert calls == 1',
          )
          replace_exact(
              writer_tests,
              '    assert captured.value.attempts == 1\n    assert "upload.example" not in str(captured.value)\n    assert calls == 1',
              '    assert captured.value.attempts == 1\n    assert captured.value.retryable is False\n    assert "upload.example" not in str(captured.value)\n    assert calls == 1',
          )

          thumb_tests = "tests/test_vk_thumbnail_transport_policy.py"
          replace_exact(
              thumb_tests,
              '    assert captured.value.attempts == 1\n    assert captured.value.kind is HttpFailureKind.TRANSPORT\n    assert "upload.example" not in str(captured.value)',
              '    assert captured.value.attempts == 1\n    assert captured.value.retryable is False\n    assert captured.value.kind is HttpFailureKind.TRANSPORT\n    assert "upload.example" not in str(captured.value)',
          )
          replace_exact(
              thumb_tests,
              '    assert captured.value.attempts == 1\n    assert captured.value.kind is HttpFailureKind.PROVIDER_TRANSIENT',
              '    assert captured.value.attempts == 1\n    assert captured.value.retryable is False\n    assert captured.value.kind is HttpFailureKind.PROVIDER_TRANSIENT',
          )
          PY
          ruff format \
            src/video_channel_manager/platforms/vk/writer.py \
            src/video_channel_manager/platforms/vk/thumbnails.py \
            tests/test_vk_writer.py \
            tests/test_vk_thumbnail_transport_policy.py
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n', 1)
          start = text.index('      - name: Make ambiguous VK outcomes non-retryable\n')
          end = text.index('      - name: Set up Python\n', start)
          path.write_text(text[:start] + text[end:], encoding='utf-8')
          PY
          ! grep -Fq 'Make ambiguous VK outcomes non-retryable' .github/workflows/ci.yml
          ! grep -Fq 'contents: write' .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make ambiguous VK outcomes non-retryable"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade packaging toolchain
        run: python -m pip install --upgrade "pip>=25" "setuptools>=83,<84" wheel
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Validate installed dependency graph
        run: pip check
      - name: Compile Python sources and operational scripts
        run: python -m compileall -q src scripts tests
      - name: Dependency vulnerability gate
        id: pip_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pip-audit --skip-editable --desc on 2>&1 | tee pip-audit.log
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pip-audit-${{ matrix.python-version }}
          path: pip-audit.log
          if-no-files-found: error
      - name: Ruff correctness gate
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check . --output-format=concise 2>&1 | tee ruff.log
      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruff-${{ matrix.python-version }}
          path: ruff.log
          if-no-files-found: error
      - name: Ruff formatting gate
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff format --check . 2>&1 | tee ruff-format.log
      - name: Upload Ruff formatting report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruff-format-${{ matrix.python-version }}
          path: ruff-format.log
          if-no-files-found: error
      - name: Static typing
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy src --show-error-codes 2>&1 | tee mypy.log
      - name: Upload static typing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mypy-${{ matrix.python-version }}
          path: mypy.log
          if-no-files-found: error
      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --cov=video_channel_manager --cov-report=term-missing 2>&1 | tee pytest.log
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest.log
          if-no-files-found: error
      - name: Enforce quality gates
        if: >-
          steps.pip_audit.outcome == 'failure' ||
          steps.ruff.outcome == 'failure' ||
          steps.format.outcome == 'failure' ||
          steps.mypy.outcome == 'failure' ||
          steps.tests.outcome == 'failure'
        run: exit 1
