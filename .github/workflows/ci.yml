name: Wave 5 state synchronization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/wave-5-state-sync
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Synchronize Wave 5 register and changelog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          register_path = Path("docs/operations/audit-register-2026-08-04.json")
          register = json.loads(register_path.read_text(encoding="utf-8"))
          register["verified_main_head"] = "1a62779293a404e4654b6230644dfc78e9b20dc1"
          findings = {item["id"]: item for item in register["findings"]}
          findings["F-013"].update(
              status="fixed",
              summary=(
                  "PR75 replaces the fragmented supported PowerShell surface with one manifest-driven operator, "
                  "classifies 23 production wrappers plus the Pester test file, and makes 19 historical provider-write "
                  "wrappers fail closed before credentials or child execution."
              ),
              action=(
                  "Retain canonical wrapper-digest inventory, exact request/manifest/type/project tests, atomic evidence, "
                  "native exit-code, CI-apply prohibition, and Windows PowerShell 5.1/PowerShell 7 coverage."
              ),
              owner_issue=72,
          )
          findings["F-014"].update(
              status="confirmed-current",
              summary=(
                  "Wave 5 retires provider-write PowerShell wrappers, but multiple Python V1/V2/V3/current wave generations, "
                  "private cross-script imports, and divergent plan/result schemas remain."
              ),
              action="Issue 76 owns the exact generation inventory and one stable versioned wave engine.",
              owner_issue=76,
          )
          findings["F-015"].update(
              summary=(
                  "Waves 1-4 cover upload/project/transport/wall boundaries; Wave 5 adds static PowerShell inventory and "
                  "17 Pester tests on Windows PowerShell 5.1 and PowerShell 7. Broader Python generation and engine fault "
                  "coverage remains Wave 6/7 work."
              ),
              action="Expand risk-based engine and CLI coverage without weakening Waves 1-5 matrices.",
          )
          findings["F-022"].update(
              summary=(
                  "Issues 31/32/37/38 remain open. Waves 1-5 prevent blind upload replay, project bypass, mutation retry, "
                  "silent wall publication and legacy PowerShell execution, but do not establish historical live queue outcomes."
              ),
              action=(
                  "Reconcile exact IDs, local ledgers and fresh published+postponed wall evidence only after the stable "
                  "Wave 6 engine and the supported Wave 5 operator."
              ),
          )
          findings["F-024"].update(
              summary=(
                  "current-state.md and automation-backlog.md are synchronized through Wave 5 merge "
                  "1a62779293a404e4654b6230644dfc78e9b20dc1; Wave 6 issue 76 is next."
              ),
              action="Keep synchronized after every wave and live run.",
          )

          register["wave_issues"]["6"] = 76
          register.update(
              wave5_status="completed",
              wave5_issue=72,
              wave5_pr=75,
              wave5_merge="1a62779293a404e4654b6230644dfc78e9b20dc1",
              wave5_ci_run=30900532613,
              wave5_python_tests="591 passed, 1 xfailed",
              wave5_pester_tests="17 passed on Windows PowerShell 5.1, PowerShell 7 Windows, PowerShell 7 Linux",
              wave5_provider_writes=0,
              wave5_state_sync_pr=77,
              wave6_status="active",
              wave6_issue=76,
          )
          register_path.write_text(
              json.dumps(register, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          changelog_path = Path("docs/operations/project-memory-changelog.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          anchor = "## 2026-08-04\n\n"
          entry = """### Wave 5 completed — reliable Windows/PowerShell operator layer

          - Merged PR #75 as `1a62779293a404e4654b6230644dfc78e9b20dc1`.
          - Exact-head CI run `30900532613` passed dependency audit, compileall, Ruff, formatting, strict mypy, and full pytest on Python 3.11, 3.12, and 3.13: `591 passed, 1 xfailed`.
          - Pester passed `17/17` on Windows PowerShell 5.1, PowerShell 7 on Windows, and PowerShell 7 on Linux.
          - Classified 23 production `.ps1` files as 1 supported, 3 compatibility-only, and 19 retired; the Pester test file is separately bound as test-only.
          - Added canonical UTF-8/LF wrapper digests stable across Windows CRLF and Linux LF checkouts.
          - Historical provider-write wrappers now stop before credentials, hard-coded paths, nested shells, or child execution.
          - Added one supported manifest-driven operator with exact request/manifest SHA-256, exact project/community/owner/snapshot/count confirmations, strict JSON types, output-collision rejection, and safe-read CLI allowlisting.
          - Added one Python 3.11/3.12/3.13 resolver, native exit-code evidence, UTF-8 without BOM, and atomic JSON replacement.
          - Apply remains impossible in CI and requires `ambiguous_mutation`, a positive operation count, and `-EnableProviderWrites` outside CI.
          - Nonzero ambiguous mutations remain `unknown_requires_reconciliation`, non-retry-safe, and never auto-replayed.
          - No VK or YouTube provider write occurred during implementation or CI.
          - Wave 5 issue #72 closed; Wave 6 stable engine work is owned by issue #76.

          """.replace("          ", "")
          if changelog.count(anchor) != 1:
              raise SystemExit("Expected exactly one 2026-08-04 changelog anchor")
          changelog_path.write_text(
              changelog.replace(anchor, anchor + entry, 1),
              encoding="utf-8",
              newline="\n",
          )
          PY
          python -m json.tool docs/operations/audit-register-2026-08-04.json >/dev/null
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wave 5: synchronize audit register and changelog"
          git push origin HEAD:agent/wave-5-state-sync
