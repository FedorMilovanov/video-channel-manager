name: Wave 6 verified stable-engine apply

on:
  push:
    branches:
      - agent/wave-6-stable-engine
  pull_request:

permissions:
  contents: write

concurrency:
  group: wave6-verified-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/wave-6-stable-engine
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Assemble and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/wave6-patch -maxdepth 1 -type f -name 'chunk-*' | wc -l)" -eq 10
          cat .github/wave6-patch/chunk-* > /tmp/wave6-production.patch.gz.b64
          echo "8bbcf5c2911bab6792efdbf7fbd0b4702c6cebff10d9e777bcbdc96ee609e174  /tmp/wave6-production.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/wave6-production.patch.gz.b64 | gzip -d > /tmp/wave6-production.patch
          echo "b4833a04115e2af8b527348b7fc3307a94e764e429060381f3b3e6518cb21523  /tmp/wave6-production.patch" | sha256sum -c -
          git apply --check /tmp/wave6-production.patch
          git apply /tmp/wave6-production.patch
      - name: Install project and verify Python gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip>=25" "setuptools>=83,<84" wheel
          python -m pip install -e ".[dev]"
          ruff format \
            src/video_channel_manager/wave_engine \
            scripts/wave_engine.py \
            tests/test_wave_engine_contract.py \
            tests/test_wave_executor_inventory.py
          ruff check tests/test_wave_engine_contract.py --fix
          ruff format \
            src/video_channel_manager/wave_engine \
            scripts/wave_engine.py \
            tests/test_wave_engine_contract.py \
            tests/test_wave_executor_inventory.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def canonical_sha(path: Path) -> str:
              text = path.read_text(encoding="utf-8").replace("\r\n", "\n").replace("\r", "\n")
              return hashlib.sha256(text.encode("utf-8")).hexdigest()

          registry_path = Path("scripts/wave-executors.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          for entry in registry["executors"]:
              entry["sha256"] = canonical_sha(Path(entry["path"]))
          registry_path.write_text(
              json.dumps(registry, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          powershell_path = Path("scripts/operator/powershell-wrappers.json")
          powershell = json.loads(powershell_path.read_text(encoding="utf-8"))
          for section in ("wrappers", "test_files"):
              for entry in powershell[section]:
                  entry["sha256"] = canonical_sha(Path(entry["path"]))
          powershell_path.write_text(
              json.dumps(powershell, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          pip check
          ruff check .
          ruff format --check .
          mypy src --show-error-codes
          python -m compileall -q src scripts tests
          python -m pytest -q
      - name: Install and run Pester 5.7.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $Result = Invoke-Pester -Path tests/powershell -PassThru -Output Detailed
          if ($Result.FailedCount -gt 0) { exit 1 }
      - name: Commit verified production code and self-cleanup
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
          rm -rf .github/wave6-patch
          rm -f \
            .github/wave6-production.patch.gz.b64 \
            .github/wave6-apply-trigger \
            .github/workflows/wave6-apply.yml
          git config user.name "Wave 6 Engine"
          git config user.email "wave6-engine@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add stable versioned wave engine"
          git push origin HEAD:agent/wave-6-stable-engine
