name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Ruff correctness gate
        run: ruff check .
      - name: Ruff formatting diagnostic
        run: ruff format --check .
        continue-on-error: true
      - name: Static typing
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy src --show-error-codes 2>&1 | tee mypy.log
      - name: Upload static typing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-${{ matrix.python-version }}
          path: mypy.log
          if-no-files-found: error
      - name: Enforce static typing
        if: steps.mypy.outcome == 'failure'
        run: exit 1
      - name: Tests
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest --cov=video_channel_manager --cov-report=term-missing 2>&1 | tee pytest.log
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest.log
          if-no-files-found: error
      - name: Enforce tests
        if: steps.pytest.outcome == 'failure'
        run: exit 1
