name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "agent/**"
      - "integration/**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade packaging toolchain
        run: python -m pip install --upgrade "pip>=25" "setuptools>=83,<84" wheel
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Validate installed dependency graph
        run: pip check
      - name: Compile Python sources and operational scripts
        run: python -m compileall -q src scripts tests
      - name: Dependency vulnerability gate
        id: pip_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pip-audit --desc on 2>&1 | tee pip-audit.log
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pip-audit-${{ matrix.python-version }}
          path: pip-audit.log
          if-no-files-found: error
      - name: Ruff correctness gate
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check . --output-format=concise 2>&1 | tee ruff.log
      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruff-${{ matrix.python-version }}
          path: ruff.log
          if-no-files-found: error
      - name: Ruff formatting gate
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff format --check . 2>&1 | tee ruff-format.log
      - name: Upload Ruff formatting report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruff-format-${{ matrix.python-version }}
          path: ruff-format.log
          if-no-files-found: error
      - name: Static typing
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy src --show-error-codes 2>&1 | tee mypy.log
      - name: Upload static typing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mypy-${{ matrix.python-version }}
          path: mypy.log
          if-no-files-found: error
      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest --cov=video_channel_manager --cov-report=term-missing 2>&1 | tee pytest.log
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest.log
          if-no-files-found: error
      - name: Enforce quality gates
        if: >-
          steps.pip_audit.outcome == 'failure' ||
          steps.ruff.outcome == 'failure' ||
          steps.format.outcome == 'failure' ||
          steps.mypy.outcome == 'failure' ||
          steps.tests.outcome == 'failure'
        run: exit 1

  finalize-vk-publishing:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/integration/youtube-vk-unified-v2' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: integration/youtube-vk-unified-v2
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade "pip>=25" "setuptools>=83,<84" wheel
          pip install -e ".[dev]"
      - name: Apply exact runtime and typing fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          apply_path = Path("scripts/apply_vk_catalog_plan.py")
          apply_text = apply_path.read_text(encoding="utf-8")
          marker = "import argparse\nimport json\n"
          replacement = "import argparse\nimport json\nfrom collections import Counter\n"
          if "from collections import Counter" not in apply_text:
              if marker not in apply_text:
                  raise SystemExit("Cannot find Counter import insertion point")
              apply_text = apply_text.replace(marker, replacement, 1)
              apply_path.write_text(apply_text, encoding="utf-8")

          catalog_path = Path("src/video_channel_manager/platforms/vk/catalog.py")
          catalog_text = catalog_path.read_text(encoding="utf-8")
          old_catalog = (
              "        source_collection = source_collections.get(source_collection_id)\n"
              "        if source_collection is None or source_collection_id not in collection_targets:\n"
              "            continue\n"
              "        target_collection_id = collection_targets[source_collection_id]\n"
          )
          new_catalog = (
              "        membership_collection = source_collections.get(source_collection_id)\n"
              "        if membership_collection is None or source_collection_id not in collection_targets:\n"
              "            continue\n"
              "        target_collection_id = collection_targets[source_collection_id]\n"
          )
          if old_catalog not in catalog_text:
              raise SystemExit("Cannot find catalog type-fix block")
          catalog_text = catalog_text.replace(old_catalog, new_catalog, 1)
          old_album_title = '"album_title": canonical_vk_text(source_collection.title),'
          new_album_title = '"album_title": canonical_vk_text(membership_collection.title),'
          if old_album_title not in catalog_text:
              raise SystemExit("Cannot find catalog album-title type-fix line")
          catalog_text = catalog_text.replace(old_album_title, new_album_title, 1)
          catalog_path.write_text(catalog_text, encoding="utf-8")

          wall_path = Path("src/video_channel_manager/platforms/vk/wall.py")
          wall_text = wall_path.read_text(encoding="utf-8")
          old_wall = 'post_ids = sorted(item.get("id") for item in duplicates if isinstance(item.get("id"), int))'
          new_wall = 'post_ids = sorted(int(item["id"]) for item in duplicates if isinstance(item.get("id"), int))'
          if old_wall not in wall_text:
              raise SystemExit("Cannot find wall post-ID type-fix line")
          wall_path.write_text(wall_text.replace(old_wall, new_wall, 1), encoding="utf-8")
          PY
      - name: Format and validate
        run: |
          ruff format .
          ruff format --check .
          ruff check .
          mypy src
          pytest
          git diff --check
      - name: Restore permanent CI and remove one-shot workflow
        run: |
          git show 1a519deef135a58063e5a57f2195e81340d5ab06:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/finalize-vk-publishing-once.yml
      - name: Commit validated publishing contour
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize guarded VK catalog and wall publishing"
          git push origin HEAD:integration/youtube-vk-unified-v2
