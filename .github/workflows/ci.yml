name: Wave 4 register synchronization

on:
  push:
    branches:
      - agent/wave-4-register-sync

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/wave-4-register-sync
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Synchronize Wave 4 register and changelog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          register_path = Path("docs/operations/audit-register-2026-08-04.json")
          register = json.loads(register_path.read_text(encoding="utf-8"))
          register["verified_main_head"] = "3bf01aec2f0d17133f0ec5821f88d63ec92373bb"

          findings = {item["id"]: item for item in register["findings"]}
          findings["F-011"].update(
              status="fixed",
              summary=(
                  "PR71 binds one immutable self-digested upload wall policy to every supported reservation and "
                  "explicitly sends wallpost=0, auto_publish=0 and repeat=0. Missing-policy migration is allowed "
                  "only before provider dispatch and recomputes operation identity/evidence."
              ),
              action="Retain explicit-flag, policy-tamper, pre-dispatch migration and provider-dispatched rejection tests.",
          )
          findings["F-012"].update(
              status="fixed",
              summary=(
                  "PR71 separates upload from wall publication, binds complete published+postponed baseline evidence "
                  "to upload operations, requires a clean postflight before verified, and makes postponed publication "
                  "the only supported default wall-write route."
              ),
              action=(
                  "Retain snapshot completeness, delta, duplicate/schedule collision and ambiguous wall.post "
                  "reconciliation coverage; live historical cleanup remains issue 37 only."
              ),
          )
          findings["F-013"].update(
              status="confirmed-current",
              summary=(
                  "Wave 5 baseline confirms historical PowerShell/operator fragmentation remains after Waves 0-4: "
                  "divergent interpreter selection, path handling, encodings, artifact discovery, confirmations, "
                  "stdout parsing and exit-code behavior require one supported contract."
              ),
              action="Issue 72 owns the exact wrapper inventory and consolidated fail-closed operator layer.",
              owner_issue=72,
          )
          findings["F-022"].update(
              summary=(
                  "Issues 31/32/37/38 remain open. Waves 1-4 now prevent blind upload replay, project bypass, "
                  "transport-level mutation retry and silent upload-side wall publication, but do not establish "
                  "historical live queue or wall outcomes."
              ),
              action="Reconcile exact IDs, local ledgers and fresh published+postponed wall evidence after operator gates.",
          )
          findings["F-024"].update(
              summary=(
                  "current-state.md and automation-backlog.md are synchronized through Wave 4 code merge "
                  "d85f7cf94b8ba0b30947291b3a08491239438843 and state-sync merge "
                  "3bf01aec2f0d17133f0ec5821f88d63ec92373bb; Wave 5 issue 72 is next."
              ),
              action="Keep synchronized after every wave and live run.",
          )

          register["wave_issues"]["5"] = 72
          register.update(
              wave4_status="completed",
              wave4_issue=36,
              wave4_pr=71,
              wave4_merge="d85f7cf94b8ba0b30947291b3a08491239438843",
              wave4_ci_run=30895905586,
              wave4_tests="586 passed, 1 xfailed",
              wave4_provider_writes=0,
              wave4_state_sync_pr=73,
              wave4_state_sync_merge="3bf01aec2f0d17133f0ec5821f88d63ec92373bb",
              wave5_status="active",
              wave5_issue=72,
          )
          register_path.write_text(
              json.dumps(register, ensure_ascii=False, sort_keys=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          changelog_path = Path("docs/operations/project-memory-changelog.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          old = '''### Wave 4 provider-contract correction and activation

          - Issue #36 is the authoritative Wave 4 contract.
          - `wallpost=0` remains the proven mandatory upload-side wall control.
          - `repeat` is not used as wall safety because it describes video playback looping in the available SDK schemas.
          - `auto_publish` is not treated as verified current primary-contract evidence and is not mandated blindly.
          - Required future safety is a versioned `wall_mutation_authorized=false` upload contract, bound published+postponed before-snapshot, mandatory postflight delta, and a separate postponed-only publication path.
          - Immediate publication requires a separate immutable reviewed exception.
          - Issue #37 remains the only owner of its exact cleanup scope; Wave 4 authorizes no live cleanup.

          '''.replace("          ", "")
          new = '''### Wave 4 completed — fail-closed upload/wall separation

          - Merged PR #71 as `d85f7cf94b8ba0b30947291b3a08491239438843`.
          - Merged living-state synchronization PR #73 as `3bf01aec2f0d17133f0ec5821f88d63ec92373bb`.
          - Exact-head CI run `30895905586` passed dependency audit, compileall, Ruff, formatting, strict mypy, and full pytest on Python 3.11, 3.12, and 3.13: `586 passed, 1 xfailed`.
          - Added immutable self-digested `wall_mutation_authorized=false` upload policy.
          - Every supported `video.save` now sends `wallpost=0`, `auto_publish=0`, and `repeat=0` explicitly.
          - Missing-policy journal migration is allowed only before provider dispatch and recomputes operation identity and initial evidence.
          - Provider-dispatched historical journals without the policy fail closed and require reconciliation.
          - Upload batches bind complete published+postponed wall baseline evidence and require a clean postflight delta before `verified`.
          - Postponed publication is the only supported default wall-write path, with exact future `publish_date`, deterministic `guid`, duplicate/schedule collision checks, and one-attempt ambiguous-response reconciliation.
          - Unexpected wall objects are classified but never automatically deleted; issue #37 remains the only owner of its exact cleanup scope.
          - No VK or YouTube provider write occurred during implementation or CI.
          - Wave 4 issue #36 closed; Wave 5 operator-layer work is owned by issue #72.

          '''.replace("          ", "")
          if changelog.count(old) != 1:
              raise SystemExit("Expected exactly one Wave 4 activation block")
          changelog_path.write_text(changelog.replace(old, new), encoding="utf-8", newline="\n")
          PY
          python -m json.tool docs/operations/audit-register-2026-08-04.json >/dev/null
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/wave4-register-sync-trigger
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wave 4: synchronize audit register and changelog"
          git push origin HEAD:agent/wave-4-register-sync
