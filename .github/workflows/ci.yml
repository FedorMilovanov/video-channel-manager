name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade packaging toolchain
        run: python -m pip install --upgrade "pip>=25" "setuptools>=83,<84" wheel
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Validate installed dependency graph
        run: pip check
      - name: Compile Python sources and operational scripts
        run: python -m compileall -q src scripts tests
      - name: Dependency vulnerability gate
        id: pip_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pip-audit --skip-editable --desc on 2>&1 | tee pip-audit.log
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pip-audit-${{ matrix.python-version }}
          path: pip-audit.log
          if-no-files-found: error
      - name: Ruff correctness gate
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check . --output-format=concise 2>&1 | tee ruff.log
      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruff-${{ matrix.python-version }}
          path: ruff.log
          if-no-files-found: error
      - name: Ruff formatting gate
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff format --check . 2>&1 | tee ruff-format.log
      - name: Upload Ruff formatting report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruff-format-${{ matrix.python-version }}
          path: ruff-format.log
          if-no-files-found: error
      - name: Static typing
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy src --show-error-codes 2>&1 | tee mypy.log
      - name: Upload static typing report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mypy-${{ matrix.python-version }}
          path: mypy.log
          if-no-files-found: error
      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --cov=video_channel_manager --cov-report=term-missing 2>&1 | tee pytest.log
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest.log
          if-no-files-found: error
      - name: Enforce quality gates
        if: >-
          steps.pip_audit.outcome == 'failure' ||
          steps.ruff.outcome == 'failure' ||
          steps.format.outcome == 'failure' ||
          steps.mypy.outcome == 'failure' ||
          steps.tests.outcome == 'failure'
        run: exit 1

  powershell-windows-51:
    name: PowerShell Windows 5.1
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        shell: powershell
        run: python -m pip install -e .
      - name: Install Pester 5.7.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
      - name: Run operator tests in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $Result = Invoke-Pester -Path tests/powershell -PassThru -Output Detailed
          if ($Result.FailedCount -gt 0) { exit 1 }

  powershell-windows-7:
    name: PowerShell Windows 7
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        shell: pwsh
        run: python -m pip install -e .
      - name: Install Pester 5.7.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
      - name: Run operator tests in PowerShell 7 on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $Result = Invoke-Pester -Path tests/powershell -PassThru -Output Detailed
          if ($Result.FailedCount -gt 0) { exit 1 }

  powershell-linux-7:
    name: PowerShell Linux 7
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        shell: pwsh
        run: python -m pip install -e .
      - name: Install Pester 5.7.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
      - name: Run operator tests in PowerShell 7 on Linux
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $Result = Invoke-Pester -Path tests/powershell -PassThru -Output Detailed
          if ($Result.FailedCount -gt 0) { exit 1 }
