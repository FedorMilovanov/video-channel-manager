name: Svodka one-time consolidation and quality gate

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/svodka-consolidate-once.yml

permissions:
  contents: write

concurrency:
  group: svodka-consolidate-once
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PROFILE_PATH: content/telegram/channels/svodka.json
      BINDING_PATH: content/telegram/channels/svodka-target-binding.json
      QUEUE_PATH: content/telegram/svodka/draft-14-posts-2026-08.json
      CANDIDATE_PATH: content/telegram/svodka/review-candidate-2026-08.json
      PROOF_PATH: .runtime/svodka-consolidation-target-proof.json
      EXPECTED_CHAT_ID: -1003527567039
      EXPECTED_BOT_ID: 8716602202
      EXPECTED_BOT_USERNAME: preaching_mp3_bot
    steps:
      - name: Check out exact main head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install repository dev runtime
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check -e ".[dev]" 2>&1 | tee /tmp/install.log

      - name: Apply source wording and runtime safety patches
        id: edit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/edit.log
          import json
          import os
          from pathlib import Path

          queue_path = Path(os.environ["QUEUE_PATH"])
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          posts = {post["publication_id"]: post for post in queue["posts"]}

          goldfish = posts["svodka-goldfish-three-second-memory-myth"]
          old_goldfish = "В другом эксперименте рыб обучали сложным задачам различения десятки дней — их результат устойчиво рос значительно выше случайного угадывания."
          new_goldfish = "В другом эксперименте золотые рыбки освоили условные задачи различения, где правильный выбор зависел от показанного образца. Это демонстрирует реальное обучение, а не трёхсекундный «сброс» памяти."
          if old_goldfish in goldfish["html_text"]:
              goldfish["html_text"] = goldfish["html_text"].replace(old_goldfish, new_goldfish)
          elif new_goldfish not in goldfish["html_text"]:
              raise SystemExit("goldfish wording is neither expected old nor reviewed new text")

          eclipse = posts["svodka-2026-august-total-solar-eclipse"]
          old_eclipse = "Уже в среду полоса полной фазы пройдёт через <b>Гренландию, Исландию и Испанию</b>."
          new_eclipse = "Уже в среду полоса полной фазы пройдёт через <b>север России, Гренландию, Исландию, Испанию и небольшой участок Португалии</b>. Во многих других районах Европы будет видна частичная фаза."
          if old_eclipse in eclipse["html_text"]:
              eclipse["html_text"] = eclipse["html_text"].replace(old_eclipse, new_eclipse)
          elif new_eclipse not in eclipse["html_text"]:
              raise SystemExit("eclipse wording is neither expected old nor reviewed new text")
          eclipse["sources"][0]["evidence"] = (
              "NASA's 2026 eclipse material places totality across Russia, Greenland, Iceland, Spain and Portugal and describes NASA-funded jet and balloon science during the eclipse."
          )

          crow = posts["svodka-crows-remember-human-faces"]
          crow["title"] = "Американские вороны помнят опасное лицо годами"
          crow["html_text"] = (
              "- Сводка -\n\n"
              "🧠🐦 <b>АМЕРИКАНСКИЕ ВОРОНЫ ПОМНЯТ ОПАСНОЕ ЧЕЛОВЕЧЕСКОЕ ЛИЦО — ГОДАМИ</b>\n\n"
              "В полевом эксперименте исследователи надевали одну и ту же необычную маску, когда ловили и кольцевали диких американских ворон в нескольких точках возле Сиэтла.\n\n"
              "После этого птицы значительно чаще ругали и атаковали людей именно в «опасной» маске. Узнавание сохранялось <b>как минимум 2,7 года</b>, несмотря на различия в росте, возрасте, поле и походке людей под маской.\n\n"
              "Это не означает, что каждая ворона хранит любое человеческое лицо навсегда. Но эксперимент показывает долговременное распознавание конкретного угрожающего визуального сигнала в дикой природе.\n\n"
              "📎 <a href=\"https://www.sciencedirect.com/science/article/pii/S0003347209005806\">Animal Behaviour, 2010 — оригинальное исследование</a>\n\n"
              "#Сводка #Вороны #Птицы #Память #Поведение #Наука"
          )
          crow["sources"] = [
              {
                  "url": "https://www.sciencedirect.com/science/article/pii/S0003347209005806",
                  "label": "Animal Behaviour, 2010 — original study",
                  "verified_on": "2026-08-08",
                  "evidence": "Field experiment showed wild American crows learned a threatening mask and continued to recognize and scold it for at least 2.7 years; wording is limited to the tested threatening-face paradigm.",
              }
          ]

          banana = posts["svodka-quiz-banana-botanical-berry"]
          banana["html_text"] = banana["html_text"].replace(
              "https://powo.science.kew.org/taxon/urn:lsid:ipni.org:names:584951-1/general-information",
              "https://www.kew.org/plants/cavendish-banana",
          ).replace(
              "Kew Plants of the World Online — Musa",
              "Kew Gardens — Cavendish banana",
          )
          banana["sources"] = [
              {
                  "url": "https://www.kew.org/plants/cavendish-banana",
                  "label": "Kew Gardens — Cavendish banana",
                  "verified_on": "2026-08-08",
                  "evidence": "Kew explicitly states that Cavendish banana fruits are botanically classified as berries and explains the single-flower/single-ovary berry criterion.",
              }
          ]

          queue_path.write_text(json.dumps(queue, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          runtime_path = Path("src/video_channel_manager/telegram_multichannel_cli.py")
          runtime = runtime_path.read_text(encoding="utf-8")
          old = "    token = _token(profile)\n\n    try:\n        if isinstance(item.payload, GenericMessagePayload):"
          new = "    try:\n        token = _token(profile)\n        if isinstance(item.payload, GenericMessagePayload):"
          if old in runtime:
              runtime = runtime.replace(old, new, 1)
          elif new not in runtime:
              raise SystemExit("generic runtime token placement is unexpected")
          runtime_path.write_text(runtime, encoding="utf-8")
          PY

      - name: Refresh exact target proof read-only
        id: discovery
        continue-on-error: true
        env:
          SVODKA_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .runtime
          python -m video_channel_manager.telegram_channel_cli discover-target \
            --profile "$PROFILE_PATH" \
            --expected-bot-id "$EXPECTED_BOT_ID" \
            --expected-bot-username "$EXPECTED_BOT_USERNAME" \
            --output "$PROOF_PATH" 2>&1 | tee /tmp/discovery.log
          python - <<'PY' 2>&1 | tee -a /tmp/discovery.log
          import json
          import os
          from pathlib import Path

          proof = json.loads(Path(os.environ["PROOF_PATH"]).read_text(encoding="utf-8"))
          if proof["chat_id"] != int(os.environ["EXPECTED_CHAT_ID"]):
              raise SystemExit("Telegram rediscovery returned unexpected numeric channel id")
          if proof["chat_username"].casefold() != "deep_info_life":
              raise SystemExit("Telegram rediscovery returned unexpected public channel username")
          if proof["bot_id"] != int(os.environ["EXPECTED_BOT_ID"]):
              raise SystemExit("Telegram rediscovery returned unexpected bot id")
          if proof["bot_username"].casefold() != os.environ["EXPECTED_BOT_USERNAME"].casefold():
              raise SystemExit("Telegram rediscovery returned unexpected bot username")
          if proof["can_post_messages"] is not True:
              raise SystemExit("Telegram bot no longer has can_post_messages")

          binding = {
              "schema_name": "video-channel-manager.telegram-target-binding",
              "schema_version": 1,
              "project_key": proof["project_key"],
              "channel_username": proof["channel_username"],
              "profile_sha256": proof["profile_sha256"],
              "chat_id": proof["chat_id"],
              "chat_username": proof["chat_username"],
              "bot_id": proof["bot_id"],
              "bot_username": proof["bot_username"],
              "can_post_messages": True,
              "discovered_at_utc": proof["checked_at_utc"],
              "discovery_method": "getMe + getChat(@username) + getChat(numeric id) + getChatAdministrators",
              "provider_write_performed": False,
          }
          Path(os.environ["BINDING_PATH"]).write_text(
              json.dumps(binding, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Ruff format additive multi-channel code
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff format \
            src/video_channel_manager/telegram_channel_profile.py \
            src/video_channel_manager/telegram_channel_discovery.py \
            src/video_channel_manager/telegram_channel_cli.py \
            src/video_channel_manager/telegram_target_binding.py \
            src/video_channel_manager/telegram_multichannel_release.py \
            src/video_channel_manager/telegram_multichannel_state.py \
            src/video_channel_manager/telegram_multichannel_transport.py \
            src/video_channel_manager/telegram_multichannel_outcome.py \
            src/video_channel_manager/telegram_multichannel_cli.py \
            src/video_channel_manager/svodka_queue.py \
            src/video_channel_manager/svodka_release.py \
            tests/test_telegram_channel_profile_contract.py \
            tests/test_telegram_channel_cli.py \
            tests/test_telegram_target_binding.py \
            tests/test_telegram_multichannel_release.py \
            tests/test_telegram_multichannel_state.py \
            tests/test_telegram_multichannel_outcome.py \
            tests/test_svodka_release_review.py \
            tests/test_svodka_preflight_workflow.py \
            2>&1 | tee /tmp/format.log

      - name: Ruff correctness gate
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check \
            src/video_channel_manager/telegram_channel_profile.py \
            src/video_channel_manager/telegram_channel_discovery.py \
            src/video_channel_manager/telegram_channel_cli.py \
            src/video_channel_manager/telegram_target_binding.py \
            src/video_channel_manager/telegram_multichannel_release.py \
            src/video_channel_manager/telegram_multichannel_state.py \
            src/video_channel_manager/telegram_multichannel_transport.py \
            src/video_channel_manager/telegram_multichannel_outcome.py \
            src/video_channel_manager/telegram_multichannel_cli.py \
            src/video_channel_manager/svodka_queue.py \
            src/video_channel_manager/svodka_release.py \
            tests/test_telegram_channel_profile_contract.py \
            tests/test_telegram_channel_cli.py \
            tests/test_telegram_target_binding.py \
            tests/test_telegram_multichannel_release.py \
            tests/test_telegram_multichannel_state.py \
            tests/test_telegram_multichannel_outcome.py \
            tests/test_svodka_release_review.py \
            tests/test_svodka_preflight_workflow.py \
            2>&1 | tee /tmp/ruff.log

      - name: Static typing gate
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy \
            src/video_channel_manager/telegram_channel_profile.py \
            src/video_channel_manager/telegram_channel_discovery.py \
            src/video_channel_manager/telegram_channel_cli.py \
            src/video_channel_manager/telegram_target_binding.py \
            src/video_channel_manager/telegram_multichannel_release.py \
            src/video_channel_manager/telegram_multichannel_state.py \
            src/video_channel_manager/telegram_multichannel_transport.py \
            src/video_channel_manager/telegram_multichannel_outcome.py \
            src/video_channel_manager/telegram_multichannel_cli.py \
            src/video_channel_manager/svodka_queue.py \
            src/video_channel_manager/svodka_release.py \
            --show-error-codes \
            2>&1 | tee /tmp/mypy.log

      - name: Focused regression suite
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_telegram_channel_profile_contract.py \
            tests/test_telegram_channel_cli.py \
            tests/test_telegram_target_binding.py \
            tests/test_telegram_multichannel_release.py \
            tests/test_telegram_multichannel_state.py \
            tests/test_telegram_multichannel_outcome.py \
            tests/test_svodka_release_review.py \
            tests/test_svodka_preflight_workflow.py \
            2>&1 | tee /tmp/pytest.log

      - name: Validate draft, binding, and freeze exact write-disabled review candidate
        id: candidate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m video_channel_manager.telegram_channel_cli validate-profile --profile "$PROFILE_PATH" 2>&1 | tee /tmp/candidate.log
          python -m video_channel_manager.telegram_channel_cli validate-svodka \
            --profile "$PROFILE_PATH" \
            --queue "$QUEUE_PATH" 2>&1 | tee -a /tmp/candidate.log
          python -m video_channel_manager.telegram_channel_cli build-svodka-candidate \
            --profile "$PROFILE_PATH" \
            --queue "$QUEUE_PATH" \
            --binding "$BINDING_PATH" \
            --release-id svodka-pilot-2026-08-review-candidate \
            --output "$CANDIDATE_PATH" 2>&1 | tee -a /tmp/candidate.log
          python - <<'PY' 2>&1 | tee -a /tmp/candidate.log
          import os
          from pathlib import Path

          from video_channel_manager.telegram_channel_profile import load_channel_profile
          from video_channel_manager.telegram_multichannel_release import load_release
          from video_channel_manager.telegram_target_binding import load_target_binding

          profile = load_channel_profile(Path(os.environ["PROFILE_PATH"]))
          binding = load_target_binding(Path(os.environ["BINDING_PATH"]), profile)
          release = load_release(Path(os.environ["CANDIDATE_PATH"]))
          if release.release_authorized:
              raise SystemExit("review candidate unexpectedly authorizes provider writes")
          if len(release.items) != 14:
              raise SystemExit("review candidate does not contain exactly 14 items")
          if release.chat_id != binding.chat_id or release.bot_id != binding.bot_id:
              raise SystemExit("review candidate target identity differs from pinned binding")
          if release.target_binding_sha256 != binding.digest:
              raise SystemExit("review candidate is not digest-bound to pinned binding")
          print(f"candidate_digest={release.digest}")
          print(f"target_binding_digest={binding.digest}")
          PY

      - name: Decide consolidation outcome
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          failed=false
          for value in \
            "${{ steps.install.outcome }}" \
            "${{ steps.edit.outcome }}" \
            "${{ steps.discovery.outcome }}" \
            "${{ steps.format.outcome }}" \
            "${{ steps.ruff.outcome }}" \
            "${{ steps.mypy.outcome }}" \
            "${{ steps.pytest.outcome }}" \
            "${{ steps.candidate.outcome }}"; do
            if [[ "$value" != "success" ]]; then failed=true; fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Preserve self-diagnostic and discard partial edits on failure
        if: steps.decision.outputs.failed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p docs/operations
          {
            echo '# Svodka consolidation diagnostic'
            echo
            echo "Workflow run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo
            echo '| Gate | Outcome |'
            echo '|---|---|'
            echo '| install | ${{ steps.install.outcome }} |'
            echo '| edit | ${{ steps.edit.outcome }} |'
            echo '| read-only Telegram discovery | ${{ steps.discovery.outcome }} |'
            echo '| format | ${{ steps.format.outcome }} |'
            echo '| ruff | ${{ steps.ruff.outcome }} |'
            echo '| mypy | ${{ steps.mypy.outcome }} |'
            echo '| pytest | ${{ steps.pytest.outcome }} |'
            echo '| candidate | ${{ steps.candidate.outcome }} |'
            echo
            for item in install edit discovery format ruff mypy pytest candidate; do
              echo "## $item"
              echo '```text'
              if [[ -f "/tmp/$item.log" ]]; then cat "/tmp/$item.log"; else echo 'no log'; fi
              echo '```'
              echo
            done
          } > docs/operations/svodka-consolidation-diagnostic.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/svodka-consolidation-diagnostic.md
          git commit -m "Record Svodka consolidation diagnostics"
          git push origin HEAD:main

      - name: Commit validated Svodka wave and remove temporary workflows
        if: steps.decision.outputs.failed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/svodka-consolidate-once.yml \
            .github/workflows/svodka-editorial-source-hardening-once.yml \
            .github/workflows/svodka-rebind-stable-profile-once.yml \
            .github/workflows/svodka-runtime-quality-once.yml \
            .github/workflows/svodka-format-once.yml \
            .github/workflows/svodka-state-hardening-once.yml
          git add \
            "$BINDING_PATH" \
            "$QUEUE_PATH" \
            "$CANDIDATE_PATH" \
            src/video_channel_manager \
            tests
          if [[ -f docs/operations/svodka-runtime-quality-diagnostic.md ]]; then
            git rm docs/operations/svodka-runtime-quality-diagnostic.md
          fi
          if [[ -f docs/operations/svodka-consolidation-diagnostic.md ]]; then
            git rm docs/operations/svodka-consolidation-diagnostic.md
          fi
          git commit -m "Consolidate validated Svodka multi-channel release candidate"
          git push origin HEAD:main

      - name: Fail after diagnostic was preserved
        if: steps.decision.outputs.failed == 'true'
        run: exit 1
