name: Svodka reconcile archived rich message 28

on:
  push:
    branches: [main]
    paths:
      - "content/telegram/svodka/rich-v1/reconcile-message-28.json"

permissions:
  contents: write
  issues: write

concurrency:
  group: svodka-rich-reconciliation-message-28
  cancel-in-progress: false

jobs:
  reconcile-provider-free:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      RELEASE_PATH: content/telegram/svodka/rich-v1/successor-release-2026-08.json
      AUTH_PATH: content/telegram/svodka/rich-v1/reconcile-message-28.json
      STATE_BRANCH: state/svodka-telegram
      STATE_DIR: .state/svodka
      LEDGER_REL: content/telegram/svodka/rich-successor-ledger.json
      INTENT_REL: content/telegram/svodka/rich-successor-dispatches/32147454449-1/intent.json
      OUTCOME_REL: content/telegram/svodka/rich-successor-dispatches/32147454449-1/outcome.json
      PROOF_REL: content/telegram/svodka/rich-successor-dispatches/32147454449-1/reconciliation.json
      EXPECTED_INTENT_BLOB: c644b71a6f59a2faf761d6cd914eb737099a3a3f
      EXPECTED_OUTCOME_BLOB: a1641011b80eb6b709cbaa00ff065ce8895925d5

    steps:
      - name: Check out exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install reviewed provider-free runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip check

      - name: Run reconciliation regression tests before touching durable state
        run: |
          set -euo pipefail
          ruff check src/video_channel_manager/svodka_rich_reconciliation.py tests/test_svodka_rich_reconciliation.py
          ruff format --check src/video_channel_manager/svodka_rich_reconciliation.py tests/test_svodka_rich_reconciliation.py
          mypy src/video_channel_manager/svodka_rich_reconciliation.py --show-error-codes
          python -m pytest -q tests/test_svodka_rich_reconciliation.py

      - name: Check out isolated durable Svodka state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state/svodka-telegram
          path: .state/svodka
          fetch-depth: 0
          persist-credentials: true

      - name: Bind reconciliation to immutable archived intent and outcome blobs
        run: |
          set -euo pipefail
          test "$(git -C "$STATE_DIR" rev-parse "HEAD:$INTENT_REL")" = "$EXPECTED_INTENT_BLOB"
          test "$(git -C "$STATE_DIR" rev-parse "HEAD:$OUTCOME_REL")" = "$EXPECTED_OUTCOME_BLOB"

      - name: Reconcile archived message 28 without provider access
        run: |
          set -euo pipefail
          python -m video_channel_manager.svodka_rich_reconciliation \
            --release "$RELEASE_PATH" \
            --root . \
            --ledger "$STATE_DIR/$LEDGER_REL" \
            --intent "$STATE_DIR/$INTENT_REL" \
            --outcome "$STATE_DIR/$OUTCOME_REL" \
            --authorization "$AUTH_PATH" \
            --proof-output "$STATE_DIR/$PROOF_REL" \
            > .reconciliation-result.json
          python - <<'PY'
          import json
          result = json.load(open('.reconciliation-result.json', encoding='utf-8'))
          assert result['message_id'] == 28
          assert result['provider_access_performed'] is False
          assert result['provider_write_performed'] is False
          assert result['replay_performed'] is False
          PY

      - name: Persist only reconciled ledger and proof
        run: |
          set -euo pipefail
          git -C "$STATE_DIR" config user.name 'svodka-publisher[bot]'
          git -C "$STATE_DIR" config user.email 'svodka-publisher@users.noreply.github.com'
          git -C "$STATE_DIR" add -- "$LEDGER_REL" "$PROOF_REL"
          git -C "$STATE_DIR" diff --cached --quiet && { echo 'Reconciliation produced no durable delta.' >&2; exit 3; }
          git -C "$STATE_DIR" commit -m 'Reconcile Svodka rich message 28 provider-free [skip ci]'
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"

      - name: Record provider-free reconciliation on owning issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment 235 --repo "$GITHUB_REPOSITORY" --body 'Provider-free reconciliation verified existing Svodka rich canary https://t.me/deep_info_life/28. Archived run 32147454449/1 had HTTP 200, exact target/media, and the only accepted structural normalization is coalescing adjacent plain RichText strings. No Telegram access, mutation, or replay was performed by reconciliation. A fresh successor identity is still required for autonomous continuation; expired v2 is not replayable.'
