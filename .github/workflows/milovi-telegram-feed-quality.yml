name: Milovi Telegram feed quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  permanent-feed-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install minimal Telegram runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            -r requirements/telegram-publisher.txt
      - name: Validate every exact Milovi feed bundle
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          from video_channel_manager.milovi_telegram_feed import validate_bundle

          releases = Path("content/telegram/milovi-cake/releases")
          runtime_files = sorted(releases.glob("milovi-feed-*-runtime.json"))
          assert runtime_files, "at least one exact Milovi feed runtime release is required"
          for runtime in runtime_files:
              publication_id = runtime.name.removesuffix("-runtime.json")
              result = validate_bundle(publication_id)
              print(publication_id, result["blockers"])
          PY
      - name: Enforce permanent Milovi workflow topology
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path(".github/workflows")
          canonical = root / "milovi-telegram-feed-publisher.yml"
          recovery = root / "milovi-reconcile-provider-outcome.yml"
          discovery = root / "milovi-telegram-target-discovery.yml"
          assert canonical.is_file()
          assert recovery.is_file()
          assert discovery.is_file()
          retired = {
              "milovi-telegram-bootstrap-activation-package.yml",
              "milovi-telegram-bootstrap-media-proof.yml",
              "milovi-telegram-bootstrap-publisher.yml",
              "milovi-telegram-bootstrap-quality.yml",
              "milovi-telegram-bootstrap-review-ready.yml",
              "milovi-telegram-ledger-init.yml",
              "milovi-telegram-live-canary-v2-dispatch.yml",
              "milovi-telegram-live-canary-v2-quality.yml",
              "milovi-telegram-live-canary-v2.yml",
              "milovi-telegram-oneoff-canary-dispatch.yml",
              "milovi-telegram-oneoff-canary-quality.yml",
              "milovi-telegram-oneoff-canary.yml",
              "milovi-feed-20260819-001-controller.yml",
              "milovi-feed-20260819-001-media-proof.yml",
              "milovi-feed-20260819-001-quality.yml",
              "milovi-telegram-follow-on-media-proof.yml",
              "milovi-telegram-follow-on-readiness.yml",
          }
          assert all(not (root / name).exists() for name in retired)

          mutation_marker = "python -m video_channel_manager.telegram_multichannel_cli " + "send-once"
          mutation_workflows = []
          for path in sorted(root.glob("*milovi*.yml")):
              text = path.read_text(encoding="utf-8")
              if mutation_marker in text:
                  mutation_workflows.append(path.name)
          assert mutation_workflows == [canonical.name], mutation_workflows

          text = canonical.read_text(encoding="utf-8")
          assert "group: milovi-cake-telegram-publisher" in text
          assert "state/milovi-cake-telegram" in text
          assert "require-execution-authorized" in text
          assert "telegram_multichannel_cli prepare" in text
          assert text.index("telegram_multichannel_cli prepare") < text.index("telegram_multichannel_cli send-once")
          send_index = text.index("- name: Send exactly once through the canonical generic Telegram runtime")
          archive_index = text.index("- name: Archive exact provider outcome before state mutation")
          apply_index = text.index("- name: Apply exact outcome and persist terminal or blocking state")
          assert send_index < archive_index < apply_index
          pinned_upload = re.search(
              r"uses:\s*actions/upload-artifact@([0-9a-f]{40})\s*#\s*v?(\d+\.\d+\.\d+)",
              text,
          )
          assert pinned_upload is not None, "upload-artifact must stay SHA pinned with its release"
          assert tuple(int(part) for part in pinned_upload.group(2).split(".")) >= (7, 0, 1)
          artifact_name_template = "name: milovi-provider-outcome-$" + "{{ github.run_id }}-$" + "{{ github.run_attempt }}"
          assert artifact_name_template in text
          assert "if-no-files-found: error" in text
          assert "schedule:" not in text
          assert "cron:" not in text

          recovery_text = recovery.read_text(encoding="utf-8")
          assert "workflow_dispatch:" in recovery_text
          assert "group: milovi-cake-telegram-publisher" in recovery_text
          assert "actions: read" in recovery_text
          assert "contents: write" in recovery_text
          assert "telegram_milovi_outcome_artifact prove" in recovery_text
          assert "telegram_milovi_outcome_artifact fetch" in recovery_text
          assert "telegram_milovi_outcome_artifact validate" in recovery_text
          assert "telegram_multichannel_cli verify-intent" in recovery_text
          assert "telegram_multichannel_cli apply-outcome" in recovery_text
          assert "MILOVI_STATE_BASE_SHA" in recovery_text
          assert "current_main_sha" in recovery_text
          for forbidden in (
              "LORDCHRIST_TELEGRAM_BOT_TOKEN",
              "MILOVI_CAKE_TELEGRAM_BOT_TOKEN",
              "telegram_channel_cli preflight",
              "telegram_multichannel_cli send-once",
              "sendMessage",
              "sendPhoto",
              "sendVideo",
          ):
              assert forbidden not in recovery_text

          photo_lock = Path("requirements/milovi-photo-publisher.txt").read_text(encoding="utf-8")
          assert "--require-hashes" in photo_lock
          assert "--only-binary=:all:" in photo_lock
          pinned = re.search(r"^Pillow==(\d+)\.(\d+)\.(\d+)\s*\\$", photo_lock, re.MULTILINE)
          assert pinned is not None, "the Milovi lock must pin an exact Pillow release"
          major, minor = (int(part) for part in pinned.groups()[:2])
          assert (major, minor) >= (13, 0), f"stale Pillow pin: {pinned.group(0)}"
          pinned_hash = re.search(r"--hash=sha256:([0-9a-f]{64})$", photo_lock, re.MULTILINE)
          assert pinned_hash is not None, "the exact Pillow wheel must be hash locked"
          assert "-r requirements/milovi-photo-publisher.txt" in text

          # The runtime range and the production lock must agree: the supported
          # dependency range has to admit the exact locked release.
          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          asserted_range = re.search(r'"Pillow>=(\d+)(?:\.(\d+))?,<(\d+)"', pyproject)
          assert asserted_range is not None, "pyproject must declare a Pillow range"
          lower_major = int(asserted_range.group(1))
          lower_minor = int(asserted_range.group(2) or 0)
          upper_major = int(asserted_range.group(3))
          assert (major, minor) >= (lower_major, lower_minor)
          assert major < upper_major, f"locked Pillow {major} is outside the supported range"

          discovery_text = discovery.read_text(encoding="utf-8")
          assert "discover-target" in discovery_text
          assert "provider_writes_authorized" not in discovery_text
          assert mutation_marker not in discovery_text

          implementation = Path(
              "src/video_channel_manager/telegram_channel_discovery.py"
          ).read_text(encoding="utf-8")
          assert 'method="getMe"' in implementation
          assert implementation.count('method="getChat"') == 4
          assert 'method="getChatMember"' in implementation
          assert implementation.count("mutation=False") == 4
          assert "mutation=True" not in implementation
          for forbidden_method in (
              "sendMessage",
              "sendPhoto",
              "sendMediaGroup",
              "editMessage",
              "deleteMessage",
          ):
              assert forbidden_method not in implementation

          print("permanent Milovi workflow topology: OK")
          PY