name: Lordchrist research read-only recovery probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lordchrist-research-readonly-recovery.yml
      - src/video_channel_manager/telegram_research_update_probe.py
      - tests/test_telegram_research_update_probe.py

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: lordchrist-research-readonly-recovery
  cancel-in-progress: false

jobs:
  probe-existing-post:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      BASE_PROFILE_PATH: content/telegram/channels/lordchrist.json
      QUEUE_PATH: content/telegram/lordchrist/research-queues/calvin-spurgeon-macarthur-v2.json
      BINDING_PATH: content/telegram/channels/lordchrist-target-binding.json
      APPROVAL_PATH: content/telegram/lordchrist/research-queues/rollout-approval-2026-08.json
      RELEASE_PATH: .runtime/lordchrist-research-approved-release.json
      RUNTIME_PROFILE_PATH: .runtime/lordchrist-research-live-profile.json
      PROBE_PATH: .runtime/lordchrist-research-recovery-probe.json
      PUBLICATION_ID: lordchrist-research-three-preachers-numbers
      EXPECTED_CHAT_ID: -1001295216957
      EXPECTED_CHAT_USERNAME: lordchrist
      ATTEMPTED_AT_UTC: 2026-08-10T12:58:06.217510Z
      HISTORICAL_RUN_ID: "31390497205"
      HISTORICAL_RUN_ATTEMPT: "1"
      HISTORICAL_OUTCOME_ARTIFACT_SHA256: sha256:22c6b1963f642384a7b59290a6992d9e5846ad12b393e77994e445960e2cf740
    steps:
      - name: Check out exact main recovery runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install hash-locked Telegram runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt

      - name: Materialize exact historical approved release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python -m video_channel_manager.lordchrist_research_rollout \
            --profile "$BASE_PROFILE_PATH" \
            --queue "$QUEUE_PATH" \
            --binding "$BINDING_PATH" \
            --approval "$APPROVAL_PATH" \
            --release-output "$RELEASE_PATH" \
            --runtime-profile-output "$RUNTIME_PROFILE_PATH"

      - name: Probe Telegram without advancing updates or changing webhook
        env:
          LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_research_update_probe \
            --release "$RELEASE_PATH" \
            --publication-id "$PUBLICATION_ID" \
            --expected-chat-id "$EXPECTED_CHAT_ID" \
            --expected-chat-username "$EXPECTED_CHAT_USERNAME" \
            --attempted-at-utc "$ATTEMPTED_AT_UTC" \
            --match-window-seconds 180 \
            --historical-run-id "$HISTORICAL_RUN_ID" \
            --historical-run-attempt "$HISTORICAL_RUN_ATTEMPT" \
            --historical-outcome-artifact-sha256 "$HISTORICAL_OUTCOME_ARTIFACT_SHA256" \
            --github-sha "$GITHUB_SHA" \
            --output "$PROBE_PATH"

      - name: Prove probe is provider-read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ['PROBE_PATH']).read_text(encoding='utf-8'))
          assert payload['provider_write_performed'] is False
          assert payload['webhook_changed'] is False
          assert payload['updates_confirmed'] is False
          assert payload['get_updates_offset_sent'] is False
          if payload['status'] == 'found':
              assert isinstance(payload['message_id'], int) and payload['message_id'] > 0
              assert payload['message_url'] == f"https://t.me/{os.environ['EXPECTED_CHAT_USERNAME']}/{payload['message_id']}"
          PY

      - name: Upload exact read-only recovery certificate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: lordchrist-research-readonly-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/lordchrist-research-recovery-probe.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: true

      - name: Record sanitized recovery checkpoint on issue 263
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > .runtime/recovery-comment.md
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ['PROBE_PATH']).read_text(encoding='utf-8'))
          print('## Read-only Telegram recovery probe')
          print()
          print(f"- main SHA: `{os.environ['GITHUB_SHA']}`")
          print(f"- historical run: `{payload['historical_run_id']}/{payload['historical_run_attempt']}`")
          print(f"- publication: `{payload['publication_id']}`")
          print(f"- status: **{payload['status']}**")
          print(f"- examined updates: `{payload['examined_updates']}`")
          print(f"- webhook URL present: `{payload['webhook_url_present']}`")
          print(f"- getUpdates called: `{payload['get_updates_called']}`")
          print(f"- offset sent: `{payload['get_updates_offset_sent']}`")
          print(f"- updates confirmed: `{payload['updates_confirmed']}`")
          print(f"- webhook changed: `{payload['webhook_changed']}`")
          print(f"- provider write performed: `{payload['provider_write_performed']}`")
          neighbors = payload.get('target_channel_neighbors') or []
          print(f"- target-channel neighbors retained: `{len(neighbors)}`")
          for neighbor in neighbors:
              print(
                  f"  - message `{neighbor['message_id']}` at `{neighbor['message_date_utc']}`; "
                  f"text `{neighbor['text_sha256']}`"
              )
          if payload['message_id'] is not None:
              print(f"- recovered message_id: `{payload['message_id']}`")
              print(f"- recovered message URL: `{payload['message_url']}`")
              print(f"- message date UTC: `{payload['message_date_utc']}`")
              print(f"- matching update IDs: `{payload['matching_update_ids']}`")
          print()
          print('No neighbor text is persisted or posted; only target-channel message id, UTC date, and text SHA-256 are retained. This workflow does not mutate the Telegram channel, webhook, update offset, or durable publication ledger. State reconciliation remains a separate reviewed transition.')
          PY
          gh issue comment 263 --repo "$GITHUB_REPOSITORY" --body-file .runtime/recovery-comment.md
