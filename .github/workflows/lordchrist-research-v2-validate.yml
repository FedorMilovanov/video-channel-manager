name: Lordchrist research v2 validation

on:
  pull_request:
    paths:
      - ".github/workflows/lordchrist-research-v2-validate.yml"
      - ".github/workflows/lordchrist-generic-target-discovery.yml"
      - "src/video_channel_manager/telegram_research.py"
      - "src/video_channel_manager/telegram_research_release.py"
      - "src/video_channel_manager/telegram_research_release_cli.py"
      - "src/video_channel_manager/telegram_release_review.py"
      - "src/video_channel_manager/telegram_release_review_cli.py"
      - "src/video_channel_manager/telegram_target_binding.py"
      - "src/video_channel_manager/telegram_target_binding_cli.py"
      - "tests/test_telegram_research.py"
      - "tests/test_telegram_research_release.py"
      - "tests/test_telegram_research_release_cli.py"
      - "tests/test_telegram_release_review.py"
      - "tests/test_telegram_target_binding.py"
      - "content/telegram/channels/lordchrist.json"
      - "content/telegram/channels/lordchrist-target-binding.json"
      - "content/telegram/lordchrist/research-queues/**"
      - "content/telegram/lordchrist/research-posts/**"
      - "docs/lordchrist/research-post-v2.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lordchrist-research-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install read-only validation dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            -r requirements/telegram-publisher.txt \
            "pytest>=8.3,<10"

      - name: Compile research, review, and binding tooling
        shell: bash
        run: |
          python -m compileall -q \
            src/video_channel_manager/telegram_research.py \
            src/video_channel_manager/telegram_research_release.py \
            src/video_channel_manager/telegram_research_release_cli.py \
            src/video_channel_manager/telegram_release_review.py \
            src/video_channel_manager/telegram_release_review_cli.py \
            src/video_channel_manager/telegram_target_binding.py \
            src/video_channel_manager/telegram_target_binding_cli.py

      - name: Validate staged research queue
        shell: bash
        run: |
          PYTHONPATH=src python -m video_channel_manager.telegram_research \
            --queue content/telegram/lordchrist/research-queues/calvin-spurgeon-macarthur-v2.json \
            validate

      - name: Run research-v2, release-review, and target-binding regression tests
        shell: bash
        run: |
          PYTHONPATH=src python -m pytest -q \
            tests/test_telegram_research.py \
            tests/test_telegram_research_release.py \
            tests/test_telegram_research_release_cli.py \
            tests/test_telegram_release_review.py \
            tests/test_telegram_target_binding.py

      - name: Prove pull-request queue cannot publish
        shell: bash
        run: |
          PYTHONPATH=src python -m video_channel_manager.telegram_research \
            --queue content/telegram/lordchrist/research-queues/calvin-spurgeon-macarthur-v2.json \
            preview > /tmp/research-preview.json
          python - <<'PY'
          import json
          from pathlib import Path

          preview = json.loads(Path("/tmp/research-preview.json").read_text(encoding="utf-8"))
          if preview.get("live_eligible") is not False:
              raise SystemExit("research queue unexpectedly became live-eligible")
          if preview.get("schedule_state") != "staged":
              raise SystemExit("research queue must remain staged in this PR")
          print("research-v2 is valid, staged, and provider-inert")
          PY

      - name: Build exact bound unauthorized research release candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          PYTHONPATH=src python -m video_channel_manager.telegram_research_release_cli \
            --profile content/telegram/channels/lordchrist.json \
            --queue content/telegram/lordchrist/research-queues/calvin-spurgeon-macarthur-v2.json \
            --release-id lordchrist-research-calvin-spurgeon-macarthur-v1 \
            --start-at 2026-08-10T19:17:00+03:00 \
            --binding content/telegram/channels/lordchrist-target-binding.json \
            --output .runtime/lordchrist-research-release-candidate.json \
            > /tmp/research-release-summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('/tmp/research-release-summary.json').read_text(encoding='utf-8'))
          if summary.get('count') != 5:
              raise SystemExit('research release candidate must contain exactly five items')
          if summary.get('target_bound') is not True:
              raise SystemExit('research release candidate must be bound to exact production-proven target identity')
          if summary.get('release_authorized') is not False:
              raise SystemExit('read-only research CI must never authorize provider writes')
          print(json.dumps(summary, ensure_ascii=False))
          PY

      - name: Prove exact candidate review remains provider-inert
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m video_channel_manager.telegram_release_review_cli \
            --profile content/telegram/channels/lordchrist.json \
            --binding content/telegram/channels/lordchrist-target-binding.json \
            --candidate .runtime/lordchrist-research-release-candidate.json \
            --expected-candidate-sha256 sha256:0f25f23fc87665b03df0b8486d6f336e8e405b6213457772ead6ce2a363cd07d \
            --reviewed-by ci-regression \
            --reviewed-at 2026-08-08T12:30:00+03:00 \
            --output .runtime/lordchrist-research-release-approved-test.json \
            > /tmp/research-review-summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          profile = json.loads(Path('content/telegram/channels/lordchrist.json').read_text(encoding='utf-8'))
          summary = json.loads(Path('/tmp/research-review-summary.json').read_text(encoding='utf-8'))
          if summary.get('authorized') is not True:
              raise SystemExit('exact candidate review regression did not produce an approved release')
          if profile.get('provider_writes_authorized') is not False:
              raise SystemExit('review validation must not enable provider writes')
          print('exact candidate review is bound and provider-inert')
          PY

      - name: Upload exact unauthorized research release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lordchrist-research-release-candidate-${{ github.sha }}
          path: .runtime/lordchrist-research-release-candidate.json
          if-no-files-found: error
          retention-days: 7
