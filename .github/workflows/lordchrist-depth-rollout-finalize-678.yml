name: Lordchrist depth-v2 rollout finalize 678

on:
  push:
    branches:
      - agent/lordchrist-depth-v2-rollout-678

permissions:
  contents: write

concurrency:
  group: lordchrist-depth-v2-rollout-finalize-678
  cancel-in-progress: false

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact rollout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/lordchrist-depth-v2-rollout-678
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Recover and apply reviewed rollout patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import re
          import subprocess
          import zlib

          helper = subprocess.check_output(
              [
                  "git",
                  "show",
                  "e5ee324238b1d798cb36b0fe72a4ff76a157aec8:.github/workflows/lordchrist-depth-rollout-patch-678.yml",
              ],
              text=True,
              encoding="utf-8",
          )
          match = re.search(r"^\s*PATCH_ZLIB_B64:\s*(\S+)\s*$", helper, flags=re.MULTILINE)
          if match is None:
              raise SystemExit("reviewed rollout patch payload is missing from its immutable source commit")
          code = zlib.decompress(base64.b64decode(match.group(1))).decode("utf-8")
          exec(compile(code, "<lordchrist-depth-v2-rollout-678>", "exec"), {"__name__": "__main__"})
          PY

      - name: Install development toolchain
        run: |
          python -m pip install --upgrade "pip>=25" "setuptools>=83,<85" wheel
          pip install -e ".[dev]"

      - name: Format and verify exact rollout scope
        shell: bash
        run: |
          set -euo pipefail
          ruff format \
            src/video_channel_manager/telegram_quote_runtime.py \
            src/video_channel_manager/telegram_quote_depth.py \
            src/video_channel_manager/lordchrist_cross_track_effect_guard.py \
            tests/test_lordchrist_quote_depth_667.py \
            tests/test_lordchrist_quote_handoff_582.py \
            tests/test_lordchrist_autonomous_production.py
          ruff check \
            src/video_channel_manager/telegram_quote_runtime.py \
            src/video_channel_manager/telegram_quote_depth.py \
            src/video_channel_manager/lordchrist_cross_track_effect_guard.py \
            tests/test_lordchrist_quote_depth_667.py \
            tests/test_lordchrist_quote_handoff_582.py \
            tests/test_lordchrist_autonomous_production.py
          mypy src --show-error-codes
          pytest -q \
            tests/test_lordchrist_quote_depth_667.py \
            tests/test_lordchrist_quote_handoff_582.py \
            tests/test_lordchrist_autonomous_production.py \
            tests/test_telegram_presentation.py \
            tests/test_lordchrist_depth_rollout_678.py

      - name: Commit exact verified rollout
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/lordchrist-depth-rollout-finalize-678.yml
          git config user.name "FedorMilovanov"
          git config user.email "258225528+FedorMilovanov@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "Depth-v2 rollout produced no staged delta." >&2
            exit 2
          }
          parent_sha="$(git rev-parse HEAD)"
          git commit -m "feat(lordchrist): stage depth-v2 production cutover"
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/agent/lordchrist-depth-v2-rollout-678 | cut -f1)"
          [[ "$remote_sha" == "$parent_sha" ]] || {
            echo "Rollout branch moved from $parent_sha to $remote_sha during final verification; refusing to overwrite it." >&2
            exit 3
          }
          git push origin "$local_sha":refs/heads/agent/lordchrist-depth-v2-rollout-678
