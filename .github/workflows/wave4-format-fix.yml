name: Wave 4 one-shot format fix

on:
  push:
    branches:
      - agent/wave-4-wall-safety
    paths:
      - .github/wave4-format-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/wave-4-wall-safety
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Apply exact formatting fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_vk_upload_lifecycle.py")
          text = path.read_text(encoding="utf-8")
          old = "        return item\n\n\n    def capture_wall_snapshot("
          new = "        return item\n\n    def capture_wall_snapshot("
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one Wave 4 formatting target")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY
          python -m pip install "ruff==0.12.11"
          ruff format --check tests/test_vk_upload_lifecycle.py
          rm -f .github/wave4-format-trigger .github/workflows/wave4-format-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wave 4: fix final Ruff formatting"
          git push origin HEAD:agent/wave-4-wall-safety
