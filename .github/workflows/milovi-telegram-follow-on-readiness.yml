name: Milovi Telegram follow-on readiness

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/milovi-telegram-follow-on-readiness.yml"
      - "src/video_channel_manager/milovi_telegram_follow_on.py"
      - "src/video_channel_manager/milovi_telegram_follow_on_readiness.py"
      - "content/telegram/channels/milovi-cake.json"
      - "content/telegram/milovi-cake/bootstrap-authorized-release-2026-08.json"
      - "content/telegram/milovi-cake/follow-on-wave-candidates-2026-08.json"
      - "content/telegram/milovi-cake/follow-on-photo-source-manifest-2026-08.json"
      - "content/telegram/milovi-cake/follow-on-release-policy-2026-08.json"
      - "content/telegram/milovi-cake/school-interest-reading-candidates-2026-08.json"

permissions:
  contents: read

env:
  PYTHONPATH: src
  PROFILE_PATH: content/telegram/channels/milovi-cake.json
  CANDIDATES_PATH: content/telegram/milovi-cake/follow-on-wave-candidates-2026-08.json
  TRANSPORT_MANIFEST_PATH: content/telegram/milovi-cake/follow-on-photo-source-manifest-2026-08.json
  POLICY_PATH: content/telegram/milovi-cake/follow-on-release-policy-2026-08.json
  BOOTSTRAP_RELEASE_PATH: content/telegram/milovi-cake/bootstrap-authorized-release-2026-08.json
  STATE_BRANCH: state/milovi-cake-telegram
  STATE_DIR: .state/milovi-cake
  BOOTSTRAP_LEDGER_PATH: .state/milovi-cake/content/telegram/milovi-cake/publication-ledger.json
  SNAPSHOT_DIR: .runtime/milovi-follow-on-readiness/sources
  REPORT_PATH: .runtime/milovi-follow-on-readiness/report.json
  RECEIPT_PATH: .runtime/milovi-follow-on-readiness/readiness.json

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable current-main runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install minimal Telegram runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            -r requirements/telegram-publisher.txt

      - name: Validate frozen follow-on bundle without provider access
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.milovi_telegram_follow_on validate \
            --profile "$PROFILE_PATH" \
            --candidates "$CANDIDATES_PATH" \
            --transport-manifest "$TRANSPORT_MANIFEST_PATH" \
            --policy "$POLICY_PATH"

      - name: Check out durable bootstrap state read-only
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state/milovi-cake-telegram
          path: .state/milovi-cake
          fetch-depth: 1
          persist-credentials: false

      - name: Capture current Cake and School source snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from __future__ import annotations

          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          token = os.environ.get("GH_TOKEN", "")
          headers = {"User-Agent": "video-channel-manager-milovi-readiness/1"}
          if token:
              headers["Authorization"] = f"Bearer {token}"
              headers["X-GitHub-Api-Version"] = "2022-11-28"

          def resolve_head(repository: str) -> str:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/commits/main",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              sha = str(payload.get("sha") or "")
              if len(sha) != 40:
                  raise SystemExit(f"unable to resolve exact main SHA for {repository}")
              return sha

          def fetch_raw(repository: str, sha: str, source_path: str) -> bytes:
              safe_path = "/".join(urllib.parse.quote(part, safe="") for part in source_path.split("/"))
              request = urllib.request.Request(
                  f"https://raw.githubusercontent.com/{repository}/{sha}/{safe_path}",
                  headers={"User-Agent": headers["User-Agent"]},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          cake_sha = resolve_head("FedorMilovanov/Milovi_Cake")
          school_sha = resolve_head("FedorMilovanov/Milovi_School")
          out = pathlib.Path(os.environ["SNAPSHOT_DIR"])
          out.mkdir(parents=True, exist_ok=True)
          (out / "cake-order.html").write_bytes(
              fetch_raw("FedorMilovanov/Milovi_Cake", cake_sha, "zakazat-tort-spb/index.html")
          )
          (out / "cake-bento.html").write_bytes(
              fetch_raw("FedorMilovanov/Milovi_Cake", cake_sha, "bento-torty/index.html")
          )
          (out / "school-articles.ts").write_bytes(
              fetch_raw("FedorMilovanov/Milovi_School", school_sha, "src/data/articles.ts")
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"CAKE_SOURCE_COMMIT={cake_sha}\n")
              handle.write(f"SCHOOL_SOURCE_COMMIT={school_sha}\n")
          print(json.dumps({
              "cake_source_commit": cake_sha,
              "school_source_commit": school_sha,
              "telegram_provider_accessed": False,
              "provider_write_performed": False,
          }))

      - name: Build fail-closed readiness report
        shell: bash
        run: |
          set -euo pipefail
          checked_at="$(python -c 'from datetime import UTC,datetime; print(datetime.now(UTC).isoformat())')"
          python -m video_channel_manager.milovi_telegram_follow_on_readiness \
            --profile "$PROFILE_PATH" \
            --candidates "$CANDIDATES_PATH" \
            --transport-manifest "$TRANSPORT_MANIFEST_PATH" \
            --policy "$POLICY_PATH" \
            --bootstrap-release "$BOOTSTRAP_RELEASE_PATH" \
            --bootstrap-ledger "$BOOTSTRAP_LEDGER_PATH" \
            --order-snapshot "$SNAPSHOT_DIR/cake-order.html" \
            --bento-snapshot "$SNAPSHOT_DIR/cake-bento.html" \
            --school-articles-snapshot "$SNAPSHOT_DIR/school-articles.ts" \
            --cake-source-commit "$CAKE_SOURCE_COMMIT" \
            --school-source-commit "$SCHOOL_SOURCE_COMMIT" \
            --checked-at "$checked_at" \
            --report "$REPORT_PATH" \
            --receipt "$RECEIPT_PATH"

      - name: Assert readiness artifact never claims provider access
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          if report["provider_write_performed"] or report["telegram_provider_accessed"] or report["state_branch_write_performed"]:
              raise SystemExit("readiness workflow crossed a forbidden mutation/provider boundary")
          receipt = Path(os.environ["RECEIPT_PATH"])
          print(json.dumps({
              "ready": report["ready"],
              "blockers": report["blockers"],
              "receipt_emitted": receipt.is_file(),
              "provider_write_performed": False,
              "telegram_provider_accessed": False,
              "state_branch_write_performed": False,
          }, ensure_ascii=False))

      - name: Upload read-only readiness evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: milovi-follow-on-readiness-${{ github.sha }}
          path: .runtime/milovi-follow-on-readiness/
          if-no-files-found: error
          retention-days: 3
