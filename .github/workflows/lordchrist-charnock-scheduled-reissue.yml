name: Lordchrist Charnock reviewed scheduled reissue

on:
  schedule:
    # Reviewed V3 12:05 Moscow target; GitHub schedule may arrive late or be dropped.
    - cron: "5 9 * * 2,5"
    # Independent off-minute attempts on the SAME reviewed Moscow date.
    # Durable terminal-readback guard below skips an already verified reissue.
    # No next-day catch-up; existing 12:00–13:59 Moscow lease is unchanged.
    - cron: "11 9 * * 2,5"
    - cron: "37 9 * * 2,5"
    - cron: "11 10 * * 2,5"
  workflow_dispatch:
    inputs:
      publication_id:
        description: Existing owner-approved future Charnock article (no missed backfill)
        required: true
        type: choice
        options:
          - lordchrist-telegraph-charnock-09
          - lordchrist-telegraph-charnock-10
          - lordchrist-telegraph-charnock-11
          - lordchrist-telegraph-charnock-12
      confirm:
        description: Type RUN_APPROVED_CHARNOCK_SLOT_ONCE; no off-date or off-window posting
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: lordchrist-telegram-publisher
  cancel-in-progress: false
  queue: max

jobs:
  schedule-only:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       github.actor == 'FedorMilovanov' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirm == 'RUN_APPROVED_CHARNOCK_SLOT_ONCE' &&
       (inputs.publication_id == 'lordchrist-telegraph-charnock-09' ||
        inputs.publication_id == 'lordchrist-telegraph-charnock-10' ||
        inputs.publication_id == 'lordchrist-telegraph-charnock-11' ||
        inputs.publication_id == 'lordchrist-telegraph-charnock-12'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      MANIFEST: content/telegram/lordchrist/telegraph-v1/charnock/charnock-reschedule-2026.json
      LEDGER_PATH: .state/lordchrist/content/telegram/lordchrist/telegraph-v1/publication-ledger.json
      ENABLED: ${{ vars.LORDCHRIST_CHARNOCK_RECOVERY_ENABLED }}
      APPROVED_MANIFEST_SHA256: ${{ vars.LORDCHRIST_CHARNOCK_RECOVERY_MANIFEST_SHA256 }}
      REVIEWED_PUBLICATION_ID: ${{ inputs.publication_id }}
      RECOVERY_CALENDAR_VERSION: "3"
      APPROVED_CALENDAR_V3_SHA256: ${{ vars.LORDCHRIST_CHARNOCK_RECOVERY_V3_SHA256 }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install publisher dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --only-binary=:all: \
            -r requirements/telegram-publisher.txt
      - name: Select exact calendar slot and prove separately authorized immutable manifest
        id: due
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 3
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_ACTOR" == "FedorMilovanov" ]] || exit 3
            [[ "${{ inputs.confirm }}" == "RUN_APPROVED_CHARNOCK_SLOT_ONCE" ]] || exit 3
          elif [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            exit 3
          fi
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]] || exit 3
          [[ "$ENABLED" == "true" ]] || {
            echo "Charnock scheduled recovery disabled"
            exit 3
          }
          [[ "$APPROVED_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 3
          [[ "$(sha256sum "$MANIFEST" | cut -d' ' -f1)" == "$APPROVED_MANIFEST_SHA256" ]] || {
            echo "Charnock scheduled edition manifest changed after approval" >&2
            exit 3
          }
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]] || exit 3
          python -m video_channel_manager.telegram_github_quality_gate --workflow ci.yml --sha "$GITHUB_SHA"
          python - <<'PY'
          import base64, json, os, subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from video_channel_manager.lordchrist_charnock_reschedule import (
              load_recovery_calendar_v3,
              require_v3_release,
              scheduled_reissue_preflight_status,
          )

          now=datetime.now(ZoneInfo("Europe/Moscow"))
          entries=load_recovery_calendar_v3(Path("."),require_approved=True)
          matches=[i for i in entries if i["scheduled_on_moscow"]==now.date().isoformat()]
          if not matches:
              print("No Charnock replacement due today; no provider effect")
              raise SystemExit(0)
          if now.hour not in (12,13) or (now.hour == 12 and now.minute < 5):
              raise SystemExit("Late/early scheduled run: no catch-up")
          if len(matches)!=1:
              raise SystemExit("Ambiguous Charnock scheduled date")
          if os.environ["GITHUB_EVENT_NAME"]=="workflow_dispatch":
              if matches[0]["publication_id"] != os.environ.get("REVIEWED_PUBLICATION_ID"):
                  raise SystemExit("Manual run is not for today's exact reviewed article")
          # Read protected state after acquiring the shared workflow concurrency
          # lock. A backup attempt may never replay an already-claimed send.
          state_path="content/telegram/lordchrist/telegraph-v1/publication-ledger.json"
          response=json.loads(subprocess.check_output([
              "gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/contents/{state_path}?ref=state/lordchrist-telegram"
          ], text=True))
          if response.get("encoding")!="base64":
              raise SystemExit("Protected state response encoding is not verified")
          state=json.loads(base64.b64decode(response["content"],validate=False).decode("utf-8"))
          # The same resolved V3 identity is used by every executor stage.
          approved=matches[0]
          status=scheduled_reissue_preflight_status(state,approved)
          if status=="verified":
              print("Charnock edition already reissued and verified; backup trigger is a no-op")
              raise SystemExit(0)
          require_v3_release(approved)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              print("publication_id="+matches[0]["publication_id"],file=out)
          PY
      - name: Publish exactly one due recovery article
        if: steps.due.outputs.publication_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_ID: ${{ steps.due.outputs.publication_id }}
          LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        run: bash scripts/lordchrist_charnock_reschedule.sh
