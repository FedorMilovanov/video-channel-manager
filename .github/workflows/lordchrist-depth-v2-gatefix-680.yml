name: Lordchrist depth-v2 schedule gate fix 680

on:
  push:
    branches:
      - agent/lordchrist-depth-v2-gatefix-680

permissions:
  contents: write

concurrency:
  group: lordchrist-depth-v2-gatefix-680
  cancel-in-progress: false

jobs:
  patch-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/lordchrist-depth-v2-gatefix-680
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Remove mutable repo-variable dependency from scheduled pre-gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/lordchrist-telegram-poster.yml')
          text = workflow_path.read_text(encoding='utf-8')
          old = '              queue_digest=os.environ["LORDCHRIST_APPROVED_QUEUE_DIGEST"],\n'
          new = '              queue_digest=schedule.successor_queue_digest,\n'
          if text.count(old) != 2:
              raise SystemExit(f'expected exactly two release-binding digest callsites, found {text.count(old)}')
          text = text.replace(old, new, 1)
          workflow_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_lordchrist_autonomous_production.py')
          tests = test_path.read_text(encoding='utf-8')
          addition = '''\n\ndef test_scheduled_pre_resolution_gate_uses_version_controlled_depth_digest_not_repo_variable() -> None:\n    workflow = WORKFLOW_PATH.read_text(encoding="utf-8")\n    start = workflow.index("      - name: Determine guarded execution mode")\n    end = workflow.index("      - name: Check out publication ledger read-only")\n    gate = workflow[start:end]\n\n    assert "queue_digest=schedule.successor_queue_digest" in gate\n    assert 'queue_digest=os.environ["LORDCHRIST_APPROVED_QUEUE_DIGEST"]' not in gate\n'''
          marker = 'def test_scheduled_pre_resolution_gate_uses_version_controlled_depth_digest_not_repo_variable() -> None:'
          if marker in tests:
              raise SystemExit('schedule gate regression test already exists unexpectedly')
          test_path.write_text(tests.rstrip() + addition + '\n', encoding='utf-8')
          PY

      - name: Install development toolchain
        run: |
          python -m pip install --upgrade "pip>=25" "setuptools>=83,<85" wheel
          pip install -e ".[dev]"

      - name: Verify exact gate fix
        shell: bash
        run: |
          set -euo pipefail
          ruff format tests/test_lordchrist_autonomous_production.py
          ruff check tests/test_lordchrist_autonomous_production.py
          mypy src --show-error-codes
          pytest -q \
            tests/test_lordchrist_autonomous_production.py \
            tests/test_lordchrist_quote_depth_667.py \
            tests/test_lordchrist_quote_handoff_582.py \
            tests/test_lordchrist_depth_rollout_678.py \
            tests/test_telegram_presentation.py

      - name: Create verified dangling commit for direct ref adoption
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/lordchrist-depth-v2-gatefix-680.yml
          git config user.name "FedorMilovanov"
          git config user.email "258225528+FedorMilovanov@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No gate-fix delta." >&2; exit 2; }
          git commit -m "fix(lordchrist): bind scheduled cutover to reviewed depth digest"
          local_sha="$(git rev-parse HEAD)"
          echo "LOCAL_COMMIT=$local_sha"
          git push origin "$local_sha":refs/heads/agent/lordchrist-depth-v2-gatefix-680
