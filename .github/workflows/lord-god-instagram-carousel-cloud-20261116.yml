name: Lord God Instagram — unapproved carousel previews (READ ONLY)
# OWNER APPROVAL HOLD: manual read-only validation only; no cron until approved.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lord-god-instagram-carousels-20261116
  cancel-in-progress: false

jobs:
  source-backed-carousel:
    name: Verify and publish exact daily five-slide carousel
    if: github.repository == 'FedorMilovanov/video-channel-manager'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LORD_GOD_PAGE_TOKEN: ${{ secrets.LORD_GOD_INSTAGRAM_PAGE_TOKEN }}
      LORD_GOD_CLOUD_MODE: preflight
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify exact images, source-bound plan and account; publish only on schedule
        run: python scripts/instagram/lord_god_carousel_cloud_20261116.py
