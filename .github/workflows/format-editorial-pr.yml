name: Format unified editorial PR

on:
  push:
    branches:
      - agent/unified-editorial-pipeline
    paths:
      - .github/workflows/format-editorial-pr.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/unified-editorial-pipeline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip>=25" "setuptools>=83,<84" wheel
          pip install -e ".[dev]"
          ruff format .
          ruff check .
          python -m compileall -q src scripts tests
          rm -f .github/workflows/format-editorial-pr.yml

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format unified editorial pipeline"
          git push origin HEAD:agent/unified-editorial-pipeline
