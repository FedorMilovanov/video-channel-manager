name: Svodka rich successor v3 finalizer

on:
  push:
    branches: [main]
    paths:
      - "content/telegram/svodka/rich-v1/successor-v3-finalizer-2026-08.json"
  workflow_dispatch:
    inputs:
      confirm:
        description: Type SVODKA-RICH-V3:@deep_info_life:WOMBAT
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: read

concurrency:
  group: svodka-rich-successor
  cancel-in-progress: false
  queue: max

jobs:
  publish-one:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.confirm == 'SVODKA-RICH-V3:@deep_info_life:WOMBAT'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      RELEASE_PATH: content/telegram/svodka/rich-v1/successor-v3-finalizer-2026-08.json
      PROFILE_PATH: content/telegram/channels/svodka.json
      STATE_BRANCH: state/svodka-telegram
      STATE_DIR: .state/svodka
      PREDECESSOR_LEDGER_PATH: .state/svodka/content/telegram/svodka/rich-successor-ledger.json
      LEDGER_RELATIVE_PATH: content/telegram/svodka/rich-successor-v3-ledger.json
      LEDGER_PATH: .state/svodka/content/telegram/svodka/rich-successor-v3-ledger.json
      TARGET_PROOF_PATH: .runtime/svodka-v3-target-proof.json
      MEDIA_PROOF_PATH: .runtime/svodka-v3-media-proof.json
      MEDIA_RECHECK_PATH: .runtime/svodka-v3-media-recheck.json
      INTENT_PATH: .runtime/svodka-v3-intent.json
      OUTCOME_PATH: .runtime/svodka-v3-outcome.json
      EXPECTED_CHAT_ID: -1003527567039
      EXPECTED_BOT_ID: 8716602202
      EXPECTED_BOT_USERNAME: preaching_mp3_bot

    steps:
      - name: Check out exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install reviewed runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt
          python -m pip check

      - name: Validate fresh v3 release provider-free
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python -m video_channel_manager.svodka_rich_successor_v3 preview \
            --release "$RELEASE_PATH" --root . > .runtime/preview.json
          python - <<'PY'
          import json
          data = json.load(open('.runtime/preview.json', encoding='utf-8'))
          assert len(data['items']) == 1
          assert data['items'][0]['publication_id'] == 'svodka-rich-wombat-cubic-poop'
          assert data['items'][0]['dispatch_mode'] == 'scheduled'
          assert data['provider_write_performed'] is False
          PY
          ruff check \
            src/video_channel_manager/svodka_rich_successor_v3.py \
            tests/test_svodka_rich_successor_v3.py
          ruff format --check \
            src/video_channel_manager/svodka_rich_successor_v3.py \
            tests/test_svodka_rich_successor_v3.py
          mypy src/video_channel_manager/svodka_rich_successor_v3.py --show-error-codes
          python -m pytest -q \
            tests/test_svodka_rich_successor_v3.py \
            tests/test_svodka_rich_successor.py \
            tests/test_svodka_rich_reconciliation.py

      - name: Check out isolated durable Svodka state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state/svodka-telegram
          path: .state/svodka
          fetch-depth: 0
          persist-credentials: true

      - name: Require verified predecessor canary message 28
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          ledger = json.load(open(os.environ['PREDECESSOR_LEDGER_PATH'], encoding='utf-8'))
          assert ledger['release_id'] == 'svodka-rich-v2-successor-2026-08'
          entry = ledger['entries']['svodka-rich-goldfish-three-second-memory-myth']
          assert entry['state'] == 'published'
          assert entry['provider_effect'] == 'verified'
          assert entry['dispatch_mode'] == 'canary'
          assert entry['message_id'] == 28
          assert entry['message_url'] == 'https://t.me/deep_info_life/28'
          assert entry['error'] is None
          PY

      - name: Create or validate fresh v3 ledger
        run: |
          set -euo pipefail
          python -m video_channel_manager.svodka_rich_successor_v3 ensure-ledger \
            --release "$RELEASE_PATH" --root . --ledger "$LEDGER_PATH"
          if git -C "$STATE_DIR" diff --quiet -- "$LEDGER_RELATIVE_PATH" && git -C "$STATE_DIR" ls-files --error-unmatch "$LEDGER_RELATIVE_PATH" >/dev/null 2>&1; then
            echo 'Exact v3 ledger already exists.'
          else
            git -C "$STATE_DIR" config user.name 'svodka-publisher[bot]'
            git -C "$STATE_DIR" config user.email 'svodka-publisher@users.noreply.github.com'
            git -C "$STATE_DIR" add -- "$LEDGER_RELATIVE_PATH"
            git -C "$STATE_DIR" commit -m "Initialize Svodka v3 finalizer ledger [skip ci]"
            git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          fi

      - name: Select fresh scheduled wombat publication
        id: select
        shell: bash
        run: |
          set +e
          python -m video_channel_manager.svodka_rich_successor_v3 select \
            --release "$RELEASE_PATH" --root . --ledger "$LEDGER_PATH" > .runtime/selection.json
          status=$?
          set -e
          if [[ "$status" == "3" ]]; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$status" == "0" ]] || exit "$status"
          python - <<'PY'
          import json, os
          data = json.load(open('.runtime/selection.json', encoding='utf-8'))
          assert data['dispatch_mode'] == 'scheduled'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('eligible=true\n')
              fh.write(f"publication_id={data['publication_id']}\n")
              fh.write(f"dispatch_mode={data['dispatch_mode']}\n")
          PY

      - name: Fresh exact Telegram target proof
        id: target
        if: steps.select.outputs.eligible == 'true'
        continue-on-error: true
        env:
          SVODKA_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set +e
          python -m video_channel_manager.telegram_channel_cli preflight \
            --profile "$PROFILE_PATH" \
            --expected-chat-id "$EXPECTED_CHAT_ID" \
            --expected-bot-id "$EXPECTED_BOT_ID" \
            --expected-bot-username "$EXPECTED_BOT_USERNAME" \
            --output "$TARGET_PROOF_PATH" \
            > .runtime/target-preflight.stdout 2> .runtime/target-preflight.stderr
          status=$?
          set -e
          cat .runtime/target-preflight.stdout
          cat .runtime/target-preflight.stderr >&2
          exit "$status"

      - name: Prove exact wombat media bytes read-only
        id: media
        if: steps.select.outputs.eligible == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m video_channel_manager.svodka_rich_successor_v3 media-proof \
            --release "$RELEASE_PATH" --root . \
            --publication-id "${{ steps.select.outputs.publication_id }}" \
            --output "$MEDIA_PROOF_PATH" \
            > .runtime/media-proof.stdout 2> .runtime/media-proof.stderr
          status=$?
          set -e
          cat .runtime/media-proof.stdout
          cat .runtime/media-proof.stderr >&2
          exit "$status"

      - name: Prepare durable v3 intent
        id: prepare
        if: >-
          steps.select.outputs.eligible == 'true' &&
          steps.target.outcome == 'success' &&
          steps.media.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m video_channel_manager.svodka_rich_successor_v3 prepare \
            --release "$RELEASE_PATH" --root . --ledger "$LEDGER_PATH" \
            --target-proof "$TARGET_PROOF_PATH" --media-proof "$MEDIA_PROOF_PATH" \
            --github-repository "$GITHUB_REPOSITORY" --github-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --intent-output "$INTENT_PATH" \
            > .runtime/prepare.stdout 2> .runtime/prepare.stderr
          status=$?
          set -e
          cat .runtime/prepare.stdout
          cat .runtime/prepare.stderr >&2
          exit "$status"

      - name: Persist v3 pre-intent diagnostics before provider boundary
        if: always() && steps.select.outputs.eligible == 'true'
        env:
          TARGET_OUTCOME: ${{ steps.target.outcome }}
          MEDIA_OUTCOME: ${{ steps.media.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          PUBLICATION_ID: ${{ steps.select.outputs.publication_id }}
          DISPATCH_MODE: ${{ steps.select.outputs.dispatch_mode }}
          DIAGNOSTIC_ABS: ${{ env.STATE_DIR }}/content/telegram/svodka/rich-successor-v3-preintent/${{ github.run_id }}-${{ github.run_attempt }}/diagnostic.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$DIAGNOSTIC_ABS")"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def text(path: str) -> str:
              value = Path(path)
              if not value.exists():
                  return ''
              return value.read_text(encoding='utf-8', errors='replace')[-6000:]

          payload = {
              'schema_name': 'video-channel-manager.svodka-rich-v3-preintent-diagnostic',
              'schema_version': 1,
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'github_sha': os.environ['GITHUB_SHA'],
              'publication_id': os.environ['PUBLICATION_ID'],
              'dispatch_mode': os.environ['DISPATCH_MODE'],
              'target_outcome': os.environ['TARGET_OUTCOME'],
              'media_outcome': os.environ['MEDIA_OUTCOME'],
              'prepare_outcome': os.environ['PREPARE_OUTCOME'],
              'target_stdout': text('.runtime/target-preflight.stdout'),
              'target_stderr': text('.runtime/target-preflight.stderr'),
              'media_stdout': text('.runtime/media-proof.stdout'),
              'media_stderr': text('.runtime/media-proof.stderr'),
              'prepare_stdout': text('.runtime/prepare.stdout'),
              'prepare_stderr': text('.runtime/prepare.stderr'),
              'provider_write_performed': False,
          }
          Path(os.environ['DIAGNOSTIC_ABS']).write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit durable v3 pre-intent diagnostic
        if: always() && steps.select.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_rel="content/telegram/svodka/rich-successor-v3-preintent/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/diagnostic.json"
          git -C "$STATE_DIR" config user.name 'svodka-publisher[bot]'
          git -C "$STATE_DIR" config user.email 'svodka-publisher@users.noreply.github.com'
          git -C "$STATE_DIR" add -- "$diagnostic_rel"
          git -C "$STATE_DIR" diff --cached --quiet && { echo 'V3 pre-intent diagnostic produced no durable delta.' >&2; exit 3; }
          git -C "$STATE_DIR" commit -m "Record Svodka v3 pre-intent diagnostic $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT [skip ci]"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"

      - name: Stop before provider boundary if v3 pre-intent proof failed
        if: >-
          always() && steps.select.outputs.eligible == 'true' &&
          (steps.target.outcome != 'success' ||
           steps.media.outcome != 'success' ||
           steps.prepare.outcome != 'success')
        run: |
          echo 'V3 pre-intent proof failed; durable diagnostic was recorded and no Telegram mutation is authorized.' >&2
          exit 1

      - name: Persist intent before Telegram mutation
        if: >-
          steps.select.outputs.eligible == 'true' &&
          steps.target.outcome == 'success' &&
          steps.media.outcome == 'success' &&
          steps.prepare.outcome == 'success'
        run: |
          set -euo pipefail
          evidence_rel="content/telegram/svodka/rich-successor-v3-dispatches/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          evidence_abs="$STATE_DIR/$evidence_rel"
          mkdir -p "$evidence_abs"
          cp -- "$INTENT_PATH" "$evidence_abs/intent.json"
          cp -- "$TARGET_PROOF_PATH" "$evidence_abs/target-proof.json"
          cp -- "$MEDIA_PROOF_PATH" "$evidence_abs/media-proof.json"
          git -C "$STATE_DIR" config user.name 'svodka-publisher[bot]'
          git -C "$STATE_DIR" config user.email 'svodka-publisher@users.noreply.github.com'
          git -C "$STATE_DIR" add -- "$LEDGER_RELATIVE_PATH" "$evidence_rel"
          git -C "$STATE_DIR" diff --cached --quiet && { echo 'V3 intent produced no durable delta.' >&2; exit 3; }
          git -C "$STATE_DIR" commit -m "Record Svodka v3 intent $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT [skip ci]"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          git -C "$STATE_DIR" show "HEAD:$evidence_rel/intent.json" > .runtime/remote-intent.json
          git -C "$STATE_DIR" show "HEAD:$evidence_rel/media-proof.json" > .runtime/remote-media-proof.json
          cmp --silent "$INTENT_PATH" .runtime/remote-intent.json
          cmp --silent "$MEDIA_PROOF_PATH" .runtime/remote-media-proof.json

      - name: Re-fetch identical media immediately before mutation
        if: steps.select.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          python -m video_channel_manager.svodka_rich_successor_v3 media-proof \
            --release "$RELEASE_PATH" --root . \
            --publication-id "${{ steps.select.outputs.publication_id }}" \
            --expected .runtime/remote-media-proof.json \
            --output "$MEDIA_RECHECK_PATH"

      - name: Send exactly one successor Rich Message
        if: steps.select.outputs.eligible == 'true'
        id: send
        env:
          SVODKA_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set +e
          python -m video_channel_manager.svodka_rich_successor_v3 send \
            --release "$RELEASE_PATH" --root . \
            --intent .runtime/remote-intent.json \
            --target-proof "$TARGET_PROOF_PATH" \
            --media-recheck "$MEDIA_RECHECK_PATH" \
            --outcome "$OUTCOME_PATH"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Apply provider outcome and persist terminal v3 state
        if: steps.select.outputs.eligible == 'true'
        id: apply
        shell: bash
        run: |
          set +e
          python -m video_channel_manager.svodka_rich_successor_v3 apply \
            --release "$RELEASE_PATH" --root . --ledger "$LEDGER_PATH" \
            --intent .runtime/remote-intent.json --outcome "$OUTCOME_PATH"
          apply_status=$?
          set -e
          evidence_rel="content/telegram/svodka/rich-successor-v3-dispatches/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp -- "$OUTCOME_PATH" "$STATE_DIR/$evidence_rel/outcome.json"
          git -C "$STATE_DIR" add -- "$LEDGER_RELATIVE_PATH" "$evidence_rel/outcome.json"
          git -C "$STATE_DIR" commit -m "Record Svodka v3 outcome $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT [skip ci]"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          echo "exit_code=$apply_status" >> "$GITHUB_OUTPUT"
          [[ "${{ steps.send.outputs.exit_code }}" == '0' && "$apply_status" == '0' ]]

      - name: Prove fresh v3 finalizer is terminal verified
        if: steps.select.outputs.eligible == 'true' && steps.apply.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          ledger = json.load(open(os.environ['LEDGER_PATH'], encoding='utf-8'))
          assert ledger['release_id'] == 'svodka-rich-v3-finalizer-2026-08'
          entries = list(ledger['entries'].values())
          assert len(entries) == 1
          entry = entries[0]
          assert entry['publication_id'] == 'svodka-rich-wombat-cubic-poop'
          assert entry['state'] == 'published'
          assert entry['provider_effect'] == 'verified'
          assert entry['dispatch_mode'] == 'scheduled'
          assert isinstance(entry['message_id'], int) and entry['message_id'] > 0
          assert entry['message_url'] == f"https://t.me/deep_info_life/{entry['message_id']}"
          assert entry['error'] is None
          PY
