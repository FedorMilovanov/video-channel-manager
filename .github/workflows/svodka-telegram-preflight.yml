name: Svodka Telegram preview and preflight

on:
  workflow_dispatch:
    inputs:
      action:
        description: Preview, discover exact target, or run pinned read-only Telegram preflight
        required: true
        default: preview
        type: choice
        options:
          - preview
          - discover
          - preflight
      sequence:
        description: Svodka draft sequence to preview
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: svodka-telegram-preflight
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PROFILE_PATH: content/telegram/channels/svodka.json
      QUEUE_PATH: content/telegram/svodka/draft-14-posts-2026-08.json
      CANDIDATE_PATH: .runtime/svodka-release-candidate.json
      SVODKA_TELEGRAM_CHAT_ID: ${{ vars.SVODKA_TELEGRAM_CHAT_ID }}
      SVODKA_TELEGRAM_BOT_ID: ${{ vars.SVODKA_TELEGRAM_BOT_ID || vars.LORDCHRIST_TELEGRAM_BOT_ID }}
      SVODKA_TELEGRAM_BOT_USERNAME: ${{ vars.SVODKA_TELEGRAM_BOT_USERNAME || vars.LORDCHRIST_TELEGRAM_BOT_USERNAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install minimal Telegram runtime
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt

      - name: Validate channel profile
        run: python -m video_channel_manager.telegram_channel_cli validate-profile --profile "$PROFILE_PATH"

      - name: Validate immutable draft inputs
        run: python -m video_channel_manager.telegram_channel_cli validate-svodka --profile "$PROFILE_PATH" --queue "$QUEUE_PATH"

      - name: Build exact write-disabled release candidate
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python -m video_channel_manager.telegram_channel_cli build-svodka-candidate \
            --profile "$PROFILE_PATH" \
            --queue "$QUEUE_PATH" \
            --release-id svodka-pilot-2026-08-candidate \
            --output "$CANDIDATE_PATH"

      - name: Preview exact deterministic payload
        env:
          PREVIEW_SEQUENCE: ${{ inputs.sequence }}
        run: |
          set -euo pipefail
          [[ "$PREVIEW_SEQUENCE" =~ ^[1-9][0-9]*$ ]] || {
            echo "sequence must be a positive integer" >&2
            exit 2
          }
          python -m video_channel_manager.telegram_channel_cli preview-svodka \
            --profile "$PROFILE_PATH" \
            --queue "$QUEUE_PATH" \
            --sequence "$PREVIEW_SEQUENCE"

      - name: Validate shared bot identity inputs
        if: inputs.action == 'discover' || inputs.action == 'preflight'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SVODKA_TELEGRAM_BOT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "SVODKA_TELEGRAM_BOT_ID/LORDCHRIST_TELEGRAM_BOT_ID must resolve to an exact positive integer" >&2
            exit 2
          }
          [[ "$SVODKA_TELEGRAM_BOT_USERNAME" =~ ^[A-Za-z0-9_]+$ ]] || {
            echo "SVODKA_TELEGRAM_BOT_USERNAME/LORDCHRIST_TELEGRAM_BOT_USERNAME is invalid" >&2
            exit 2
          }

      - name: Discover exact Svodka target read-only
        if: inputs.action == 'discover'
        env:
          SVODKA_TELEGRAM_BOT_TOKEN: ${{ secrets.SVODKA_TELEGRAM_BOT_TOKEN || secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python -m video_channel_manager.telegram_channel_cli discover-target \
            --profile "$PROFILE_PATH" \
            --expected-bot-id "$SVODKA_TELEGRAM_BOT_ID" \
            --expected-bot-username "$SVODKA_TELEGRAM_BOT_USERNAME" \
            --output .runtime/svodka-target-discovery.json
          echo "Read-only Svodka discovery passed. No Telegram provider mutation was attempted."

      - name: Upload discovered target proof
        if: inputs.action == 'discover'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: svodka-target-discovery
          path: .runtime/svodka-target-discovery.json
          if-no-files-found: error

      - name: Validate exact pinned preflight variables
        if: inputs.action == 'preflight'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SVODKA_TELEGRAM_CHAT_ID" =~ ^-?[0-9]+$ ]] || {
            echo "SVODKA_TELEGRAM_CHAT_ID must be an exact signed integer" >&2
            exit 2
          }
          (( SVODKA_TELEGRAM_CHAT_ID < 0 )) || {
            echo "SVODKA_TELEGRAM_CHAT_ID must be negative" >&2
            exit 2
          }

      - name: Run pinned read-only Telegram target preflight
        if: inputs.action == 'preflight'
        env:
          SVODKA_TELEGRAM_BOT_TOKEN: ${{ secrets.SVODKA_TELEGRAM_BOT_TOKEN || secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python -m video_channel_manager.telegram_channel_cli preflight \
            --profile "$PROFILE_PATH" \
            --expected-chat-id "$SVODKA_TELEGRAM_CHAT_ID" \
            --expected-bot-id "$SVODKA_TELEGRAM_BOT_ID" \
            --expected-bot-username "$SVODKA_TELEGRAM_BOT_USERNAME" \
            --output .runtime/svodka-target-proof.json
          echo "Pinned read-only Svodka preflight passed. No Telegram provider mutation was attempted."

      - name: Upload pinned target proof
        if: inputs.action == 'preflight'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: svodka-target-proof
          path: .runtime/svodka-target-proof.json
          if-no-files-found: error
