name: Milovi Cake Telegram one-off canary

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Exact one-off execution confirmation
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: milovi-cake-telegram-publisher
  cancel-in-progress: false

jobs:
  publish-oneoff-canary:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PROFILE_PATH: content/telegram/channels/milovi-cake.json
      BINDING_PATH: content/telegram/channels/milovi-cake-target-binding.json
      RELEASE_PATH: content/telegram/milovi-cake/oneoff-canary-authorized-release-2026-08-18.json
      EXECUTION_AUTH_PATH: content/telegram/milovi-cake/oneoff-canary-execution-authorization-2026-08-18.json
      TRANSPORT_PROOF_PATH: content/telegram/milovi-cake/bootstrap-photo-transport-proof-2026-08.json
      STATE_BRANCH: state/milovi-cake-telegram
      STATE_DIR: .state/milovi-cake
      LEDGER_RELATIVE_PATH: content/telegram/milovi-cake/oneoff-canary-2026-08-18/publication-ledger.json
      LEDGER_PATH: .state/milovi-cake/content/telegram/milovi-cake/oneoff-canary-2026-08-18/publication-ledger.json
      TARGET_PROOF_PATH: .runtime/milovi-oneoff-target-proof.json
      ENVELOPE_PATH: .runtime/milovi-oneoff-dispatch.json
      OUTCOME_PATH: .runtime/milovi-oneoff-outcome.json
      PUBLICATION_ID: milovi-canary-20260818-001
      EXPECTED_CONFIRM: PUBLISH:@MiloviCake:milovi-canary-20260818-001
      MAX_PUBLICATION_LAG_MINUTES: 120

    steps:
      - name: Check out immutable current-main runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install minimal Telegram runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            -r requirements/telegram-publisher.txt

      - name: Resolve exact one-off execution authorization before provider access
        id: activation
        env:
          MANUAL_CONFIRM: ${{ inputs.confirm }}
          EVENT_NAME: ${{ github.event_name }}
        shell: python
        run: |
          from __future__ import annotations

          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from video_channel_manager.telegram_channel_profile import load_channel_profile
          from video_channel_manager.telegram_multichannel_release import load_release
          from video_channel_manager.telegram_multichannel_transport import GenericPhotoPayload
          from video_channel_manager.telegram_target_binding import load_target_binding

          profile = load_channel_profile(Path(os.environ["PROFILE_PATH"]))
          binding = load_target_binding(Path(os.environ["BINDING_PATH"]), profile)
          release = load_release(Path(os.environ["RELEASE_PATH"]))
          authorization = json.loads(Path(os.environ["EXECUTION_AUTH_PATH"]).read_text(encoding="utf-8"))
          blockers = []

          if os.environ["EVENT_NAME"] != "workflow_dispatch":
              blockers.append("provider_workflow_requires_workflow_dispatch")
          if os.environ["MANUAL_CONFIRM"] != os.environ["EXPECTED_CONFIRM"]:
              blockers.append("exact_confirmation_missing_or_mismatched")
          if profile.project_key != "milovi-cake" or profile.channel_username.casefold() != "@milovicake":
              blockers.append("profile_identity_drift")
          if not profile.provider_writes_authorized:
              blockers.append("profile_write_gate_disabled")
          if profile.daily_verified_limit != 2:
              blockers.append("daily_limit_drift")
          if (
              binding.chat_id != -1002215328390
              or binding.bot_id != 8716602202
              or binding.bot_username.casefold() != "preaching_mp3_bot"
          ):
              blockers.append("target_binding_identity_drift")
          if not release.release_authorized:
              blockers.append("release_not_authorized")
          if release.release_id != "milovi-oneoff-canary-2026-08-18" or len(release.items) != 1:
              blockers.append("oneoff_release_shape_drift")
          else:
              item = release.items[0]
              if item.publication_id != os.environ["PUBLICATION_ID"]:
                  blockers.append("oneoff_publication_identity_drift")
              if item.scheduled_at.isoformat() != "2026-08-18T16:10:00+03:00":
                  blockers.append("oneoff_schedule_drift")
              if not isinstance(item.payload, GenericPhotoPayload):
                  blockers.append("oneoff_payload_is_not_photo")
              elif (
                  item.payload.provider_payload_sha256
                  != "sha256:60ba1bdd1e9a05d6bb7620951a5861140c253477c533be25d3aabe362c96cdef"
                  or item.payload.media_sha256
                  != "sha256:8bb0956e44084265d7a3a14ce01f96eb1e4a9c327c780448de34e068f6cf6f10"
              ):
                  blockers.append("oneoff_payload_or_media_drift")
          if (
              release.target_binding_sha256 != binding.digest
              or release.chat_id != binding.chat_id
              or release.bot_id != binding.bot_id
              or (release.bot_username or "").casefold() != binding.bot_username.casefold()
          ):
              blockers.append("release_target_binding_drift")

          expected_auth = {
              "schema_name": "video-channel-manager.telegram-oneoff-execution-authorization",
              "schema_version": 1,
              "project_key": "milovi-cake",
              "channel_username": "@MiloviCake",
              "release_id": release.release_id,
              "release_digest": release.digest,
              "publication_id": os.environ["PUBLICATION_ID"],
              "provider_payload_sha256": "sha256:60ba1bdd1e9a05d6bb7620951a5861140c253477c533be25d3aabe362c96cdef",
              "media_sha256": "sha256:8bb0956e44084265d7a3a14ce01f96eb1e4a9c327c780448de34e068f6cf6f10",
              "target_binding_sha256": binding.digest,
              "chat_id": binding.chat_id,
              "bot_id": binding.bot_id,
              "bot_username": binding.bot_username,
          }
          for key, expected in expected_auth.items():
              actual = authorization.get(key)
              if isinstance(expected, str) and key in {"channel_username", "bot_username"}:
                  matches = str(actual).casefold() == expected.casefold()
              else:
                  matches = actual == expected
              if not matches:
                  blockers.append(f"execution_authorization_{key}_drift")

          if authorization.get("execution_authorized") is not True:
              blockers.append("execution_not_authorized")
          if authorization.get("automatic_dispatch_authorized") is not True:
              blockers.append("automatic_dispatch_not_authorized")
          if authorization.get("max_provider_attempts") != 1 or authorization.get("blind_mutation_retries") != 0:
              blockers.append("attempt_or_retry_policy_drift")
          if authorization.get("supersedes_publication_id") != "milovi-bootstrap-003":
              blockers.append("superseded_identity_drift")
          if authorization.get("supersedes_only_if_prior_intent_absent") is not True:
              blockers.append("supersede_safety_drift")

          now = datetime.now(ZoneInfo("Europe/Moscow"))
          try:
              not_before = datetime.fromisoformat(authorization["execute_not_before"])
              not_after = datetime.fromisoformat(authorization["execute_not_after"])
          except Exception:
              blockers.append("execution_window_invalid")
          else:
              if now < not_before:
                  blockers.append("oneoff_not_due")
              if now >= not_after:
                  blockers.append("oneoff_too_stale")

          active = not blockers
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"active={'true' if active else 'false'}\n")
              output.write(f"reason={','.join(blockers) if blockers else 'authorized'}\n")
          print(json.dumps({
              "active": active,
              "reason": blockers,
              "release_digest": release.digest,
              "publication_id": os.environ["PUBLICATION_ID"],
              "moscow_now": now.isoformat(),
              "provider_access_performed": False,
          }, ensure_ascii=False))

      - name: Report inactive one-off canary
        if: steps.activation.outputs.active != 'true'
        run: echo "Milovi one-off canary is inert — ${{ steps.activation.outputs.reason }}. No Telegram access was attempted."

      - name: Require exact current-main one-off quality and media proofs
        if: steps.activation.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow ci.yml \
            --sha "$GITHUB_SHA"
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow milovi-telegram-oneoff-canary-quality.yml \
            --sha "$GITHUB_SHA"
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow milovi-telegram-bootstrap-media-proof.yml \
            --sha "$GITHUB_SHA"

      - name: Check out isolated durable Milovi state branch
        if: steps.activation.outputs.active == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state/milovi-cake-telegram
          path: .state/milovi-cake
          fetch-depth: 0
          persist-credentials: true

      - name: Require existing exact one-off ledger
        if: steps.activation.outputs.active == 'true'
        id: ledger
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$LEDGER_PATH" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=oneoff_ledger_missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m video_channel_manager.telegram_multichannel_cli validate-ledger \
            --release "$RELEASE_PATH" \
            --ledger "$LEDGER_PATH"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "reason=ledger_valid" >> "$GITHUB_OUTPUT"

      - name: Require fresh exact one-off slot before Telegram access
        if: steps.activation.outputs.active == 'true' && steps.ledger.outputs.ready == 'true'
        id: freshness
        shell: bash
        run: |
          set +e
          python -m video_channel_manager.telegram_publication_freshness next \
            --release "$RELEASE_PATH" \
            --ledger "$LEDGER_PATH" \
            --publication-id "$PUBLICATION_ID" \
            --max-lag-minutes "$MAX_PUBLICATION_LAG_MINUTES"
          status=$?
          set -e
          if [[ "$status" == "3" ]]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$status" == "0" ]] || exit "$status"
          echo "fresh=true" >> "$GITHUB_OUTPUT"

      - name: Fresh exact target preflight
        if: steps.activation.outputs.active == 'true' && steps.ledger.outputs.ready == 'true' && steps.freshness.outputs.fresh == 'true'
        env:
          MILOVI_CAKE_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python -m video_channel_manager.telegram_channel_cli preflight \
            --profile "$PROFILE_PATH" \
            --expected-chat-id -1002215328390 \
            --expected-bot-id 8716602202 \
            --expected-bot-username preaching_mp3_bot \
            --output "$TARGET_PROOF_PATH"

      - name: Prepare one durable exact one-off intent
        if: steps.activation.outputs.active == 'true' && steps.ledger.outputs.ready == 'true' && steps.freshness.outputs.fresh == 'true'
        id: prepare
        shell: bash
        run: |
          set +e
          python -m video_channel_manager.telegram_multichannel_cli prepare \
            --profile "$PROFILE_PATH" \
            --release "$RELEASE_PATH" \
            --ledger "$LEDGER_PATH" \
            --target-proof "$TARGET_PROOF_PATH" \
            --mode manual \
            --publication-id "$PUBLICATION_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-sha "$GITHUB_SHA" \
            --github-workflow-sha "${{ github.workflow_sha }}" \
            --envelope-output "$ENVELOPE_PATH"
          status=$?
          set -e
          if [[ "$status" == "3" ]]; then
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$status" == "0" ]] || exit "$status"
          echo "prepared=true" >> "$GITHUB_OUTPUT"

      - name: Persist one-off intent and target proof before provider mutation
        if: steps.prepare.outputs.prepared == 'true'
        id: persist_intent
        shell: bash
        run: |
          set -euo pipefail
          evidence_rel_dir="content/telegram/milovi-cake/oneoff-canary-2026-08-18/dispatches/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          evidence_abs_dir="$STATE_DIR/$evidence_rel_dir"
          mkdir -p "$evidence_abs_dir"
          cp -- "$ENVELOPE_PATH" "$evidence_abs_dir/dispatch.json"
          cp -- "$TARGET_PROOF_PATH" "$evidence_abs_dir/target-proof.json"

          git -C "$STATE_DIR" config user.name "milovi-telegram-publisher[bot]"
          git -C "$STATE_DIR" config user.email "milovi-telegram-publisher@users.noreply.github.com"
          git -C "$STATE_DIR" add -- "$LEDGER_RELATIVE_PATH" "$evidence_rel_dir"
          git -C "$STATE_DIR" diff --cached --quiet && {
            echo "prepared Milovi one-off canary produced no durable state delta" >&2
            exit 3
          }
          git -C "$STATE_DIR" commit -m "Record Milovi one-off Telegram intent for run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT [skip ci]"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || {
            echo "remote state branch does not contain exact Milovi one-off dispatch intent" >&2
            exit 3
          }
          git -C "$STATE_DIR" fetch --no-tags origin "$STATE_BRANCH"
          git -C "$STATE_DIR" show "origin/$STATE_BRANCH:$LEDGER_RELATIVE_PATH" > .runtime/remote-oneoff-ledger.json
          git -C "$STATE_DIR" show "origin/$STATE_BRANCH:$evidence_rel_dir/dispatch.json" > .runtime/remote-oneoff-dispatch.json
          python -m video_channel_manager.telegram_multichannel_cli verify-intent \
            --release "$RELEASE_PATH" \
            --ledger .runtime/remote-oneoff-ledger.json \
            --envelope .runtime/remote-oneoff-dispatch.json
          echo "evidence_rel_dir=$evidence_rel_dir" >> "$GITHUB_OUTPUT"

      - name: Re-prove exact current-main quality immediately before provider mutation
        if: steps.prepare.outputs.prepared == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow ci.yml \
            --sha "$GITHUB_SHA"
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow milovi-telegram-oneoff-canary-quality.yml \
            --sha "$GITHUB_SHA"
          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow milovi-telegram-bootstrap-media-proof.yml \
            --sha "$GITHUB_SHA"

      - name: Materialize exact reviewed photo bytes
        if: steps.prepare.outputs.prepared == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: Pillow==11.3.0
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          from video_channel_manager.milovi_telegram_bootstrap import materialize_exact_photo
          from video_channel_manager.telegram_multichannel_release import load_release
          from video_channel_manager.telegram_multichannel_state import GenericDispatchEnvelope
          from video_channel_manager.telegram_multichannel_transport import GenericPhotoPayload

          release = load_release(Path(os.environ["RELEASE_PATH"]))
          envelope = GenericDispatchEnvelope.model_validate_json(
              Path(os.environ["ENVELOPE_PATH"]).read_text(encoding="utf-8")
          )
          item = next(item for item in release.items if item.publication_id == envelope.publication_id)
          if not isinstance(item.payload, GenericPhotoPayload):
              raise SystemExit("one-off canary payload is not a photo")

          proof = json.loads(Path(os.environ["TRANSPORT_PROOF_PATH"]).read_text(encoding="utf-8"))
          media_id = Path(item.payload.media_filename).stem
          media = next(candidate for candidate in proof["photos"] if candidate["media_id"] == media_id)
          safe_path = "/".join(
              urllib.parse.quote(part, safe="") for part in media["source_path"].split("/")
          )
          url = (
              f"https://raw.githubusercontent.com/{proof['source_repository']}/"
              f"{proof['source_commit']}/{safe_path}"
          )
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "video-channel-manager-milovi-oneoff-canary/1"},
          )
          source_path = Path(".runtime/milovi-oneoff-source.webp")
          with urllib.request.urlopen(request, timeout=30) as response:
              source_path.write_bytes(response.read())
          result = materialize_exact_photo(
              transport_proof_path=Path(os.environ["TRANSPORT_PROOF_PATH"]),
              media_id=media_id,
              source_path=source_path,
              output_path=Path(item.payload.media_path),
          )
          if result["transport_sha256"] != item.payload.media_sha256:
              raise SystemExit("materialized one-off media digest differs from authorized release")
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Send exactly once through generic Telegram runtime
        if: steps.prepare.outputs.prepared == 'true'
        id: send
        env:
          MILOVI_CAKE_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set +e
          python -m video_channel_manager.telegram_multichannel_cli send-once \
            --profile "$PROFILE_PATH" \
            --release "$RELEASE_PATH" \
            --ledger "$LEDGER_PATH" \
            --envelope "$ENVELOPE_PATH" \
            --outcome-output "$OUTCOME_PATH"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [[ -f "$OUTCOME_PATH" ]] || {
            echo "provider runtime did not persist an outcome; durable intent remains non-replayable" >&2
            exit 5
          }

      - name: Apply provider outcome and persist final state
        if: steps.prepare.outputs.prepared == 'true' && always() && steps.send.outputs.status != ''
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_multichannel_cli apply-outcome \
            --release "$RELEASE_PATH" \
            --ledger "$LEDGER_PATH" \
            --envelope "$ENVELOPE_PATH" \
            --outcome "$OUTCOME_PATH"

          evidence_rel_dir="${{ steps.persist_intent.outputs.evidence_rel_dir }}"
          evidence_abs_dir="$STATE_DIR/$evidence_rel_dir"
          cp -- "$OUTCOME_PATH" "$evidence_abs_dir/outcome.json"
          git -C "$STATE_DIR" add -- "$LEDGER_RELATIVE_PATH" "$evidence_rel_dir/outcome.json"
          git -C "$STATE_DIR" commit -m "Record Milovi one-off Telegram outcome for run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT [skip ci]"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || {
            echo "remote state branch does not contain exact Milovi one-off provider outcome" >&2
            exit 3
          }

          status="${{ steps.send.outputs.status }}"
          if [[ "$status" != "0" ]]; then
            echo "Telegram send was not verified; exact outcome is durable and blind replay is blocked." >&2
            exit "$status"
