name: Svodka one-time state hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/svodka-state-hardening-once.yml

permissions:
  contents: write

concurrency:
  group: svodka-state-hardening-once
  cancel-in-progress: false

jobs:
  patch-test-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install dev runtime
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Bind state preparation to exact release target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/video_channel_manager/telegram_multichannel_state.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _require_target(profile: TelegramChannelProfile, target: GenericTargetProof, now: datetime) -> None:
              if target.project_key != profile.project_key or target.profile_sha256 != profile.digest:
                  raise ValueError("target proof differs from selected Telegram channel profile")
              if target.channel_username.casefold() != profile.channel_username.casefold():
                  raise ValueError("target proof channel differs from selected Telegram channel profile")
              if target.chat_username.casefold() != profile.bare_username.casefold() or target.chat_type != "channel":
                  raise ValueError("target proof does not resolve the selected Telegram channel")
              age = now - target.checked_at_utc.astimezone(UTC)
              if age < -timedelta(minutes=1) or age > timedelta(minutes=15):
                  raise ValueError("target proof is stale or has an invalid future timestamp")
          '''.replace("          ", "")
          new = '''def _require_target(
              profile: TelegramChannelProfile,
              release: GenericReleaseQueue,
              target: GenericTargetProof,
              now: datetime,
          ) -> None:
              if target.project_key != profile.project_key or target.profile_sha256 != profile.digest:
                  raise ValueError("target proof differs from selected Telegram channel profile")
              if target.channel_username.casefold() != profile.channel_username.casefold():
                  raise ValueError("target proof channel differs from selected Telegram channel profile")
              if target.chat_username.casefold() != profile.bare_username.casefold() or target.chat_type != "channel":
                  raise ValueError("target proof does not resolve the selected Telegram channel")
              if release.chat_id is None or release.bot_id is None or release.bot_username is None:
                  raise ValueError("authorized release is missing exact Telegram target identity")
              if (
                  target.chat_id != release.chat_id
                  or target.bot_id != release.bot_id
                  or target.bot_username.casefold() != release.bot_username.casefold()
              ):
                  raise ValueError("target proof differs from release-bound Telegram target")
              age = now - target.checked_at_utc.astimezone(UTC)
              if age < -timedelta(minutes=1) or age > timedelta(minutes=15):
                  raise ValueError("target proof is stale or has an invalid future timestamp")
          '''.replace("          ", "")
          if old not in text:
              raise SystemExit("expected _require_target block not found exactly")
          text = text.replace(old, new, 1)
          call_old = "    _require_target(profile, target, prepared_at)\n"
          call_new = "    _require_target(profile, release, target, prepared_at)\n"
          if call_old not in text:
              raise SystemExit("expected _require_target call not found exactly")
          text = text.replace(call_old, call_new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          ruff format \
            src/video_channel_manager/telegram_multichannel_release.py \
            src/video_channel_manager/telegram_multichannel_state.py \
            src/video_channel_manager/svodka_release.py \
            src/video_channel_manager/telegram_channel_cli.py \
            tests/test_telegram_multichannel_state.py \
            tests/test_svodka_release_review.py
          ruff check \
            src/video_channel_manager/telegram_multichannel_release.py \
            src/video_channel_manager/telegram_multichannel_state.py \
            src/video_channel_manager/svodka_release.py \
            src/video_channel_manager/telegram_channel_cli.py \
            tests/test_telegram_multichannel_state.py \
            tests/test_svodka_release_review.py
          python -m pytest -q tests/test_telegram_multichannel_state.py tests/test_svodka_release_review.py

      - name: Commit hardening and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/svodka-state-hardening-once.yml
          git add src/video_channel_manager tests
          git commit -m "Require release-bound Telegram identity before generic dispatch"
          git push origin HEAD:main
