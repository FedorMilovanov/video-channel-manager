name: YouTube executor static fix once

on:
  push:
    branches:
      - agent/youtube-release-executor-rebased
    paths:
      - .github/workflows/youtube-executor-static-fix-once.yml

permissions:
  contents: write

jobs:
  fix-and-self-remove:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/youtube-release-executor-rebased
          fetch-depth: 1

      - name: Apply exact static fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          operations = Path('src/video_channel_manager/youtube_release_operations.py')
          text = operations.read_text(encoding='utf-8')
          old = 'import argparse\nimport json\nfrom pathlib import Path\nfrom typing import Any, Protocol\n'
          new = 'import argparse\nimport json\nfrom collections.abc import Callable\nfrom pathlib import Path\nfrom typing import Any, Protocol\n'
          if old not in text:
              raise SystemExit('operations import anchor not found')
          text = text.replace(old, new, 1)
          old = '    client_builder=build_readonly_client,\n'
          new = '    client_builder: Callable[[str], ReadOnlyYouTubeClient] = build_readonly_client,\n'
          if old not in text:
              raise SystemExit('client_builder anchor not found')
          text = text.replace(old, new, 1)
          operations.write_text(text, encoding='utf-8')

          tests = Path('tests/test_youtube_release_operations.py')
          text = tests.read_text(encoding='utf-8')
          old = '    with pytest.raises(Exception):\n'
          new = '    with pytest.raises(UploadPlanError):\n'
          if old not in text:
              raise SystemExit('pytest.raises anchor not found')
          text = text.replace(old, new, 1)
          tests.write_text(text, encoding='utf-8')
          PY

      - name: Format and lint exact changed surfaces
        run: |
          python -m pip install 'ruff==0.16.2'
          ruff format src/video_channel_manager/youtube_release_operations.py tests/test_youtube_release_operations.py
          ruff check src/video_channel_manager/youtube_release_operations.py tests/test_youtube_release_operations.py

      - name: Commit fixes and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/youtube-executor-static-fix-once.yml
          git add src/video_channel_manager/youtube_release_operations.py tests/test_youtube_release_operations.py
          git commit -m 'Fix YouTube executor static contracts'
          git push origin HEAD:agent/youtube-release-executor-rebased
