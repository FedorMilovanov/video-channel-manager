name: Format YouTube comments once

on:
  push:
    branches:
      - feature/youtube-comment-publishing-v1

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[youtube-comment-format-2]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/youtube-comment-publishing-v1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff>=0.9,<1"
      - name: Format feature files
        run: |
          ruff format \
            scripts/apply_youtube_comment_plan.py \
            scripts/audit_youtube_comments.py \
            scripts/build_youtube_comment_editorial_queue.py \
            scripts/build_youtube_comment_plan.py \
            src/video_channel_manager/platforms/youtube/comment_content.py \
            src/video_channel_manager/platforms/youtube/comment_plan.py \
            src/video_channel_manager/platforms/youtube/comments.py \
            tests/test_youtube_comment_content.py \
            tests/test_youtube_comment_plan.py \
            tests/test_youtube_comments.py
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/apply_youtube_comment_plan.py \
            scripts/audit_youtube_comments.py \
            scripts/build_youtube_comment_editorial_queue.py \
            scripts/build_youtube_comment_plan.py \
            src/video_channel_manager/platforms/youtube/comment_content.py \
            src/video_channel_manager/platforms/youtube/comment_plan.py \
            src/video_channel_manager/platforms/youtube/comments.py \
            tests/test_youtube_comment_content.py \
            tests/test_youtube_comment_plan.py \
            tests/test_youtube_comments.py
          git commit -m "Format sourced YouTube comment workflow [youtube-comment-format-2]"
          git push origin HEAD:feature/youtube-comment-publishing-v1
