name: Svodka one-time consolidation repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/svodka-consolidation-repair-once.yml

permissions:
  contents: write

concurrency:
  group: svodka-consolidation-repair-once
  cancel-in-progress: false

jobs:
  repair-validate-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PROFILE_PATH: content/telegram/channels/svodka.json
      BINDING_PATH: content/telegram/channels/svodka-target-binding.json
      QUEUE_PATH: content/telegram/svodka/draft-14-posts-2026-08.json
      CANDIDATE_PATH: content/telegram/svodka/review-candidate-2026-08.json
      PROOF_PATH: .runtime/svodka-repair-target-proof.json
      EXPECTED_CHAT_ID: -1003527567039
      EXPECTED_BOT_ID: 8716602202
      EXPECTED_BOT_USERNAME: preaching_mp3_bot
    steps:
      - name: Check out exact main head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install repository dev runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Apply reviewed Svodka wording and source corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["QUEUE_PATH"])
          queue = json.loads(path.read_text(encoding="utf-8"))
          posts = {post["publication_id"]: post for post in queue["posts"]}

          goldfish = posts["svodka-goldfish-three-second-memory-myth"]
          old_goldfish = (
              "В другом эксперименте рыб обучали сложным задачам различения десятки дней — "
              "их результат устойчиво рос значительно выше случайного угадывания."
          )
          new_goldfish = (
              "В другом эксперименте золотые рыбки освоили условные задачи различения, где правильный выбор "
              "зависел от показанного образца. Это демонстрирует реальное обучение, а не трёхсекундный «сброс» памяти."
          )
          if old_goldfish in goldfish["html_text"]:
              goldfish["html_text"] = goldfish["html_text"].replace(old_goldfish, new_goldfish)
          elif new_goldfish not in goldfish["html_text"]:
              raise SystemExit("goldfish wording drifted outside the reviewed old/new forms")

          eclipse = posts["svodka-2026-august-total-solar-eclipse"]
          old_eclipse = "Уже в среду полоса полной фазы пройдёт через <b>Гренландию, Исландию и Испанию</b>."
          new_eclipse = (
              "Уже в среду полоса полной фазы пройдёт через <b>север России, Гренландию, Исландию, Испанию "
              "и небольшой участок Португалии</b>. Во многих других районах Европы будет видна частичная фаза."
          )
          if old_eclipse in eclipse["html_text"]:
              eclipse["html_text"] = eclipse["html_text"].replace(old_eclipse, new_eclipse)
          elif new_eclipse not in eclipse["html_text"]:
              raise SystemExit("eclipse wording drifted outside the reviewed old/new forms")
          eclipse["sources"][0]["evidence"] = (
              "NASA's 2026 eclipse material places totality across Russia, Greenland, Iceland, Spain and Portugal "
              "and describes NASA-funded jet and balloon science during the eclipse."
          )

          crow = posts["svodka-crows-remember-human-faces"]
          crow["title"] = "Американские вороны помнят опасное лицо годами"
          crow["html_text"] = (
              "- Сводка -\n\n"
              "🧠🐦 <b>АМЕРИКАНСКИЕ ВОРОНЫ ПОМНЯТ ОПАСНОЕ ЧЕЛОВЕЧЕСКОЕ ЛИЦО — ГОДАМИ</b>\n\n"
              "В полевом эксперименте исследователи надевали одну и ту же необычную маску, когда ловили и кольцевали "
              "диких американских ворон в нескольких точках возле Сиэтла.\n\n"
              "После этого птицы значительно чаще ругали и атаковали людей именно в «опасной» маске. Узнавание "
              "сохранялось <b>как минимум 2,7 года</b>, несмотря на различия в росте, возрасте, поле и походке людей под маской.\n\n"
              "Это не означает, что каждая ворона хранит любое человеческое лицо навсегда. Но эксперимент показывает "
              "долговременное распознавание конкретного угрожающего визуального сигнала в дикой природе.\n\n"
              "📎 <a href=\"https://www.sciencedirect.com/science/article/pii/S0003347209005806\">"
              "Animal Behaviour, 2010 — оригинальное исследование</a>\n\n"
              "#Сводка #Вороны #Птицы #Память #Поведение #Наука"
          )
          crow["sources"] = [
              {
                  "url": "https://www.sciencedirect.com/science/article/pii/S0003347209005806",
                  "label": "Animal Behaviour, 2010 — original study",
                  "verified_on": "2026-08-08",
                  "evidence": (
                      "Field experiment showed wild American crows learned a threatening mask and continued to recognize "
                      "and scold it for at least 2.7 years; wording is limited to the tested threatening-face paradigm."
                  ),
              }
          ]

          banana = posts["svodka-quiz-banana-is-berry"]
          banana["quiz"]["explanation"] = (
              "Kew Gardens прямо указывает, что плод банана ботанически классифицируется как ягода."
          )
          banana["html_text"] = (
              "- Сводка -\n\n"
              "🍌🧠 <b>ТЕСТ: ЧТО ИЗ ЭТОГО БОТАНИЧЕСКИ ЯГОДА?</b>\n\n"
              "🔘 Банан\n🔘 Клубника\n🔘 Малина\n🔘 Вишня\n\n"
              "<b>Ответ: банан.</b>\n\n"
              "В быту «ягода» — это маленький сочный плод. В ботанике определение другое: учитывается то, как плод "
              "развивается из завязи цветка и как устроены его стенки.\n\n"
              "Kew Gardens прямо указывает, что плод банана ботанически относится к <b>ягодам</b>.\n\n"
              "📎 <a href=\"https://www.kew.org/plants/cavendish-banana\">Kew Gardens — Cavendish banana</a>\n\n"
              "#Сводка #Тест #Ботаника #Банан #Факты"
          )
          banana["sources"] = [
              {
                  "url": "https://www.kew.org/plants/cavendish-banana",
                  "label": "Kew Gardens — Cavendish banana",
                  "verified_on": "2026-08-08",
                  "evidence": (
                      "Kew explicitly states that Cavendish banana fruits are botanically classified as berries and "
                      "explains the single-flower/single-ovary berry criterion."
                  ),
              }
          ]

          path.write_text(json.dumps(queue, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Ruff format focused Svodka runtime
        shell: bash
        run: |
          set -euo pipefail
          ruff format \
            src/video_channel_manager/telegram_channel_profile.py \
            src/video_channel_manager/telegram_channel_discovery.py \
            src/video_channel_manager/telegram_channel_cli.py \
            src/video_channel_manager/telegram_target_binding.py \
            src/video_channel_manager/telegram_multichannel_release.py \
            src/video_channel_manager/telegram_multichannel_state.py \
            src/video_channel_manager/telegram_multichannel_transport.py \
            src/video_channel_manager/telegram_multichannel_outcome.py \
            src/video_channel_manager/telegram_multichannel_cli.py \
            src/video_channel_manager/svodka_queue.py \
            src/video_channel_manager/svodka_release.py \
            tests/test_telegram_channel_profile_contract.py \
            tests/test_telegram_channel_cli.py \
            tests/test_telegram_target_binding.py \
            tests/test_telegram_multichannel_release.py \
            tests/test_telegram_multichannel_state.py \
            tests/test_telegram_multichannel_outcome.py \
            tests/test_telegram_multichannel_cli.py \
            tests/test_svodka_release_review.py \
            tests/test_svodka_preflight_workflow.py

      - name: Ruff correctness gate
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            src/video_channel_manager/telegram_channel_profile.py \
            src/video_channel_manager/telegram_channel_discovery.py \
            src/video_channel_manager/telegram_channel_cli.py \
            src/video_channel_manager/telegram_target_binding.py \
            src/video_channel_manager/telegram_multichannel_release.py \
            src/video_channel_manager/telegram_multichannel_state.py \
            src/video_channel_manager/telegram_multichannel_transport.py \
            src/video_channel_manager/telegram_multichannel_outcome.py \
            src/video_channel_manager/telegram_multichannel_cli.py \
            src/video_channel_manager/svodka_queue.py \
            src/video_channel_manager/svodka_release.py \
            tests/test_telegram_channel_profile_contract.py \
            tests/test_telegram_channel_cli.py \
            tests/test_telegram_target_binding.py \
            tests/test_telegram_multichannel_release.py \
            tests/test_telegram_multichannel_state.py \
            tests/test_telegram_multichannel_outcome.py \
            tests/test_telegram_multichannel_cli.py \
            tests/test_svodka_release_review.py \
            tests/test_svodka_preflight_workflow.py

      - name: Static typing gate
        shell: bash
        run: |
          set -euo pipefail
          mypy \
            src/video_channel_manager/telegram_channel_profile.py \
            src/video_channel_manager/telegram_channel_discovery.py \
            src/video_channel_manager/telegram_channel_cli.py \
            src/video_channel_manager/telegram_target_binding.py \
            src/video_channel_manager/telegram_multichannel_release.py \
            src/video_channel_manager/telegram_multichannel_state.py \
            src/video_channel_manager/telegram_multichannel_transport.py \
            src/video_channel_manager/telegram_multichannel_outcome.py \
            src/video_channel_manager/telegram_multichannel_cli.py \
            src/video_channel_manager/svodka_queue.py \
            src/video_channel_manager/svodka_release.py \
            --show-error-codes

      - name: Focused Svodka regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_telegram_channel_profile_contract.py \
            tests/test_telegram_channel_cli.py \
            tests/test_telegram_target_binding.py \
            tests/test_telegram_multichannel_release.py \
            tests/test_telegram_multichannel_state.py \
            tests/test_telegram_multichannel_outcome.py \
            tests/test_telegram_multichannel_cli.py \
            tests/test_svodka_release_review.py \
            tests/test_svodka_preflight_workflow.py

      - name: Validate draft and rebuild exact write-disabled candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_channel_cli validate-profile --profile "$PROFILE_PATH"
          python -m video_channel_manager.telegram_channel_cli validate-svodka \
            --profile "$PROFILE_PATH" \
            --queue "$QUEUE_PATH"
          python -m video_channel_manager.telegram_channel_cli preview-svodka \
            --profile "$PROFILE_PATH" \
            --queue "$QUEUE_PATH" \
            --sequence 2 >/dev/null
          python -m video_channel_manager.telegram_channel_cli preview-svodka \
            --profile "$PROFILE_PATH" \
            --queue "$QUEUE_PATH" \
            --sequence 6 >/dev/null
          python -m video_channel_manager.telegram_channel_cli preview-svodka \
            --profile "$PROFILE_PATH" \
            --queue "$QUEUE_PATH" \
            --sequence 8 >/dev/null
          python -m video_channel_manager.telegram_channel_cli preview-svodka \
            --profile "$PROFILE_PATH" \
            --queue "$QUEUE_PATH" \
            --sequence 13 >/dev/null
          python -m video_channel_manager.telegram_channel_cli build-svodka-candidate \
            --profile "$PROFILE_PATH" \
            --queue "$QUEUE_PATH" \
            --binding "$BINDING_PATH" \
            --release-id svodka-pilot-2026-08-review-candidate \
            --output "$CANDIDATE_PATH"
          python - <<'PY'
          import os
          from pathlib import Path

          from video_channel_manager.telegram_channel_profile import load_channel_profile
          from video_channel_manager.telegram_multichannel_release import load_release
          from video_channel_manager.telegram_target_binding import load_target_binding

          profile = load_channel_profile(Path(os.environ["PROFILE_PATH"]))
          binding = load_target_binding(Path(os.environ["BINDING_PATH"]), profile)
          release = load_release(Path(os.environ["CANDIDATE_PATH"]))
          if release.release_authorized:
              raise SystemExit("review candidate unexpectedly authorizes provider writes")
          if release.profile_sha256 != profile.digest:
              raise SystemExit("candidate profile digest differs from stable channel contract")
          if release.target_binding_sha256 != binding.digest:
              raise SystemExit("candidate target binding digest differs from pinned binding")
          if (release.chat_id, release.bot_id, release.bot_username) != (
              binding.chat_id,
              binding.bot_id,
              binding.bot_username,
          ):
              raise SystemExit("candidate exact Telegram identity differs from pinned binding")
          if len(release.items) != 14:
              raise SystemExit("candidate must contain exactly 14 pilot publications")
          print(f"candidate={release.digest}")
          print(f"binding={binding.digest}")
          print(f"profile={profile.digest}")
          PY

      - name: Refresh exact Telegram proof read-only
        env:
          SVODKA_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python -m video_channel_manager.telegram_channel_cli preflight \
            --profile "$PROFILE_PATH" \
            --expected-chat-id "$EXPECTED_CHAT_ID" \
            --expected-bot-id "$EXPECTED_BOT_ID" \
            --expected-bot-username "$EXPECTED_BOT_USERNAME" \
            --output "$PROOF_PATH"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          proof = json.loads(Path(os.environ["PROOF_PATH"]).read_text(encoding="utf-8"))
          expected = (
              int(os.environ["EXPECTED_CHAT_ID"]),
              int(os.environ["EXPECTED_BOT_ID"]),
              os.environ["EXPECTED_BOT_USERNAME"].casefold(),
          )
          actual = (proof["chat_id"], proof["bot_id"], proof["bot_username"].casefold())
          if actual != expected:
              raise SystemExit(f"read-only preflight exact identity mismatch: {actual!r}")
          if proof["can_post_messages"] is not True:
              raise SystemExit("read-only preflight no longer proves can_post_messages")
          PY

      - name: Record successful consolidation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/operations
          python - <<'PY'
          import os
          from pathlib import Path

          from video_channel_manager.svodka_queue import load_svodka_draft
          from video_channel_manager.telegram_channel_profile import load_channel_profile
          from video_channel_manager.telegram_multichannel_release import load_release
          from video_channel_manager.telegram_target_binding import load_target_binding

          profile = load_channel_profile(Path(os.environ["PROFILE_PATH"]))
          binding = load_target_binding(Path(os.environ["BINDING_PATH"]), profile)
          queue = load_svodka_draft(Path(os.environ["QUEUE_PATH"]), profile)
          candidate = load_release(Path(os.environ["CANDIDATE_PATH"]))
          result = f"""# Svodka consolidation result — 2026-08-08

Status: PASS

- install: pass
- editorial source hardening: pass
- ruff format/check: pass
- mypy focused runtime: pass
- pytest focused Svodka runtime: pass
- deterministic preview checks: pass
- exact target-bound candidate rebuild: pass
- read-only Telegram preflight: pass
- provider mutation performed by this gate: no

Pinned identities:

- profile digest: `{profile.digest}`
- target binding digest: `{binding.digest}`
- draft queue digest: `{queue.digest}`
- review candidate digest: `{candidate.digest}`
- Telegram chat id: `{binding.chat_id}`
- Telegram bot id: `{binding.bot_id}`
- Telegram bot username: `@{binding.bot_username}`
- candidate authorized: `{str(candidate.release_authorized).lower()}`

This file supersedes the earlier failed consolidation diagnostic for the repaired gate. The failure record remains in history as regression evidence.
"""
          Path("docs/operations/svodka-consolidation-result.md").write_text(result, encoding="utf-8")
          PY

      - name: Remove superseded one-time workflows and commit repaired state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in \
            .github/workflows/svodka-runtime-quality-once.yml \
            .github/workflows/svodka-editorial-source-hardening-once.yml \
            .github/workflows/svodka-consolidate-once.yml \
            .github/workflows/svodka-rebind-stable-profile-once.yml \
            .github/workflows/svodka-consolidation-repair-once.yml
          do
            if [[ -e "$file" ]]; then
              git rm "$file"
            fi
          done

          git add \
            "$QUEUE_PATH" \
            "$CANDIDATE_PATH" \
            src/video_channel_manager \
            tests \
            docs/operations/svodka-consolidation-result.md

          git diff --cached --quiet && {
            echo "Repair gate produced no durable repository changes." >&2
            exit 3
          }
          git commit -m "Pass repaired Svodka consolidation gate"
          git push origin HEAD:main
