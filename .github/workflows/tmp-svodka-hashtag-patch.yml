name: Temporary Svodka hashtag patch helper

on:
  push:
    branches:
      - agent/svodka-hashtag-spacing

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/svodka-hashtag-spacing
          fetch-depth: 0
          persist-credentials: true
      - name: Apply deterministic source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          models = 'src/video_channel_manager/telegram_rich_models.py'
          replace(
              models,
              '''class RichTextAnchor(BaseModel):\n''',
              '''class RichTextHashtag(_TextEntity):\n    """Explicit hashtag; corresponds to ``RichTextHashtag`` in Bot API 10.2."""\n\n    type: Literal["hashtag"] = "hashtag"\n    hashtag: str = Field(min_length=1, max_length=128)\n\n\nclass RichTextAnchor(BaseModel):\n''',
          )
          replace(
              models,
              '''    | RichTextUrl\n    | RichTextAnchor\n''',
              '''    | RichTextUrl\n    | RichTextHashtag\n    | RichTextAnchor\n''',
          )

          loader = 'src/video_channel_manager/svodka_rich_loader.py'
          replace(
              loader,
              '''    RichTextItalic,\n    RichTextNode,\n    RichTextUrl,\n''',
              '''    RichTextHashtag,\n    RichTextItalic,\n    RichTextNode,\n    RichTextUrl,\n''',
          )
          replace(
              loader,
              '''        if isinstance(hashtags, list) and hashtags:\n            hashtag_text = " ".join(str(tag) for tag in hashtags)\n            blocks.append(RichBlockParagraph(block_id="p-hashtags", text=hashtag_text))\n''',
              '''        if isinstance(hashtags, list) and hashtags:\n            hashtag_nodes: list[RichTextNode] = ["\\n"]\n            for index, raw_tag in enumerate(hashtags):\n                tag = str(raw_tag)\n                if not tag.startswith("#") or len(tag) < 2 or any(char.isspace() for char in tag):\n                    raise SvodkaRichLoadError(f"invalid footer hashtag: {tag!r}")\n                if index:\n                    hashtag_nodes.append(" ")\n                hashtag_nodes.append(RichTextHashtag(text=tag, hashtag=tag[1:]))\n            blocks.append(RichBlockParagraph(block_id="p-hashtags", text=tuple(hashtag_nodes)))\n''',
          )

          renderer = 'src/video_channel_manager/telegram_rich_renderer.py'
          replace(
              renderer,
              '''        case "url":\n            return {"type": "url", "text": _inline(value.text), "url": value.url}\n        case "custom_emoji":\n''',
              '''        case "url":\n            return {"type": "url", "text": _inline(value.text), "url": value.url}\n        case "hashtag":\n            return {"type": "hashtag", "text": _inline(value.text), "hashtag": value.hashtag}\n        case "custom_emoji":\n''',
          )

          prod = 'src/video_channel_manager/svodka_rich_production.py'
          replace(prod, '    RichTextCustomEmoji,\n', '')
          replace(
              prod,
              '''    themed = catalog.item_for_role(role)\n    icon = RichTextCustomEmoji(custom_emoji_id=themed.custom_emoji_id, alternative_text=themed.fallback_emoji)\n''',
              '''    themed = catalog.item_for_role(role)\n    # Bot API permits custom emoji in channel posts only for bots with an additional\n    # Fragment username. This bot does not have that capability, so production uses\n    # the catalog's reviewed Unicode fallback instead of emitting an invalid entity.\n    icon = themed.fallback_emoji\n''',
          )
          replace(
              prod,
              '''            item = catalog.item_for_digit(section, style="primary")\n            digit = RichTextCustomEmoji(custom_emoji_id=item.custom_emoji_id, alternative_text=item.fallback_emoji)\n''',
              '''            item = catalog.item_for_digit(section, style="primary")\n            digit = item.fallback_emoji\n''',
          )

          tests = 'tests/test_svodka_rich_production.py'
          replace(
              tests,
              '''        assert document.input_rich_message["skip_entity_detection"] is True\n        assert _custom_emoji_ids(document.input_rich_message)\n''',
              '''        assert document.input_rich_message["skip_entity_detection"] is True\n        assert not _custom_emoji_ids(document.input_rich_message)\n        hashtag_block = next(\n            block for block in document.input_rich_message["blocks"]\n            if block.get("type") == "paragraph"\n            and isinstance(block.get("text"), list)\n            and any(isinstance(node, dict) and node.get("type") == "hashtag" for node in block["text"])\n        )\n        assert hashtag_block["text"][0] == "\\n"\n''',
          )
          replace(
              tests,
              '''def test_release_uses_verified_primary_premium_numbers_in_section_headings() -> None:\n    release = load_release(RELEASE_PATH, Path("."))\n    item = cast(list[dict[str, Any]], release["items"])[0]\n    document, _render, _article = build_document(Path("."), release, item)\n    custom_ids = _custom_emoji_ids(document.input_rich_message)\n    assert "5426972640587853090" in custom_ids  # primary premium digit 1\n''',
              '''def test_channel_production_uses_reviewed_unicode_fallback_instead_of_invalid_custom_emoji() -> None:\n    release = load_release(RELEASE_PATH, Path("."))\n    item = cast(list[dict[str, Any]], release["items"])[0]\n    document, _render, _article = build_document(Path("."), release, item)\n    assert not _custom_emoji_ids(document.input_rich_message)\n    headings = [block for block in document.input_rich_message["blocks"] if block.get("type") == "heading"]\n    assert headings[1]["text"][0] == "1️⃣"\n''',
          )
          PY
          python -m pip install --disable-pip-version-check ruff==0.16.2 >/dev/null
          ruff format src/video_channel_manager/telegram_rich_models.py src/video_channel_manager/svodka_rich_loader.py src/video_channel_manager/telegram_rich_renderer.py src/video_channel_manager/svodka_rich_production.py tests/test_svodka_rich_production.py
          git config user.name 'svodka-patch[bot]'
          git config user.email 'svodka-patch@users.noreply.github.com'
          git add src/video_channel_manager/telegram_rich_models.py src/video_channel_manager/svodka_rich_loader.py src/video_channel_manager/telegram_rich_renderer.py src/video_channel_manager/svodka_rich_production.py tests/test_svodka_rich_production.py
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Svodka hashtag spacing and channel emoji fallback'
          git push origin HEAD:agent/svodka-hashtag-spacing
