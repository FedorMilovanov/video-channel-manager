name: LordChrist Shorts provider-inert quality

on:
  pull_request:
    paths:
      - content/telegram/lordchrist/shorts-feed-policy.json
      - content/telegram/lordchrist/shorts-historical-duration-baseline-20260729.json
      - content/telegram/lordchrist/production-schedule.json
      - docs/operations/lordchrist-shorts-feed.md
      - src/video_channel_manager/lordchrist_shorts.py
      - src/video_channel_manager/lordchrist_shorts_artifacts.py
      - src/video_channel_manager/lordchrist_shorts_snapshot_readiness.py
      - src/video_channel_manager/lordchrist_cross_track_effect_guard.py
      - src/video_channel_manager/platforms/youtube/client.py
      - tests/test_lordchrist_shorts.py
      - tests/test_lordchrist_shorts_artifacts.py
      - tests/test_lordchrist_shorts_backlog.py
      - tests/test_lordchrist_shorts_snapshot_readiness.py
      - tests/test_lordchrist_shorts_youtube_inventory_guard.py
      - .github/workflows/lordchrist-shorts-quality.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lordchrist-shorts-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  provider-inert-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install project quality runtime
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Validate provider-inert policy and editorial gap
        run: >-
          python -m video_channel_manager.lordchrist_shorts validate-policy
          --policy content/telegram/lordchrist/shorts-feed-policy.json
          --editorial-schedule content/telegram/lordchrist/production-schedule.json

      - name: Lint focused implementation
        run: >-
          ruff check
          src/video_channel_manager/lordchrist_shorts.py
          src/video_channel_manager/lordchrist_shorts_artifacts.py
          src/video_channel_manager/lordchrist_shorts_snapshot_readiness.py
          src/video_channel_manager/lordchrist_cross_track_effect_guard.py
          src/video_channel_manager/platforms/youtube/client.py
          tests/test_lordchrist_shorts.py
          tests/test_lordchrist_shorts_artifacts.py
          tests/test_lordchrist_shorts_backlog.py
          tests/test_lordchrist_shorts_snapshot_readiness.py
          tests/test_lordchrist_shorts_youtube_inventory_guard.py

      - name: Run focused regressions
        run: >-
          pytest -q
          tests/test_lordchrist_shorts.py
          tests/test_lordchrist_shorts_artifacts.py
          tests/test_lordchrist_shorts_snapshot_readiness.py
          tests/test_lordchrist_shorts_youtube_inventory_guard.py
          tests/test_lordchrist_cross_track_effect_guard.py

      - name: Assert provider-inert policy flags
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path("content/telegram/lordchrist/shorts-feed-policy.json").read_text(encoding="utf-8"))
          assert policy["automated_youtube_download_allowed"] is False
          assert policy["telegram_provider_mutation_allowed"] is False
          assert policy["telegram_stories_enabled"] is False
          assert policy["slot_local_time"] == "17:17"
          assert policy["min_gap_from_editorial_hours"] == 4
          baseline = json.loads(
              Path("content/telegram/lordchrist/shorts-historical-duration-baseline-20260729.json").read_text(
                  encoding="utf-8"
              )
          )
          assert baseline["source_snapshot_id"] == "5b994503-6107-4cbe-adc8-740b50562075"
          assert baseline["owner_file_details_present"] is False
          assert baseline["proven_shorts"] is False
          assert baseline["provider_writes_authorized"] is False
          assert len(baseline["items"]) == 25
          workflow = Path(".github/workflows/lordchrist-shorts-quality.yml").read_text(encoding="utf-8")
          forbidden_secret_expression = "$" + "{" + "{" + " secrets."
          assert forbidden_secret_expression not in workflow
          print("provider writes performed by quality workflow: 0")
          PY
