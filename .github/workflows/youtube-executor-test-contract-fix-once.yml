name: YouTube executor test contract fix once

on:
  push:
    branches:
      - agent/youtube-release-executor-rebased
    paths:
      - .github/workflows/youtube-executor-test-contract-fix-once.yml

permissions:
  contents: write

jobs:
  fix-and-self-remove:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/youtube-release-executor-rebased
          fetch-depth: 1

      - name: Correct exact identity-gate exception contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_youtube_release_operations.py')
          text = path.read_text(encoding='utf-8')
          old = '    with pytest.raises(UploadPlanError):\n        adopt_existing(\n'
          new = '    with pytest.raises(ValueError):\n        adopt_existing(\n'
          if old not in text:
              raise SystemExit('identity-gate assertion anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m pip install 'ruff==0.16.2'
          ruff format tests/test_youtube_release_operations.py
          ruff check tests/test_youtube_release_operations.py

      - name: Commit fix and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/youtube-executor-test-contract-fix-once.yml
          git add tests/test_youtube_release_operations.py
          git commit -m 'Align YouTube identity-gate regression with canonical error'
          git push origin HEAD:agent/youtube-release-executor-rebased
