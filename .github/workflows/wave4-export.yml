name: Wave 4 source export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/wave-4-wall-safety'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wave4-source-bundle
          path: |
            scripts/sync_youtube_to_vk.py
            scripts/sync_youtube_to_vk_textsafe.py
            src/video_channel_manager/platforms/vk/wall.py
            src/video_channel_manager/platforms/vk/wall_wave.py
            src/video_channel_manager/platforms/vk/publishing.py
            src/video_channel_manager/platforms/vk/editorial_plan.py
            src/video_channel_manager/platforms/vk/editorial_writer.py
            src/video_channel_manager/platforms/vk/upload_lifecycle.py
            src/video_channel_manager/platforms/vk/writer.py
            tests/test_sync_entrypoint_contract.py
            tests/test_vk_wall.py
            tests/test_vk_wall_wave.py
            tests/test_vk_publishing.py
            tests/test_vk_editorial_plan.py
            tests/test_vk_upload_lifecycle.py
            tests/test_vk_writer.py
          if-no-files-found: warn
