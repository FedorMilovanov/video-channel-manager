name: Wave 4 apply upload postflight

on:
  push:
    branches:
      - agent/wave-4-wall-safety
    paths:
      - .github/wave4-apply-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/wave-4-wall-safety
          fetch-depth: 0
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/wave4-upload-postflight.patch.gz.b64 | gzip -d > /tmp/wave4-upload-postflight.patch
          git apply --check /tmp/wave4-upload-postflight.patch
          git apply /tmp/wave4-upload-postflight.patch
          rm -f \
            .github/wave4-upload-postflight.patch.gz.b64 \
            .github/wave4-apply-trigger \
            .github/workflows/wave4-export.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wave 4: require upload wall baseline and postflight"
          git push origin HEAD:agent/wave-4-wall-safety
