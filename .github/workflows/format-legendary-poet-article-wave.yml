name: Format Legendary Poet article wave

on:
  push:
    branches:
      - agent/legendary-poet-article-wave

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legendary-poet-article-wave
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.1
      - name: Format exact article-wave files
        run: |
          ruff format \
            src/video_channel_manager/wave_engine/article_prepare.py \
            src/video_channel_manager/wave_engine/cli.py \
            src/video_channel_manager/wave_engine/vk_article_provider.py \
            tests/test_legendary_poet_article_prepare.py \
            tests/test_vk_article_provider.py
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/video_channel_manager/wave_engine/article_prepare.py \
            src/video_channel_manager/wave_engine/cli.py \
            src/video_channel_manager/wave_engine/vk_article_provider.py \
            tests/test_legendary_poet_article_prepare.py \
            tests/test_vk_article_provider.py
          git commit -m "Format Legendary Poet article wave"
          git push origin HEAD:agent/legendary-poet-article-wave
