name: Svodka Actions heartbeat

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/svodka-actions-heartbeat-once.yml

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Record runner heartbeat and self-remove
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/operations
          printf '# Svodka Actions heartbeat\n\nrun=%s attempt=%s sha=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" \
            > docs/operations/svodka-actions-heartbeat.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/svodka-actions-heartbeat.md
          git rm .github/workflows/svodka-actions-heartbeat-once.yml
          git commit -m "Record Svodka Actions heartbeat [skip ci]"
          git push origin HEAD:main
