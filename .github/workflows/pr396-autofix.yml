name: PR396 one-shot autofix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.ref == 'agent/milovi-daylight-strict-next' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/milovi-daylight-strict-next
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply exact replacements
        run: python scripts/pr396_autofix.py
      - name: Format touched Python files
        run: |
          python -m pip install --disable-pip-version-check 'ruff==0.16.3'
          ruff format src/video_channel_manager/milovi_telegram_bootstrap.py src/video_channel_manager/telegram_multichannel_transport.py tests/test_milovi_telegram_bootstrap.py tests/test_telegram_multichannel_photo_transport.py tests/test_http_client_inventory.py tests/test_telegram_multichannel.py
      - name: Commit fixes and remove one-shot files
        run: |
          rm .github/workflows/pr396-autofix.yml scripts/pr396_autofix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: satisfy Milovi Telegram quality gates'
          git push origin HEAD:agent/milovi-daylight-strict-next
