name: Milovi Telegram bootstrap media proof

on:
  pull_request:
    paths:
      - "content/telegram/milovi-cake/bootstrap-photo-transport-proof-2026-08.json"
      - "content/telegram/milovi-cake/bootstrap-photo-source-readiness-2026-08.json"
      - "content/telegram/milovi-cake/bootstrap-first-screen-candidates-2026-08.json"
      - ".github/workflows/milovi-telegram-bootstrap-media-proof.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-exact-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install exact image dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: Pillow==11.3.0

      - name: Re-materialize and verify all nine exact JPEG transports
        shell: python
        run: |
          from __future__ import annotations

          import hashlib
          import io
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          from PIL import Image

          root = pathlib.Path.cwd()
          proof_path = root / "content/telegram/milovi-cake/bootstrap-photo-transport-proof-2026-08.json"
          proof = json.loads(proof_path.read_text(encoding="utf-8"))
          source_repo = proof["source_repository"]
          source_commit = proof["source_commit"]
          photos = proof["photos"]
          if proof["photo_count"] != 9 or proof["transport_ready_count"] != 9 or len(photos) != 9:
              raise SystemExit("expected nine exact transport-ready photos")

          results = []
          for item in photos:
              source_path = item["source_path"]
              safe_path = "/".join(urllib.parse.quote(part, safe="") for part in source_path.split("/"))
              request = urllib.request.Request(
                  f"https://raw.githubusercontent.com/{source_repo}/{source_commit}/{safe_path}",
                  headers={"User-Agent": "video-channel-manager-milovi-bootstrap-proof/1"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  source = response.read()

              if len(source) != int(item["source_byte_size"]):
                  raise SystemExit(f"{item['media_id']}: source size mismatch")
              blob = hashlib.sha1(
                  f"blob {len(source)}\0".encode("ascii") + source,
                  usedforsecurity=False,
              ).hexdigest()
              if blob != item["source_git_blob_sha1"]:
                  raise SystemExit(f"{item['media_id']}: source Git blob mismatch")
              if "sha256:" + hashlib.sha256(source).hexdigest() != item["source_sha256"]:
                  raise SystemExit(f"{item['media_id']}: source SHA-256 mismatch")

              with Image.open(io.BytesIO(source)) as image:
                  image.load()
                  if image.format != "WEBP":
                      raise SystemExit(f"{item['media_id']}: source is not WebP")
                  expected_size = (int(item["pixel_width"]), int(item["pixel_height"]))
                  if image.size != expected_size:
                      raise SystemExit(f"{item['media_id']}: decoded dimensions mismatch")
                  rgb = image.convert("RGB")

              encoded = io.BytesIO()
              rgb.save(
                  encoded,
                  format="JPEG",
                  quality=95,
                  subsampling=0,
                  optimize=False,
                  progressive=False,
                  exif=b"",
              )
              jpeg = encoded.getvalue()
              if len(jpeg) != int(item["transport_byte_size"]):
                  raise SystemExit(f"{item['media_id']}: JPEG size mismatch")
              if "sha256:" + hashlib.sha256(jpeg).hexdigest() != item["transport_sha256"]:
                  raise SystemExit(f"{item['media_id']}: JPEG SHA-256 mismatch")
              results.append({
                  "media_id": item["media_id"],
                  "source_sha256": item["source_sha256"],
                  "transport_sha256": item["transport_sha256"],
                  "transport_byte_size": len(jpeg),
                  "pixel_width": expected_size[0],
                  "pixel_height": expected_size[1],
                  "verified": True,
              })

          if len({item["media_id"] for item in results}) != 9:
              raise SystemExit("duplicate media id in proof")
          out = root / "test-results" / "milovi-bootstrap-media-proof"
          out.mkdir(parents=True, exist_ok=True)
          report = {
              "schema_name": "video-channel-manager.milovi-bootstrap-media-proof-run",
              "schema_version": 1,
              "source_repository": source_repo,
              "source_commit": source_commit,
              "photo_count": 9,
              "transport_ready_count": 9,
              "provider_write_performed": False,
              "results": results,
          }
          (out / "report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"verified": True, "photo_count": 9, "provider_write_performed": False}))

      - name: Upload exact media proof report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: milovi-bootstrap-media-proof-${{ github.sha }}
          path: test-results/milovi-bootstrap-media-proof/report.json
          if-no-files-found: error
          retention-days: 14
