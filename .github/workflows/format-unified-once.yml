name: Format unified branch once

on:
  push:
    branches:
      - integration/youtube-vk-unified-v2

permissions:
  contents: write

concurrency:
  group: format-unified-once
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: integration/youtube-vk-unified-v2
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install the project formatter
        run: |
          python -m pip install --upgrade "pip>=25" "setuptools>=83,<84" wheel
          pip install -e ".[dev]"
      - name: Format the complete unified tree
        run: |
          ruff format .
          ruff format --check .
          git diff --check
      - name: Remove this one-shot workflow
        run: rm .github/workflows/format-unified-once.yml
      - name: Commit deterministic formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format unified YouTube and VK codebase"
          git push origin HEAD:integration/youtube-vk-unified-v2
