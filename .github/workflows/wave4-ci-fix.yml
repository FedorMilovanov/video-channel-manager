name: Wave 4 apply deterministic CI fixes

on:
  push:
    branches:
      - agent/wave-4-wall-safety
    paths:
      - .github/wave4-ci-fix-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/wave-4-wall-safety
          fetch-depth: 0
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/wave4-ci-fix.patch
          git apply .github/wave4-ci-fix.patch
          rm -f \
            .github/wave4-ci-fix.patch \
            .github/wave4-ci-fix-trigger \
            .github/workflows/wave4-ci-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wave 4: align wall digest and operational memory"
          git push origin HEAD:agent/wave-4-wall-safety
