name: Finalize VK publishing once

on:
  push:
    branches:
      - integration/youtube-vk-unified-v2
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - edited

permissions:
  contents: write

concurrency:
  group: finalize-vk-publishing-once
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: integration/youtube-vk-unified-v2
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade "pip>=25" "setuptools>=83,<84" wheel
          pip install -e ".[dev]"
      - name: Apply exact runtime and typing fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          apply_path = Path("scripts/apply_vk_catalog_plan.py")
          apply_text = apply_path.read_text(encoding="utf-8")
          marker = "import argparse\nimport json\n"
          replacement = "import argparse\nimport json\nfrom collections import Counter\n"
          if "from collections import Counter" not in apply_text:
              if marker not in apply_text:
                  raise SystemExit("Cannot find Counter import insertion point")
              apply_text = apply_text.replace(marker, replacement, 1)
              apply_path.write_text(apply_text, encoding="utf-8")

          catalog_path = Path("src/video_channel_manager/platforms/vk/catalog.py")
          catalog_text = catalog_path.read_text(encoding="utf-8")
          old_catalog = '''        source_collection = source_collections.get(source_collection_id)
        if source_collection is None or source_collection_id not in collection_targets:
            continue
        target_collection_id = collection_targets[source_collection_id]
'''
          new_catalog = '''        membership_collection = source_collections.get(source_collection_id)
        if membership_collection is None or source_collection_id not in collection_targets:
            continue
        target_collection_id = collection_targets[source_collection_id]
'''
          if old_catalog not in catalog_text:
              raise SystemExit("Cannot find catalog type-fix block")
          catalog_text = catalog_text.replace(old_catalog, new_catalog, 1)
          catalog_text = catalog_text.replace(
              '"album_title": canonical_vk_text(source_collection.title),',
              '"album_title": canonical_vk_text(membership_collection.title),',
              1,
          )
          catalog_path.write_text(catalog_text, encoding="utf-8")

          wall_path = Path("src/video_channel_manager/platforms/vk/wall.py")
          wall_text = wall_path.read_text(encoding="utf-8")
          old_wall = 'post_ids = sorted(item.get("id") for item in duplicates if isinstance(item.get("id"), int))'
          new_wall = 'post_ids = sorted(int(item["id"]) for item in duplicates if isinstance(item.get("id"), int))'
          if old_wall not in wall_text:
              raise SystemExit("Cannot find wall post-ID type-fix line")
          wall_path.write_text(wall_text.replace(old_wall, new_wall, 1), encoding="utf-8")
          PY
      - name: Apply canonical Ruff formatting
        run: ruff format .
      - name: Verify Ruff formatting
        run: ruff format --check .
      - name: Ruff correctness
        run: ruff check .
      - name: Static typing
        run: mypy src
      - name: Tests
        run: pytest -vv
      - name: Validate diff whitespace
        run: git diff --check
      - name: Remove this one-shot workflow
        run: rm .github/workflows/finalize-vk-publishing-once.yml
      - name: Commit validated publishing contour
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize guarded VK catalog and wall publishing"
          git push origin HEAD:integration/youtube-vk-unified-v2
