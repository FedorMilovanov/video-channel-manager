name: Finalize VK publishing once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-vk-publishing-once
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: integration/youtube-vk-unified-v2
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade "pip>=25" "setuptools>=83,<84" wheel
          pip install -e ".[dev]"
      - name: Add missing runtime import
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_vk_catalog_plan.py")
          text = path.read_text(encoding="utf-8")
          marker = "import argparse\nimport json\n"
          replacement = "import argparse\nimport json\nfrom collections import Counter\n"
          if "from collections import Counter" not in text:
              if marker not in text:
                  raise SystemExit("Cannot find import insertion point")
              text = text.replace(marker, replacement, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Apply canonical Ruff formatting
        run: ruff format .
      - name: Verify Ruff formatting
        run: ruff format --check .
      - name: Ruff correctness
        run: ruff check .
      - name: Static typing
        run: mypy src
      - name: Tests
        run: pytest -vv
      - name: Validate diff whitespace
        run: git diff --check
      - name: Remove this one-shot workflow
        run: rm .github/workflows/finalize-vk-publishing-once.yml
      - name: Commit validated publishing contour
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize guarded VK catalog and wall publishing"
          git push origin HEAD:integration/youtube-vk-unified-v2
