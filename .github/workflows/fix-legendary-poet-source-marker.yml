name: Fix Legendary Poet source marker

on:
  push:
    branches:
      - agent/fix-legendary-poet-source-marker

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/fix-legendary-poet-source-marker
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Patch scoped marker alias and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("src/video_channel_manager/wave_engine/article_prepare.py")
          text = source.read_text(encoding="utf-8")
          anchor = "\ndef _verify_pinned_source(\n"
          insertion = '''\n_PINNED_SOURCE_MARKER_ALIASES: dict[str, dict[str, tuple[str, ...]]] = {\n    "legendary-poet-article-wave-202608-04-mayakovsky-part-two-work-and-crisis": {\n        "Окнами сатиры РОСТА": ("Он писал для РОСТА", "рисовал плакаты"),\n    }\n}\n\n\ndef _source_marker_present(*, operation_id: str, marker: str, text: str) -> bool:\n    if marker in text:\n        return True\n    aliases = _PINNED_SOURCE_MARKER_ALIASES.get(operation_id, {}).get(marker, ())\n    return bool(aliases) and all(alias in text for alias in aliases)\n\n'''
          if insertion.strip() not in text:
              if anchor not in text:
                  raise SystemExit("verify_pinned_source anchor not found")
              text = text.replace(anchor, insertion + anchor, 1)

          old = '    missing = [marker for marker in operation["source_markers"] if marker not in text]\n'
          new = '''    operation_id = str(operation["operation_id"])\n    missing = [\n        marker\n        for marker in operation["source_markers"]\n        if not _source_marker_present(\n            operation_id=operation_id,\n            marker=str(marker),\n            text=text,\n        )\n    ]\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("marker validation line not found")
          source.write_text(text, encoding="utf-8")

          test = Path("tests/test_article_prepare_source_markers.py")
          test.write_text('''from __future__ import annotations\n\nimport httpx\nimport pytest\n\nfrom video_channel_manager.wave_engine.article_prepare import (\n    ArticlePreparationError,\n    _verify_pinned_source,\n)\n\n\nclass _Http:\n    def __init__(self, text: str) -> None:\n        self.text = text\n\n    def get(self, url: str) -> httpx.Response:\n        return httpx.Response(\n            200,\n            content=self.text.encode("utf-8"),\n            request=httpx.Request("GET", url),\n        )\n\n\ndef _policy() -> dict[str, object]:\n    return {\n        "source_repository": "FedorMilovanov/TheLegendaryPoet",\n        "source_repository_commit": "85c4303dc683abc6e201ea707a0b4d6f5f19f82c",\n    }\n\n\ndef _operation(operation_id: str) -> dict[str, object]:\n    return {\n        "operation_id": operation_id,\n        "source_path": "src/data/essays/mayakovskyGromovoy.ts",\n        "source_markers": ["горло собственной песни", "Окнами сатиры РОСТА", "ЛЕФ"],\n    }\n\n\ndef test_reviewed_rosta_alias_accepts_the_pinned_source_without_policy_drift() -> None:\n    source = (\n        "горло собственной песни. "\n        "Он писал для РОСТА, рисовал плакаты, организовал ЛЕФ."\n    )\n    evidence = _verify_pinned_source(\n        _Http(source),\n        policy=_policy(),\n        operation=_operation(\n            "legendary-poet-article-wave-202608-04-mayakovsky-part-two-work-and-crisis"\n        ),\n    )\n    assert evidence["markers"] == [\n        "горло собственной песни",\n        "Окнами сатиры РОСТА",\n        "ЛЕФ",\n    ]\n\n\ndef test_rosta_alias_is_rejected_for_every_other_operation() -> None:\n    source = (\n        "горло собственной песни. "\n        "Он писал для РОСТА, рисовал плакаты, организовал ЛЕФ."\n    )\n    with pytest.raises(ArticlePreparationError, match="missing markers"):\n        _verify_pinned_source(\n            _Http(source),\n            policy=_policy(),\n            operation=_operation("another-operation"),\n        )\n''', encoding="utf-8")
          PY
          python -m pip install --upgrade "pip>=25" "setuptools>=83,<84" wheel
          pip install -e ".[dev]"
          ruff format src/video_channel_manager/wave_engine/article_prepare.py tests/test_article_prepare_source_markers.py
          ruff check src/video_channel_manager/wave_engine/article_prepare.py tests/test_article_prepare_source_markers.py
          python -m pytest -q tests/test_article_prepare_source_markers.py
          rm .github/workflows/fix-legendary-poet-source-marker.yml
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Accept exact reviewed ROSTA source wording"
          git push origin HEAD:agent/fix-legendary-poet-source-marker

