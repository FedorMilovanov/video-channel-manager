name: Lordchrist depth-v2 rollout patch 678

on:
  push:
    branches:
      - agent/lordchrist-depth-v2-rollout-678

permissions:
  contents: write

concurrency:
  group: lordchrist-depth-rollout-patch-678
  cancel-in-progress: false

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out rollout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/lordchrist-depth-v2-rollout-678
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Apply exact rollout patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          DEPTH_DIGEST = "sha256:c2ad28bb96e88a9e0633c4b7a55d6033bbf29c5a557e1aa4478cc2e0359e3441"
          POLICY_ID = "lordchrist-quote-v3"
          POLICY_DIGEST = "sha256:c6350861bcdbf3de9816afc398db5d80c605ae9fc0e750c3f7850e2e68449e0f"
          GHA = "$" + "{{"

          def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          def replace_between(path: str, start: str, end: str, new_block: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(f"{path}: rollout markers are not unique: {start!r} / {end!r}")
              a = text.index(start)
              b = text.index(end, a)
              p.write_text(text[:a] + new_block + text[b:], encoding="utf-8")

          schedule_path = Path("content/telegram/lordchrist/production-schedule.json")
          schedule = json.loads(schedule_path.read_text(encoding="utf-8"))
          if schedule.get("enabled") is not False:
              raise SystemExit("production schedule was expected to be paused before depth-v2 rollout")
          schedule.update(
              enabled=True,
              successor_queue_digest=DEPTH_DIGEST,
              presentation_policy_id=POLICY_ID,
              presentation_policy_sha256=POLICY_DIGEST,
              activation_note=(
                  "Quality-audited Lordchrist depth-v2 is the only autonomous quote release. The exact source-v1 "
                  "handoff is locked at 14 published+verified and 46 pristine pending entries; runtime selection, "
                  "ledger migration, quote-v3 presentation, provider authorization, and schedule binding all fail "
                  "closed on identity or state drift."
              ),
          )
          schedule_path.write_text(json.dumps(schedule, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          activation_path = Path("content/telegram/lordchrist/successor-depth-activation-v1.json")
          activation = json.loads(activation_path.read_text(encoding="utf-8"))
          if activation.get("provider_writes_authorized") is not False:
              raise SystemExit("depth-v2 activation was expected to remain provider-inert before rollout")
          if activation.get("queue_digest") != DEPTH_DIGEST:
              raise SystemExit("depth-v2 activation digest drifted before rollout")
          activation["provider_writes_authorized"] = True
          activation_path.write_text(json.dumps(activation, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          replace_exact(
              "src/video_channel_manager/telegram_quote_runtime.py",
              '    release_id: Literal["lordchrist-successor-quotes-v1-integrity-v2"]\n',
              '    release_id: Literal["lordchrist-successor-quotes-v1-integrity-v2", "lordchrist-successor-depth-v2"]\n',
          )
          replace_exact(
              "src/video_channel_manager/telegram_quote_depth.py",
              '        release_id="lordchrist-successor-quotes-v1-integrity-v2",\n',
              "        release_id=DEPTH_RELEASE_ID,\n",
          )

          guard_path = Path("src/video_channel_manager/lordchrist_cross_track_effect_guard.py")
          guard = guard_path.read_text(encoding="utf-8")
          constants_old = (
              'SUCCESSOR_QUEUE_DIGEST = "sha256:6c9835793785570311108eec21fd1468aa83e0c45cf63eb554d0f6b9cb7d0873"\n'
              'SUCCESSOR_LEDGER_FILENAME = "successor-publication-ledger.json"\n'
              'SUCCESSOR_ENTRY_COUNT = 60\n'
          )
          constants_new = constants_old + (
              f'DEPTH_QUEUE_DIGEST = "{DEPTH_DIGEST}"\n'
              'DEPTH_LEDGER_FILENAME = "successor-depth-v2-publication-ledger.json"\n'
              'DEPTH_PUBLICATION_PREFIX = "lordchrist-successor-depth-v2-"\n'
              'DEPTH_HISTORY_COUNT = 14\n'
              'DEPTH_FUTURE_COUNT = 46\n'
          )
          if guard.count(constants_old) != 1:
              raise SystemExit("cross-track guard constants anchor drifted")
          guard = guard.replace(constants_old, constants_new, 1)

          function_anchor = "\n\ndef require_no_cross_track_unresolved_effects(\n"
          if guard.count(function_anchor) != 1:
              raise SystemExit("cross-track guard function anchor drifted")
          depth_loader = '''


def load_optional_depth_ledger(
    path: Path,
    *,
    profile: TelegramChannelProfile,
) -> TelegramLedger | None:
    """Load the exact depth-v2 state as a channel-wide provider-effect track."""

    if not path.exists():
        return None
    try:
        ledger = TelegramLedger.model_validate_json(path.read_text(encoding="utf-8"))
    except (OSError, ValidationError) as exc:
        raise ValueError(f"invalid Lordchrist depth-v2 ledger {path}: {exc}") from exc
    if ledger.project_key != profile.project_key:
        raise ValueError("depth-v2 ledger project differs from canonical Lordchrist profile")
    if ledger.channel_username.casefold() != profile.channel_username.casefold():
        raise ValueError("depth-v2 ledger channel differs from canonical Lordchrist profile")
    if ledger.queue_digest != DEPTH_QUEUE_DIGEST:
        raise ValueError("depth-v2 ledger queue digest differs from the reviewed depth-v2 release")
    depth_ids = [publication_id for publication_id in ledger.entries if publication_id.startswith(DEPTH_PUBLICATION_PREFIX)]
    history_ids = [publication_id for publication_id in ledger.entries if not publication_id.startswith(DEPTH_PUBLICATION_PREFIX)]
    if (
        len(ledger.entries) != SUCCESSOR_ENTRY_COUNT
        or len(depth_ids) != DEPTH_FUTURE_COUNT
        or len(history_ids) != DEPTH_HISTORY_COUNT
        or any(not publication_id.startswith("lordchrist-successor-") for publication_id in history_ids)
    ):
        raise ValueError("depth-v2 ledger coverage differs from the reviewed 14-history/46-future release")
    return ledger
'''
          guard = guard.replace(function_anchor, depth_loader + function_anchor, 1)

          old_state = '''    successor_ledger_path = legacy_ledger_path.parent / SUCCESSOR_LEDGER_FILENAME
    successor_ledger = load_optional_successor_ledger(successor_ledger_path, profile=profile)
'''
          new_state = old_state + '''    depth_ledger_path = legacy_ledger_path.parent / DEPTH_LEDGER_FILENAME
    depth_ledger = load_optional_depth_ledger(depth_ledger_path, profile=profile)
'''
          if guard.count(old_state) != 1:
              raise SystemExit("cross-track successor state anchor drifted")
          guard = guard.replace(old_state, new_state, 1)

          old_tracks = '''            "successor": successor_ledger.entries.values() if successor_ledger is not None else (),
        },
'''
          new_tracks = '''            "successor": successor_ledger.entries.values() if successor_ledger is not None else (),
            "depth_v2": depth_ledger.entries.values() if depth_ledger is not None else (),
        },
'''
          if guard.count(old_tracks) != 1:
              raise SystemExit("cross-track track-map anchor drifted")
          guard = guard.replace(old_tracks, new_tracks, 1)

          old_return = '''        "successor_ledger_present": successor_ledger is not None,
        "legacy_unresolved": list(blockers["legacy"]),
        "research_unresolved": list(blockers["research"]),
        "successor_unresolved": list(blockers["successor"]),
'''
          new_return = '''        "successor_ledger_present": successor_ledger is not None,
        "depth_v2_ledger_present": depth_ledger is not None,
        "legacy_unresolved": list(blockers["legacy"]),
        "research_unresolved": list(blockers["research"]),
        "successor_unresolved": list(blockers["successor"]),
        "depth_v2_unresolved": list(blockers["depth_v2"]),
'''
          if guard.count(old_return) != 1:
              raise SystemExit("cross-track return anchor drifted")
          guard = guard.replace(old_return, new_return, 1)
          guard_path.write_text(guard, encoding="utf-8")

          workflow_path = ".github/workflows/lordchrist-telegram-poster.yml"
          replace_exact(
              workflow_path,
              "  PRESENTATION_POLICY_PATH: content/telegram/lordchrist/presentation-policy.json\n",
              "  PRESENTATION_POLICY_PATH: content/telegram/lordchrist/presentation-policy-v3.json\n",
          )
          replace_exact(
              workflow_path,
              "  SUCCESSOR_RUNTIME_QUEUE_PATH: .runtime/lordchrist-successor-runtime-queue.json\n",
              "  SUCCESSOR_RUNTIME_QUEUE_PATH: .runtime/lordchrist-successor-runtime-queue.json\n"
              "  DEPTH_RELEASE_PATH: content/telegram/lordchrist/successor-depth-release-v1.json\n"
              "  DEPTH_ACTIVATION_PATH: content/telegram/lordchrist/successor-depth-activation-v1.json\n"
              "  DEPTH_RUNTIME_QUEUE_PATH: .runtime/lordchrist-successor-depth-v2-runtime-queue.json\n"
              "  DEPTH_LEDGER_RELATIVE_PATH: content/telegram/lordchrist/successor-depth-v2-publication-ledger.json\n"
              "  DEPTH_LEDGER_PATH: .state/lordchrist/content/telegram/lordchrist/successor-depth-v2-publication-ledger.json\n",
          )

          do_publish_expr = GHA + " steps.intent.outputs.do_publish }}"
          active_release_expr = GHA + " steps.active_release.outputs.active_release }}"
          resolve_block = f'''      - name: Resolve exact active quote release
        id: active_release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          provider_write_args=()
          if [[ "{do_publish_expr}" == "true" ]]; then
            provider_write_args+=(--require-provider-writes)
          fi
          python -m video_channel_manager.telegram_quote_depth resolve \\
            --predecessor-queue "$PREDECESSOR_QUEUE_PATH" \\
            --predecessor-ledger "$PREDECESSOR_LEDGER_PATH" \\
            --candidate "$SUCCESSOR_CANDIDATE_PATH" \\
            --translation-ledger "$SUCCESSOR_TRANSLATION_LEDGER_PATH" \\
            --integrity-amendments "$SUCCESSOR_INTEGRITY_AMENDMENTS_PATH" \\
            --source-v1-runtime-queue "$SUCCESSOR_RUNTIME_QUEUE_PATH" \\
            --source-v1-ledger "$SUCCESSOR_LEDGER_PATH" \\
            --runtime-queue "$DEPTH_RUNTIME_QUEUE_PATH" \\
            --depth-ledger "$DEPTH_LEDGER_PATH" \\
            "${{provider_write_args[@]}}" \\
            --output "$ACTIVE_SELECTION_PATH"

          python - <<'PY2'
          import json
          import os
          from pathlib import Path

          selection = json.loads(Path(os.environ["ACTIVE_SELECTION_PATH"]).read_text(encoding="utf-8"))
          outputs = {{
              "active_release": selection["active_release"],
              "queue_digest": selection["queue_digest"],
              "needs_ledger_initialization": str(selection["needs_ledger_initialization"]).lower(),
              "provider_writes_authorized": str(selection["provider_writes_authorized"]).lower(),
          }}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{{key}}={{value}}\\n")
          env = {{
              "QUEUE_PATH": selection["queue_path"],
              "LEDGER_PATH": selection["ledger_path"],
              "LEDGER_RELATIVE_PATH": selection["ledger_relative_path"],
              "LORDCHRIST_APPROVED_QUEUE_DIGEST": selection["queue_digest"],
          }}
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in env.items():
                  handle.write(f"{{key}}={{value}}\\n")
          PY2

'''
          replace_between(
              workflow_path,
              "      - name: Resolve exact active quote release\n",
              "      - name: Materialize missing successor ledger locally for read-only validation\n",
              resolve_block,
          )

          local_block = f'''      - name: Materialize missing depth-v2 ledger locally for read-only validation
        if: steps.active_release.outputs.needs_ledger_initialization == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "{active_release_expr}" == "depth-v2" ]] || {{
            echo "Local depth-v2 ledger materialization requested for another release." >&2
            exit 2
          }}
          [[ ! -e "$DEPTH_LEDGER_PATH" ]] || {{
            echo "Depth-v2 ledger unexpectedly exists in the read-only state snapshot." >&2
            exit 3
          }}
          python -m video_channel_manager.telegram_quote_depth initialize-ledger \\
            --runtime-queue "$DEPTH_RUNTIME_QUEUE_PATH" \\
            --source-v1-runtime-queue "$SUCCESSOR_RUNTIME_QUEUE_PATH" \\
            --source-v1-ledger "$SUCCESSOR_LEDGER_PATH" \\
            --release "$DEPTH_RELEASE_PATH" \\
            --ledger "$DEPTH_LEDGER_PATH" \\
            --confirm INITIALIZE_REVIEWED_DEPTH_V2_LEDGER

'''
          replace_between(
              workflow_path,
              "      - name: Materialize missing successor ledger locally for read-only validation\n",
              "      - name: Validate immutable queue and strict ledger\n",
              local_block,
          )

          durable_block = f'''      - name: Discard read-only depth-v2 ledger before durable initialization
        if: steps.active_release.outputs.needs_ledger_initialization == 'true' && steps.intent.outputs.do_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$DEPTH_LEDGER_PATH"

      - name: Enable state writer for one-time depth-v2 ledger initialization
        if: steps.active_release.outputs.needs_ledger_initialization == 'true' && steps.intent.outputs.do_publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state/lordchrist-telegram
          path: .state/lordchrist
          fetch-depth: 0
          persist-credentials: true

      - name: Persist exact depth-v2 ledger after current-main proof
        if: steps.active_release.outputs.needs_ledger_initialization == 'true' && steps.intent.outputs.do_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "{active_release_expr}" == "depth-v2" ]] || {{
            echo "Depth-v2 ledger initialization requested for another release." >&2
            exit 2
          }}
          [[ ! -e "$DEPTH_LEDGER_PATH" ]] || {{
            echo "Depth-v2 ledger appeared after selection; refusing ambiguous initialization." >&2
            exit 3
          }}
          python -m video_channel_manager.telegram_quote_depth initialize-ledger \\
            --runtime-queue "$DEPTH_RUNTIME_QUEUE_PATH" \\
            --source-v1-runtime-queue "$SUCCESSOR_RUNTIME_QUEUE_PATH" \\
            --source-v1-ledger "$SUCCESSOR_LEDGER_PATH" \\
            --release "$DEPTH_RELEASE_PATH" \\
            --ledger "$DEPTH_LEDGER_PATH" \\
            --confirm INITIALIZE_REVIEWED_DEPTH_V2_LEDGER

          git -C "$STATE_DIR" config user.name "lordchrist-publisher[bot]"
          git -C "$STATE_DIR" config user.email "lordchrist-publisher@users.noreply.github.com"
          git -C "$STATE_DIR" add -- "$DEPTH_LEDGER_RELATIVE_PATH"
          git -C "$STATE_DIR" commit -m "Initialize reviewed Lordchrist depth-v2 ledger [skip ci]"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$remote_sha" == "$local_sha" ]] || {{
            echo "Remote depth-v2 ledger initialization commit differs from local exact commit." >&2
            exit 3
          }}

          git -C "$STATE_DIR" fetch --no-tags origin "$STATE_BRANCH"
          git -C "$STATE_DIR" show "origin/$STATE_BRANCH:$DEPTH_LEDGER_RELATIVE_PATH" > .runtime/remote-depth-v2-ledger.json
          cmp -s "$DEPTH_LEDGER_PATH" .runtime/remote-depth-v2-ledger.json || {{
            echo "Remote depth-v2 ledger differs from the exact initialized ledger." >&2
            exit 3
          }}
          python -m video_channel_manager.telegram_cli \\
            --queue "$QUEUE_PATH" \\
            --ledger .runtime/remote-depth-v2-ledger.json \\
            --presentation-policy "$PRESENTATION_POLICY_PATH" \\
            validate

'''
          replace_between(
              workflow_path,
              "      - name: Discard read-only successor ledger before durable initialization\n",
              "      - name: Enable publication ledger writer\n",
              durable_block,
          )

          test_path = Path("tests/test_lordchrist_autonomous_production.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              'POLICY_PATH = ROOT / "content/telegram/lordchrist/presentation-policy.json"',
              'POLICY_PATH = ROOT / "content/telegram/lordchrist/presentation-policy-v3.json"',
              1,
          )
          tests = tests.replace(
              'EXPECTED_SUCCESSOR_DIGEST = "sha256:6c9835793785570311108eec21fd1468aa83e0c45cf63eb554d0f6b9cb7d0873"',
              f'EXPECTED_SUCCESSOR_DIGEST = "{DEPTH_DIGEST}"',
              1,
          )
          tests = tests.replace(
              '    assert config.enabled is False\n    assert "paused" in config.activation_note.lower()\n    assert "depth-v2" in config.activation_note\n',
              '    assert config.enabled is True\n    assert "depth-v2" in config.activation_note\n    assert "fail closed" in config.activation_note.lower()\n',
              1,
          )
          old_disabled = '''def test_disabled_production_schedule_fails_closed_before_slot_evaluation() -> None:
    config = load_production_schedule(CONFIG_PATH)
    decision = decide_scheduled_slot(
        config,
        event_schedule="17 9 * * *",
        now=datetime(2026, 9, 7, 6, 17, tzinfo=UTC),
    )

    assert decision.active is False
    assert decision.slot is None
    assert decision.reason == "production schedule disabled"
'''
          new_enabled = '''def test_enabled_depth_v2_schedule_activates_an_exact_due_slot() -> None:
    config = load_production_schedule(CONFIG_PATH)
    decision = decide_scheduled_slot(
        config,
        event_schedule="17 9 * * *",
        now=datetime(2026, 9, 7, 6, 17, tzinfo=UTC),
    )

    assert decision.active is True
    assert decision.slot == "morning"
    assert decision.reason == "morning slot active"
'''
          if tests.count(old_disabled) != 1:
              raise SystemExit("autonomous production disabled-test anchor drifted")
          tests = tests.replace(old_disabled, new_enabled, 1)
          tests = tests.replace(
              'gate_end = workflow.index("      - name: Discard read-only successor ledger before durable initialization")',
              'gate_end = workflow.index("      - name: Discard read-only depth-v2 ledger before durable initialization")',
              1,
          )
          tests = tests.replace(
              'def test_successor_ledger_durable_initialization_is_execution_gated_and_after_current_main_proof() -> None:',
              'def test_depth_v2_ledger_durable_initialization_is_execution_gated_and_after_current_main_proof() -> None:',
              1,
          )
          tests = tests.replace(
              'workflow.index("      - name: Materialize missing successor ledger locally for read-only validation")',
              'workflow.index("      - name: Materialize missing depth-v2 ledger locally for read-only validation")',
              1,
          )
          tests = tests.replace(
              'workflow.index("      - name: Discard read-only successor ledger before durable initialization")',
              'workflow.index("      - name: Discard read-only depth-v2 ledger before durable initialization")',
              1,
          )
          tests = tests.replace(
              'workflow.index("      - name: Enable state writer for one-time successor ledger initialization")',
              'workflow.index("      - name: Enable state writer for one-time depth-v2 ledger initialization")',
              1,
          )
          tests = tests.replace(
              'workflow.index("      - name: Persist exact successor ledger after current-main proof")',
              'workflow.index("      - name: Persist exact depth-v2 ledger after current-main proof")',
              1,
          )
          tests = tests.replace('"Initialize sealed Lordchrist successor ledger"', '"Initialize reviewed Lordchrist depth-v2 ledger"', 2)
          tests = tests.replace('"remote-successor-ledger.json"', '"remote-depth-v2-ledger.json"', 1)
          test_path.write_text(tests, encoding="utf-8")

          profile_test_path = Path("tests/test_telegram_channel_profile_contract.py")
          profile_tests = profile_test_path.read_text(encoding="utf-8")
          profile_tests = profile_tests.replace(
              '    assert production["enabled"] is False\n    assert "paused" in production["activation_note"].lower()\n',
              '    assert production["enabled"] is True\n    assert "depth-v2" in production["activation_note"]\n',
              1,
          )
          profile_test_path.write_text(profile_tests, encoding="utf-8")

          handoff_test_path = Path("tests/test_lordchrist_quote_handoff_582.py")
          handoff_tests = handoff_test_path.read_text(encoding="utf-8")
          handoff_tests = handoff_tests.replace(
              'POLICY = CONTENT / "presentation-policy.json"\nSCHEDULE = CONTENT / "production-schedule.json"\n',
              'POLICY = CONTENT / "presentation-policy.json"\nSCHEDULE_POLICY = CONTENT / "presentation-policy-v3.json"\nSCHEDULE = CONTENT / "production-schedule.json"\n',
              1,
          )
          marker = "def test_schedule_release_binding_accepts_only_predecessor_or_armed_successor() -> None:\n"
          start = handoff_tests.index(marker)
          end = handoff_tests.index("\n\ndef ", start + len(marker))
          segment = handoff_tests[start:end]
          if segment.count("policy = load_presentation_policy(POLICY)") != 1:
              raise SystemExit("schedule binding policy anchor drifted")
          segment = segment.replace(
              "policy = load_presentation_policy(POLICY)",
              "policy = load_presentation_policy(SCHEDULE_POLICY)",
              1,
          )
          handoff_tests = handoff_tests[:start] + segment + handoff_tests[end:]
          handoff_test_path.write_text(handoff_tests, encoding="utf-8")

          depth_test_path = Path("tests/test_lordchrist_quote_depth_667.py")
          depth_tests = depth_test_path.read_text(encoding="utf-8")
          anchor = "    assert depth.digest == DEPTH_QUEUE_DIGEST\n    assert len(depth.posts) == 60\n"
          if depth_tests.count(anchor) != 1:
              raise SystemExit("depth runtime assertion anchor drifted")
          depth_tests = depth_tests.replace(
              anchor,
              '    assert depth.digest == DEPTH_QUEUE_DIGEST\n    assert depth.release_id == "lordchrist-successor-depth-v2"\n    assert len(depth.posts) == 60\n',
              1,
          )
          depth_test_path.write_text(depth_tests, encoding="utf-8")

          rollout_test = Path("tests/test_lordchrist_depth_rollout_678.py")
          rollout_test.write_text(
              f'''from __future__ import annotations

import json
from pathlib import Path

from video_channel_manager.telegram_presentation import load_presentation_policy
from video_channel_manager.telegram_quote_depth import DEPTH_QUEUE_DIGEST, build_depth_runtime_queue, load_depth_activation
from video_channel_manager.telegram_schedule import load_production_schedule

ROOT = Path(__file__).resolve().parents[1]
CONTENT = ROOT / "content/telegram/lordchrist"
WORKFLOW = ROOT / ".github/workflows/lordchrist-telegram-poster.yml"


def test_depth_v2_activation_and_schedule_form_one_exact_production_identity() -> None:
    activation = load_depth_activation(CONTENT / "successor-depth-activation-v1.json")
    schedule = load_production_schedule(CONTENT / "production-schedule.json")
    policy = load_presentation_policy(CONTENT / "presentation-policy-v3.json")

    assert activation.provider_writes_authorized is True
    assert activation.queue_digest == DEPTH_QUEUE_DIGEST
    assert activation.presentation_policy_id == policy.policy_id == "lordchrist-quote-v3"
    assert activation.presentation_policy_sha256 == policy.digest
    assert schedule.enabled is True
    assert schedule.successor_queue_digest == DEPTH_QUEUE_DIGEST
    assert schedule.presentation_policy_id == policy.policy_id
    assert schedule.presentation_policy_sha256 == policy.digest


def test_depth_v2_runtime_is_release_scoped_and_starts_future_work_at_sequence_15() -> None:
    queue = build_depth_runtime_queue(
        candidate_path=CONTENT / "successor-quotes-v1.json",
        translation_ledger_path=CONTENT / "successor-translation-ledger-v1.json",
        integrity_amendment_path=CONTENT / "successor-integrity-amendments-v1.json",
    )

    assert queue.release_id == "lordchrist-successor-depth-v2"
    assert queue.digest == DEPTH_QUEUE_DIGEST
    assert queue.posts[14].sequence == 15
    assert queue.posts[14].publication_id.startswith("lordchrist-successor-depth-v2-15-")
    assert "Пояснение:" not in queue.posts[14].text
    assert "© " not in queue.posts[14].text


def test_production_workflow_has_no_old_successor_runtime_fallback() -> None:
    workflow = WORKFLOW.read_text(encoding="utf-8")
    publish_next = workflow.split("  historical-rich:\n", 1)[0]

    assert "video_channel_manager.telegram_quote_depth resolve" in publish_next
    assert "video_channel_manager.telegram_quote_depth initialize-ledger" in publish_next
    assert "video_channel_manager.telegram_quote_runtime resolve" not in publish_next
    assert "INITIALIZE_REVIEWED_DEPTH_V2_LEDGER" in publish_next
    assert "successor-depth-v2-publication-ledger.json" in publish_next
    assert "presentation-policy-v3.json" in publish_next
    assert "remote-depth-v2-ledger.json" in publish_next
    assert "--require-provider-writes" in publish_next


