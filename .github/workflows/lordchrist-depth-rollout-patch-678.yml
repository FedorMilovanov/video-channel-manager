name: Lordchrist depth-v2 rollout patch 678

on:
  push:
    branches:
      - agent/lordchrist-depth-v2-rollout-678

permissions:
  contents: write

concurrency:
  group: lordchrist-depth-rollout-patch-678
  cancel-in-progress: false

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out rollout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/lordchrist-depth-v2-rollout-678
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Apply exact rollout patch
        shell: bash
        env:
          PATCH_ZLIB_B64: 
        run: |
          python - <<'PY'
          import base64, os, zlib
          code = zlib.decompress(base64.b64decode(os.environ["PATCH_ZLIB_B64"])).decode("utf-8")
          exec(compile(code, "<rollout-patch>", "exec"), {"__name__": "__main__"})
          PY

      - name: Install development toolchain
        run: |
          python -m pip install --upgrade "pip>=25" "setuptools>=83,<85" wheel
          pip install -e ".[dev]"

      - name: Format and verify rollout scope
        shell: bash
        run: |
          set -euo pipefail
          ruff format \
            src/video_channel_manager/telegram_quote_runtime.py \
            src/video_channel_manager/telegram_quote_depth.py \
            src/video_channel_manager/lordchrist_cross_track_effect_guard.py \
            tests/test_lordchrist_autonomous_production.py \
            tests/test_telegram_channel_profile_contract.py \
            tests/test_lordchrist_quote_handoff_582.py \
            tests/test_lordchrist_quote_depth_667.py \
            tests/test_lordchrist_depth_rollout_678.py
          ruff check \
            src/video_channel_manager/telegram_quote_runtime.py \
            src/video_channel_manager/telegram_quote_depth.py \
            src/video_channel_manager/lordchrist_cross_track_effect_guard.py \
            tests/test_lordchrist_autonomous_production.py \
            tests/test_telegram_channel_profile_contract.py \
            tests/test_lordchrist_quote_handoff_582.py \
            tests/test_lordchrist_quote_depth_667.py \
            tests/test_lordchrist_depth_rollout_678.py
          mypy src --show-error-codes
          pytest -q \
            tests/test_lordchrist_autonomous_production.py \
            tests/test_telegram_channel_profile_contract.py \
            tests/test_lordchrist_quote_handoff_582.py \
            tests/test_lordchrist_quote_depth_667.py \
            tests/test_lordchrist_depth_rollout_678.py

      - name: Commit verified rollout patch and remove patcher
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/lordchrist-depth-rollout-patch-678.yml
          git config user.name "FedorMilovanov"
          git config user.email "258225528+FedorMilovanov@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No rollout delta to commit." >&2; exit 2; }
          git commit -m "feat(lordchrist): wire reviewed depth-v2 production rollout"
          git push origin HEAD:agent/lordchrist-depth-v2-rollout-678
