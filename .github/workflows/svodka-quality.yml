name: Svodka quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svodka-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PROFILE_PATH: content/telegram/channels/svodka.json
      BINDING_PATH: content/telegram/channels/svodka-target-binding.json
      QUEUE_PATH: content/telegram/svodka/draft-14-posts-2026-08.json
      APPROVAL_PATH: content/telegram/svodka/release-approval-2026-08.json
      CANDIDATE_PATH: .runtime/svodka-review-candidate.json
      RELEASE_ID: svodka-pilot-2026-08
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Apply exact production Telegram dependency lock
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt

      - name: Dependency consistency
        run: python -m pip check

      - name: Audit exact production Telegram dependency lock
        run: >-
          python -m pip_audit
          --no-deps
          --progress-spinner off
          -r requirements/telegram-publisher.txt

      - name: Ruff correctness
        run: >-
          ruff check
          src/video_channel_manager/telegram_models.py
          src/video_channel_manager/telegram_transport.py
          src/video_channel_manager/telegram_channel_profile.py
          src/video_channel_manager/telegram_channel_discovery.py
          src/video_channel_manager/telegram_channel_cli.py
          src/video_channel_manager/telegram_github_quality_gate.py
          src/video_channel_manager/telegram_github_outcome_artifact.py
          src/video_channel_manager/telegram_release_review.py
          src/video_channel_manager/telegram_html_entities.py
          src/video_channel_manager/telegram_publication_freshness.py
          src/video_channel_manager/telegram_target_binding.py
          src/video_channel_manager/telegram_multichannel_release.py
          src/video_channel_manager/telegram_multichannel_state.py
          src/video_channel_manager/telegram_multichannel_transport.py
          src/video_channel_manager/telegram_multichannel_outcome.py
          src/video_channel_manager/telegram_multichannel_cli.py
          src/video_channel_manager/telegram_rich_provider.py
          src/video_channel_manager/telegram_rich_models.py
          src/video_channel_manager/telegram_rich_validation.py
          src/video_channel_manager/telegram_rich_renderer.py
          src/video_channel_manager/telegram_rich_fallback.py
          src/video_channel_manager/svodka_rich_loader.py
          src/video_channel_manager/svodka_native_rich_canary.py
          src/video_channel_manager/svodka_queue.py
          src/video_channel_manager/svodka_release.py
          src/video_channel_manager/svodka_rollout_candidate_cli.py
          src/video_channel_manager/svodka_approval_cli.py
          tests/test_telegram_channel_profile_contract.py
          tests/test_telegram_channel_cli.py
          tests/test_telegram_github_quality_gate.py
          tests/test_telegram_github_outcome_artifact.py
          tests/test_telegram_github_outcome_artifact_integrity.py
          tests/test_telegram_html_entities.py
          tests/test_telegram_publication_freshness.py
          tests/test_telegram_target_binding.py
          tests/test_telegram_multichannel_release.py
          tests/test_telegram_multichannel_state.py
          tests/test_telegram_multichannel_transport.py
          tests/test_telegram_multichannel_outcome.py
          tests/test_telegram_multichannel_cli.py
          tests/test_telegram_rich_provider.py
          tests/test_telegram_rich_validation.py
          tests/test_telegram_rich_renderer.py
          tests/test_telegram_rich_fallback.py
          tests/test_telegram_rich_integration.py
          tests/test_telegram_rich_legacy_digests.py
          tests/test_svodka_rich_loader.py
          tests/test_svodka_native_rich_canary.py
          tests/test_svodka_queue_contract.py
          tests/test_svodka_release_review.py
          tests/test_svodka_preflight_workflow.py
          tests/test_svodka_deployment_workflows.py
          tests/test_svodka_reconciliation_workflow.py
          tests/test_svodka_outcome_recovery_workflow.py
          tests/test_svodka_rollout_schedule.py
          tests/test_svodka_approval_cli.py

      - name: Ruff formatting
        run: >-
          ruff format --check
          src/video_channel_manager/telegram_models.py
          src/video_channel_manager/telegram_transport.py
          src/video_channel_manager/telegram_channel_profile.py
          src/video_channel_manager/telegram_channel_discovery.py
          src/video_channel_manager/telegram_channel_cli.py
          src/video_channel_manager/telegram_github_quality_gate.py
          src/video_channel_manager/telegram_github_outcome_artifact.py
          src/video_channel_manager/telegram_release_review.py
          src/video_channel_manager/telegram_html_entities.py
          src/video_channel_manager/telegram_publication_freshness.py
          src/video_channel_manager/telegram_target_binding.py
          src/video_channel_manager/telegram_multichannel_release.py
          src/video_channel_manager/telegram_multichannel_state.py
          src/video_channel_manager/telegram_multichannel_transport.py
          src/video_channel_manager/telegram_multichannel_outcome.py
          src/video_channel_manager/telegram_multichannel_cli.py
          src/video_channel_manager/telegram_rich_provider.py
          src/video_channel_manager/telegram_rich_models.py
          src/video_channel_manager/telegram_rich_validation.py
          src/video_channel_manager/telegram_rich_renderer.py
          src/video_channel_manager/telegram_rich_fallback.py
          src/video_channel_manager/svodka_rich_loader.py
          src/video_channel_manager/svodka_native_rich_canary.py
          src/video_channel_manager/svodka_queue.py
          src/video_channel_manager/svodka_release.py
          src/video_channel_manager/svodka_rollout_candidate_cli.py
          src/video_channel_manager/svodka_approval_cli.py
          tests/test_telegram_channel_profile_contract.py
          tests/test_telegram_channel_cli.py
          tests/test_telegram_github_quality_gate.py
          tests/test_telegram_github_outcome_artifact.py
          tests/test_telegram_github_outcome_artifact_integrity.py
          tests/test_telegram_html_entities.py
          tests/test_telegram_publication_freshness.py
          tests/test_telegram_target_binding.py
          tests/test_telegram_multichannel_release.py
          tests/test_telegram_multichannel_state.py
          tests/test_telegram_multichannel_transport.py
          tests/test_telegram_multichannel_outcome.py
          tests/test_telegram_multichannel_cli.py
          tests/test_telegram_rich_provider.py
          tests/test_telegram_rich_validation.py
          tests/test_telegram_rich_renderer.py
          tests/test_telegram_rich_fallback.py
          tests/test_telegram_rich_integration.py
          tests/test_telegram_rich_legacy_digests.py
          tests/test_svodka_rich_loader.py
          tests/test_svodka_native_rich_canary.py
          tests/test_svodka_queue_contract.py
          tests/test_svodka_release_review.py
          tests/test_svodka_preflight_workflow.py
          tests/test_svodka_deployment_workflows.py
          tests/test_svodka_reconciliation_workflow.py
          tests/test_svodka_outcome_recovery_workflow.py
          tests/test_svodka_rollout_schedule.py
          tests/test_svodka_approval_cli.py

      - name: Static typing
        run: >-
          mypy
          src/video_channel_manager/telegram_models.py
          src/video_channel_manager/telegram_transport.py
          src/video_channel_manager/telegram_channel_profile.py
          src/video_channel_manager/telegram_channel_discovery.py
          src/video_channel_manager/telegram_channel_cli.py
          src/video_channel_manager/telegram_github_quality_gate.py
          src/video_channel_manager/telegram_github_outcome_artifact.py
          src/video_channel_manager/telegram_release_review.py
          src/video_channel_manager/telegram_html_entities.py
          src/video_channel_manager/telegram_publication_freshness.py
          src/video_channel_manager/telegram_target_binding.py
          src/video_channel_manager/telegram_multichannel_release.py
          src/video_channel_manager/telegram_multichannel_state.py
          src/video_channel_manager/telegram_multichannel_transport.py
          src/video_channel_manager/telegram_multichannel_outcome.py
          src/video_channel_manager/telegram_multichannel_cli.py
          src/video_channel_manager/telegram_rich_provider.py
          src/video_channel_manager/telegram_rich_models.py
          src/video_channel_manager/telegram_rich_validation.py
          src/video_channel_manager/telegram_rich_renderer.py
          src/video_channel_manager/telegram_rich_fallback.py
          src/video_channel_manager/svodka_rich_loader.py
          src/video_channel_manager/svodka_native_rich_canary.py
          src/video_channel_manager/svodka_queue.py
          src/video_channel_manager/svodka_release.py
          src/video_channel_manager/svodka_rollout_candidate_cli.py
          src/video_channel_manager/svodka_approval_cli.py
          --show-error-codes

      - name: Focused regression suite
        run: >-
          python -m pytest -q
          tests/test_telegram_channel_profile_contract.py
          tests/test_telegram_channel_cli.py
          tests/test_telegram_github_quality_gate.py
          tests/test_telegram_github_outcome_artifact.py
          tests/test_telegram_github_outcome_artifact_integrity.py
          tests/test_telegram_html_entities.py
          tests/test_telegram_publication_freshness.py
          tests/test_telegram_target_binding.py
          tests/test_telegram_multichannel_release.py
          tests/test_telegram_multichannel_state.py
          tests/test_telegram_multichannel_transport.py
          tests/test_telegram_multichannel_outcome.py
          tests/test_telegram_multichannel_cli.py
          tests/test_telegram_rich_provider.py
          tests/test_telegram_rich_validation.py
          tests/test_telegram_rich_renderer.py
          tests/test_telegram_rich_fallback.py
          tests/test_telegram_rich_integration.py
          tests/test_telegram_rich_legacy_digests.py
          tests/test_svodka_rich_loader.py
          tests/test_svodka_native_rich_canary.py
          tests/test_svodka_queue_contract.py
          tests/test_svodka_release_review.py
          tests/test_svodka_preflight_workflow.py
          tests/test_svodka_deployment_workflows.py
          tests/test_svodka_reconciliation_workflow.py
          tests/test_svodka_outcome_recovery_workflow.py
          tests/test_svodka_rollout_schedule.py
          tests/test_svodka_approval_cli.py

      - name: Validate raw editorial Svodka inputs
        shell: bash
        run: |
          set -euo pipefail
          python content/telegram/svodka/rich-v1/media/validate_registry.py
          python -m video_channel_manager.telegram_channel_cli validate-profile --profile "$PROFILE_PATH"
          python -m video_channel_manager.telegram_channel_cli validate-svodka --profile "$PROFILE_PATH" --queue "$QUEUE_PATH"
          python - <<'PY'
          from pathlib import Path

          from video_channel_manager.telegram_channel_profile import load_channel_profile
          from video_channel_manager.telegram_target_binding import load_target_binding

          profile = load_channel_profile(Path("content/telegram/channels/svodka.json"))
          binding = load_target_binding(Path("content/telegram/channels/svodka-target-binding.json"), profile)
          assert binding.chat_id == -1003527567039
          assert binding.bot_id == 8716602202
          assert binding.bot_username == "preaching_mp3_bot"
          assert binding.can_post_messages is True
          assert binding.provider_write_performed is False
          PY

      - name: Render every raw editorial payload deterministically
        shell: bash
        run: |
          set -euo pipefail
          for sequence in $(seq 1 14); do
            python -m video_channel_manager.telegram_channel_cli preview-svodka \
              --profile "$PROFILE_PATH" --queue "$QUEUE_PATH" --sequence "$sequence" >/dev/null
          done

      - name: Build exact target-bound rollout candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python -m video_channel_manager.svodka_rollout_candidate_cli \
            --profile "$PROFILE_PATH" \
            --queue "$QUEUE_PATH" \
            --binding "$BINDING_PATH" \
            --release-id "$RELEASE_ID" \
            --output "$CANDIDATE_PATH"
          python - <<'PY'
          import os
          from pathlib import Path

          from video_channel_manager.svodka_approval_cli import load_svodka_release_approval
          from video_channel_manager.telegram_multichannel_release import load_release

          candidate = load_release(Path(os.environ["CANDIDATE_PATH"]))
          approval = load_svodka_release_approval(Path(os.environ["APPROVAL_PATH"]))
          assert candidate.release_authorized is False
          assert candidate.release_id == os.environ["RELEASE_ID"]
          assert len(candidate.items) == 14
          assert candidate.items[0].scheduled_at.isoformat() == "2026-08-10T10:30:00+03:00"
          assert candidate.items[4].publication_id == "svodka-2026-august-total-solar-eclipse"
          assert candidate.items[4].scheduled_at.isoformat() == "2026-08-12T10:30:00+03:00"
          assert candidate.items[-1].scheduled_at.isoformat() == "2026-08-16T19:30:00+03:00"
          assert candidate.chat_id == -1003527567039
          assert candidate.bot_id == 8716602202
          assert candidate.bot_username == "preaching_mp3_bot"
          assert candidate.digest == approval.candidate_sha256
          print(f"release_digest={candidate.digest}")
          PY

      - name: Upload rollout review candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: svodka-review-candidate
          path: .runtime/svodka-review-candidate.json
          if-no-files-found: error
          retention-days: 7
