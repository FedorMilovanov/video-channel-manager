name: Svodka quality

on:
  push:
    branches: [main]
    paths:
      - "content/telegram/channels/svodka*.json"
      - "content/telegram/svodka/**"
      - "src/video_channel_manager/svodka_*.py"
      - "src/video_channel_manager/telegram_channel_*.py"
      - "src/video_channel_manager/telegram_html_entities.py"
      - "src/video_channel_manager/telegram_multichannel_*.py"
      - "src/video_channel_manager/telegram_target_binding.py"
      - "tests/test_svodka*.py"
      - "tests/test_telegram_channel*.py"
      - "tests/test_telegram_html_entities.py"
      - "tests/test_telegram_multichannel*.py"
      - ".github/workflows/svodka-quality.yml"
      - ".github/workflows/svodka-telegram-preflight.yml"
      - ".github/workflows/svodka-ledger-init.yml"
      - ".github/workflows/svodka-skip-expired.yml"
      - ".github/workflows/svodka-reconcile-skipped-send.yml"
      - ".github/workflows/svodka-canary.yml"
      - ".github/workflows/svodka-scheduled-publisher.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svodka-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PROFILE_PATH: content/telegram/channels/svodka.json
      BINDING_PATH: content/telegram/channels/svodka-target-binding.json
      QUEUE_PATH: content/telegram/svodka/draft-14-posts-2026-08.json
      CANDIDATE_PATH: .runtime/svodka-review-candidate.json
      RELEASE_ID: svodka-pilot-2026-08
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Dependency consistency
        run: python -m pip check

      - name: Ruff correctness
        run: >-
          ruff check
          src/video_channel_manager/telegram_channel_profile.py
          src/video_channel_manager/telegram_channel_discovery.py
          src/video_channel_manager/telegram_channel_cli.py
          src/video_channel_manager/telegram_html_entities.py
          src/video_channel_manager/telegram_target_binding.py
          src/video_channel_manager/telegram_multichannel_release.py
          src/video_channel_manager/telegram_multichannel_state.py
          src/video_channel_manager/telegram_multichannel_transport.py
          src/video_channel_manager/telegram_multichannel_outcome.py
          src/video_channel_manager/telegram_multichannel_cli.py
          src/video_channel_manager/svodka_queue.py
          src/video_channel_manager/svodka_release.py
          tests/test_telegram_channel_profile_contract.py
          tests/test_telegram_channel_cli.py
          tests/test_telegram_html_entities.py
          tests/test_telegram_target_binding.py
          tests/test_telegram_multichannel_release.py
          tests/test_telegram_multichannel_state.py
          tests/test_telegram_multichannel_transport.py
          tests/test_telegram_multichannel_outcome.py
          tests/test_telegram_multichannel_cli.py
          tests/test_svodka_queue_contract.py
          tests/test_svodka_release_review.py
          tests/test_svodka_preflight_workflow.py
          tests/test_svodka_deployment_workflows.py
          tests/test_svodka_reconciliation_workflow.py

      - name: Ruff formatting
        run: >-
          ruff format --check
          src/video_channel_manager/telegram_channel_profile.py
          src/video_channel_manager/telegram_channel_discovery.py
          src/video_channel_manager/telegram_channel_cli.py
          src/video_channel_manager/telegram_html_entities.py
          src/video_channel_manager/telegram_target_binding.py
          src/video_channel_manager/telegram_multichannel_release.py
          src/video_channel_manager/telegram_multichannel_state.py
          src/video_channel_manager/telegram_multichannel_transport.py
          src/video_channel_manager/telegram_multichannel_outcome.py
          src/video_channel_manager/telegram_multichannel_cli.py
          src/video_channel_manager/svodka_queue.py
          src/video_channel_manager/svodka_release.py
          tests/test_telegram_channel_profile_contract.py
          tests/test_telegram_channel_cli.py
          tests/test_telegram_html_entities.py
          tests/test_telegram_target_binding.py
          tests/test_telegram_multichannel_release.py
          tests/test_telegram_multichannel_state.py
          tests/test_telegram_multichannel_transport.py
          tests/test_telegram_multichannel_outcome.py
          tests/test_telegram_multichannel_cli.py
          tests/test_svodka_queue_contract.py
          tests/test_svodka_release_review.py
          tests/test_svodka_preflight_workflow.py
          tests/test_svodka_deployment_workflows.py
          tests/test_svodka_reconciliation_workflow.py

      - name: Static typing
        run: >-
          mypy
          src/video_channel_manager/telegram_channel_profile.py
          src/video_channel_manager/telegram_channel_discovery.py
          src/video_channel_manager/telegram_channel_cli.py
          src/video_channel_manager/telegram_html_entities.py
          src/video_channel_manager/telegram_target_binding.py
          src/video_channel_manager/telegram_multichannel_release.py
          src/video_channel_manager/telegram_multichannel_state.py
          src/video_channel_manager/telegram_multichannel_transport.py
          src/video_channel_manager/telegram_multichannel_outcome.py
          src/video_channel_manager/telegram_multichannel_cli.py
          src/video_channel_manager/svodka_queue.py
          src/video_channel_manager/svodka_release.py
          --show-error-codes

      - name: Focused regression suite
        run: >-
          python -m pytest -q
          tests/test_telegram_channel_profile_contract.py
          tests/test_telegram_channel_cli.py
          tests/test_telegram_html_entities.py
          tests/test_telegram_target_binding.py
          tests/test_telegram_multichannel_release.py
          tests/test_telegram_multichannel_state.py
          tests/test_telegram_multichannel_transport.py
          tests/test_telegram_multichannel_outcome.py
          tests/test_telegram_multichannel_cli.py
          tests/test_svodka_queue_contract.py
          tests/test_svodka_release_review.py
          tests/test_svodka_preflight_workflow.py
          tests/test_svodka_deployment_workflows.py
          tests/test_svodka_reconciliation_workflow.py

      - name: Validate canonical Svodka inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_channel_cli validate-profile --profile "$PROFILE_PATH"
          python -m video_channel_manager.telegram_channel_cli validate-svodka --profile "$PROFILE_PATH" --queue "$QUEUE_PATH"
          python - <<'PY'
          from pathlib import Path
          from video_channel_manager.telegram_channel_profile import load_channel_profile
          from video_channel_manager.telegram_target_binding import load_target_binding

          profile = load_channel_profile(Path("content/telegram/channels/svodka.json"))
          binding = load_target_binding(Path("content/telegram/channels/svodka-target-binding.json"), profile)
          assert binding.chat_id == -1003527567039
          assert binding.bot_id == 8716602202
          assert binding.bot_username == "preaching_mp3_bot"
          assert binding.can_post_messages is True
          assert binding.provider_write_performed is False
          PY

      - name: Render every deterministic payload
        shell: bash
        run: |
          set -euo pipefail
          for sequence in $(seq 1 14); do
            python -m video_channel_manager.telegram_channel_cli preview-svodka \
              --profile "$PROFILE_PATH" --queue "$QUEUE_PATH" --sequence "$sequence" >/dev/null
          done

      - name: Build exact target-bound write-disabled candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python -m video_channel_manager.telegram_channel_cli build-svodka-candidate \
            --profile "$PROFILE_PATH" \
            --queue "$QUEUE_PATH" \
            --binding "$BINDING_PATH" \
            --release-id "$RELEASE_ID" \
            --output "$CANDIDATE_PATH"
          python - <<'PY'
          import os
          from pathlib import Path
          from video_channel_manager.telegram_multichannel_release import load_release

          release = load_release(Path(".runtime/svodka-review-candidate.json"))
          assert release.release_authorized is False
          assert release.release_id == os.environ["RELEASE_ID"]
          assert len(release.items) == 14
          assert release.chat_id == -1003527567039
          assert release.bot_id == 8716602202
          assert release.bot_username == "preaching_mp3_bot"
          print(f"release_digest={release.digest}")
          PY

      - name: Upload review candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: svodka-review-candidate
          path: .runtime/svodka-review-candidate.json
          if-no-files-found: error
          retention-days: 7
