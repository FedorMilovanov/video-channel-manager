name: Lordchrist Charnock existing Telegraph page correction (owner only)

on:
  workflow_dispatch:
    inputs:
      page:
        description: Existing, independently reviewed page to correct (never create)
        required: true
        type: choice
        options:
          - '03'
          - history-01
      confirm:
        description: Type EDIT_EXISTING_CHARNOCK_PAGE_ONCE for one guarded in-place revision
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lordchrist-charnock-telegraph-inplace-owner-only
  cancel-in-progress: false

jobs:
  in-place-edit:
    if: >-
      github.actor == 'FedorMilovanov' &&
      github.repository == 'FedorMilovanov/video-channel-manager' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'EDIT_EXISTING_CHARNOCK_PAGE_ONCE' &&
      (inputs.page == '03' || inputs.page == 'history-01')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse replay, non-main, or moving HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]] || exit 3
          [[ "$GITHUB_REPOSITORY" == "FedorMilovanov/video-channel-manager" ]] || exit 3
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 3
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]] || exit 3
      - name: Check out pinned existing-page editor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Exactly one preconditioned editPage and full public readback
        shell: bash
        env:
          LORDCHRIST_TELEGRAPH_ACCESS_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAPH_ACCESS_TOKEN }}
          REVIEWED_PAGE: ${{ inputs.page }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/charnock-provider-receipts"
          python -m scripts.charnock_telegraph_surgical_revision \
            --page "$REVIEWED_PAGE" \
            --execute \
            --confirm EDIT_EXISTING_CHARNOCK_PAGE_ONCE \
            --receipt-dir "$RUNNER_TEMP/charnock-provider-receipts"
          [[ "$(find "$RUNNER_TEMP/charnock-provider-receipts" -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 1 ]] || exit 4
