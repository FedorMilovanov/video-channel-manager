name: Svodka custom emoji harvest

on:
  pull_request:
    branches:
      - main
    paths:
      - "content/telegram/svodka/custom-emoji-exemplars.json"
      - "src/video_channel_manager/telegram_custom_emoji_harvest.py"
      - "src/video_channel_manager/telegram_html_entities.py"
      - "tests/test_telegram_custom_emoji_harvest.py"
      - "tests/test_telegram_html_entities.py"
      - ".github/workflows/svodka-custom-emoji-harvest.yml"
  push:
    branches:
      - main
    paths:
      - "content/telegram/svodka/custom-emoji-exemplars.json"
      - "src/video_channel_manager/telegram_custom_emoji_harvest.py"
      - "src/video_channel_manager/telegram_html_entities.py"
      - "tests/test_telegram_custom_emoji_harvest.py"
      - "tests/test_telegram_html_entities.py"
      - ".github/workflows/svodka-custom-emoji-harvest.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: svodka-custom-emoji-harvest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      EXEMPLARS_PATH: content/telegram/svodka/custom-emoji-exemplars.json
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install minimal Telegram runtime
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt

      - name: Harvest custom emoji ids from public historical exemplars
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python -m video_channel_manager.telegram_custom_emoji_harvest \
            --config "$EXEMPLARS_PATH" \
            --output .runtime/svodka-custom-emoji-public-harvest.json

      - name: Upload public harvest proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: svodka-custom-emoji-public-harvest
          path: .runtime/svodka-custom-emoji-public-harvest.json
          if-no-files-found: error

      - name: Verify harvested ids with read-only Bot API
        if: github.event_name != 'pull_request'
        env:
          SVODKA_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_custom_emoji_harvest \
            --config "$EXEMPLARS_PATH" \
            --verify-bot-api \
            --output .runtime/svodka-custom-emoji-verified-harvest.json

      - name: Upload verified custom emoji proof
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: svodka-custom-emoji-verified-harvest
          path: .runtime/svodka-custom-emoji-verified-harvest.json
          if-no-files-found: error

      - name: Build sanitized issue checkpoint
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('.runtime/svodka-custom-emoji-verified-harvest.json').read_text(encoding='utf-8'))
          lines = [
              '## Svodka custom emoji harvest — verified',
              '',
              f"- main SHA: `{__import__('os').environ['GITHUB_SHA']}`",
              f"- channel: `{payload['channel_username']}`",
              f"- exemplar message ids: `{', '.join(str(item['message_id']) for item in payload['exemplars'])}`",
              f"- distinct custom emoji ids: `{len(payload['all_custom_emoji_ids'])}`",
              f"- Bot API validation performed: `{payload['bot_api_validation_performed']}`",
              '- provider write performed: `False`',
              '',
              'Verified IDs and fallback emoji:',
          ]
          for item in payload['verified_custom_emoji']:
              lines.append(f"- `{item['custom_emoji_id']}` → {item['emoji']} ({item.get('set_name') or 'no set name'})")
          Path('.runtime/custom-emoji-issue-comment.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Record verified harvest checkpoint in issue 273
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 273 --repo "$GITHUB_REPOSITORY" --body-file .runtime/custom-emoji-issue-comment.md
