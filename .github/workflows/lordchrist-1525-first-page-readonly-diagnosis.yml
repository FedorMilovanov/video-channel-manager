name: LordChrist 1525 first glossary page — read-only provider diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-page-proof:
    if: >-
      github.repository == 'FedorMilovanov/video-channel-manager' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTHONPATH: src
      LORDCHRIST_TELEGRAPH_ACCESS_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAPH_ACCESS_TOKEN }}
    steps:
      - name: Exact main checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check 'httpx==0.28.1'
      - name: Authenticated READ-ONLY page list and public content comparison
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import httpx
          from video_channel_manager.lordchrist_peasants1525_term_pages import PAGES, page_nodes, validate_page

          title = PAGES["swabia"][0]
          token = os.environ.get("LORDCHRIST_TELEGRAPH_ACCESS_TOKEN", "").strip()
          if not token:
              raise RuntimeError("Read-only diagnosis secret unavailable")
          with httpx.Client(timeout=22) as http:
              found = []
              for offset in range(0, 4000, 200):
                  res = http.post("https://api.telegra.ph/getPageList", data={
                      "access_token": token, "offset": str(offset), "limit": "200",
                  })
                  res.raise_for_status()
                  data = res.json()
                  page_list = (data.get("result") or {}).get("pages", [])
                  if not data.get("ok") or not isinstance(page_list, list):
                      raise RuntimeError("Provider listing failure")
                  found.extend([page for page in page_list if page.get("title") == title])
                  if len(page_list) < 200:
                      break
              print("EXACT_TITLE_MATCHES", len(found))
              if len(found) != 1:
                  raise RuntimeError("Ambiguous or absent publisher-owned page. No mutations.")
              page_url = found[0]["url"]
              page_path = found[0]["path"]
              if page_url != "https://telegra.ph/" + page_path:
                  raise RuntimeError("Unexpected page identity")
              print("OWNED_PUBLIC_URL", page_url)
              res = http.get("https://api.telegra.ph/getPage/" + page_path, params={
                  "return_content": "true",
              })
              res.raise_for_status()
              data = res.json()
              result = data.get("result") if data.get("ok") else None
              if not isinstance(result, dict):
                  raise RuntimeError("No public page content")
              actual = result.get("content") or []
              expected = page_nodes("swabia")
              print("LIVE_TITLE_MATCH", result.get("title") == title)
              print("LIVE_URL_MATCH", result.get("url") == page_url)
              print("NODE_COUNTS", len(actual), len(expected))
              for i in range(min(len(actual), 8)):
                  a = actual[i]
                  b = expected[i] if i < len(expected) else None
                  print("NODE", i, "MATCH", a == b)
                  print("LIVE_STRUCTURE", i, json.dumps(a, ensure_ascii=True, sort_keys=True)[:1100])
                  print("EXPECTED_STRUCTURE", i, json.dumps(b, ensure_ascii=True, sort_keys=True)[:1100])
              print("EXISTING_VALIDATOR_RESULT", validate_page("swabia", page_url))
              print("DIAGNOSIS_READ_ONLY", True)
          PY
