name: Svodka one-time Ruff format

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/svodka-format-once.yml

permissions:
  contents: write

concurrency:
  group: svodka-format-once
  cancel-in-progress: false

jobs:
  format-and-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install repository dev formatter
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Format only the additive Telegram multi-channel wave
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            src/video_channel_manager/telegram_channel_*.py
            src/video_channel_manager/telegram_multichannel_*.py
            src/video_channel_manager/svodka_*.py
            tests/test_telegram_channel_*.py
            tests/test_telegram_multichannel_*.py
            tests/test_svodka_*.py
          )
          ((${#files[@]} > 0)) || {
            echo "No Svodka multi-channel Python files matched" >&2
            exit 2
          }
          ruff format "${files[@]}"

      - name: Commit formatting result and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/svodka-format-once.yml
          git add src/video_channel_manager tests
          if git diff --cached --quiet; then
            echo "Nothing changed after Ruff formatting" >&2
            exit 2
          fi
          git commit -m "Apply Ruff format to Svodka multi-channel wave"
          git push origin HEAD:main
