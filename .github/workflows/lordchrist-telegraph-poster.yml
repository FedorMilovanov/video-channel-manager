name: Lordchrist Telegraph publisher

on:
  workflow_dispatch:
    inputs:
      action:
        description: Offline preview, publish Telegraph page only (test link privately), or publish full post to @lordchrist
        required: true
        default: publish-telegraph-only
        type: choice
        options:
          - preview
          - publish-telegraph-only
          - publish
      publication_id:
        description: Exact publication_id from content/telegram/lordchrist/telegraph-v1/article-queue.json
        required: true
        default: lordchrist-telegraph-charnock-01b
        type: string
      confirm:
        description: Required ONLY for action=publish — type PUBLISH:<publication_id>
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: lordchrist-telegraph-publisher
  cancel-in-progress: false

jobs:
  telegraph-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Check out state branch if present
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin state/lordchrist-telegram >/dev/null 2>&1; then
            git fetch origin state/lordchrist-telegram:refs/remotes/origin/state/lordchrist-telegram
            git worktree add .state/lordchrist origin/state/lordchrist-telegram
          else
            mkdir -p .state/lordchrist
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt

      - name: Run Telegraph publisher (${{ inputs.action }})
        id: run
        shell: bash
        env:
          PYTHONPATH: src
          ACTION: ${{ inputs.action }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
          CONFIRMATION: ${{ inputs.confirm }}
          MEDIA_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          LEDGER_PATH: ".state/lordchrist/content/telegram/lordchrist/telegraph-v1/publication-ledger.json"
          LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
          LORDCHRIST_TELEGRAPH_ACCESS_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAPH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ "$ACTION" == "preview" ]]; then
            python -m video_channel_manager.lordchrist_telegraph_publisher preview \
              --publication-id "$PUBLICATION_ID" \
              --media-base-url "$MEDIA_BASE_URL" \
              --html-out "artifacts/${PUBLICATION_ID}-preview.html" | tee artifacts/result.json
          elif [[ "$ACTION" == "publish-telegraph-only" ]]; then
            python -m video_channel_manager.lordchrist_telegraph_publisher publish-telegraph-only \
              --publication-id "$PUBLICATION_ID" \
              --media-base-url "$MEDIA_BASE_URL" \
              --ledger "$LEDGER_PATH" | tee artifacts/result.json
          elif [[ "$ACTION" == "publish" ]]; then
            python -m video_channel_manager.lordchrist_telegraph_publisher publish \
              --publication-id "$PUBLICATION_ID" \
              --media-base-url "$MEDIA_BASE_URL" \
              --ledger "$LEDGER_PATH" \
              --confirm "$CONFIRMATION" \
              --outcome "artifacts/outcome.json" | tee artifacts/result.json
          fi

          python - >> "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import json
          import pathlib

          res = json.loads(pathlib.Path("artifacts/result.json").read_text(encoding="utf-8"))
          lines = ["### Результат запуска Telegraph + @lordchrist", ""]
          lines.extend(f"- **{key}**: {value}" for key, value in res.items())
          telegraph_url = res.get("telegraph_url")
          if telegraph_url:
              lines.append("")
              lines.append(
                  "Готовая ссылка Telegra.ph (киньте себе в Избранное в Telegram "
                  f"и нажмите ПОСМОТРЕТЬ): {telegraph_url}"
              )
          print("\n".join(lines))
          PYEOF

      - name: Persist public ledger on state branch
        if: inputs.action != 'preview'
        env:
          ACTION: ${{ inputs.action }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d .state/lordchrist/.git || -f .state/lordchrist/.git ]]; then
            cd .state/lordchrist
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore(lordchrist): record Telegraph ${ACTION} for ${PUBLICATION_ID}"
              git push origin HEAD:state/lordchrist-telegram
            fi
          fi

      - name: Upload preview / outcome artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lordchrist-telegraph-${{ inputs.publication_id }}
          path: artifacts/
