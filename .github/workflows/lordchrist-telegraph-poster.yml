name: Lordchrist Telegraph publisher

on:
  workflow_dispatch:
    inputs:
      action:
        description: Offline preview or reviewed staged publication to @lordchrist
        required: true
        default: preview
        type: choice
        options:
          - preview
          - publish
      publication_id:
        description: Exact publication_id from content/telegram/lordchrist/telegraph-v1/article-queue.json
        required: true
        default: lordchrist-telegraph-charnock-01b
        type: string
      confirm:
        description: Required ONLY for action=publish — type PUBLISH:<publication_id>
        required: false
        default: ""
        type: string
  schedule:
    # GitHub cron fires in UTC. 09:00 UTC = 12:00 Moscow — the midday article
    # slot, Tuesday and Friday (2 articles per week). The publisher resolves
    # the due article from telegraph-v1/article-queue.json in Europe/Moscow
    # and refuses duplicates via the state-branch ledger. Do NOT add a
    # `timezone:` key: the expression is already the UTC form of 12:00 MSK.
    - cron: "0 9 * * 2,5"

permissions:
  actions: read
  contents: write

# All writers of the same durable ref must share one serialized run queue.
env:
  STATE_BRANCH: state/lordchrist-telegram

concurrency:
  group: lordchrist-telegram-publisher
  cancel-in-progress: false
  queue: max

jobs:
  telegraph-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Check out state branch if present
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH"
            git worktree add .state/lordchrist "origin/$STATE_BRANCH"
          else
            mkdir -p .state/lordchrist
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt

      - name: Resolve scheduled article (schedule only)
        if: github.event_name == 'schedule'
        id: resolve
        shell: bash
        env:
          PYTHONPATH: src
          LEDGER_PATH: ".state/lordchrist/content/telegram/lordchrist/telegraph-v1/publication-ledger.json"
        run: |
          set -euo pipefail
          python -m video_channel_manager.lordchrist_telegraph_publisher due \
            --ledger "$LEDGER_PATH" > due.json
          cat due.json
          publication_id="$(python -c 'import json; print(json.load(open("due.json")).get("due") or "")')"
          echo "publication_id=${publication_id}" >> "$GITHUB_OUTPUT"

      # The queue's "ready" status proves formatting only, not source/rights approval.
      # Versioned editorial review precedes manually setting these exact release
      # variables. A missing or stale binding must never reach the provider.
      - name: Require approved exact Telegraph bytes and current-main CI
        if: github.event_name != 'schedule' || steps.resolve.outputs.publication_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
          ACTION: ${{ github.event_name == 'schedule' && 'publish' || inputs.action }}
          MANUAL_CONFIRM: ${{ inputs.confirm }}
          PUBLICATION_ID: ${{ github.event_name == 'schedule' && steps.resolve.outputs.publication_id || inputs.publication_id }}
          LORDCHRIST_TELEGRAPH_POSTING_ENABLED: ${{ vars.LORDCHRIST_TELEGRAPH_POSTING_ENABLED }}
          LORDCHRIST_TELEGRAPH_APPROVED_PUBLICATION_ID: ${{ vars.LORDCHRIST_TELEGRAPH_APPROVED_PUBLICATION_ID }}
          LORDCHRIST_TELEGRAPH_APPROVED_ARTICLE_BLOB_SHA: ${{ vars.LORDCHRIST_TELEGRAPH_APPROVED_ARTICLE_BLOB_SHA }}
        run: |
          set -euo pipefail
          if [[ "$ACTION" == "preview" ]]; then
            echo "Provider-free preview: no release authority is created."
            exit 0
          fi
          [[ "$ACTION" == "publish" ]] || {
            echo "Telegraph-only direct mutation is retired; use a reviewed staged release." >&2
            exit 3
          }
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$PUBLICATION_ID" == lordchrist-telegraph-charnock-* ]]; then
            echo "Manual Charnock publication is permanently retired after the 2026-11-05 incident; use the reviewed calendar reissue only." >&2
            exit 3
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$MANUAL_CONFIRM" == "PUBLISH:$PUBLICATION_ID" ]] || {
              echo "Manual public publication requires exact PUBLISH:<publication_id> confirmation." >&2
              exit 3
            }
          fi
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]] || {
            echo "Rerunning a provider-capable workflow attempt is forbidden." >&2
            exit 3
          }

          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Public Telegraph mutation requires current main, not a PR or stale branch." >&2
            exit 3
          }
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current_main" == "$GITHUB_SHA" ]] || {
            echo "main moved after checkout; reject a stale public Telegraph mutation." >&2
            exit 3
          }
          python -m video_channel_manager.telegram_github_quality_gate --workflow ci.yml --sha "$GITHUB_SHA"

          [[ "$LORDCHRIST_TELEGRAPH_POSTING_ENABLED" == "true" ]] || {
            echo "Telegraph lane is not explicitly enabled after editorial review." >&2
            exit 3
          }
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          publication_id = os.environ["PUBLICATION_ID"]
          approved_id = os.environ["LORDCHRIST_TELEGRAPH_APPROVED_PUBLICATION_ID"]
          approved_sha = os.environ["LORDCHRIST_TELEGRAPH_APPROVED_ARTICLE_BLOB_SHA"]
          if not publication_id or approved_id != publication_id or re.fullmatch(r"[a-f0-9]{40}", approved_sha) is None:
              raise SystemExit("No exact reviewed publication ID and 40-character Git article blob approval; reject.")
          queue = json.loads(Path("content/telegram/lordchrist/telegraph-v1/article-queue.json").read_text("utf-8"))
          matches = [item for item in queue["items"] if item["publication_id"] == publication_id]
          if len(matches) != 1 or matches[0]["status"] != "ready":
              raise SystemExit("Exact ready Telegraph article is absent or ambiguous; reject.")
          article = matches[0]["article"]
          if article["git_blob_sha"] != approved_sha:
              raise SystemExit("Reviewed article blob differs from queued immutable blob; reject.")
          root = Path.cwd().resolve()
          article_path = (root / article["path"]).resolve()
          if not article_path.is_relative_to(root) or not article_path.is_file():
              raise SystemExit("Reviewed Telegraph article path is unsafe or missing; reject.")
          data = article_path.read_bytes()
          actual = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          if actual != approved_sha:
              raise SystemExit("Reviewed article bytes differ from the exact approved Git blob; reject.")
          print(f"Release-bound Telegraph article confirmed: {publication_id} / {actual}")
          PY

      - name: Run Telegraph publisher (provider-free preview)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'preview'
        shell: bash
        env:
          PYTHONPATH: src
          PUBLICATION_ID: ${{ inputs.publication_id }}
          MEDIA_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m video_channel_manager.lordchrist_telegraph_publisher preview \
            --publication-id "$PUBLICATION_ID" \
            --media-base-url "$MEDIA_BASE_URL" \
            --html-out "artifacts/${PUBLICATION_ID}-preview.html" > artifacts/preview.json
          cat artifacts/preview.json

      - name: Prepare exact durable Telegraph dispatch claim
        if: >-
          (github.event_name == 'schedule' && steps.resolve.outputs.publication_id != '') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
        shell: bash
        env:
          PYTHONPATH: src
          PUBLICATION_ID: ${{ github.event_name == 'schedule' && steps.resolve.outputs.publication_id || inputs.publication_id }}
          MEDIA_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          LEDGER_PATH: ".state/lordchrist/content/telegram/lordchrist/telegraph-v1/publication-ledger.json"
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]] || {
            echo "Workflow rerun must not replay previously claimed external effects." >&2
            exit 3
          }
          mkdir -p artifacts
          python -m video_channel_manager.lordchrist_telegraph_staged prepare-page \
            --publication-id "$PUBLICATION_ID" \
            --media-base-url "$MEDIA_BASE_URL" \
            --ledger "$LEDGER_PATH" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-sha "$GITHUB_SHA" > artifacts/claim-page.json

      - name: Persist and verify claimed Telegraph intent before public mutation
        if: >-
          (github.event_name == 'schedule' && steps.resolve.outputs.publication_id != '') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
        shell: bash
        run: |
          set -euo pipefail
          state_dir=.state/lordchrist
          [[ -e "$state_dir/.git" ]] || {
            echo "No writable durable state checkout; public release refused." >&2
            exit 3
          }
          git -C "$state_dir" config user.name "lordchrist-telegraph[bot]"
          git -C "$state_dir" config user.email "lordchrist-telegraph@users.noreply.github.com"
          git -C "$state_dir" add -- content/telegram/lordchrist/telegraph-v1/publication-ledger.json
          git -C "$state_dir" diff --cached --quiet && exit 3
          git -C "$state_dir" commit -m "Claim irreversible Telegraph page dispatch for run $GITHUB_RUN_ID/1"
          local_sha="$(git -C "$state_dir" rev-parse HEAD)"
          git -C "$state_dir" push origin HEAD:state/lordchrist-telegram
          remote_sha="$(git -C "$state_dir" ls-remote origin refs/heads/state/lordchrist-telegram | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || exit 3

      - name: Send exactly one claimed Telegraph page
        if: >-
          (github.event_name == 'schedule' && steps.resolve.outputs.publication_id != '') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
        shell: bash
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_ID: ${{ github.event_name == 'schedule' && steps.resolve.outputs.publication_id || inputs.publication_id }}
          MEDIA_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          LEDGER_PATH: ".state/lordchrist/content/telegram/lordchrist/telegraph-v1/publication-ledger.json"
          LORDCHRIST_TELEGRAPH_ACCESS_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAPH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]] || exit 3
          python -m video_channel_manager.telegram_github_quality_gate --workflow ci.yml --sha "$GITHUB_SHA"
          local_sha="$(git -C .state/lordchrist rev-parse HEAD)"
          remote_sha="$(git -C .state/lordchrist ls-remote origin refs/heads/state/lordchrist-telegram | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || exit 3
          python -m video_channel_manager.lordchrist_telegraph_staged send-page \
            --publication-id "$PUBLICATION_ID" --media-base-url "$MEDIA_BASE_URL" \
            --ledger "$LEDGER_PATH" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-sha "$GITHUB_SHA" > artifacts/page-receipt.json

      - name: Persist and verify Telegraph receipt before Telegram preparation
        if: >-
          (github.event_name == 'schedule' && steps.resolve.outputs.publication_id != '') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
        shell: bash
        run: |
          set -euo pipefail
          state_dir=.state/lordchrist
          git -C "$state_dir" add -- content/telegram/lordchrist/telegraph-v1/publication-ledger.json
          git -C "$state_dir" diff --cached --quiet && exit 3
          git -C "$state_dir" commit -m "Record verified Telegraph page receipt for run $GITHUB_RUN_ID/1"
          local_sha="$(git -C "$state_dir" rev-parse HEAD)"
          git -C "$state_dir" push origin HEAD:state/lordchrist-telegram
          remote_sha="$(git -C "$state_dir" ls-remote origin refs/heads/state/lordchrist-telegram | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || exit 3

      - name: Prepare durable Telegram dispatch claim
        if: >-
          (github.event_name == 'schedule' && steps.resolve.outputs.publication_id != '') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
        shell: bash
        env:
          PYTHONPATH: src
          PUBLICATION_ID: ${{ github.event_name == 'schedule' && steps.resolve.outputs.publication_id || inputs.publication_id }}
          MEDIA_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          LEDGER_PATH: ".state/lordchrist/content/telegram/lordchrist/telegraph-v1/publication-ledger.json"
        run: |
          set -euo pipefail
          python -m video_channel_manager.lordchrist_telegraph_staged prepare-telegram \
            --publication-id "$PUBLICATION_ID" --media-base-url "$MEDIA_BASE_URL" \
            --ledger "$LEDGER_PATH" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-sha "$GITHUB_SHA" > artifacts/claim-telegram.json

      - name: Persist and verify Telegram dispatch claim before public mutation
        if: >-
          (github.event_name == 'schedule' && steps.resolve.outputs.publication_id != '') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
        shell: bash
        run: |
          set -euo pipefail
          state_dir=.state/lordchrist
          git -C "$state_dir" add -- content/telegram/lordchrist/telegraph-v1/publication-ledger.json
          git -C "$state_dir" diff --cached --quiet && exit 3
          git -C "$state_dir" commit -m "Claim irreversible Telegram send for run $GITHUB_RUN_ID/1"
          local_sha="$(git -C "$state_dir" rev-parse HEAD)"
          git -C "$state_dir" push origin HEAD:state/lordchrist-telegram
          remote_sha="$(git -C "$state_dir" ls-remote origin refs/heads/state/lordchrist-telegram | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || exit 3

      - name: Send exactly one claimed Telegram post
        if: >-
          (github.event_name == 'schedule' && steps.resolve.outputs.publication_id != '') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
        shell: bash
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_ID: ${{ github.event_name == 'schedule' && steps.resolve.outputs.publication_id || inputs.publication_id }}
          MEDIA_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          LEDGER_PATH: ".state/lordchrist/content/telegram/lordchrist/telegraph-v1/publication-ledger.json"
          LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]] || exit 3
          python -m video_channel_manager.telegram_github_quality_gate --workflow ci.yml --sha "$GITHUB_SHA"
          local_sha="$(git -C .state/lordchrist rev-parse HEAD)"
          remote_sha="$(git -C .state/lordchrist ls-remote origin refs/heads/state/lordchrist-telegram | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || exit 3
          python -m video_channel_manager.lordchrist_telegraph_staged send-telegram \
            --publication-id "$PUBLICATION_ID" --media-base-url "$MEDIA_BASE_URL" \
            --ledger "$LEDGER_PATH" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-sha "$GITHUB_SHA" > artifacts/telegram-receipt.json

      - name: Persist verified terminal Telegram receipt
        if: >-
          (github.event_name == 'schedule' && steps.resolve.outputs.publication_id != '') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
        shell: bash
        run: |
          set -euo pipefail
          state_dir=.state/lordchrist
          git -C "$state_dir" add -- content/telegram/lordchrist/telegraph-v1/publication-ledger.json
          git -C "$state_dir" diff --cached --quiet && exit 3
          git -C "$state_dir" commit -m "Verify terminal Telegram receipt for run $GITHUB_RUN_ID/1"
          local_sha="$(git -C "$state_dir" rev-parse HEAD)"
          git -C "$state_dir" push origin HEAD:state/lordchrist-telegram
          remote_sha="$(git -C "$state_dir" ls-remote origin refs/heads/state/lordchrist-telegram | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || exit 3

      - name: Upload preview / receipt artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lordchrist-telegraph-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
