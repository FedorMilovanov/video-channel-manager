name: Lordchrist quote-v4 read-only preflight

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: Exact read-only staging confirmation READ-ONLY-STAGING-PREFLIGHT
        required: true
        type: string
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  actions: read
  contents: read

concurrency:
  group: lordchrist-quote-v4-read-only-preflight
  cancel-in-progress: true

env:
  PYTHONPATH: src
  QUEUE_PATH: content/telegram/lordchrist/verified-30-posts.json
  LEDGER_PATH: .state/lordchrist/content/telegram/lordchrist/publication-ledger.json
  LOCAL_LEDGER_PATH: .runtime/lordchrist-quote-v4-publication-ledger.json
  ACTIVATION_PATH: content/telegram/lordchrist/quote-v4-runtime-activation.json
  PRESENTATION_POLICY_PATH: content/telegram/lordchrist/presentation-policy.json
  PRODUCTION_SCHEDULE_PATH: content/telegram/lordchrist/production-schedule.json
  ACTIVE_SELECTION_PATH: .runtime/lordchrist-active-quote-selection.json
  TARGET_PROOF_PATH: .runtime/lordchrist-quote-v4-target-proof.json
  RENDER_PROOF_PATH: .runtime/lordchrist-quote-v4-render-proof.json
  STATE_DIR: .state/lordchrist
  STATE_BRANCH: state/lordchrist-telegram
  # Cross-track no-blind-replay barrier bindings (read-only here): the
  # predecessor queue is the archived pre-v4 queue; its ledger is the live
  # state ledger until the publisher cutover archives it under a
  # digest-named path.
  LORDCHRIST_PREDECESSOR_QUEUE_PATH: content/telegram/lordchrist/archived-old-queues/verified-30-posts.json
  LORDCHRIST_PREDECESSOR_LEDGER_PATH: .state/lordchrist/content/telegram/lordchrist/publication-ledger.json
  LORDCHRIST_TELEGRAM_CHAT_ID: ${{ vars.LORDCHRIST_TELEGRAM_CHAT_ID }}
  LORDCHRIST_TELEGRAM_BOT_ID: ${{ vars.LORDCHRIST_TELEGRAM_BOT_ID }}
  LORDCHRIST_TELEGRAM_BOT_USERNAME: ${{ vars.LORDCHRIST_TELEGRAM_BOT_USERNAME }}

jobs:
  preflight:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'lordchrist-read-only-preflight'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact read-only preflight revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove the exact preflight revision and read-only mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SUCCESSFUL_CI_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirm }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_REF: ${{ github.event.pull_request.head.label }}
        run: |
          set -euo pipefail
          local_sha="$(git rev-parse HEAD)"
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          staging_revision=""
          case "$EVENT_NAME" in
            workflow_run)
              [[ "$local_sha" == "$SUCCESSFUL_CI_SHA" ]] || {
                echo "Checked-out SHA differs from successful CI SHA." >&2
                exit 2
              }
              [[ "$current_main" == "$SUCCESSFUL_CI_SHA" ]] || {
                echo "Successful CI SHA is no longer current main; refusing stale activation proof." >&2
                exit 3
              }
              ;;
            workflow_dispatch)
              [[ "$DISPATCH_CONFIRMATION" == "READ-ONLY-STAGING-PREFLIGHT" ]] || {
                echo "workflow_dispatch requires the exact confirmation READ-ONLY-STAGING-PREFLIGHT." >&2
                exit 2
              }
              [[ "$local_sha" == "$DISPATCH_SHA" ]] || {
                echo "Checked-out SHA differs from the dispatched SHA." >&2
                exit 2
              }
              staging_revision="$DISPATCH_REF"
              ;;
            pull_request)
              [[ "$local_sha" == "$PULL_REQUEST_HEAD_SHA" ]] || {
                echo "Checked-out SHA differs from the pull-request head SHA." >&2
                exit 2
              }
              staging_revision="$PULL_REQUEST_REF"
              ;;
            *)
              echo "Unsupported preflight event: $EVENT_NAME" >&2
              exit 4
              ;;
          esac
          if [[ "$local_sha" == "$current_main" ]]; then
            preflight_mode=current_main
          else
            preflight_mode=staging_sha
            echo "Read-only staging proof on ${staging_revision:-$EVENT_NAME} at $local_sha."
            echo "This staged run is verification evidence only; it never authorizes a provider write."
          fi
          [[ "$preflight_mode" == "current_main" || "$preflight_mode" == "staging_sha" ]] || {
            echo "Unknown preflight mode." >&2
            exit 4
          }
          {
            echo "PREFLIGHT_MODE=$preflight_mode"
            echo "PREFLIGHT_SHA=$local_sha"
          } >> "$GITHUB_ENV"
          echo "Read-only preflight mode: $preflight_mode at $local_sha."

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install minimal Telegram runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt

      - name: Check out durable Telegram state read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state/lordchrist-telegram
          path: .state/lordchrist
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact v4 quote release (read-only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          from pathlib import Path

          from video_channel_manager.telegram_models import TelegramQueue

          queue_path = Path(os.environ["QUEUE_PATH"])
          queue = TelegramQueue.model_validate_json(queue_path.read_text(encoding="utf-8"))
          digest = queue.digest
          activation = json.loads(Path(os.environ["ACTIVATION_PATH"]).read_text(encoding="utf-8"))
          if activation.get("release_id") != "lordchrist-puritan-spurgeon-v4":
              raise SystemExit("v4 activation artifact names an unexpected release")
          if activation.get("queue_digest") != digest:
              raise SystemExit("v4 activation artifact does not bind the exact live queue digest")

          # The v4 ledger is initialized by the guarded publisher on its first
          # publish; until then (or after any digest change) validate read-only
          # against an exact local materialization.
          effective = os.environ["LOCAL_LEDGER_PATH"]
          needs_init = True
          ledger_path = Path(os.environ["LEDGER_PATH"])
          if ledger_path.is_file():
              try:
                  existing = json.loads(ledger_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  existing = {}
              if existing.get("queue_digest") == digest:
                  effective = os.environ["LEDGER_PATH"]
                  needs_init = False

          selection = {
              "schema_name": "video-channel-manager.telegram-active-quote-selection",
              "schema_version": 3,
              "active_release": "v4",
              "release_id": "lordchrist-puritan-spurgeon-v4",
              "queue_path": str(queue_path),
              "ledger_path": effective,
              "queue_digest": digest,
              "needs_ledger_initialization": needs_init,
              "provider_writes_authorized": bool(activation.get("provider_writes_authorized")),
          }
          Path(os.environ["ACTIVE_SELECTION_PATH"]).write_text(
              json.dumps(selection, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print("EFFECTIVE_LEDGER_PATH=" + effective)
          PY

      - name: Materialize missing v4 ledger locally for read-only validation
        if: env.EFFECTIVE_LEDGER_PATH == env.LOCAL_LEDGER_PATH
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_cli \
            --queue "$QUEUE_PATH" \
            --ledger "$LOCAL_LEDGER_PATH" \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            initialize-ledger \
            --confirm INITIALIZE_NEW_LORDCHRIST_LEDGER

      - name: Bind the exact reviewed queue digest for the read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          selection = json.loads(Path(os.environ["ACTIVE_SELECTION_PATH"]).read_text(encoding="utf-8"))
          activation = json.loads(Path(os.environ["ACTIVATION_PATH"]).read_text(encoding="utf-8"))
          schedule = json.loads(Path(os.environ["PRODUCTION_SCHEDULE_PATH"]).read_text(encoding="utf-8"))
          digest = selection["queue_digest"]
          if not (digest == activation["queue_digest"] == schedule["queue_digest"]):
              raise SystemExit(
                  "Resolved v4 queue digest differs from the reviewed activation artifact "
                  "and the reviewed production schedule binding."
              )
          if schedule["enabled"] is not activation["provider_writes_authorized"]:
              raise SystemExit(
                  "Reviewed schedule arming disagrees with the reviewed v4 activation artifact; "
                  "read-only preflight must not proceed on an unreviewed arming state."
              )
          if schedule["presentation_policy_sha256"] != activation["presentation_policy_sha256"]:
              raise SystemExit("Reviewed schedule presentation policy differs from the v4 activation artifact.")
          print(f"LORDCHRIST_APPROVED_QUEUE_DIGEST={digest}")
          PY

      - name: Validate queue and strict ledger (v4)
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_cli \
            --queue "$QUEUE_PATH" \
            --ledger "$EFFECTIVE_LEDGER_PATH" \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            validate

      - name: Prove the v4 reading unit for the exact next pending publication
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_cli \
            --queue "$QUEUE_PATH" \
            --ledger "$EFFECTIVE_LEDGER_PATH" \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            preview
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from video_channel_manager.telegram_models import TelegramLedger, TelegramQueue

          queue = TelegramQueue.model_validate_json(Path(os.environ["QUEUE_PATH"]).read_text(encoding="utf-8"))
          ledger = TelegramLedger.model_validate_json(Path(os.environ["EFFECTIVE_LEDGER_PATH"]).read_text(encoding="utf-8"))
          activation = json.loads(Path(os.environ["ACTIVATION_PATH"]).read_text(encoding="utf-8"))
          published_prefix = 0
          next_post = None
          for post in queue.posts:
              entry = ledger.entries.get(post.publication_id)
              if entry is not None and entry.state == "published" and next_post is None:
                  published_prefix += 1
              elif next_post is None:
                  next_post = post
          pending = sum(1 for post in queue.posts if (ledger.entries.get(post.publication_id) is None or ledger.entries[post.publication_id].state == "pending"))
          proof = {
              "schema_name": "video-channel-manager.telegram-quote-v4-render-proof",
              "schema_version": 1,
              "release_id": activation["release_id"],
              "queue_digest": queue.digest,
              "provider_writes_authorized": bool(activation["provider_writes_authorized"]),
              "published_prefix": published_prefix,
              "pending_suffix": pending,
              "next_sequence": next_post.sequence if next_post else None,
              "next_publication_id": next_post.publication_id if next_post else None,
          }
          Path(os.environ["RENDER_PROOF_PATH"]).write_text(
              json.dumps(proof, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print(json.dumps(proof, ensure_ascii=False))
          PY

      - name: Prove exact Telegram target configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LORDCHRIST_TELEGRAM_CHAT_ID" =~ ^-?[0-9]+$ ]] && (( LORDCHRIST_TELEGRAM_CHAT_ID < 0 )) || {
            echo "LORDCHRIST_TELEGRAM_CHAT_ID must be an exact negative integer." >&2
            exit 2
          }
          [[ "$LORDCHRIST_TELEGRAM_BOT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "LORDCHRIST_TELEGRAM_BOT_ID must be an exact positive integer." >&2
            exit 2
          }
          [[ "$LORDCHRIST_TELEGRAM_BOT_USERNAME" =~ ^[A-Za-z0-9_]+$ ]] || {
            echo "LORDCHRIST_TELEGRAM_BOT_USERNAME is invalid." >&2
            exit 2
          }

      - name: Read-only live bot and channel identity preflight
        shell: bash
        env:
          LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_cli \
            --queue "$QUEUE_PATH" \
            --ledger "$EFFECTIVE_LEDGER_PATH" \
            --presentation-policy "$PRESENTATION_POLICY_PATH" \
            preflight \
            --mode manual \
            --expected-chat-id "$LORDCHRIST_TELEGRAM_CHAT_ID" \
            --expected-bot-id "$LORDCHRIST_TELEGRAM_BOT_ID" \
            --expected-bot-username "$LORDCHRIST_TELEGRAM_BOT_USERNAME" \
            --output "$TARGET_PROOF_PATH"

      - name: Assert preflight remained provider-inert
        shell: bash
        run: |
          set -euo pipefail
          # Direct state-inert proof: the read-only durable state checkout was not
          # modified and no dispatch/rendered provider intent was materialized.
          [[ -z "$(git -C "$STATE_DIR" status --porcelain)" ]] || {
            echo "Read-only preflight modified the durable state checkout." >&2
            exit 2
          }
          [[ "$(git -C "$STATE_DIR" rev-parse HEAD)" == "$(git ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)" ]] || {
            echo "Read-only preflight no longer matches the durable state branch head." >&2
            exit 3
          }
          [[ ! -e .runtime/lordchrist-dispatch.json && ! -e .runtime/lordchrist-rendered.json ]] || {
            echo "Read-only preflight materialized a provider dispatch or rendered payload." >&2
            exit 4
          }
          [[ ! -e .runtime/lordchrist-outcome.json ]] || {
            echo "Read-only preflight materialized a provider outcome." >&2
            exit 4
          }
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          activation = json.loads(Path(os.environ["ACTIVATION_PATH"]).read_text(encoding="utf-8"))
          selection = json.loads(Path(os.environ["ACTIVE_SELECTION_PATH"]).read_text(encoding="utf-8"))
          render_proof = json.loads(Path(os.environ["RENDER_PROOF_PATH"]).read_text(encoding="utf-8"))
          target_proof = json.loads(Path(os.environ["TARGET_PROOF_PATH"]).read_text(encoding="utf-8"))
          schedule = json.loads(Path(os.environ["PRODUCTION_SCHEDULE_PATH"]).read_text(encoding="utf-8"))

          if render_proof["provider_writes_authorized"] != activation["provider_writes_authorized"]:
              raise SystemExit("Rendering proof authorization differs from the reviewed activation artifact.")
          if schedule["enabled"] is not activation["provider_writes_authorized"]:
              raise SystemExit("Reviewed schedule arming differs from the reviewed activation artifact.")
          if selection["active_release"] != "v4":
              raise SystemExit("Read-only preflight resolved an unexpected active release.")
          if selection["needs_ledger_initialization"]:
              materialized = Path(os.environ["LOCAL_LEDGER_PATH"])
              if not materialized.is_file():
                  raise SystemExit("v4 ledger initialization is required but was not materialized locally.")
              local_ledger = json.loads(materialized.read_text(encoding="utf-8"))
              if local_ledger["queue_digest"] != selection["queue_digest"]:
                  raise SystemExit("Locally materialized v4 ledger differs from the resolved queue digest.")
          if target_proof["bot_id"] != int(os.environ["LORDCHRIST_TELEGRAM_BOT_ID"]):
              raise SystemExit("Live target proof resolved a different bot id.")
          if target_proof["chat_id"] != int(os.environ["LORDCHRIST_TELEGRAM_CHAT_ID"]):
              raise SystemExit("Live target proof resolved a different channel id.")
          if target_proof["chat_username"] != "lordchrist" or target_proof["chat_type"] != "channel":
              raise SystemExit("Live target proof did not resolve the canonical channel.")
          if target_proof["can_post_messages"] is not True:
              raise SystemExit("Live target proof did not confirm posting permission.")

          mode = os.environ["PREFLIGHT_MODE"]
          label = "exact current-main" if mode == "current_main" else "read-only staging"
          print(
              f"PASS: {label} quote-v4 preflight is provider-inert; "
              f"published prefix {render_proof['published_prefix']}, pending suffix {render_proof['pending_suffix']}, "
              f"strict next sequence {render_proof['next_sequence']} ({render_proof['next_publication_id']})."
          )
          PY

      - name: Publish exact read-only preflight evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def emit(label: str, value: str) -> None:
              print(f"::notice::{label}: {value}")

          emit("preflight mode", f"{os.environ.get('PREFLIGHT_MODE', 'unknown')} at {os.environ.get('PREFLIGHT_SHA', 'unknown')}")
          activation = json.loads(Path(os.environ["ACTIVATION_PATH"]).read_text(encoding="utf-8"))
          emit("reviewed v4 activation", f"{activation['release_id']} {activation['queue_digest']}")
          emit("quote policy", f"{activation['presentation_policy_id']} {activation['presentation_policy_sha256']}")
          render_proof = json.loads(Path(os.environ["RENDER_PROOF_PATH"]).read_text(encoding="utf-8"))
          emit(
              "state boundary",
              f"{render_proof['published_prefix']} published / {render_proof['pending_suffix']} pristine pending; "
              f"strict next sequence {render_proof['next_sequence']} ({render_proof['next_publication_id']})",
          )
          target_proof = json.loads(Path(os.environ["TARGET_PROOF_PATH"]).read_text(encoding="utf-8"))
          emit(
              "read-only Telegram target proof",
              f"bot {target_proof['bot_username']} ({target_proof['bot_id']}); "
              f"chat @{target_proof['chat_username']} ({target_proof['chat_id']}) {target_proof['chat_type']}; "
              f"member status {target_proof['member_status']}; can_post_messages={target_proof['can_post_messages']}",
          )
          emit("provider inertness", "durable state checkout byte-clean; no dispatch or rendered payload materialized")
          PY

      - name: Upload exact read-only preflight evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lordchrist-quote-v4-preflight-proofs
          retention-days: 30
          if-no-files-found: warn
          path: |
            .runtime/lordchrist-active-quote-selection.json
            .runtime/lordchrist-quote-v4-render-proof.json
            .runtime/lordchrist-quote-v4-target-proof.json
