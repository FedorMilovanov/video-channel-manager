name: Lordchrist Charnock exact editorial correction

on:
  workflow_dispatch:
    inputs:
      page:
        description: Existing Telegraph page (no new page or Telegram post)
        required: true
        type: choice
        options: ["11", "12", "13"]
      mode:
        description: Plan publicly; apply only the reviewed exact digests
        type: choice
        required: true
        default: plan
        options: [plan, apply]
      expected_before:
        description: Exact before_sha256 from plan (required for apply)
        type: string
        required: false
      expected_after:
        description: Exact after_sha256 from plan (required for apply)
        type: string
        required: false
      confirm:
        description: APPLY_EXACT_CHARNOCK_TEXT_CORRECTION_ONCE for apply
        type: string
        required: false

permissions:
  actions: read
  contents: write

concurrency:
  group: lordchrist-telegram-publisher
  cancel-in-progress: false
  queue: max

jobs:
  correction:
    if: github.actor == 'FedorMilovanov' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PAGE: ${{ inputs.page }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt
      - name: Public GET and exact plan (no Telegraph credential)
        if: inputs.mode == 'plan'
        run: python -m scripts.charnock_telegraph_credit_revision --page "$PAGE"
      - name: Exact current main quality gate
        if: inputs.mode == 'apply'
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          python -m video_channel_manager.telegram_github_quality_gate --workflow ci.yml --sha "$GITHUB_SHA"
      - name: Apply one exact correction after durable claim
        if: inputs.mode == 'apply' && inputs.confirm == 'APPLY_EXACT_CHARNOCK_TEXT_CORRECTION_ONCE'
        env:
          LORDCHRIST_TELEGRAPH_ACCESS_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAPH_ACCESS_TOKEN }}
        run: python -m scripts.charnock_telegraph_credit_revision --page "$PAGE" --apply
      - name: Reject absent confirmation
        if: inputs.mode == 'apply' && inputs.confirm != 'APPLY_EXACT_CHARNOCK_TEXT_CORRECTION_ONCE'
        run: exit 3
