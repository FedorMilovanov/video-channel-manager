name: Lordchrist new quote-v6 publisher

on:
  workflow_dispatch:
    inputs:
      action:
        description: Initialize the exact new v6 ledger, or send the first manual canary
        required: true
        type: choice
        options:
          - initialize
          - publish
      publication_id:
        description: First canary publication ID (manual publish only)
        required: false
        type: string
      confirm:
        description: Confirm with PUBLISH:<publication_id> (manual publish only)
        required: false
        type: string
  schedule:
    # 07:00 UTC = 10:00 Europe/Moscow, never add timezone here.
    # The exact release starts no earlier than Sunday 2026-11-08.
    - cron: "0 7 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: lordchrist-telegram-publisher
  cancel-in-progress: false
  queue: max

jobs:
  quote-v6:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      STATE_DIR: .state/lordchrist
      STATE_BRANCH: state/lordchrist-telegram
      STATE_LEDGER: content/telegram/lordchrist/quote-v6-publication-ledger.json
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Check out current exact main release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install minimal Telegram runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt

      - name: Check out separate shared state writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state/lordchrist-telegram
          path: .state/lordchrist
          fetch-depth: 0
          persist-credentials: true

      - name: Require verified current-main CI before any new state or provider mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_github_quality_gate --workflow ci.yml --sha "$GITHUB_SHA"

      - name: Determine exact v6 invocation
        id: invocation
        shell: bash
        env:
          V6_ACTION: ${{ inputs.action }}
          V6_PUBLICATION_ID: ${{ inputs.publication_id }}
          V6_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            echo "mode=scheduled" >> "$GITHUB_OUTPUT"
            echo "initialize=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$V6_ACTION" == "initialize" ]]; then
            [[ -z "$V6_PUBLICATION_ID" && -z "$V6_CONFIRM" ]] || exit 2
            echo "initialize=true" >> "$GITHUB_OUTPUT"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$V6_ACTION" == "publish" ]] || exit 2
          [[ "$V6_PUBLICATION_ID" == "lordchrist-ryle-religion-cost" ]] || exit 2
          [[ "$V6_CONFIRM" == "PUBLISH:$V6_PUBLICATION_ID" ]] || exit 2
          echo "initialize=false" >> "$GITHUB_OUTPUT"
          echo "mode=manual" >> "$GITHUB_OUTPUT"

      - name: Initialize exactly one separate v6 ledger (no messages sent)
        if: steps.invocation.outputs.initialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.lordchrist_quote_v6_publisher init

      - name: Persist new independent v6 ledger before canary
        if: steps.invocation.outputs.initialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C "$STATE_DIR" add -- "$STATE_LEDGER"
          if git -C "$STATE_DIR" diff --cached --quiet; then
            echo "v6 ledger already initialized; unchanged"
            exit 0
          fi
          git -C "$STATE_DIR" config user.name "lordchrist-publisher[bot]"
          git -C "$STATE_DIR" config user.email "lordchrist-publisher@users.noreply.github.com"
          git -C "$STATE_DIR" commit -m "Initialize independent 30 quote-v6 journal [skip ci]"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || exit 3

      - name: Preflight exact Telegram bot and prepare one quote (no provider write)
        id: prepare
        if: steps.invocation.outputs.initialize != 'true'
        shell: bash
        env:
          EXPECTED_V6_PUBLICATION_ID: ${{ inputs.publication_id }}
        run: |
          set -euo pipefail
          mkdir -p .runtime
          args=(prepare --mode "${{ steps.invocation.outputs.mode }}")
          if [[ "${{ steps.invocation.outputs.mode }}" == "manual" ]]; then
            args+=(--publication-id "$EXPECTED_V6_PUBLICATION_ID")
          fi
          set +e
          python -m scripts.lordchrist_quote_v6_publisher "${args[@]}"
          result=$?
          set -e
          if [[ "$result" -eq 3 ]]; then
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$result" -eq 0 ]] || exit "$result"
          echo "prepared=true" >> "$GITHUB_OUTPUT"

      - name: Persist immutable pre-send intent in shared state
        id: intent
        if: steps.prepare.outputs.prepared == 'true'
        shell: bash
        run: |
          set -euo pipefail
          evidence="content/telegram/lordchrist/dispatches/v6/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$STATE_DIR/$evidence"
          cp .runtime/lordchrist-v6-dispatch.json "$STATE_DIR/$evidence/dispatch.json"
          cp .runtime/lordchrist-v6-target-proof.json "$STATE_DIR/$evidence/target-proof.json"
          git -C "$STATE_DIR" config user.name "lordchrist-publisher[bot]"
          git -C "$STATE_DIR" config user.email "lordchrist-publisher@users.noreply.github.com"
          git -C "$STATE_DIR" add -- "$STATE_LEDGER" "$evidence"
          git -C "$STATE_DIR" diff --cached --quiet && exit 3
          git -C "$STATE_DIR" commit -m "Record quote-v6 intent $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT [skip ci]"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || exit 3
          git -C "$STATE_DIR" fetch --no-tags origin "$STATE_BRANCH"
          git -C "$STATE_DIR" show "origin/$STATE_BRANCH:$evidence/dispatch.json" > .runtime/v6-persisted-dispatch.json
          cmp -s .runtime/lordchrist-v6-dispatch.json .runtime/v6-persisted-dispatch.json || exit 3
          echo "persisted=true" >> "$GITHUB_OUTPUT"

      - name: Re-prove exact current-main CI before Telegram sendMessage
        id: final_quality
        if: steps.intent.outputs.persisted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_github_quality_gate --workflow ci.yml --sha "$GITHUB_SHA"

      - name: Send exactly one v6 message with HTML quote formatting
        id: send
        if: steps.intent.outputs.persisted == 'true' && steps.final_quality.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m scripts.lordchrist_quote_v6_publisher send
          status=$?
          set -e
          echo "result=$status" >> "$GITHUB_OUTPUT"
          [[ -f .runtime/lordchrist-v6-outcome.json ]] || exit 3
          exit 0

      - name: Archive Telegram outcome for recovery without retries
        if: steps.send.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lordchrist-v6-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/lordchrist-v6-outcome.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Persist verified publication or uncertain-effect blocker
        if: steps.send.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          evidence="content/telegram/lordchrist/dispatches/v6/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp .runtime/lordchrist-v6-outcome.json "$STATE_DIR/$evidence/outcome.json"
          git -C "$STATE_DIR" add -- "$STATE_LEDGER" "$evidence"
          git -C "$STATE_DIR" diff --cached --quiet && exit 3
          git -C "$STATE_DIR" commit -m "Record quote-v6 provider outcome $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT [skip ci]"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || exit 3
          [[ "${{ steps.send.outputs.result }}" == "0" ]] || {
            echo "Uncertain v6 provider effect; do not retry without reconciliation" >&2
            exit 4
          }
