name: Secret scanning

# Единственный контроль, которого в этом репозитории не было: пины действий,
# явные permissions и защищённые refs уже проверяются pytest-набором tests/,
# а утечки секретов не проверялись ничем.
#
# Поводы для сканирования разные по смыслу:
#  - push/pull_request — дифф: секрет, добавленный и удалённый в одном PR,
#    виден только сканированию полной истории;
#  - schedule — вся история целиком: путь «секрет попал в коммит и был удалён
#    следующим коммитом» не виден ни на push, ни на pull_request.
#
# gitleaks выбран, а не trufflehog/detect-secrets: один бинарь, полная история,
# правила по умолчанию покрывают токены Telegram, VK, Google, GitHub и приватные ключи.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Полная история: игнорирование этого шага превращает проверку
          # «нет ли секретов в репозитории» в проверку «нет ли секретов в диффе».
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true
          # Публичный репозиторий: лицензия для gitleaks-action не нужна.
          # Находки печатаются в лог; отдельный артефакт не нужен, чтобы не
          # требовать actions: write у read-only токена.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
