name: Lordchrist Charnock corrective publication

on:
  workflow_dispatch:
    inputs:
      publication_id:
        description: Existing Charnock publication ID
        required: true
        type: string
      confirm:
        description: Exact confirmation CORRECT:<publication_id>
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: lordchrist-telegram-publisher
  cancel-in-progress: false
  queue: max

jobs:
  correction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PUBLICATION_ID: ${{ inputs.publication_id }}
      MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
      LEDGER_PATH: .state/lordchrist/content/telegram/lordchrist/telegraph-v1/publication-ledger.json
      APPROVED_ID: ${{ vars.LORDCHRIST_CORRECTION_APPROVED_PUBLICATION_ID }}
      APPROVED_BLOB: ${{ vars.LORDCHRIST_CORRECTION_APPROVED_ARTICLE_BLOB_SHA }}
      ENABLED: ${{ vars.LORDCHRIST_CORRECTION_ENABLED }}
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install publisher requirements
        run: python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt
      - name: Exact-head CI and approved article proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" && "$GITHUB_REF" == "refs/heads/main" ]] || exit 3
          [[ "$CONFIRM" == "CORRECT:$PUBLICATION_ID" ]] || exit 3
          [[ "$ENABLED" == "true" && "$APPROVED_ID" == "$PUBLICATION_ID" ]] || exit 3
          [[ "$APPROVED_BLOB" =~ ^[a-f0-9]{40}$ ]] || exit 3
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]] || exit 3
          python -m video_channel_manager.telegram_github_quality_gate --workflow ci.yml --sha "$GITHUB_SHA"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          queue=json.loads(Path("content/telegram/lordchrist/telegraph-v1/article-queue.json").read_text("utf-8"))
          items=[i for i in queue["items"] if i["publication_id"]==os.environ["PUBLICATION_ID"]]
          if len(items)!=1 or items[0]["status"]!="ready":
              raise SystemExit("Expected one ready Charnock article")
          article=items[0]["article"]
          raw=Path(article["path"]).read_bytes()
          sha=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
          if sha!=os.environ["APPROVED_BLOB"] or article["git_blob_sha"]!=sha:
              raise SystemExit("Corrected article blob not approved")
          print("Exact approved article confirmed")
          PY
      - name: Correct existing Telegram message with one-shot durable claims
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LORDCHRIST_TELEGRAPH_ACCESS_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAPH_ACCESS_TOKEN }}
          LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
        run: bash scripts/charnock-corrective-release.sh
