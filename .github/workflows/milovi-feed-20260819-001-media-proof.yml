name: Milovi feed 20260819-001 media proof

on:
  pull_request:
    paths:
      - "content/telegram/milovi-cake/**"
      - ".github/workflows/milovi-feed-20260819-001-*.yml"
      - "tests/test_milovi_feed_20260819_001.py"
  push:
    branches: [main]
    paths:
      - "content/telegram/milovi-cake/**"
      - ".github/workflows/milovi-feed-20260819-001-*.yml"
      - "tests/test_milovi_feed_20260819_001.py"

permissions:
  contents: read

jobs:
  exact-p03-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Cross-check p03 candidate against frozen transport proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("content/telegram/milovi-cake")
          candidate = json.loads((root / "next-publication-candidate-2026-08-19.json").read_text(encoding="utf-8"))
          release = json.loads((root / "releases/milovi-feed-20260819-001-review.json").read_text(encoding="utf-8"))
          proof = json.loads((root / "bootstrap-photo-transport-proof-2026-08.json").read_text(encoding="utf-8"))
          p03 = next(item for item in proof["photos"] if item["media_id"] == "p03")

          assert proof["provider_write_performed"] is False
          assert proof["execution_authorized"] is False
          assert p03["transport_ready"] is True
          expected = {
              "media_id": "p03",
              "transport_format": "image/jpeg",
              "transport_byte_size": 391620,
              "transport_sha256": "sha256:d40b185ab813a46d29b66aa0da6f9300a13cad2bac0baf0ba71f1cd8e36a50a1",
              "pixel_width": 1024,
              "pixel_height": 1536,
          }
          for key, value in expected.items():
              assert p03[key] == value
              assert candidate["media"][key] == value
          for key in ("media_id", "transport_format", "transport_byte_size", "transport_sha256", "pixel_width", "pixel_height"):
              assert release["item"][key] == expected[key]
          assert candidate["caption_sha256"] == release["item"]["caption_sha256"] == "sha256:e4549b91102cad61a94f2faadc0100de23716c54e48d27552e21b92eb71cf918"
          print("exact p03 transport proof: OK")
          PY
