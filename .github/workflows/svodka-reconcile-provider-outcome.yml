name: Svodka reconcile archived provider outcome

on:
  workflow_dispatch:
    inputs:
      release_digest:
        description: Exact sha256 digest of the approved Svodka release
        required: true
        type: string
      source_run_id:
        description: Original canary or scheduled GitHub Actions run id
        required: true
        type: string
      source_run_attempt:
        description: Original GitHub Actions run attempt
        required: true
        default: "1"
        type: string
      publication_id:
        description: Exact publication_id held by the unresolved durable intent
        required: true
        type: string
      confirm:
        description: Type RECONCILE-OUTCOME:<run_id>:<attempt>:<publication_id>:<release_digest>
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: svodka-telegram-publisher
  cancel-in-progress: false
  queue: max

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: src
      PROFILE_PATH: content/telegram/channels/svodka.json
      BINDING_PATH: content/telegram/channels/svodka-target-binding.json
      RELEASE_PATH: content/telegram/svodka/approved-release-2026-08.json
      STATE_BRANCH: state/svodka-telegram
      STATE_DIR: .state/svodka
      LEDGER_RELATIVE_PATH: content/telegram/svodka/publication-ledger.json
      LEDGER_PATH: .state/svodka/content/telegram/svodka/publication-ledger.json
      RECOVERY_DIR: .runtime/recovered-provider-outcome
      RECOVERED_OUTCOME_PATH: .runtime/recovered-provider-outcome/svodka-outcome.json
      PROOF_PATH: .runtime/svodka-provider-outcome-recovery-proof.json
    steps:
      - name: Check out current immutable release and runtime
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install minimal Telegram runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/telegram-publisher.txt

      - name: Verify exact recovery request and committed release
        env:
          REQUESTED_DIGEST: ${{ inputs.release_digest }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          REQUESTED_PUBLICATION_ID: ${{ inputs.publication_id }}
          CONFIRMATION: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "release_digest must be an exact sha256 digest" >&2
            exit 2
          }
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "source_run_id must be a positive integer" >&2
            exit 2
          }
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
            echo "source_run_attempt must be a positive integer" >&2
            exit 2
          }
          [[ "$REQUESTED_PUBLICATION_ID" =~ ^svodka-[a-z0-9][a-z0-9-]{4,90}$ ]] || {
            echo "publication_id is invalid" >&2
            exit 2
          }
          expected="RECONCILE-OUTCOME:$SOURCE_RUN_ID:$SOURCE_RUN_ATTEMPT:$REQUESTED_PUBLICATION_ID:$REQUESTED_DIGEST"
          [[ "$CONFIRMATION" == "$expected" ]] || {
            echo "confirmation does not match the exact outcome recovery request" >&2
            exit 2
          }
          [[ -f "$RELEASE_PATH" ]] || {
            echo "approved Svodka release is missing" >&2
            exit 2
          }
          python - <<'PY'
          import os
          from pathlib import Path

          from video_channel_manager.telegram_channel_profile import load_channel_profile
          from video_channel_manager.telegram_multichannel_release import load_release
          from video_channel_manager.telegram_target_binding import load_target_binding

          profile = load_channel_profile(Path(os.environ["PROFILE_PATH"]))
          binding = load_target_binding(Path(os.environ["BINDING_PATH"]), profile)
          release = load_release(Path(os.environ["RELEASE_PATH"]))
          if not release.release_authorized:
              raise SystemExit("committed Svodka release is not authorized")
          if release.digest != os.environ["REQUESTED_DIGEST"]:
              raise SystemExit("requested release digest differs from committed release")
          if release.profile_sha256 != profile.digest or release.target_binding_sha256 != binding.digest:
              raise SystemExit("committed release differs from current profile or target binding")
          if (release.chat_id, release.bot_id, release.bot_username) != (
              binding.chat_id,
              binding.bot_id,
              binding.bot_username,
          ):
              raise SystemExit("committed release differs from exact Telegram target")
          if os.environ["REQUESTED_PUBLICATION_ID"] not in {item.publication_id for item in release.items}:
              raise SystemExit("publication_id is absent from committed release")
          PY

      - name: Check out isolated durable state branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: state/svodka-telegram
          path: .state/svodka
          fetch-depth: 0
          persist-credentials: true

      - name: Verify unresolved persisted provider intent
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          REQUESTED_PUBLICATION_ID: ${{ inputs.publication_id }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_rel_dir="content/telegram/svodka/dispatches/$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          evidence_abs_dir="$STATE_DIR/$evidence_rel_dir"
          dispatch_path="$evidence_abs_dir/dispatch.json"
          [[ -f "$LEDGER_PATH" ]] || {
            echo "Svodka ledger is missing" >&2
            exit 2
          }
          [[ -f "$dispatch_path" ]] || {
            echo "persisted dispatch evidence is missing: $dispatch_path" >&2
            exit 2
          }
          [[ ! -f "$evidence_abs_dir/outcome.json" ]] || {
            echo "durable provider outcome already exists; archived-outcome recovery is forbidden" >&2
            exit 2
          }
          python -m video_channel_manager.telegram_multichannel_cli validate-ledger \
            --release "$RELEASE_PATH" \
            --ledger "$LEDGER_PATH"
          python -m video_channel_manager.telegram_multichannel_cli verify-intent \
            --release "$RELEASE_PATH" \
            --ledger "$LEDGER_PATH" \
            --envelope "$dispatch_path"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          dispatch_path = (
              Path(os.environ["STATE_DIR"])
              / "content/telegram/svodka/dispatches"
              / f"{os.environ['SOURCE_RUN_ID']}-{os.environ['SOURCE_RUN_ATTEMPT']}"
              / "dispatch.json"
          )
          dispatch = json.loads(dispatch_path.read_text(encoding="utf-8"))
          if dispatch["publication_id"] != os.environ["REQUESTED_PUBLICATION_ID"]:
              raise SystemExit("persisted dispatch publication differs from recovery request")
          if dispatch["workflow_run_id"] != os.environ["SOURCE_RUN_ID"]:
              raise SystemExit("persisted dispatch run id differs from recovery request")
          if dispatch["workflow_run_attempt"] != os.environ["SOURCE_RUN_ATTEMPT"]:
              raise SystemExit("persisted dispatch run attempt differs from recovery request")
          PY

      - name: Prove source run and archived outcome provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          REQUESTED_PUBLICATION_ID: ${{ inputs.publication_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime
          dispatch_path="$STATE_DIR/content/telegram/svodka/dispatches/$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT/dispatch.json"
          python -m video_channel_manager.telegram_github_outcome_artifact prove \
            --dispatch "$dispatch_path" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --publication-id "$REQUESTED_PUBLICATION_ID" \
            --proof-output "$PROOF_PATH"

      - name: Download exact archived provider outcome
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m video_channel_manager.telegram_github_outcome_artifact fetch \
            --proof "$PROOF_PATH" \
            --outcome-output "$RECOVERED_OUTCOME_PATH"

      - name: Validate recovered outcome against persisted dispatch
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          REQUESTED_PUBLICATION_ID: ${{ inputs.publication_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$RECOVERED_OUTCOME_PATH" ]] || {
            echo "downloaded artifact does not contain the exact provider outcome file" >&2
            exit 2
          }
          file_count="$(find "$RECOVERY_DIR" -type f | wc -l | tr -d ' ')"
          [[ "$file_count" == "1" ]] || {
            echo "provider outcome artifact must contain exactly one file" >&2
            exit 2
          }
          dispatch_path="$STATE_DIR/content/telegram/svodka/dispatches/$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT/dispatch.json"
          python -m video_channel_manager.telegram_github_outcome_artifact validate \
            --dispatch "$dispatch_path" \
            --outcome "$RECOVERED_OUTCOME_PATH" \
            --publication-id "$REQUESTED_PUBLICATION_ID"

      - name: Apply archived outcome without provider access
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_rel_dir="content/telegram/svodka/dispatches/$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          evidence_abs_dir="$STATE_DIR/$evidence_rel_dir"
          dispatch_path="$evidence_abs_dir/dispatch.json"
          python -m video_channel_manager.telegram_multichannel_cli apply-outcome \
            --release "$RELEASE_PATH" \
            --ledger "$LEDGER_PATH" \
            --envelope "$dispatch_path" \
            --outcome "$RECOVERED_OUTCOME_PATH"
          cp -- "$RECOVERED_OUTCOME_PATH" "$evidence_abs_dir/outcome.json"
          cp -- "$PROOF_PATH" "$evidence_abs_dir/outcome-recovery-proof.json"

      - name: Persist recovered provider outcome state
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_rel_dir="content/telegram/svodka/dispatches/$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"

          git -C "$STATE_DIR" config user.name "svodka-publisher[bot]"
          git -C "$STATE_DIR" config user.email "svodka-publisher@users.noreply.github.com"
          git -C "$STATE_DIR" add -- "$LEDGER_RELATIVE_PATH" "$evidence_rel_dir/outcome.json" "$evidence_rel_dir/outcome-recovery-proof.json"
          git -C "$STATE_DIR" diff --cached --quiet && {
            echo "archived-outcome recovery produced no durable state delta" >&2
            exit 3
          }
          git -C "$STATE_DIR" commit -m "Recover archived Svodka provider outcome for run $SOURCE_RUN_ID/$SOURCE_RUN_ATTEMPT [skip ci]"
          local_sha="$(git -C "$STATE_DIR" rev-parse HEAD)"
          git -C "$STATE_DIR" push origin "HEAD:$STATE_BRANCH"
          remote_sha="$(git -C "$STATE_DIR" ls-remote origin "refs/heads/$STATE_BRANCH" | cut -f1)"
          [[ "$local_sha" == "$remote_sha" ]] || {
            echo "remote state branch does not contain exact recovered provider outcome" >&2
            exit 3
          }
          python -m video_channel_manager.telegram_multichannel_cli validate-ledger \
            --release "$RELEASE_PATH" \
            --ledger "$LEDGER_PATH"