name: Lordchrist Charnock series existing-page correction (owner only)
run-name: charnock-series-inplace-${{ github.event.client_payload.page || inputs.page }}-${{ github.event.client_payload.mode || inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      page:
        description: Existing, independently reviewed series page to correct (never create)
        required: true
        type: choice
        options:
          - '02'
          - '03'
          - '09'
          - '11'
          - '12'
          - '13'
      confirm:
        description: Type EDIT_EXISTING_CHARNOCK_PAGE_ONCE for one guarded in-place revision
        required: true
        type: string
      mode:
        description: dry-run verifies, reconcile receipts an already-applied page, execute posts once
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - reconcile
          - execute
  repository_dispatch:
    types: [charnock-series-inplace]

permissions:
  contents: read
  actions: write

concurrency:
  group: lordchrist-charnock-series-inplace-${{ github.event.client_payload.page || inputs.page }}
  cancel-in-progress: false

jobs:
  in-place-edit:
    if: >-
      github.actor == 'FedorMilovanov' &&
      github.repository == 'FedorMilovanov/video-channel-manager' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' &&
        inputs.confirm == 'EDIT_EXISTING_CHARNOCK_PAGE_ONCE' &&
        (inputs.page == '02' || inputs.page == '03' || inputs.page == '09' ||
         inputs.page == '11' || inputs.page == '12' || inputs.page == '13')) ||
       (github.event_name == 'repository_dispatch' &&
        github.event.client_payload.confirm == 'EDIT_EXISTING_CHARNOCK_PAGE_ONCE' &&
        (github.event.client_payload.page == '02' || github.event.client_payload.page == '03' ||
         github.event.client_payload.page == '09' || github.event.client_payload.page == '11' ||
         github.event.client_payload.page == '12' || github.event.client_payload.page == '13')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Refuse replay, non-main, or moving HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]] || exit 3
          [[ "$GITHUB_REPOSITORY" == "FedorMilovanov/video-channel-manager" ]] || exit 3
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 3
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]] || exit 3
      - name: Check out pinned existing-page editor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Exactly one preconditioned editPage and full public readback
        shell: bash
        env:
          LORDCHRIST_TELEGRAPH_ACCESS_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAPH_ACCESS_TOKEN }}
          REVIEWED_PAGE: ${{ github.event.client_payload.page || inputs.page }}
          MODE: ${{ github.event.client_payload.mode || inputs.mode }}
        run: |
          set -euo pipefail
          echo "::notice title=charnock-series-${REVIEWED_PAGE}::mode=${MODE} page=${REVIEWED_PAGE}"
          mkdir -p "$RUNNER_TEMP/charnock-series-provider-receipts"
          args=(--page "$REVIEWED_PAGE" --receipt-dir "$RUNNER_TEMP/charnock-series-provider-receipts")
          if [[ "$MODE" == "execute" ]]; then
            args+=(--execute --confirm EDIT_EXISTING_CHARNOCK_PAGE_ONCE)
          elif [[ "$MODE" == "reconcile" ]]; then
            args+=(--reconcile)
          elif [[ "$MODE" != "dry-run" ]]; then
            exit 3
          fi
          python -m scripts.charnock_telegraph_series_inplace "${args[@]}"
          if [[ "$MODE" == "execute" || "$MODE" == "reconcile" ]]; then
            [[ "$(find "$RUNNER_TEMP/charnock-series-provider-receipts" -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 1 ]] || exit 4
          fi
      - name: Upload the single provider receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: charnock-series-receipt-${{ github.event.client_payload.page || inputs.page }}-${{ github.run_id }}
          path: ${{ runner.temp }}/charnock-series-provider-receipts/*.json
          if-no-files-found: warn
          retention-days: 30
