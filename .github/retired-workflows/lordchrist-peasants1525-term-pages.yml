name: LordChrist 1525 four Telegraph definitions and restore classic Telegram 1619

on:
  push:
    branches: [main]
    paths:
      - src/video_channel_manager/lordchrist_peasants1525_term_pages.py
      - .github/workflows/lordchrist-peasants1525-term-pages.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: lordchrist-telegram-publisher
  cancel-in-progress: false
  queue: max

jobs:
  edit-existing-post:
    if: >-
      github.actor == 'FedorMilovanov' &&
      github.repository == 'FedorMilovanov/video-channel-manager' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
      LORDCHRIST_TELEGRAPH_ACCESS_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAPH_ACCESS_TOKEN }}
      LORDCHRIST_TELEGRAM_BOT_TOKEN: ${{ secrets.LORDCHRIST_TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout reviewed main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pinned publisher requirements
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            -r requirements/telegram-publisher.txt
      - name: One-shot four short pages and single existing Telegram edit
        shell: bash
        run: |
          set -euo pipefail
          state_branch=state/lordchrist-telegram
          state_dir=.state/lordchrist
          ledger_rel=content/telegram/lordchrist/telegraph-v1/publication-ledger.json
          ledger="$state_dir/$ledger_rel"
          media_base="https://raw.githubusercontent.com/FedorMilovanov/video-channel-manager/77b2087ac2e714af74fed19cb653b1a7c2ecfb68"

          [[ "$GITHUB_REPOSITORY" == "FedorMilovanov/video-channel-manager" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]] || {
            echo "Main changed before protected release; no mutations" >&2
            exit 3
          }

          python -m video_channel_manager.telegram_github_quality_gate \
            --workflow ci.yml --sha "$GITHUB_SHA" --wait-seconds 600
          git fetch origin "$state_branch:refs/remotes/origin/$state_branch"
          git worktree add "$state_dir" "origin/$state_branch"
          test -f "$ledger"
          git -C "$state_dir" config user.name "lordchrist-glossary-editor[bot]"
          git -C "$state_dir" config user.email "lordchrist-glossary-editor@users.noreply.github.com"

          stage() {
            local stage="$1" key="$2"
            python -m video_channel_manager.lordchrist_peasants1525_term_pages "$stage" \
              --key "$key" \
              --repo-root . \
              --ledger "$ledger" \
              --publication-id lordchrist-telegraph-peasants-1525-20261115 \
              --media-base-url "$media_base" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --github-sha "$GITHUB_SHA"
          }

          persist() {
            git -C "$state_dir" add -- "$ledger_rel"
            if git -C "$state_dir" diff --cached --quiet; then
              echo "Expected durable ledger change missing at $1" >&2
              exit 3
            fi
            git -C "$state_dir" commit -m "chore(lordchrist): 1525 glossary $1 [skip ci]"
            git -C "$state_dir" push origin "HEAD:$state_branch"
            local local_sha remote_sha
            local_sha="$(git -C "$state_dir" rev-parse HEAD)"
            remote_sha="$(git ls-remote origin "refs/heads/$state_branch" | cut -f1)"
            [[ "$local_sha" == "$remote_sha" ]] || {
              echo "State push not verified, no repeat provider mutation" >&2
              exit 3
            }
          }

          # 2026-11-16 first createPage request was claimed and returned a URL,
          # but the immediate public replica readback failed. Do not recreate it.
          # Reconcile exclusively through authenticated page listing before moving on.
          stage reconcile-swabia swabia
          persist swabia-reconciled

          for key in articles dependency memmingen; do
            stage claim-page "$key"
            persist "$key-claimed"
            stage create-page "$key"
            persist "$key-verified"
          done

          stage claim-telegram all
          persist telegram-claimed
          stage edit-telegram all
          persist telegram-verified
