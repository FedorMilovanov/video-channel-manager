version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      routine-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Major dependency upgrades are explicit compatibility work, not routine bot maintenance.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # This exact/hash-bound production closure is refreshed coherently as one supply-chain artifact.
      - dependency-name: annotated-types
      - dependency-name: anyio
      - dependency-name: certifi
      - dependency-name: h11
      - dependency-name: httpcore
      - dependency-name: httpx
      - dependency-name: idna
      - dependency-name: pydantic
      - dependency-name: pydantic-core
      - dependency-name: typing-extensions
      - dependency-name: typing-inspection
    labels:
      - dependencies
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      workflow-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
    labels:
      - dependencies
    commit-message:
      prefix: actions
