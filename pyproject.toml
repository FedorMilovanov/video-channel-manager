[build-system]
requires = ["setuptools>=83,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-channel-manager"
version = "0.1.0"
description = "Safety-first video channel auditing, organization, synchronization, and external-AI change plans."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Fedor Milovanov" }]
dependencies = [
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13.9,<15",
  "sqlalchemy>=2.0.36,<3",
  "tenacity>=9,<10",
  "typer>=0.15,<1",
  "tzdata>=2025.2,<2027; platform_system == 'Windows'",
]

[project.optional-dependencies]
browser-read = [
  "playwright>=1.54,<2",
]
milovi-gap-read = [
  "Pillow>=11,<13",
]
dev = [
  "mypy>=1.14,<3",
  "pip-audit>=2.9,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
video-manager = "video_channel_manager.cli.app:run"
video-manager-package-a = "video_channel_manager.wave_engine.package_a_cli:run"
video-manager-resi = "video_channel_manager.cli.resi:run"
video-manager-vk-postponed-text = "video_channel_manager.cli.vk_postponed_text:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_channel_manager = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "error:unclosed database.*:ResourceWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# Start with correctness-oriented blocking rules. Formatting and broader style
# families are reported separately until the first provider adapters stabilize.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B014", "E501"]

[tool.ruff.format]
quote-style = "double"
# These guarded operational runners, exact policy-fixture tests, and imported
# documentation-only historical blobs preserve an already reviewed layout.
# Keep compilation and linting enabled while excluding them from rewriting.
exclude = [
  "docs/history/operational-attempts/**",
  "scripts/complete_vk_longform_tail.py",
  "scripts/run_vk_p1_final_megawave.py",
  "scripts/schedule_lord_god_article_wave.py",
  "scripts/schedule_lord_god_article_wave_current.py",
  "scripts/schedule_lord_god_article_wave_v3.py",
  "scripts/lord_god_article_wave_v3/**",
  "scripts/schedule_lord_god_wall_tail.py",
  "scripts/vk_shorts_reset.py",
  "scripts/vk_shorts_reset_20260801.py",
  "scripts/vk_shorts_reset_20260801_v3.py",
  "scripts/vk_shorts_reset_current.py",
  "tests/test_schedule_lord_god_article_wave.py",
  "tests/test_schedule_lord_god_article_wave_v3.py",
  "tests/test_schedule_lord_god_article_source_contract.py",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["video_channel_manager"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
