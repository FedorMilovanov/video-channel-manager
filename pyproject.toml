[build-system]
requires = ["setuptools>=83,<84", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-channel-manager"
version = "0.1.0"
description = "Safety-first video channel auditing, organization, synchronization, and external-AI change plans."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "FedorMilovanov" }]
dependencies = [
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13.9,<15",
  "sqlalchemy>=2.0.36,<3",
  "tenacity>=9,<10",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
video-manager = "video_channel_manager.cli.app:run"
vk-delete-orchestrator = "video_channel_manager.cli.vk_delete:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_channel_manager = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# Start with correctness-oriented blocking rules. Formatting and broader style
# families are reported separately until the first provider adapters stabilize.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B014", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# This guarded operational runner is generated as an auditable step-by-step journal.
# Keep linting, compilation, typing, and tests enabled; preserve its deliberate layout.
exclude = ["scripts/run_vk_p1_final_megawave.py"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["video_channel_manager"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
