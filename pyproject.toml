[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-channel-manager"
version = "0.1.0"
description = "Safety-first video channel auditing, organization, synchronization, and external-AI change plans."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Fedor Milovanov" }]
dependencies = [
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13.9,<15",
  "sqlalchemy>=2.0.36,<3",
  "tenacity>=9,<10",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
video-manager = "video_channel_manager.cli.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_channel_manager = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["video_channel_manager"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
